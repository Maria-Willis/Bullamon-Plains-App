// Extensible field model: a pre-existing field (batch no., supplier,
// purchase date, expiry date) keeps reading/writing its original object
// key via legacyKey, so nothing needs a data migration. A brand new field
// Maria adds herself has no legacyKey, so its values live in a generic
// customFields bag instead, keyed by the field's own id.
function registerFieldValue(entry, field){
  if(field.legacyKey) return entry[field.legacyKey];
  return (entry.customFields || {})[field.id];
}
function setRegisterFieldValue(entry, field, value){
  if(field.legacyKey){
    entry[field.legacyKey] = value;
  } else {
    entry.customFields = entry.customFields || {};
    entry.customFields[field.id] = value;
  }
}
function addRegisterField(){
  state.chemicals.registerFields = state.chemicals.registerFields || [];
  state.chemicals.registerFields.push({ id: uid("rf"), label: "New field" });
  persist();
}
function renameRegisterField(id, label){
  var f = byId(state.chemicals.registerFields || [], id);
  if(!f) return;
  f.label = label;
  persist();
}
function removeRegisterField(id){
  var fields = state.chemicals.registerFields || [];
  var f = byId(fields, id);
  if(!f) return;
  if(!confirm('Remove the "' + f.label + '" field? It will stop showing on the register and the add/edit form. This does not delete any chemicals or the volumes you have on hand.')) return;
  removeById(fields, id);
  persist();
}
function moveRegisterField(id, direction){
  var fields = state.chemicals.registerFields || [];
  var i = fields.findIndex(function(f){ return f.id === id; });
  if(i < 0) return;
  var j = i + direction;
  if(j < 0 || j >= fields.length) return;
  var tmp = fields[i]; fields[i] = fields[j]; fields[j] = tmp;
  persist();
}
function renderRegisterFieldsEditor(){
  var fields = state.chemicals.registerFields || [];
  var html = "";
  if(fields.length === 0){
    html += '<div class="empty-state">No extra fields -- just chemical, location and quantity.</div>';
  } else {
    html += fields.map(function(f, idx){
      var isFirst = idx === 0, isLast = idx === fields.length - 1;
      return '<div class="card-row" style="padding:8px 0;border-bottom:1px solid var(--border);">' +
        '<input type="text" value="' + escAttr(f.label) + '" style="font-weight:600;font-size:13.5px;flex:1;min-width:120px;" onchange="renameRegisterField(\'' + f.id + '\',this.value)" />' +
        '<span style="display:flex;gap:4px;">' +
          '<button type="button" class="btn btn-ghost btn-sm"' + (isFirst ? " disabled" : "") + ' onclick="moveRegisterField(\'' + f.id + '\',-1)" title="Move up">&#8593;</button>' +
          '<button type="button" class="btn btn-ghost btn-sm"' + (isLast ? " disabled" : "") + ' onclick="moveRegisterField(\'' + f.id + '\',1)" title="Move down">&#8595;</button>' +
        '</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="removeRegisterField(\'' + f.id + '\')">Remove</button>' +
      '</div>';
    }).join("");
  }
  html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;width:auto;" onclick="addRegisterField()">+ Add field</button>';
  return html;
}
function renderRegisterForm(existing){
  var fields = state.chemicals.registerFields || [];

function addRegister(e){

function renderRegisterRow(r){
  var fields = state.chemicals.registerFields || [];
  return '<tr>' +
    '<td><button type="button" class="subtle-btn" style="font-weight:600;" onclick="ui.openForms[\'reguse_' + r.id + '\']=!ui.openForms[\'reguse_' + r.id + '\'];render();">' + esc(r.chemicalName) + '</button></td>' +
    '<td>' + esc(r.storageLocation) + '</td><td class="num">' + fmtNum(r.quantity, r.unit) + '</td>' +
    fields.map(function(f){
      var val = registerFieldValue(r, f);
      var display = f.type === "date" ? fmtDate(val) : esc(val);
      // Only the expiry date field itself gets the "coming due soon /
      // already expired" red-flag treatment -- applying it to every date
      // field would also flag purchase dates (always in the past, so
      // always "less than 60 days" away) as if they were urgent.
      var style = "";
      if(f.legacyKey === "expiryDate"){
        var days = daysUntil(val);

      }
      return '<td' + style + '>' + display + '</td>';
    }).join("") +
    '<td><div style="display:flex;gap:6px;justify-content:flex-end;">' +
      '<button type="button" class="subtle-btn" onclick="ui.editing.register=\'' + r.id + '\';render();">Edit</button>' +

  '</tr>';

// The usage/return forms + log for a register entry that's been expanded
// (clicked open from renderRegisterRow above). Rendered as a plain block
// outside the table -- see the note in renderChemicals() for why.
function renderRegisterExpanded(r){
  var html = '<div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface-2);">';
  html += '<p class="row-muted" style="margin:0 0 10px;font-size:12px;font-weight:600;">' + esc(r.chemicalName) + (r.batchNo ? " &middot; batch " + esc(r.batchNo) : "") + '</p>';

// Opens a file stored in Supabase Storage (a map photo/PDF, or a bull's
// attached PDF), preferring an offline-cached copy (kept warm in the
// background by prefetchStorageFilesForOffline()) over hitting the network
// directly -- so these still work with no signal at all, not just the list
// of titles/names. Opens a blank tab SYNCHRONOUSLY, before any await, and
// only navigates it once the cache lookup resolves -- looking the URL up
// first and opening the tab afterwards would make most browsers treat the
// delayed window.open() as a blocked popup, since it'd no longer be
// directly inside the click's own call stack. Named generically (not
// "openMapFile") since Bulls' PDF attachments use this exact same function.
function openStoredFile(url){
  var win = null;
  try{ win = window.open("", "_blank"); }catch(e){}
  (async function(){
    try{
      if("caches" in window){
        var cached = await caches.match(url);
        if(cached){
          var blob = await cached.blob();
          var blobUrl = URL.createObjectURL(blob);
          if(win && !win.closed){ win.location = blobUrl; } else { window.open(blobUrl, "_blank"); }
          return;
        }
      }
    }catch(e){ /* fall through to a direct network open below */ }
    if(win && !win.closed){ win.location = url; } else { window.open(url, "_blank"); }
  })();
  return false;
}

// Shrinks/re-compresses a photo client-side before it's uploaded (phone
// camera JPEGs are commonly 5-10MB, slow and wasteful to upload as-is,
// especially over the patchy rural connections this app needs to cope
// with). Falls back to the original file untouched on any decode error
// (e.g. a format the browser can't draw to canvas) rather than blocking
// the upload.
function compressMapPhoto(file){
  return new Promise(function(resolve){
    var MAX_DIM = 1800;
    try{
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          try{
            var scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
            var cw = Math.max(1, Math.round(img.width * scale));
            var ch = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement("canvas");
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            canvas.toBlob(function(blob){ resolve(blob || file); }, "image/jpeg", 0.82);
          }catch(e2){ resolve(file); }
        };
        img.onerror = function(){ resolve(file); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ resolve(file); };
      reader.readAsDataURL(file);
    }catch(e){ resolve(file); }
  });
}
async function addMap(e){
  e.preventDefault();
  var f = e.target;
  var title = f.title.value.trim();
  var notes = f.notes.value.trim();
  var manualUrl = f.url.value.trim();
  var file = f.photo && f.photo.files && f.photo.files[0];
  if(!file && !manualUrl){
    setNotice("err", "Add a photo, a PDF, or paste a link before saving.");
    render();
    return;
  }
  if(!file){
    state.maps.items.push({ id: uid("map"), title: title, notes: notes, url: manualUrl, isPhoto: false });
    ui.openForms.newMap = false;
    persist();
    return;
  }
  // A PDF is detected by MIME type first; some browsers/OS combinations
  // leave file.type blank for a dragged-in file, so fall back to the
  // filename extension rather than mistakenly treating it as an image.
  var isPDF = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
  if(!supabaseClient){
    setNotice("err", "Can't upload a " + (isPDF ? "PDF" : "photo") + " right now (not connected to the database). Text and other changes still work offline, but file uploads need a connection at the moment you add them — try again once you're back online.");
    render();
    return;
  }
  var submitBtn = f.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
  try{
    var uploadBlob = isPDF ? file : await compressMapPhoto(file);
    var path = uid("map") + (isPDF ? ".pdf" : ".jpg");
    var upRes = await supabaseClient.storage.from("maps").upload(path, uploadBlob, { cacheControl: "3600", upsert: false, contentType: isPDF ? "application/pdf" : "image/jpeg" });
    if(upRes.error) throw upRes.error;
    var pub = supabaseClient.storage.from("maps").getPublicUrl(path);
    state.maps.items.push({ id: uid("map"), title: title, notes: notes, url: pub.data.publicUrl, storagePath: path, isPhoto: !isPDF, isPDF: isPDF });
    ui.openForms.newMap = false;
    persist();
  }catch(err){
    console.error("[Bullamon Plains] map file upload failed:", err);
    setNotice("err", "Couldn't upload that " + (isPDF ? "PDF" : "photo") + " (" + (err && err.message ? err.message : "unknown error") + "). If you're offline or have a weak signal, try again once you're back in range.");
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Add"; }
    render();
  }
}
function removeMap(id){
  var item = (state.maps.items || []).find(function(m){ return m.id === id; });
  if(item && item.isPhoto && item.storagePath && supabaseClient){
    supabaseClient.storage.from("maps").remove([item.storagePath]).catch(function(err){
      console.error("[Bullamon Plains] couldn't delete the stored map photo (it will be left orphaned in storage, but this doesn't affect the app):", err);
    });
  }
  removeById(state.maps.items, id);
  persist();
}

    '<input type="file" id="restoreBackupInput" accept="application/json,.json" style="display:none;" onchange="handleRestoreFileSelected(event)" />' +
    (daysSince !== null ? '<span class="row-muted" style="font-size:12px;margin-left:10px;">Last backup: ' + fmtDate(state.meta.lastBackupAt) + ' (' + daysSince + (daysSince === 1 ? ' day' : ' days') + ' ago)</span>' : '') +
    '<span style="flex:1;"></span><button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newStaff\')">' + (ui.openForms.newStaff ? "Cancel" : "+ Add staff") + '</button>' +
  '</div>';
  html += '<p class="row-muted" style="margin:-6px 0 16px;font-size:12px;">Restoring completely replaces everything currently in the app -- for everyone, on every device -- with what\'s in the backup file. Only use this to recover from something going wrong.</p>';
  if(ui.openForms.newStaff) html += renderStaffForm();

  html += (state.team || []).map(function(t){
    if(ui.editing.staff === t.name) return renderStaffForm(t);
    return '<div class="team-card">' +
      '<div class="team-name-row"><div class="avatar">' + esc(initials(t.name)) + '</div><div>' +
        '<div style="font-weight:600;">' + esc(t.name) + (t.name === currentUser().name ? " (you)" : "") + '</div>' +
        '<div class="team-flags">' +
          (t.active ? '<span>Active</span>' : '<span style="color:var(--danger);">Inactive</span>') +
          (t.isAdmin ? '<span class="pill pill-admin" style="margin:0;">Admin</span>' : '') +
          (t.canAllocate ? '<span>Can allocate jobs</span>' : '') +
          '<span>Code: ' + (t.passcode ? '<code class="access-code">set</code>' : '<em>none</em>') + '</span>' +
        '</div></div></div>' +
      '<div style="display:flex;gap:6px;">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.staff=\'' + escAttr(t.name) + '\';render();">Edit</button>' +
        (t.name !== currentUser().name ? '<button type="button" class="btn btn-danger btn-sm" onclick="removeStaff(\'' + escAttr(t.name) + '\')">Remove</button>' : '') +
      '</div>' +
    '</div>';
  }).join("");
  html += renderSidebarConfigCard();
  return html;
}

/* ----------------------------------------------------------------------
   SIDEBAR MENU -- lets an admin rename/add/remove the sidebar's headings
   (Daily Work, Safety & Compliance, People, or whatever they create) and
   choose which heading each menu item sits under, at Maria's request
   ("make it so that I can change the headings and place the menu items
   under the headings I create or that currently exist"). Backs
   sidebarSections()/renderShell() above -- see the block comment there.
   ---------------------------------------------------------------------- */
function ensureSidebarConfig(){
  if(!state.sidebarConfig) state.sidebarConfig = { headings: [], itemHeading: {}, sectionOrder: [] };
  if(!state.sidebarConfig.headings) state.sidebarConfig.headings = [];
  if(!state.sidebarConfig.itemHeading) state.sidebarConfig.itemHeading = {};
  if(!state.sidebarConfig.sectionOrder) state.sidebarConfig.sectionOrder = [];
  return state.sidebarConfig;
}
function touchSidebarConfig(){
  var u = currentUser();
  state.sidebarConfig.updatedAt = new Date().toISOString();
  state.sidebarConfig.updatedBy = u ? u.name : null;
}
function addSidebarHeading(){
  var cfg = ensureSidebarConfig();
  var id = uid("navh");
  cfg.headings.push({ id: id, name: "New heading" });
  cfg.sectionOrder.push("heading:" + id);
  touchSidebarConfig();
  persist();
}
function renameSidebarHeading(id, name){
  var cfg = ensureSidebarConfig();
  var h = byId(cfg.headings, id);
  if(!h) return;
  h.name = name;
  touchSidebarConfig();
  persist();
}
function removeSidebarHeading(id){
  var cfg = ensureSidebarConfig();
  var h = byId(cfg.headings, id);
  if(!h) return;
  if(!confirm('Remove the "' + h.name + '" heading? Its items will just show without a heading -- nothing is deleted.')) return;
  var freedTokens = [];
  Object.keys(cfg.itemHeading).forEach(function(key){
    if(cfg.itemHeading[key] === id){
      delete cfg.itemHeading[key];
      freedTokens.push("item:" + key);
    }
  });
  var idx = cfg.sectionOrder.indexOf("heading:" + id);
  if(idx > -1){
    cfg.sectionOrder.splice.apply(cfg.sectionOrder, [idx, 1].concat(freedTokens));
  } else {
    cfg.sectionOrder = cfg.sectionOrder.concat(freedTokens);
  }
  removeById(cfg.headings, id);
  touchSidebarConfig();
  persist();
}
function moveSidebarSection(token, direction){
  var cfg = ensureSidebarConfig();
  var i = cfg.sectionOrder.indexOf(token);
  if(i < 0) return;
  var j = i + direction;
  if(j < 0 || j >= cfg.sectionOrder.length) return;
  var tmp = cfg.sectionOrder[i]; cfg.sectionOrder[i] = cfg.sectionOrder[j]; cfg.sectionOrder[j] = tmp;
  touchSidebarConfig();
  persist();
}
function setItemHeading(key, headingId){
  var cfg = ensureSidebarConfig();
  if(headingId){
    cfg.itemHeading[key] = headingId;
    cfg.sectionOrder = cfg.sectionOrder.filter(function(t){ return t !== "item:" + key; });
  } else {
    delete cfg.itemHeading[key];
    if(cfg.sectionOrder.indexOf("item:" + key) === -1) cfg.sectionOrder.push("item:" + key);
  }
  touchSidebarConfig();
  persist();
}
function renderSidebarConfigCard(){
  var cfg = ensureSidebarConfig();
  var byKey = {};
  NAV.forEach(function(n){ byKey[n.key] = n; });

  var html = '<div class="card"><h3 style="margin-bottom:6px;">Sidebar menu</h3>' +
    '<p class="row-muted" style="margin:0 0 14px;font-size:12.5px;">Rename headings, add your own, and choose which heading each menu item sits under. Applies for everyone, straight away.</p>';

  if(cfg.sectionOrder.length === 0){
    html += '<div class="empty-state">Nothing set up yet.</div>';
  } else {
    html += cfg.sectionOrder.map(function(token, idx){
      var isFirst = idx === 0, isLast = idx === cfg.sectionOrder.length - 1;
      var moveButtons = '<span style="display:flex;gap:4px;">' +
        '<button type="button" class="btn btn-ghost btn-sm"' + (isFirst ? " disabled" : "") + ' onclick="moveSidebarSection(\'' + token + '\',-1)" title="Move up">&#8593;</button>' +
        '<button type="button" class="btn btn-ghost btn-sm"' + (isLast ? " disabled" : "") + ' onclick="moveSidebarSection(\'' + token + '\',1)" title="Move down">&#8595;</button>' +
      '</span>';
      if(token.indexOf("heading:") === 0){
        var hid = token.slice(8);
        var h = byId(cfg.headings, hid);
        if(!h) return "";
        return '<div class="card-row" style="padding:8px 0;border-bottom:1px solid var(--border);">' +
          '<input type="text" value="' + escAttr(h.name) + '" style="font-weight:700;font-size:13.5px;flex:1;min-width:140px;" onchange="renameSidebarHeading(\'' + hid + '\',this.value)" />' +
          moveButtons +
          '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="removeSidebarHeading(\'' + hid + '\')">Remove heading</button>' +
        '</div>';
      }
      var key = token.slice(5);
      var item = byKey[key];
      if(!item) return "";
      return '<div class="card-row" style="padding:8px 0;border-bottom:1px solid var(--border);">' +
        '<span style="font-size:13.5px;">' + esc(item.label) + ' <span class="row-muted" style="font-size:11.5px;">(no heading)</span></span>' +
        moveButtons +
      '</div>';
    }).join("");
  }

  html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;width:auto;" onclick="addSidebarHeading()">+ Add heading</button>';

  html += '<h4 style="margin:20px 0 10px;font-size:13px;">Menu items</h4>';
  html += NAV.map(function(n){
    var currentHeading = cfg.itemHeading[n.key] || "";
    var options = '<option value="">No heading</option>' + cfg.headings.map(function(h){
      return '<option value="' + escAttr(h.id) + '"' + (currentHeading === h.id ? " selected" : "") + '>' + esc(h.name) + '</option>';
    }).join("");
    return '<div class="card-row" style="padding:5px 0;">' +
      '<span style="font-size:13.5px;">' + esc(n.label) + '</span>' +
      '<select style="width:auto;" onchange="setItemHeading(\'' + n.key + '\',this.value)">' + options + '</select>' +
    '</div>';
  }).join("");

  html += '<p class="row-muted" style="margin:12px 0 0;font-size:12px;">' +
    (cfg.updatedAt ? ("Last updated " + fmtDateTime(cfg.updatedAt) + (cfg.updatedBy ? (" by " + esc(cfg.updatedBy)) : "")) : "Not updated yet.") +
    '</p>';
  html += '</div>';
  return html;
}
function renderStaffForm(existing){
  return '<div class="form-panel"><form onsubmit="saveStaff(event,' + (existing ? "'" + escAttr(existing.name) + "'" : "null") + ')">' +
    '<h4>' + (existing ? "Edit " + esc(existing.name) : "New staff member") + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Name</label><input type="text" name="name" required value="' + escAttr(existing ? existing.name : "") + '" /></div>' +
      '<div class="field"><label>Access code (optional)</label><input type="text" name="passcode" value="' + escAttr(existing ? existing.passcode : "") + '" placeholder="Leave blank for no code" /></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="active" id="active_cb" ' + (!existing || existing.active ? 'checked' : '') + ' /><label for="active_cb" style="text-transform:none;font-weight:400;">Active (can sign in)</label></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="isAdmin" id="admin_cb" ' + (existing && existing.isAdmin ? 'checked' : '') + ' /><label for="admin_cb" style="text-transform:none;font-weight:400;">Admin (Team page + edit reference content)</label></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="canAllocate" id="alloc_cb" ' + (existing && existing.canAllocate ? 'checked' : '') + ' /><label for="alloc_cb" style="text-transform:none;font-weight:400;">Can allocate jobs to others</label></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button>' +
    '<button type="button" class="btn btn-ghost" onclick="' + (existing ? "ui.editing.staff=null;render();" : "toggleForm('newStaff')") + '">Cancel</button></div>' +
  '</form></div>';
}
function saveStaff(e, origName){
  e.preventDefault();
  var f = e.target;
  var name = f.name.value.trim();
  if(!name) return;
  var data = { name: name, passcode: f.passcode.value.trim(), active: f.active.checked, isAdmin: f.isAdmin.checked, canAllocate: f.canAllocate.checked };
  if(origName){
    var t = findTeam(origName);
    Object.assign(t, data);
    if(origName === session.name && origName !== name){ session.name = name; setLocal("bp_signed_in_name", name); }
    ui.editing.staff = null;
  } else {
    if(findTeam(name)){ alert("Someone with that name is already on the team."); return; }
    state.team.push(data);
    ui.openForms.newStaff = false;
  }
  persist();
}
function removeStaff(name){
  if(!confirm('Remove ' + name + ' from the team? They will no longer be able to sign in.')) return;
  var idx = state.team.findIndex(function(t){ return t.name === name; });
  if(idx > -1) state.team.splice(idx, 1);
  persist();
}

/* ======================================================================
   PRIVATE -- a section visible only to a chosen pair of people (plus
   admins, so it can always be found and managed), at Maria's request ("Can
   you create a section in the app that is only for 2 people to look at").
   She hadn't decided who the two people are or what goes in it yet, so
   this sets up just the access control (an admin-managed allow-list of up
   to two team members, in state.settings.privateAccess) plus a private
   notes log to fill it with a working example, similar in shape to the
   Dashboard Notes board and the per-bull note log -- swap in something
   else later once there's a clearer idea of what belongs here.
   IMPORTANT LIMITATION (told to Maria before building this): this app
   keeps all of its data in one shared blob every signed-in device
   downloads (that's what makes offline mode and instant sync work), so
   this only hides the section in the app's own interface for everyone but
   the two chosen people (and admins) -- it is not a guarantee the
   underlying data never reaches another device, the same trust level as
   every other admin-gated feature in this app.
   ====================================================================== */
function renderPrivate(){
  var html = pageHead("Private", "Visible only to the two people listed under Access below (plus admins, so it can always be managed).");
  if(isAdmin()) html += renderPrivateAccessCard();
  html += renderPrivateInfoCard();
  html += renderPrivateNotesCard();
  return html;
}
/* ------------------------------------------------------------------------
   Information card (Private section) -- started as a fixed-shape "cotton &
   dryland spreadsheet summary" card at Maria's request, then generalized at
   her follow-up request ("Can you please make the private section fully
   editable including creating new headings, names, information etc").
   Now a free-form set of headings ("groups"), each holding any number of
   label/value fields -- add, rename, or remove headings and fields freely,
   no fixed structure. Anyone with Private access (not just admins) can
   edit it, per Maria's earlier choice for the old summary card, which
   carries over here.
   Data model: state.privateInfo = { groups: [{id, title, fields: [{id,
   label, value}]}], updatedAt, updatedBy }.
   ====================================================================== */
function renderPrivateInfoCard(){
  var info = state.privateInfo || { groups: [] };
  var groups = info.groups || [];
  var editing = !!ui.openForms.editPrivateInfo;
  var html = '<div class="card"><div class="card-row"><h3 style="margin:0;">Information</h3>' +
    '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'editPrivateInfo\')">' + (editing ? "Done" : "Edit") + '</button></div>' +
    '<p class="row-muted" style="margin:4px 0 12px;font-size:12.5px;">Whatever the two of you need to keep track of here -- add headings and fields freely.</p>';

  if(groups.length === 0){
    html += '<div class="empty-state">Nothing here yet' + (editing ? " -- add a heading below." : ".") + '</div>';
  } else {
    html += groups.map(function(g){
      var fields = g.fields || [];
      var out = '<div style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);">';
      if(editing){
        out += '<div class="card-row" style="margin-bottom:8px;gap:8px;">' +
          '<input type="text" value="' + escAttr(g.title) + '" style="font-weight:700;font-size:13.5px;flex:1;" onchange="updatePrivateInfoGroupTitle(\'' + g.id + '\',this.value)" />' +
          '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="confirmRemovePrivateInfoGroup(\'' + g.id + '\')">Remove heading</button>' +
        '</div>';
        out += fields.map(function(f){
          return '<div class="form-grid" style="margin-bottom:6px;align-items:end;">' +
            '<div class="field"><label>Label</label><input type="text" value="' + escAttr(f.label) + '" onchange="updatePrivateInfoFieldLabel(\'' + g.id + '\',\'' + f.id + '\',this.value)" /></div>' +
            '<div class="field"><label>Value</label><input type="text" value="' + escAttr(f.value) + '" onchange="updatePrivateInfoFieldValue(\'' + g.id + '\',\'' + f.id + '\',this.value)" /></div>' +
            '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="removePrivateInfoField(\'' + g.id + '\',\'' + f.id + '\')">Remove</button>' +
          '</div>';
        }).join("") +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="addPrivateInfoField(\'' + g.id + '\')">+ Add field</button>';
      } else {
        out += '<h4 style="margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);">' + esc(g.title) + '</h4>';
        if(fields.length === 0){
          out += '<p class="row-muted" style="font-size:12.5px;margin:0;">No fields yet.</p>';
        } else {
          out += fields.map(function(f){
            return '<div class="card-row" style="padding:4px 0;"><span class="row-muted" style="font-size:12.5px;">' + esc(f.label) + '</span><span style="font-size:13.5px;font-weight:600;">' + (f.value ? esc(f.value) : '&mdash;') + '</span></div>';
          }).join("");
        }
      }
      out += '</div>';
      return out;
    }).join("");
  }

  if(editing){
    html += '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="addPrivateInfoGroup()">+ Add heading</button>';
  }

  html += '<p class="row-muted" style="margin:10px 0 0;font-size:12px;">' +
    (info.updatedAt ? ("Last updated " + fmtDateTime(info.updatedAt) + (info.updatedBy ? (" by " + esc(info.updatedBy)) : "")) : "Not updated yet.") +
    '</p>';
  html += '</div>';
  return html;
}
function touchPrivateInfo(){
  var u = currentUser();
  state.privateInfo.updatedAt = new Date().toISOString();
  state.privateInfo.updatedBy = u ? u.name : null;
}
function findPrivateInfoGroup(groupId){
  return byId((state.privateInfo && state.privateInfo.groups) || [], groupId);
}
function addPrivateInfoGroup(){
  state.privateInfo = state.privateInfo || { groups: [] };
  state.privateInfo.groups = state.privateInfo.groups || [];
  state.privateInfo.groups.push({ id: uid("pgrp"), title: "New heading", fields: [] });
  touchPrivateInfo();
  persist();
}
function confirmRemovePrivateInfoGroup(groupId){
  var g = findPrivateInfoGroup(groupId);
  if(!g) return;
  if(confirm('Remove the "' + g.title + '" heading and everything under it? This cannot be undone.')){
    removeById(state.privateInfo.groups, groupId);
    touchPrivateInfo();
    persist();
  }
}
function updatePrivateInfoGroupTitle(groupId, value){
  var g = findPrivateInfoGroup(groupId);
  if(!g) return;
  g.title = value;
  touchPrivateInfo();
  persist();
}
function addPrivateInfoField(groupId){
  var g = findPrivateInfoGroup(groupId);
  if(!g) return;
  g.fields = g.fields || [];
  g.fields.push({ id: uid("pfld"), label: "New field", value: "" });
  touchPrivateInfo();
  persist();
}
function removePrivateInfoField(groupId, fieldId){
  var g = findPrivateInfoGroup(groupId);
  if(!g) return;
  removeById(g.fields, fieldId);
  touchPrivateInfo();
  persist();
}
function updatePrivateInfoFieldLabel(groupId, fieldId, value){
  var g = findPrivateInfoGroup(groupId);
  if(!g) return;
  var f = byId(g.fields, fieldId);
  if(!f) return;
  f.label = value;
  touchPrivateInfo();
  persist();
}
function updatePrivateInfoFieldValue(groupId, fieldId, value){
  var g = findPrivateInfoGroup(groupId);
  if(!g) return;
  var f = byId(g.fields, fieldId);
  if(!f) return;
  f.value = value;
  touchPrivateInfo();
  persist();
}
function renderPrivateAccessCard(){
  var access = state.settings.privateAccess || [];
  var everyone = (state.team || []).map(function(t){ return t.name; });
  var available = everyone.filter(function(n){ return access.indexOf(n) === -1; });
  var html = '<div class="card"><h3 style="margin-bottom:6px;">Access</h3>' +
    '<p class="row-muted" style="margin:0 0 12px;font-size:12.5px;">Only these people can see this section (admins can always see and manage it too). Up to two people.</p>';
  if(access.length === 0){
    html += '<div class="empty-state">Nobody has access yet -- add up to two people below.</div>';
  } else {
    html += access.map(function(name, idx){
      return '<div class="card-row" style="padding:6px 0;">' +
        '<span style="font-size:13.5px;font-weight:600;">' + esc(name) + '</span>' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="removePrivateAccessAt(' + idx + ')">Remove</button>' +
      '</div>';
    }).join("");
  }
  if(access.length < 2 && available.length){
    html += '<form class="form-panel" style="margin-top:10px;" onsubmit="submitAddPrivateAccess(event)">' +
      '<div class="form-grid"><div class="field span-2"><label>Add person</label><select name="member">' +
        available.map(function(n){ return '<option value="' + escAttr(n) + '">' + esc(n) + '</option>'; }).join("") +
      '</select></div></div>' +
      '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Add</button></div>' +
    '</form>';
  } else if(access.length >= 2){
    html += '<p class="row-muted" style="margin:10px 0 0;font-size:12px;">Two people already have access -- remove one first to add someone else.</p>';
  }
  html += '</div>';
  return html;
}
function submitAddPrivateAccess(e){
  e.preventDefault();
  var f = e.target;
  var name = f.member.value;
  if(!name) return;
  state.settings.privateAccess = state.settings.privateAccess || [];
  if(state.settings.privateAccess.length >= 2) return;
  if(state.settings.privateAccess.indexOf(name) === -1) state.settings.privateAccess.push(name);
  persist();
}
function removePrivateAccessAt(idx){
  var access = state.settings.privateAccess || [];
  if(idx < 0 || idx >= access.length) return;
  access.splice(idx, 1);
  persist();
}
function renderPrivateNotesCard(){
  var notes = (state.privateNotes || []).slice().sort(byDateDesc("postedAt"));
  var u = currentUser();
  var html = '<div class="card"><div class="card-row"><h3 style="margin:0;">Notes</h3>' +
    '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="toggleForm(\'newPrivateNote\')">' + (ui.openForms.newPrivateNote ? "Cancel" : "+ Add note") + '</button></div>' +
    '<p class="row-muted" style="margin:4px 0 12px;font-size:12.5px;">A starting point -- happy to swap this for something else once you know what this section is for.</p>';
  if(ui.openForms.newPrivateNote) html += renderPrivateNoteForm();
  if(notes.length === 0){
    html += '<div class="empty-state">No notes yet.</div>';
  } else {
    html += notes.map(function(n){
      var canDelete = isAdmin() || (u && n.author === u.name);
      return '<div style="padding:10px 0;border-top:1px solid var(--border);">' +
        '<div class="card-row" style="margin-bottom:4px;"><span class="row-muted" style="font-size:12px;">' + esc(n.author) + ' &middot; ' + fmtDateTime(n.postedAt) + '</span>' +
        (canDelete ? '<button type="button" class="btn btn-ghost btn-sm" onclick="confirmDeletePrivateNote(\'' + n.id + '\')">Delete</button>' : '') +
        '</div>' +
        '<p style="margin:0;font-size:13.5px;white-space:pre-wrap;">' + esc(n.text) + '</p>' +
      '</div>';
    }).join("");
  }
  html += '</div>';
  return html;
}
function renderPrivateNoteForm(){
  var err = ui.formErrors.newPrivateNote;
  return '<form class="form-panel" style="margin:0 0 10px;" onsubmit="addPrivateNote(event)">' +
    (err ? '<p style="color:var(--danger);font-size:12.5px;font-weight:600;margin:0 0 10px;">' + esc(err) + '</p>' : '') +
    '<div class="field"><label>Note</label><textarea name="text" rows="3" required></textarea></div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Post note</button><button type="button" class="btn btn-ghost" onclick="delete ui.formErrors.newPrivateNote;toggleForm(\'newPrivateNote\')">Cancel</button></div>' +
  '</form>';
}
function addPrivateNote(e){
  e.preventDefault();
  var f = e.target;
  var text = f.text.value.trim();
  if(!text){ ui.formErrors.newPrivateNote = "Write something before posting."; render(); return; }
  delete ui.formErrors.newPrivateNote;
  var u = currentUser();
  state.privateNotes = state.privateNotes || [];
  state.privateNotes.push({ id: uid("pnote"), text: text, author: u ? u.name : "Unknown", postedAt: new Date().toISOString() });
  ui.openForms.newPrivateNote = false;
  persist();
}
function confirmDeletePrivateNote(id){
  var n = byId(state.privateNotes, id);
  if(!n) return;
  var preview = n.text.length > 40 ? (n.text.slice(0,40) + "...") : n.text;
  if(confirm('Delete this note ("' + preview + '")? This cannot be undone.')){
    removeById(state.privateNotes, id);
    persist();
  }
}

/* ======================================================================
   FORCE REFRESH (sidebar button)
   ====================================================================== */
// A plain page reload can still show a stale, previously-cached copy of the
// app -- the service worker (see sw.js) deliberately serves its cached copy
// first for speed, then only refreshes that cache in the background. This
// button skips that: it unregisters the service worker and clears its
// caches first, then reloads with a cache-busting query string so the
// browser is forced to fetch the current files straight from the network.
// It never touches farm data (that lives in Supabase / localStorage, not in
// these caches), so there's nothing risky about using it any time.
function forceRefreshApp(){
  // Refreshing needs a live connection -- it unregisters the service worker
  // and clears its cache, then reloads over the network. Doing that while
  // offline would strand the person on a browser "no internet" error page
  // instead of the app, so refuse early and say why. This never touches
  // farm data either way (offline edits live in localStorage, untouched by
  // this function), but the app itself would be unreachable until back in
  // range, so it's not worth the risk.
  if(isOffline || (typeof navigator !== "undefined" && "onLine" in navigator && !navigator.onLine)){
    setNotice("warn", "Refresh needs an internet connection -- you're currently offline, so the app is staying on this device's saved copy. Your data is safe either way; try Refresh again once you're back in range.");
    return;
  }
  var btn = document.getElementById("refreshAppBtn");
  if(btn){ btn.disabled = true; btn.innerHTML = "&#8987;"; }
  var reloaded = false;
  function goReload(){
    if(reloaded) return;
    reloaded = true;
    location.href = location.pathname + "?refreshed=" + Date.now();
  }
  var tasks = [];
  if("serviceWorker" in navigator){
    tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    }).catch(function(){}));
  }
  if("caches" in window){
    tasks.push(caches.keys().then(function(names){
      return Promise.all(names.map(function(n){ return caches.delete(n); }));
    }).catch(function(){}));
  }
  Promise.all(tasks).then(goReload).catch(goReload);
  // Safety net in case a registration/cache call hangs -- never leave the
  // person stuck on a disabled button.
  setTimeout(goReload, 3000);
}

/* ======================================================================
   START
   ====================================================================== */
if("serviceWorker" in navigator){
  // Keeps a cached copy of the app itself so it can still open with no
  // signal at all -- see sw.js. If this fails (unsupported browser, etc.)
  // the app still works fine, it just needs a connection to load fresh.
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(){
      // Checks whether this device already has a saved push subscription
      // (e.g. from a previous visit) so the "Get notified" button on the
      // Dashboard shows the right state from the start.
      refreshPushSubscriptionStatus();
    }).catch(function(e){
      console.error("[Bullamon Plains] service worker registration failed:", e);
    });
  });
}
boot();
</script>
