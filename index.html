function openIncidentsCount(){ return (state.whs.incidents || []).filter(function(i){ return i.status !== "Closed"; }).length; }

// Builds the ordered list of sidebar sections (each either a heading with
// its assigned items, or a single standalone item) from state.sidebarConfig
// -- see the block comment above the NAV array. Deliberately defensive
// against stale/missing config (a heading token pointing at a since-deleted
// heading, an item never assigned a section-order token, etc.) so a menu
// item can never silently disappear just because the config drifted --
// anything visible-but-unaccounted-for is appended standalone at the end.
function sidebarSections(){
  var cfg = state.sidebarConfig || {};
  var headings = cfg.headings || [];
  var itemHeading = cfg.itemHeading || {};
  var order = cfg.sectionOrder || [];
  var visibleNav = NAV.filter(function(n){ return (!n.adminOnly || isAdmin()) && (!n.visibleIf || n.visibleIf()); });
  var byKey = {};
  visibleNav.forEach(function(n){ byKey[n.key] = n; });
  var headingsById = {};
  headings.forEach(function(h){ headingsById[h.id] = h; });

  var sections = [];
  var placed = {};
  order.forEach(function(token){
    if(token.indexOf("heading:") === 0){
      var hid = token.slice(8);
      var heading = headingsById[hid];
      if(!heading) return;
      var items = visibleNav.filter(function(n){ return itemHeading[n.key] === hid; });
      if(items.length === 0) return;
      items.forEach(function(n){ placed[n.key] = true; });
      sections.push({ type: "heading", id: hid, name: heading.name, items: items });
    } else if(token.indexOf("item:") === 0){
      var key = token.slice(5);
      var item = byKey[key];
      if(!item || itemHeading[key]) return; // assigned to a heading elsewhere -- let that claim it, never show twice
      placed[key] = true;
      sections.push({ type: "item", item: item });
    }
  });
  visibleNav.forEach(function(n){
    if(!placed[n.key]) sections.push({ type: "item", item: n });
  });
  return sections;
}

function navRowHtml(n){
  var badge = "";
  if(n.key === "jobs" && openJobsCount() > 0) badge = '<span class="nav-badge">' + openJobsCount() + "</span>";
  if(n.key === "whs" && openIncidentsCount() > 0) badge = '<span class="nav-badge">' + openIncidentsCount() + "</span>";
  return '<button type="button" class="nav-btn' + (ui.section === n.key ? " active" : "") + '" onclick="goTo(\'' + n.key + '\')">' +
    '<span class="nav-icon-circle">' + (n.key === "bulls" ? '<span class="icon-force-black">' + n.icon + '</span>' : n.icon) + '</span>' +
    '<span class="nav-btn-label">' + esc(n.label) + '</span>' + badge +
    '<span class="nav-chevron">&#8250;</span>' +
  '</button>';
}

function renderShell(){
  var u = currentUser();
  var navHtml = sidebarSections().map(function(sec){
    if(sec.type === "heading"){
      return '<div class="nav-section-label">' + esc(sec.name) + '</div>' +
        '<div class="nav-card">' + sec.items.map(navRowHtml).join("") + '</div>';
    }
    return '<div class="nav-card">' + navRowHtml(sec.item) + '</div>';
  }).join("");

  return '' +
  '<div id="app-shell"' + (ui.mobileMenuOpen ? ' class="mobile-menu-open"' : '') + '>' +
    '<nav class="sidebar">' +
      '<div class="brand" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">' +
        '<div>' +
          '<p class="brand-name">' + esc(state.meta.propertyName) + '</p>' +
          '<p class="brand-tag">' + esc(state.meta.tagline) + '</p>' +
        '</div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;">' +
          '<button type="button" id="refreshAppBtn" class="refresh-btn" title="Refresh to load the latest version of the app" onclick="forceRefreshApp()">&#8635;</button>' +
          '<span title="This is the version currently running on this device -- if someone tells you a newer version was sent, tap the refresh button above until this changes." style="font-size:9.5px;color:var(--accent-contrast);opacity:.75;white-space:nowrap;">v' + esc(APP_BUILD) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="nav-list">' + navHtml + '</div>' +
      '<div class="sidebar-spacer"></div>' +
      '<div class="whoami">' +
        '<div class="whoami-name">' + esc(u.name) + (u.isAdmin ? ' &middot; Admin' : '') + '</div>' +
        '<div class="whoami-role">' + (writeChecked && !writable ? "View only" : "Signed in") + '</div>' +
        '<button type="button" class="signout-btn" onclick="signOut()">Sign out</button>' +
      '</div>' +
    '</nav>' +
    '<main>' + renderMobileBackBar() + renderOfflineBanner() + renderNotice() + renderSection() + '</main>' +
  '</div>';
}

// Mobile-only "Back to menu" bar shown above a section's content -- see the
// #app-shell.mobile-menu-open CSS rules (only active under the 900px layout
// breakpoint; on desktop this renders but stays hidden, since there's
// always a visible sidebar there to navigate from instead).
function renderMobileBackBar(){
  var current = NAV.filter(function(n){ return n.key === ui.section; })[0];
  return '<div class="mobile-back-bar">' +
    '<button type="button" class="mobile-back-btn" onclick="showMobileMenu()">&larr; Menu</button>' +
    (current ? '<span class="mobile-back-title">' + esc(current.label) + '</span>' : '') +
  '</div>';
}

// On mobile, opening a section's content pushes a browser history entry, so
// the phone's own back button (hardware key or edge-swipe gesture) backs out
// to the menu instead of leaving the app entirely -- matching how a native
// app's back button usually works (step back one screen at a time, then
// exit). The in-app "<- Menu" button goes through the exact same
// history.back() path rather than just toggling the view directly, so
// there's only ever one mechanism to keep in sync, not two that can drift
// apart. Desktop is unaffected -- no history entry is pushed there, since
// the sidebar is always visible and there's nothing to "back" out of.
function goTo(section){
  ui.section = section;
  ui.mobileMenuOpen = false;
  if(typeof history !== "undefined" && typeof window !== "undefined" && window.matchMedia && window.matchMedia("(max-width: 900px)").matches){
    try{ history.pushState({ bpMobileSection: true }, "", location.href); }catch(e){ /* pushState blocked (e.g. a sandboxed preview) -- the in-app Menu button still works, just without the phone back-button tie-in */ }
  }
  render();
}
function showMobileMenu(){
  if(typeof history !== "undefined" && history.state && history.state.bpMobileSection){
    history.back(); // triggers the popstate handler below, which flips ui.mobileMenuOpen and re-renders
  } else {
    ui.mobileMenuOpen = true;
    render();
  }
}
function handleMobileBackPopState(){
  // The phone's own back button/gesture landed on the entry from BEFORE a
  // section's content was opened -- treat it exactly like tapping "<- Menu"
  // ourselves. Only acts while content is actually showing, so this never
  // interferes with the browser's own back/forward behaviour anywhere else
  // (including a plain "back" press from the menu itself, which is left
  // alone to exit the app as usual).
  if(!ui.mobileMenuOpen){
    ui.mobileMenuOpen = true;
    render();
  }
}
if(typeof window !== "undefined"){ window.addEventListener("popstate", handleMobileBackPopState); }

function renderOfflineBanner(){
  var html = "";
  if(isOffline || hasPendingOfflineEdits()){
    var msg = hasPendingOfflineEdits()
      ? "You’re offline — your changes are saved on this device and will sync automatically once you’re back in range."
      : "You’re offline — showing the last data downloaded to this device. Changes you make now will be saved once you’re back in range.";
    html += '<div class="banner warn" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">' +
      '<span>' + msg + '</span>' +
      (hasPendingOfflineEdits() ? '<button type="button" class="subtle-btn" onclick="attemptOfflineSync()">Try now</button>' : '') +
    '</div>';
  }
  if(offlineConflict){
    html += '<div class="banner err" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">' +
      '<span>Someone else saved changes while this device was offline, so your offline changes from ' + esc(fmtDateTime(offlineConflict.since)) + ' couldn’t be combined automatically. Download them below before they’re lost, and re-apply anything important by hand.</span>' +
      '<span style="display:flex;gap:6px;flex-shrink:0;">' +
        '<button type="button" class="subtle-btn" onclick="downloadOfflineConflict()">Download</button>' +
        '<button type="button" class="subtle-btn" onclick="offlineConflict=null;render();">Dismiss</button>' +
      '</span>' +
    '</div>';
  }
  return html;
}

function renderNotice(){
  if(!notice) return "";
  var cls = (notice.kind === "view-only" || notice.kind === "conflict" || notice.kind === "warn") ? "warn" : notice.kind === "err" ? "err" : notice.kind === "ok" ? "ok" : "";
  return '<div class="banner ' + cls + '" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">' +
    '<span>' + esc(notice.msg) + '</span>' +
    '<span style="display:flex;gap:6px;flex-shrink:0;">' +
    (notice.kind === "err" || notice.kind === "view-only" ? '<button type="button" class="subtle-btn" onclick="retrySave()">Retry now</button>' : '') +
    (notice.kind !== "conflict" ? '<button type="button" class="subtle-btn" onclick="dismissNotice()">Dismiss</button>' : '') +
    '</span>' +
  '</div>';
}

function renderSection(){

    case "bulls": return renderBulls();
    case "machinery": return renderMachinery();

function renderDashboardOpenIssuesCard(){

/* ----------------------------------------------------------------------
   PUSH NOTIFICATIONS for Dashboard notes -- at Maria's request ("Is it
   possible to make the phone send a notification when something is added
   to the notes"). This is safe to be public -- it's the public half of a
   key pair (see PUSH_NOTIFICATIONS_SETUP.md); the matching private key
   never leaves Supabase.
   A staff member taps "Get notified of new notes" once per device, which
   asks the browser/phone for notification permission and registers a push
   subscription with the browser's push service; that subscription
   (endpoint + keys, no personal data beyond their team name) is saved to a
   new `push_subscriptions` table in Supabase. A Supabase Edge Function
   (notify-new-dashboard-note, in supabase/functions/) is triggered by a
   Database Webhook every time app_state is saved; it diffs the old and new
   dashboardNotes lists, and for any note that's newly appeared, sends a
   real push notification (via the Web Push protocol) to every subscribed
   device except ones belonging to whoever wrote that note. Delivery to the
   phone itself happens entirely outside this app once sent -- through the
   browser vendor's push service -- so it still arrives even if nobody has
   the app open, which is the whole point. See PUSH_NOTIFICATIONS_SETUP.md
   for the one-time Supabase setup this needs before it will actually
   deliver anything.
   ---------------------------------------------------------------------- */
var VAPID_PUBLIC_KEY = "BEl6aS6JvtMlfrPQWQYuf9rqK5X-6dyUl0cURVDYsGPsWkCHms16njVwGIir5sN3vHvoRMhu7krm6FgjOizEl7k";

function pushSupported(){
  return (typeof navigator !== "undefined" && "serviceWorker" in navigator) &&
    (typeof window !== "undefined" && "PushManager" in window && "Notification" in window);
}
function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i = 0; i < rawData.length; i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}
async function refreshPushSubscriptionStatus(){
  if(!pushSupported()) return;
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    ui.pushSubscribed = !!sub;
    render();
  }catch(e){ /* leave as unknown -- the toggle just offers to turn it on */ }
}
function renderPushToggle(){
  if(!pushSupported()){
    return '<p class="row-muted" style="margin:0 0 10px;font-size:11.5px;">Push notifications aren\'t supported in this browser.</p>';
  }
  var html = "";
  if(ui.pushError) html += '<p style="color:var(--danger);font-size:12px;font-weight:600;margin:0 0 6px;">' + esc(ui.pushError) + '</p>';
  if(ui.pushSubscribed){
    html += '<button type="button" class="btn btn-ghost btn-sm"' + (ui.pushBusy ? " disabled" : "") + ' onclick="disableDashboardNotifications()">&#128276; Notifications on &mdash; turn off</button>';
  } else {
    html += '<button type="button" class="btn btn-ghost btn-sm"' + (ui.pushBusy ? " disabled" : "") + ' onclick="enableDashboardNotifications()">' + (ui.pushBusy ? "Turning on…" : "&#128276; Get notified of new notes") + '</button>';
  }
  return '<div style="margin:0 0 10px;">' + html + '</div>';
}
async function enableDashboardNotifications(){
  if(!pushSupported()){
    ui.pushError = "Push notifications aren't supported in this browser.";
    render();
    return;
  }
  if(!supabaseClient){
    ui.pushError = "Can't turn on notifications right now (not connected to the database). Try again once you're back online.";
    render();
    return;
  }
  ui.pushBusy = true;
  delete ui.pushError;
  render();
  try{
    var permission = await Notification.requestPermission();
    if(permission !== "granted"){
      ui.pushError = (permission === "denied")
        ? "Notifications are blocked for this app in your browser/phone settings. Turn them back on there, then try again."
        : "Notifications weren't enabled.";
      ui.pushBusy = false;
      render();
      return;
    }
    var reg = await navigator.serviceWorker.ready;
    var sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) }));
    var raw = sub.toJSON();
    var u = currentUser();
    var upRes = await supabaseClient.from("push_subscriptions").upsert({
      endpoint: raw.endpoint,
      p256dh: raw.keys.p256dh,
      auth: raw.keys.auth,
      user_name: u ? u.name : null
    }, { onConflict: "endpoint" });
    if(upRes.error) throw upRes.error;
    ui.pushSubscribed = true;
    ui.pushBusy = false;
    render();
  }catch(err){
    console.error("[Bullamon Plains] enabling push notifications failed:", err);
    ui.pushError = "Couldn't turn on notifications (" + (err && err.message ? err.message : "unknown error") + "). Try again once you're back online.";
    ui.pushBusy = false;
    render();
  }
}
async function disableDashboardNotifications(){
  if(!pushSupported()) return;
  ui.pushBusy = true;
  render();
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(sub){
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      if(supabaseClient){
        await supabaseClient.from("push_subscriptions").delete().eq("endpoint", endpoint);
      }
    }
    ui.pushSubscribed = false;
    ui.pushBusy = false;
    render();
  }catch(err){
    console.error("[Bullamon Plains] turning off push notifications failed:", err);
    ui.pushBusy = false;
    render();
  }
}

   MACHINERY
   ====================================================================== */
function machineDueForService(m){
  var d = daysUntil(m.nextServiceDue);
  return d != null && d <= 21;
}

// A maintenance schedule is "configured" once a starting hour reading and an
// interval (in hours) have both been entered manually for a machine.
function machineScheduleConfigured(m){
  return m.scheduleStartHours != null && m.serviceIntervalHours != null && m.serviceIntervalHours > 0;
}

// Builds a short window of service milestones (start + n * interval) around
// the machine's current reading: the most recently passed milestone (if any)
// plus the next few upcoming ones. Returns null when no schedule is set.
function machineScheduleMilestones(m){
  if(!machineScheduleConfigured(m)) return null;
  var start = m.scheduleStartHours;
  var interval = m.serviceIntervalHours;
  var current = m.currentReading || 0;
  var kLastDone = Math.floor((current - start) / interval);
  if(kLastDone < 0) kLastDone = 0;
  var fromK = Math.max(1, kLastDone - 1);
  var toK = kLastDone + 3;
  var milestones = [];
  var markedNext = false;
  for(var k = fromK; k <= toK; k++){
    var hours = start + k * interval;
    var status = hours <= current ? "done" : (markedNext ? "upcoming" : "next");
    if(status === "next") markedNext = true;
    milestones.push({ k: k, hours: hours, status: status });
  }
  return milestones;
}

function machineNextMilestone(m){
  var milestones = machineScheduleMilestones(m);
  if(!milestones) return null;
  for(var i = 0; i < milestones.length; i++){
    if(milestones[i].status === "next") return milestones[i];
  }
  return null;
}

// Rounds a computed milestone hour value to a stable key for matching
// against a saved log entry's milestoneHours -- start + k*interval can pick
// up float rounding noise (e.g. 2249.9999999998), so exact equality isn't
// safe to compare on.
function milestoneKey(hours){ return Math.round(hours * 100) / 100; }

// Finds the (most recent) service log entry recorded against a specific
// scheduled milestone, so the schedule table can show what was actually
// done at that point instead of just a due/done status.
function machineMilestoneLog(m, hours){
  var key = milestoneKey(hours);
  var log = m.log || [];
  for(var i = 0; i < log.length; i++){
    if(log[i].milestoneHours != null && milestoneKey(log[i].milestoneHours) === key) return log[i];
  }
  return null;
}

  if(text.indexOf("goldacres") > -1) return MACHINE_ICON_ASSETS.sprayer;
  if(text.indexOf("excavator") > -1) return MACHINE_ICON_ASSETS.excavator;
  if(text.indexOf("kenworth") > -1 || text.indexOf("mack") > -1) return MACHINE_ICON_ASSETS.truck;
  if(text.indexOf("track loader") > -1 || text.indexOf("track-loader") > -1) return MACHINE_ICON_ASSETS.trackloader;
  if(text.indexOf("loader") > -1) return MACHINE_ICON_ASSETS.loader;
  if(text.indexOf("moxy") > -1) return MACHINE_ICON_ASSETS.dumptruck;
  if(text.indexOf("dozer") > -1 || text.indexOf("bulldozer") > -1) return MACHINE_ICON_ASSETS.dozer;
  if(text.indexOf("header") > -1 || text.indexOf("combine") > -1) return MACHINE_ICON_ASSETS.header;
  return MACHINE_ICON_ASSETS.tractor;
}
function machineIconHtml(m, cls){
  return '<img class="' + cls + '" src="' + machineIconAsset(m) + '" alt="" />';
}

// The default set of standard-service checklist items a new machine starts
// with (2026-09-28, matching Maria's reference mockups' "Due at next
// service" / "Service items completed" checklists) -- editable per machine
// from its Overview tab afterwards, since not every machine's service is
// identical (e.g. a spray rig vs. a truck).
var DEFAULT_MACHINE_CHECKLIST = ["Engine oil & filter", "Fuel filters", "Air filter check", "Grease all points"];

// "Out of action" (2026-09-28): before issues had a severity, this was read
// as "has any open issue at all" (see the old fleet-card comment). Now that
// issues carry a severity, this means specifically "has an open issue
// marked Unsafe" -- matching the mockups ("Marking an issue Unsafe tags the
// machine Out of action"). A Minor or Needs-repair issue can be open
// without taking the machine out of action.
function machineOutOfAction(m){
  return (m.issues || []).some(function(i){ return i.status !== "Resolved" && i.severity === "Unsafe"; });
}

function renderMachinery(){
  // Fleet-list / detail-view navigation (2026-09-24 redesign, to match
  // Maria's reference photos): the page shows either the whole fleet as a
  // searchable, filterable list of collapsed cards, or -- once a machine is
  // selected -- a single machine's full detail screen with a back chevron
  // to return to the list. If the selected machine no longer exists (e.g.
  // it was just deleted entirely from its detail screen), fall back to the
  // list instead of showing a blank/broken page.
  var selected = ui.machinerySelected ? byId(state.machinery, ui.machinerySelected) : null;
  if(ui.machinerySelected && !selected) ui.machinerySelected = null;
  return selected ? renderMachineDetail(selected) : renderMachineryList();
}

function renderMachineryList(){
  var q = ui.machineryQuery.trim().toLowerCase();
  var all = state.machinery || [];
  var active = all.filter(function(m){ return m.status !== "archived"; });
  var archived = all.filter(function(m){ return m.status === "archived"; });
  var dueCount = active.filter(machineDueForService).length;
  var outCount = active.filter(machineOutOfAction).length;

  var filter = ui.machineryFilter || "all";
  var list = active;
  if(filter === "due") list = list.filter(machineDueForService);
  else if(filter === "out") list = list.filter(machineOutOfAction);
  if(q) list = list.filter(function(m){
    return (m.name + " " + (m.type||"") + " " + (m.regNo||"")).toLowerCase().indexOf(q) > -1;
  });

  var html = pageHead("Machinery Maintenance", "Service history, hour/km readings and reported issues for farm plant and vehicles.");
  html += '<div class="stat-row">' +
    '<div class="stat"><div class="stat-num">' + active.length + '</div><div class="stat-label">Total machines</div></div>' +
    '<div class="stat"><div class="stat-num">' + dueCount + '</div><div class="stat-label">Due for service</div></div>' +
  '</div>';
  html += '<div class="toolbar">' +
    '<input id="machinery-search-input" class="search-input" type="text" placeholder="Search machinery…" value="' + escAttr(ui.machineryQuery) + '" oninput="ui.machineryQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newMachine\')">' + (ui.openForms.newMachine ? "Cancel" : "+ Add machine") + '</button>' : '') +
  '</div>';
  html += '<div class="filter-pill-row">' +
    ['all', 'due', 'out'].map(function(key){
      var labels = { all: "All", due: "Service due (" + dueCount + ")", out: "Out of action (" + outCount + ")" };
      return '<button type="button" class="filter-pill' + (filter === key ? " active" : "") + '" onclick="ui.machineryFilter=\'' + key + '\';render();">' + labels[key] + '</button>';
    }).join("") +
  '</div>';
  if(ui.openForms.newMachine) html += renderMachineForm();

  if(list.length === 0){ html += '<div class="empty-state">No machinery matches your search.</div>'; }
  html += '<div class="list-cards">' + list.map(renderMachineFleetCard).join("") + '</div>';

  if(archived.length){
    html += '<h3 style="margin:26px 0 10px;font-size:15px;">Sold or Other (' + archived.length + ')</h3>' +
      '<p class="row-muted" style="margin:0 0 12px;font-size:12px;">Machines moved out of the active list. Service history is kept and they can be restored at any time.</p>';
    html += '<div class="list-cards">' + archived.map(renderArchivedMachineCard).join("") + '</div>';
  }
  return html;
}

// A single collapsed row in the fleet list: photo/icon placeholder, name,
// type/rego, and a status pill -- exactly what the reference photos show.
// The whole row is the click target and always navigates into that
// machine's own detail screen (renderMachineDetail); nothing expands here.
function renderMachineFleetCard(m){
  var d = daysUntil(m.nextServiceDue);
  var issues = m.issues || [];
  var openIssues = issues.filter(function(i){ return i.status !== "Resolved"; });
  var scheduleConfigured = machineScheduleConfigured(m);
  var nextMilestone = machineNextMilestone(m);
  var dueLabel, dueTone;
  if(scheduleConfigured && nextMilestone){
    var hoursRemaining = nextMilestone.hours - (m.currentReading || 0);
    var toneWindow = m.serviceIntervalHours || 250;
    dueTone = hoursRemaining <= toneWindow * 0.1 ? "pill-high" : hoursRemaining <= toneWindow * 0.25 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due at " + fmtNum(nextMilestone.hours, "hrs");
  } else {
    dueTone = d != null && d <= 7 ? "pill-high" : d != null && d <= 21 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due " + fmtDate(m.nextServiceDue);
  }
  return '<div class="card" style="cursor:pointer;" onclick="ui.machinerySelected=\'' + m.id + '\';render();">' +
    '<div class="card-row">' +
      '<div style="display:flex;gap:12px;align-items:center;min-width:0;">' +
        '<div class="machine-photo">' + machineIconHtml(m, "machine-icon-img") + '</div>' +
        '<div style="min-width:0;"><h3 style="margin-bottom:2px;font-size:18px;color:var(--accent-strong);">' + esc(m.name) + '</h3>' +
        '<p class="row-muted" style="margin:0;font-size:12.5px;">' + esc(m.type) + (m.regNo ? " &middot; " + esc(m.regNo) : "") + '</p></div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">' +
        (machineOutOfAction(m) ? '<span class="pill pill-high">&#9888; Out of action</span>' : (openIssues.length ? '<span class="pill pill-medium">' + openIssues.length + ' issue' + (openIssues.length === 1 ? "" : "s") + '</span>' : "")) +
        '<span class="pill pill-due ' + dueTone + '">' + dueLabel + '</span>' +
        '<span class="nav-chevron">&#8250;</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// A machine's full detail screen -- back chevron, header (photo placeholder,
// name/type/rego, current reading), an orange "service due" progress card,
// then every capability the old expanded card used to have (edit/archive,
// combined service history + schedule, parts & part numbers, issues), all
// unchanged. Deliberately has no "Start pre-start check" button -- that's
// from Maria's reference photos but isn't a feature this app has, and she
// asked for it to be left out.
function renderMachineDetail(m){
  var editing = ui.editing.machine === m.id;
  var html = '<button type="button" class="back-chevron-btn" onclick="ui.machinerySelected=null;ui.machineryLogWork=null;ui.machineryReportIssue=null;ui.machineryIssueSelected=null;render();">&#8249; Back to machinery</button>';
  html += '<div class="card">';
  if(editing){
    html += renderMachineForm(m);
    html += '</div>';
    return html;
  }

  // Dedicated full-page sub-screens -- Log work, Report an issue, and an
  // issue's own detail/action-timeline screen (2026-09-28 restructure, to
  // match Maria's reference mockups) -- take over the whole card instead of
  // living inline in a tab, since each of these is a one-off action rather
  // than something to browse. Each has its own back/Cancel control.
  if(ui.machineryLogWork && ui.machineryLogWork.id === m.id){
    html += renderMachineLogWorkForm(m, ui.machineryLogWork);
    html += '</div>';
    return html;
  }
  if(ui.machineryReportIssue === m.id){
    html += renderMachineIssueForm(m);
    html += '</div>';
    return html;
  }
  var selectedIssue = ui.machineryIssueSelected ? byId(m.issues || [], ui.machineryIssueSelected) : null;
  if(ui.machineryIssueSelected && !selectedIssue) ui.machineryIssueSelected = null;
  if(selectedIssue){
    html += renderMachineIssueDetail(m, selectedIssue);
    html += '</div>';
    return html;
  }

  var issues = m.issues || [];
  var scheduleConfigured = machineScheduleConfigured(m);
  var nextMilestone = machineNextMilestone(m);
  var d = daysUntil(m.nextServiceDue);
  var dueLabel, dueTone, dueOk, progressPct = null;
  if(scheduleConfigured && nextMilestone){
    var hoursRemaining = nextMilestone.hours - (m.currentReading || 0);
    var toneWindow = m.serviceIntervalHours || 250;
    dueOk = hoursRemaining > toneWindow * 0.25;
    dueTone = hoursRemaining <= toneWindow * 0.1 ? "pill-high" : hoursRemaining <= toneWindow * 0.25 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due at " + fmtNum(nextMilestone.hours, "hrs") + " (" + fmtNum(Math.max(0, hoursRemaining), "hrs") + " to go)";
    progressPct = Math.max(0, Math.min(100, 100 * (1 - hoursRemaining / toneWindow)));
  } else {
    dueOk = d == null || d > 21;
    dueTone = d != null && d <= 7 ? "pill-high" : d != null && d <= 21 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due " + fmtDate(m.nextServiceDue);
  }

  html += '<div class="card-row" style="align-items:flex-start;">' +
    '<div style="display:flex;gap:14px;align-items:center;min-width:0;">' +
      '<div class="machine-photo machine-photo-lg">' + machineIconHtml(m, "machine-icon-img") + '</div>' +
      '<div style="min-width:0;"><h3 style="margin-bottom:2px;font-size:22px;color:var(--accent-strong);">' + esc(m.name) + '</h3>' +
      '<p class="row-muted" style="margin:0;font-size:13px;">' + esc(m.type) + (m.regNo ? " &middot; " + esc(m.regNo) : "") + '</p>' +
      '<p class="row-muted" style="margin:4px 0 0;font-size:12.5px;">' + fmtNum(m.currentReading, "hrs") + ' current reading</p></div>' +
    '</div>' +
    '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">' +
      (machineOutOfAction(m) ? '<span class="pill pill-high">&#9888; Out of action</span>' : '') +
      (m.status === "archived" ? '<span class="pill pill-todo">Sold / Other</span>' : '') +
    '</div>' +
  '</div>';

  if(m.status === "archived"){
    html += '<p class="row-muted" style="margin:10px 0 0;font-size:12px;">' +
      (m.archivedReason ? esc(m.archivedReason) : "No reason given") + (m.archivedDate ? " &middot; " + fmtDate(m.archivedDate) : "") +
    '</p>';
    if(isAdmin()){
      html += '<div class="job-actions" style="margin:10px 0 0;">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="restoreMachine(\'' + m.id + '\')">Restore to active list</button>' +
        '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteMachine(\'' + m.id + '\')">Delete machine entirely</button>' +
      '</div>';
    }
  } else if(isAdmin()){
    html += '<div class="job-actions" style="margin:10px 0 0;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.machine=\'' + m.id + '\';render();">Edit</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + m.id + '\')">' + (ui.openForms["archive_" + m.id] ? "Cancel" : "Mark as Sold / Other") + '</button>' +
    '</div>';
    if(ui.openForms["archive_" + m.id]) html += renderArchiveMachineForm(m);
  }

  // Overview / Parts / History / Issues tabs (2026-09-28 restructure, at
  // Maria's request, to match her reference mockups) -- replaces the old
  // always-visible stacked "Show service history" / "Show Parts & Part
  // Numbers" / "Report Issue & Show Issues" toggle sections with a proper
  // tab strip. Reuses the same .filter-pill-row look as the fleet list's
  // own All/Due/Out filter pills (see .detail-tab-row/.detail-tab-btn in
  // the stylesheet) so this still reads as this app's existing design
  // language, not a new one -- Maria asked to restructure the content and
  // flow here, not restyle the app.
  var tab = ui.machineryTab || "overview";
  html += '<div class="detail-tab-row">' +
    [["overview", "Overview"], ["parts", "Parts"], ["schedule", "Service Schedule"], ["issues", "Issues (" + issues.length + ")"]].map(function(t){
      return '<button type="button" class="detail-tab-btn' + (tab === t[0] ? " active" : "") + '" onclick="ui.machineryTab=\'' + t[0] + '\';render();">' + t[1] + '</button>';
    }).join("") +
  '</div>';

  if(tab === "parts") html += renderMachinePartsTab(m);
  else if(tab === "schedule") html += renderMachineServiceScheduleTab(m);
  else if(tab === "issues") html += renderMachineIssuesTab(m);
  else html += renderMachineOverviewTab(m, dueLabel, dueOk, progressPct);

  html += '</div>';
  return html;
}

// Overview tab: the "next service due" status card (now with a progress
// bar towards the next scheduled milestone, at Maria's request to "make the
// boxes/info deeper" -- reusing the exact same due/hours-remaining maths
// this app already had, just also drawn as a bar), Last service/Interval,
// and the three primary actions (Log service / Log other work / Report
// issue) as full-page screens of their own, matching the reference
// mockups. The "Due at next service" checklist used to live here too, but
// moved to the new Service Schedule tab (2026-09-28, at Maria's follow-up
// request: "Note on the overview should list items due at the next service
// and these items should be in the service schedule") -- see
// renderMachineServiceScheduleTab. Log service still opens the same quick
// Log Work form either way; it reads the same m.serviceChecklistItems
// either way too, so nothing about what gets logged changed, just where the
// checklist is shown/edited.
function renderMachineOverviewTab(m, dueLabel, dueOk, progressPct){
  var html = '<div class="due-progress-card' + (dueOk ? " ok" : "") + '"><div class="stat-label">Maintenance status</div>' +
    '<div style="font-weight:700;font-size:14.5px;margin-top:2px;">' + dueLabel + '</div>' +
    (progressPct != null ? '<div style="height:8px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden;"><div style="height:100%;width:' + progressPct.toFixed(1) + '%;background:var(--accent-strong);"></div></div>' : '') +
  '</div>';

  html += '<div class="form-grid" style="margin:12px 0;">' +
    '<div><div class="stat-label">Last service</div><div style="font-weight:600;">' + fmtNum(m.lastServiceReading, "hrs") + ' &middot; ' + fmtDate(m.lastServiceDate) + '</div></div>' +
    '<div><div class="stat-label">Interval</div><div style="font-weight:600;">' + esc(m.serviceIntervalDesc || "—") + '</div></div>' +
  '</div>';

  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;">' +
    '<button type="button" class="btn btn-primary" style="width:auto;" onclick="ui.machineryLogWork={id:\'' + m.id + '\',mode:\'service\'};render();">&#128295; Log service</button>' +
    '<button type="button" class="btn btn-ghost" style="width:auto;" onclick="ui.machineryLogWork={id:\'' + m.id + '\',mode:\'other\'};render();">+ Log other work</button>' +
    '<button type="button" class="btn btn-ghost" style="width:auto;" onclick="ui.machineryReportIssue=\'' + m.id + '\';render();">&#9888; Report issue</button>' +
  '</div>';
  return html;
}

// A machine's standard service checklist (2026-09-28) -- deliberately just
// a plain one-item-per-line textarea rather than individual add/remove
// buttons per item, since re-typing a short list occasionally is far less
// code and far less fragile than a whole separate mini-CRUD for it, and
// this is edited rarely (set once per machine, tweaked occasionally) rather
// than a running log.
function renderMachineChecklistForm(m){
  var current = (m.serviceChecklistItems || []).join("\n");
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="saveMachineChecklist(event,\'' + m.id + '\')">' +
    '<h4 style="margin-top:0;">Service checklist — ' + esc(m.name) + '</h4>' +
    '<div class="field"><label>One item per line</label><textarea name="items" rows="5" placeholder="e.g. Engine oil &amp; filter">' + esc(current) + '</textarea></div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'checklist_' + m.id + '\')">Cancel</button></div>' +
  '</form>';
}
function saveMachineChecklist(e, machineId){
  e.preventDefault();
  var f = e.target;
  var m = byId(state.machinery, machineId);
  if(!m) return;
  m.serviceChecklistItems = f.items.value.split("\n").map(function(s){ return s.trim(); }).filter(function(s){ return !!s; });
  ui.openForms["checklist_" + machineId] = false;
  persist();
}

// Parts tab wrapper: adds the search box and "+ Add part" button the
// reference mockup shows at the top of this screen, around the existing
// renderMachinePartsSection table (unchanged apart from the new Qty column
// and a copy-part-number button).
function renderMachinePartsTab(m){
  var q = (ui.machinePartsQuery || "").trim().toLowerCase();
  var addKey = "newPart_" + m.id;
  var html = '<div class="toolbar">' +
    '<input class="search-input" type="text" placeholder="Search parts or part numbers" value="' + escAttr(ui.machinePartsQuery || "") + '" oninput="ui.machinePartsQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'' + addKey + '\')">' + (ui.openForms[addKey] ? "Cancel" : "+ Add part") + '</button>' : "") +
  '</div>';
  if(ui.openForms[addKey]) html += renderMachinePartForm(m, null);
  html += renderMachinePartsSection(m, q);
  return html;
}

// Service Schedule tab (2026-09-28, at Maria's follow-up request: "the
// service schedule is now in history. It should be under Service Schedule.
// Note on the overview should list items due at the next service and these
// items should be in the service schedule") -- what used to be the History
// tab is now Service Schedule: the "Due at next service" checklist (moved
// here from Overview, same underlying m.serviceChecklistItems data, just
// shown/edited from this tab now instead), the maintenance-schedule admin
// controls, then the existing combined upcoming-milestones + completed-log
// table underneath (unchanged), and "Delete all service history" at the
// bottom -- past records stay on this same tab rather than a separate one.
function renderMachineServiceScheduleTab(m){
  var scheduleConfigured = machineScheduleConfigured(m);
  var checklist = m.serviceChecklistItems || [];
  var checklistEditing = ui.openForms["checklist_" + m.id];
  var html = '<div class="stat-label">Due at next service</div>';
  if(!checklist.length){
    html += '<div class="empty-state" style="margin-top:6px;">No standard service items set for this machine yet.</div>';
  } else {
    html += '<div style="margin-top:6px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;">' +
      checklist.map(function(item){ return '<div class="due-checklist-row"><span class="due-checklist-dot"></span>' + esc(item) + '</div>'; }).join("") +
    '</div>';
  }
  if(isAdmin()){
    html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="toggleForm(\'checklist_' + m.id + '\')">' + (checklistEditing ? "Cancel" : "Edit service checklist") + '</button>';
    if(checklistEditing) html += renderMachineChecklistForm(m);
  }

  html += '<div class="stat-label" style="margin-top:18px;">Schedule &amp; history</div>';
  html += renderMachineServiceHistory(m);
  if(isAdmin()){
    html += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'setSchedule_' + m.id + '\')">' + (ui.openForms["setSchedule_" + m.id] ? "Cancel" : (scheduleConfigured ? "Edit maintenance schedule" : "+ Set maintenance schedule")) + '</button>' +
      ((m.log || []).length ? '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteServiceHistory(\'' + m.id + '\')">Delete all service history</button>' : "") +
    '</div>';
  }
  if(ui.openForms["setSchedule_" + m.id]) html += renderMaintenanceScheduleForm(m);
  return html;
}

// Issues tab: a plain list (open issues read the same as before, just now
// each row opens its own full detail/action-timeline screen instead of
// expanding an inline edit form in place). Reporting a new issue is never
// admin-gated -- anyone signed in can report one, same as before this
// restructure.
function renderMachineIssuesTab(m){
  var issues = (m.issues || []).slice().sort(byDateDesc("date"));
  var html = "";
  if(!issues.length){
    html += '<div class="empty-state">No issues reported for this machine.</div>';
  } else {
    html += '<div class="list-cards">' + issues.map(function(iss){
      var open = iss.status !== "Resolved";
      var sevTone = iss.severity === "Unsafe" ? "pill-high" : iss.severity === "Needs repair" ? "pill-medium" : "pill-todo";
      return '<div class="card" style="cursor:pointer;box-shadow:none;border:1px solid var(--border);padding:10px 12px;" onclick="ui.machineryIssueSelected=\'' + iss.id + '\';render();">' +
        '<div class="card-row"><p style="margin:0;flex:1;">' + esc(iss.description) + '</p><span class="nav-chevron">&#8250;</span></div>' +
        '<div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;">' +
          '<span class="pill ' + (open ? "pill-high" : "pill-todo") + '">' + esc(iss.status || "Open") + '</span>' +
          (iss.severity ? '<span class="pill ' + sevTone + '">' + esc(iss.severity) + '</span>' : "") +
        '</div>' +
        '<p class="row-muted" style="margin:6px 0 0;font-size:11.5px;">Reported by ' + esc(iss.reportedBy) + ' on ' + fmtDate(iss.date) + '</p>' +
      '</div>';
    }).join("") + '</div>';
  }
  html += '<button type="button" class="btn btn-primary btn-sm" style="width:auto;margin-top:12px;" onclick="ui.machineryReportIssue=\'' + m.id + '\';render();">+ Report an issue</button>';
  return html;
}

// A single issue's full detail/action-timeline screen (2026-09-28, matching
// the reference mockup exactly): status pill, the reported description and
// photo (or its edit form, admin-only), a running "Action taken" timeline,
// then the "Add action taken" form and the Save action / Mark resolved
// buttons together in one <form> so both act on whatever's currently typed
// above them.
function renderMachineIssueDetail(m, iss){
  var editKey = "editissue_" + iss.id;
  var editingDesc = ui.openForms[editKey];
  var open = iss.status !== "Resolved";
  var sevTone = iss.severity === "Unsafe" ? "pill-high" : iss.severity === "Needs repair" ? "pill-medium" : "pill-todo";
  var actionFormKey = "issueAction_" + iss.id;
  var actionErr = ui.formErrors[actionFormKey];

  var html = '<button type="button" class="back-chevron-btn" onclick="ui.machineryIssueSelected=null;render();">&#8249; Back to issues</button>';
  html += '<div class="card-row" style="margin-top:6px;">' +
    '<span class="pill ' + (open ? "pill-high" : "pill-todo") + '">' + esc(iss.status || "Open") + (iss.severity ? ' &middot; ' + esc(iss.severity) : "") + '</span>' +
  '</div>';

  if(editingDesc){
    html += renderMachineIssueEditForm(m, iss);
  } else {
    html += '<p style="margin:10px 0 4px;font-weight:700;font-size:16px;">' + esc(iss.description) + '</p>' +
      '<p class="row-muted" style="margin:0 0 10px;font-size:12px;">' + esc(m.name) + ' &middot; Reported by ' + esc(iss.reportedBy) + ' &middot; ' + fmtDate(iss.date) + (iss.hourMeter != null ? ' &middot; ' + fmtNum(iss.hourMeter, "hrs") : "") + '</p>';
    if(iss.photoUrl) html += '<img src="' + escAttr(iss.photoUrl) + '" style="max-width:220px;border-radius:12px;border:1px solid var(--border);margin-bottom:10px;display:block;" />';
  }

  html += '<div class="stat-label" style="margin-top:10px;">Action taken</div>';
  var actions = iss.actions || [];
  if(!actions.length){
    html += '<div class="empty-state" style="margin-top:6px;">No action logged yet.</div>';
  } else {
    html += '<div style="margin-top:8px;">' + actions.map(function(a){
      return '<div style="border-left:2px solid var(--status-done);padding-left:12px;margin-bottom:12px;">' +
        '<p style="margin:0;font-weight:600;font-size:12.5px;">' + esc(a.by) + ' &middot; ' + fmtDate(a.date) + '</p>' +
        '<p style="margin:2px 0 0;font-size:13px;">' + esc(a.description) + '</p>' +
        (a.partsUsed && a.partsUsed.length ? '<p class="row-muted" style="margin:2px 0 0;font-size:11.5px;">Parts used: ' + a.partsUsed.map(function(pu){ return esc(pu.name) + (pu.qty ? " ×" + esc(pu.qty) : ""); }).join(", ") + '</p>' : "") +
        (a.photoUrl ? '<img src="' + escAttr(a.photoUrl) + '" style="max-width:160px;border-radius:10px;border:1px solid var(--border);margin-top:6px;display:block;" />' : "") +
      '</div>';
    }).join("") + '</div>';
  }

  var partsChipsId = "actionParts_" + iss.id;
  html += '<form onsubmit="addMachineIssueAction(event,\'' + m.id + '\',\'' + iss.id + '\')" style="margin-top:10px;">' +
    (actionErr ? '<p style="color:var(--danger);font-size:12.5px;font-weight:600;margin:0 0 8px;">' + esc(actionErr) + '</p>' : "") +
    '<textarea name="description" rows="3" placeholder="What did you do?" style="width:100%;box-sizing:border-box;"></textarea>' +
    '<div id="' + partsChipsId + '" class="chip-row"></div>' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;">' +
      renderPartsUsedPicker(m, partsChipsId) +
      '<label class="btn btn-ghost btn-sm" style="width:auto;cursor:pointer;">&#128247; Photo<input type="file" name="photo" accept="image/*" style="display:none;" onchange="markPhotoAttached(this)" /></label>' +
      '<span class="row-muted" data-photo-label style="font-size:11.5px;"></span>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">' +
      '<button type="submit" class="btn btn-ghost" style="width:auto;">Save action</button>' +
      (open ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="resolveMachineIssue(\'' + m.id + '\',\'' + iss.id + '\')">Mark resolved</button>' : '<button type="button" class="btn btn-ghost" style="width:auto;" onclick="reopenMachineIssue(\'' + m.id + '\',\'' + iss.id + '\')">Reopen</button>') +
    '</div>' +
  '</form>';

  if(isAdmin()){
    html += '<div style="display:flex;gap:8px;margin-top:14px;border-top:1px solid var(--border);padding-top:10px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'' + editKey + '\']=' + (editingDesc ? "false" : "true") + ';render();">' + (editingDesc ? "Cancel edit" : "Edit report") + '</button>' +
      '<button type="button" class="btn btn-danger btn-sm" onclick="if(confirm(\'Delete this issue?\')){deleteMachineIssue(\'' + m.id + '\',\'' + iss.id + '\');}">Delete</button>' +
    '</div>';
  }
  return html;
}

// A small "+ Parts used" picker (Add action taken / Log work) -- a free-text
// part-name box (with a <datalist> of this machine's own Parts & Part
// Numbers, when it has any, for quick autocomplete) plus a qty box, managed
// entirely with plain DOM methods (addPartsUsedChip below) rather than
// going through render(), so picking a part never disturbs whatever's
// already typed into the surrounding form (same reasoning as the severity
// pills). 2026-09-28 fix: this used to be a <select> built only from
// m.parts, which rendered as nothing at all -- not even an input -- for any
// machine with no parts catalogued yet ("The parts used section is blank.
// You can't add anything to it"). A free-text box always renders and works,
// catalogued or not; typing a name that matches an existing part links the
// chip to that part's id, and typing anything else still records a plain
// name (e.g. a part not yet added to Parts & Part Numbers).
function renderPartsUsedPicker(m, containerId){
  var parts = m.parts || [];
  var nameId = containerId + "_name";
  var qtyId = containerId + "_qty";
  var listId = containerId + "_list";
  return '<input id="' + nameId + '" type="text" list="' + listId + '" placeholder="Part used" style="max-width:170px;" />' +
    (parts.length ? '<datalist id="' + listId + '">' + parts.map(function(p){ return '<option value="' + escAttr(p.name) + '">'; }).join("") + '</datalist>' : "") +
    '<input id="' + qtyId + '" type="text" value="1" style="width:44px;" title="Qty" />' +
    '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="addPartsUsedChip(\'' + containerId + '\',\'' + nameId + '\',\'' + qtyId + '\',\'' + m.id + '\')">+ Add</button>';
}
function addPartsUsedChip(containerId, nameId, qtyId, machineId){
  var container = document.getElementById(containerId);
  var nameInput = document.getElementById(nameId);
  var qtyInput = document.getElementById(qtyId);
  if(!container || !nameInput) return;
  var partName = nameInput.value.trim();
  if(!partName) return;
  var qty = (qtyInput && qtyInput.value.trim()) || "1";
  var m = machineId ? byId(state.machinery, machineId) : null;
  var matched = m ? (m.parts || []).find(function(p){ return String(p.name).toLowerCase() === partName.toLowerCase(); }) : null;
  var partId = matched ? matched.id : "";
  var chip = document.createElement("span");
  chip.className = "chip";
  var label = document.createElement("span");
  label.textContent = partName + (qty ? " ×" + qty : "");
  chip.appendChild(label);
  var removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.textContent = "×";
  removeBtn.title = "Remove";
  removeBtn.onclick = function(){ container.removeChild(chip); };
  chip.appendChild(removeBtn);
  var hidden = document.createElement("input");
  hidden.type = "hidden";
  hidden.name = "partsUsedChip";
  hidden.value = partId + "|" + partName + "|" + qty;
  chip.appendChild(hidden);
  container.appendChild(chip);
  nameInput.value = "";
  if(qtyInput) qtyInput.value = "1";
  nameInput.focus();
}
// Just records the chosen file's name next to the "+ Photo"/"Add photo"
// button (plain DOM, no render()) -- the actual file stays on the input
// element itself and is only read (and uploaded) once the surrounding form
// is actually submitted, exactly like every other file input in this app.
function markPhotoAttached(input){
  var form = input.form;
  var lbl = form ? form.querySelector("[data-photo-label]") : null;
  if(lbl) lbl.textContent = (input.files && input.files[0]) ? ("Attached: " + input.files[0].name) : "";
}
// The severity picker (Report an issue) is plain three-button toggle, also
// managed without a render() for the same reason as the parts picker above.
// Toggles the visible "tags the machine Out of action" warning banner the
// moment Unsafe is picked (or hides it again if the person changes their
// mind), rather than only surfacing that after they've already submitted.
function selectSeverityPill(btn, value){
  var row = btn.parentElement;
  Array.prototype.forEach.call(row.children, function(b){ b.classList.remove("sel-minor", "sel-repair", "sel-unsafe"); });
  btn.classList.add(value === "Unsafe" ? "sel-unsafe" : value === "Needs repair" ? "sel-repair" : "sel-minor");
  var form = btn.form;
  if(!form) return;
  var hidden = form.querySelector('input[name="severity"]');
  if(hidden) hidden.value = value;
  var warn = form.querySelector(".banner.warn");
  if(warn) warn.style.display = value === "Unsafe" ? "block" : "none";
}
function copyPartNumber(btn, text){
  if(!navigator.clipboard || !navigator.clipboard.writeText) return;
  navigator.clipboard.writeText(text).then(function(){
    var old = btn.textContent;
    btn.textContent = "✓";
    setTimeout(function(){ btn.textContent = old; }, 1200);
  }).catch(function(){ /* clipboard blocked (e.g. no HTTPS/permission) -- the part number is still right there to copy by hand */ });
}

// The unified "Log work" full-page screen (2026-09-28, matching the
// reference mockup): a Service/Other-work toggle, hour meter + date, then
// either the machine's standard service checklist (pre-ticked, since most
// scheduled services complete every standard item) or a free-text "what
// was done" for other work, a Parts used picker either way, and -- for a
// Service entry against a currently-due milestone -- a preview of what the
// next service will be due at once this one's saved. Writes into the exact
// same m.log this app already had (so History/the schedule maths are
// completely unaffected), just with the new structured checklistDone/
// partsUsed/kind fields alongside the existing ones. The old per-milestone
// inline form in the History tab (renderMilestoneLogForm) is untouched and
// still works exactly as before -- this is an additional, primary way to
// log work, not a replacement for that one.
function renderMachineLogWorkForm(m, ctx){
  var mode = ctx.mode === "other" ? "other" : "service";
  var scheduleConfigured = machineScheduleConfigured(m);
  var target = null;
  if(mode === "service" && scheduleConfigured){
    var next = machineNextMilestone(m);
    if(next && !machineMilestoneLog(m, milestoneKey(next.hours))){
      target = next;
    } else {
      var milestones = machineScheduleMilestones(m) || [];
      for(var i = 0; i < milestones.length; i++){
        if(!machineMilestoneLog(m, milestoneKey(milestones[i].hours))){ target = milestones[i]; break; }
      }
    }
  }
  var formKey = "logwork_" + m.id;
  var err = ui.formErrors[formKey];
  var checklist = m.serviceChecklistItems || [];
  var partsChipsId = "logworkParts_" + m.id;

  var html = '<button type="button" class="back-chevron-btn" onclick="ui.machineryLogWork=null;render();">&#8249; Cancel</button>' +
    '<h3 style="margin:10px 0 4px;">Log work — ' + esc(m.name) + '</h3>' +
    '<div class="filter-pill-row">' +
      '<button type="button" class="filter-pill' + (mode === "service" ? " active" : "") + '" onclick="ui.machineryLogWork={id:\'' + m.id + '\',mode:\'service\'};render();">Service</button>' +
      '<button type="button" class="filter-pill' + (mode === "other" ? " active" : "") + '" onclick="ui.machineryLogWork={id:\'' + m.id + '\',mode:\'other\'};render();">Other work</button>' +
    '</div>' +
    '<form onsubmit="addMachineWorkLog(event,\'' + m.id + '\',\'' + mode + '\',' + (target ? milestoneKey(target.hours) : "null") + ')">' +
    (err ? '<p style="color:var(--danger);font-size:12.5px;font-weight:600;margin:8px 0;">' + esc(err) + '</p>' : "") +
    '<div class="form-grid" style="margin-top:10px;">' +
      '<div class="field"><label>Hour meter</label><input type="text" inputmode="decimal" name="reading" required value="' + escAttr(target ? target.hours : m.currentReading) + '" /></div>' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + todayISO() + '" required /></div>' +
    '</div>';
  if(mode === "service"){
    html += '<div class="stat-label" style="margin-top:12px;">Service items completed</div>' +
      '<div style="margin-top:6px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;">' +
        (checklist.length ? checklist.map(function(item, i){
          var itemId = "svcitem_" + m.id + "_" + i;
          return '<div class="checkbox-row" style="padding:9px 10px;border-bottom:1px solid var(--border);">' +
            '<input type="checkbox" name="checklistDone" value="' + escAttr(item) + '" id="' + itemId + '" checked />' +
            '<label for="' + itemId + '" style="font-weight:400;text-transform:none;">' + esc(item) + '</label>' +
          '</div>';
        }).join("") : '<div class="empty-state">No standard service items set for this machine yet -- add some from its Overview tab.</div>') +
      '</div>';
  } else {
    html += '<div class="field" style="margin-top:10px;"><label>What was done</label><textarea name="description" rows="2" required placeholder="e.g. Replaced hydraulic hose, front left"></textarea></div>';
  }
  html += '<div class="stat-label" style="margin-top:14px;">Parts used</div>' +
    '<div id="' + partsChipsId + '" class="chip-row"></div>' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0;">' + renderPartsUsedPicker(m, partsChipsId) + '</div>' +
    '<div class="field" style="margin-top:10px;"><label>Performed by</label><input type="text" name="performedBy" value="' + escAttr(currentUser().name) + '" /></div>' +
    '<div class="field" style="margin-top:10px;"><label>Notes (optional)</label><textarea name="notes" rows="2"></textarea></div>';
  if(scheduleConfigured && mode === "service"){
    html += '<div class="due-progress-card ok" style="margin-top:12px;"><div class="stat-label">Next service due at</div><div style="font-weight:700;font-size:14.5px;">' + fmtNum((target ? target.hours : (m.currentReading || 0)) + (m.serviceIntervalHours || 0), "hrs") + '</div></div>';
  }
  html += '<div class="form-actions" style="margin-top:14px;"><button type="submit" class="btn btn-primary">Save ' + (mode === "service" ? "service" : "work") + '</button></div>' +
  '</form>';
  return html;
}
function addMachineWorkLog(e, machineId, mode, milestoneHoursKey){
  e.preventDefault();
  var f = e.target;
  var formKey = "logwork_" + machineId;
  var m = byId(state.machinery, machineId);
  if(!m) return;
  var reading = parseHoursInput(f.reading.value);
  if(isNaN(reading)){
    ui.formErrors[formKey] = "Enter a valid hour-meter reading (e.g. 2140).";
    render();
    return;
  }
  var description = mode === "service" ? "Scheduled service" : (f.description ? f.description.value.trim() : "");
  if(mode === "other" && !description){
    ui.formErrors[formKey] = "Describe what work was done.";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var checklistDone = mode === "service" ? Array.prototype.slice.call(f.querySelectorAll('input[name="checklistDone"]:checked')).map(function(cb){ return cb.value; }) : [];
  var partsUsed = Array.prototype.slice.call(f.querySelectorAll('input[name="partsUsedChip"]')).map(function(inp){
    var parts = inp.value.split("|");
    return { partId: parts[0], name: parts[1], qty: parts[2] };
  });
  m.log = m.log || [];
  m.log.unshift({
    id: uid("l"), date: f.date.value, description: description, performedBy: f.performedBy.value.trim(),
    reading: reading, notes: f.notes.value.trim(), kind: mode,
    checklistDone: checklistDone, partsUsed: partsUsed,
    milestoneHours: milestoneHoursKey
  });
  m.currentReading = reading;
  if(mode === "service"){ m.lastServiceDate = f.date.value; m.lastServiceReading = reading; }
  ui.machineryLogWork = null;
  persist();
}

// Parts & Part Numbers -- a per-machine reference list (not a log of events
// like service history or issues) so whoever's ordering a replacement filter,
// belt or hose can look up the right part number without having to dig
// through old service records or ask around. Anyone can view it; adding/
// editing/deleting entries is admin-only, same as the machine's own Edit
// form and maintenance schedule, since it's reference data staff rely on
// being accurate rather than a running log anyone should freely add to.
function renderMachinePartsSection(m, q){
  var parts = (m.parts || []).slice().sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||"")); });
  if(q){
    parts = parts.filter(function(p){
      return String(p.name||"").toLowerCase().indexOf(q) > -1 || String(p.partNumber||"").toLowerCase().indexOf(q) > -1;
    });
  }
  var openForms = "";
  var html = "";
  if(!parts.length){
    html += '<div class="empty-state" style="margin-top:8px;">' + (q ? "No parts match that search." : "No parts or part numbers recorded yet.") + '</div>';
  } else {
    var rows = parts.map(function(p){
      var editKey = "editpart_" + p.id;
      var editing = ui.openForms[editKey];
      if(editing) openForms += renderMachinePartForm(m, p);
      return '<tr>' +
        '<td>' + esc(p.name) + '</td>' +
        '<td class="row-muted">' + esc(p.partNumber || "—") + (p.partNumber ? ' <button type="button" class="subtle-btn" title="Copy part number" onclick="copyPartNumber(this,\'' + escAttr(p.partNumber) + '\')">&#128203;</button>' : "") + '</td>' +
        '<td class="row-muted">' + esc(p.qty || "—") + '</td>' +
        '<td class="row-muted">' + esc(p.notes || "—") + '</td>' +
        '<td style="white-space:nowrap;">' + (isAdmin() ?
          ('<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'' + editKey + '\']=!ui.openForms[\'' + editKey + '\'];render();">' + (editing ? "Cancel" : "Edit") + '</button> ' +
           '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteMachinePart(\'' + m.id + '\',\'' + p.id + '\')">Delete</button>')
          : "") + '</td>' +
      '</tr>';
    }).join("");
    html += '<div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th>Part / component</th><th>Part number</th><th>Qty</th><th>Notes</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  if(openForms) html += '<div style="margin-top:10px;">' + openForms + '</div>';
  return html;
}
function renderMachinePartForm(m, existing){
  var formKey = existing ? ("editpart_" + existing.id) : ("newPart_" + m.id);
  var err = ui.formErrors[formKey];
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="saveMachinePart(event,\'' + m.id + '\',' + (existing ? "'" + existing.id + "'" : "null") + ')">' +
    '<h4 style="margin-top:0;">' + (existing ? "Edit part" : "Add part") + ' — ' + esc(m.name) + '</h4>' +
    (err ? '<p style="color:var(--danger);font-size:12.5px;font-weight:600;margin:0 0 10px;">' + esc(err) + '</p>' : '') +
    '<div class="form-grid">' +
      '<div class="field"><label>Part / component</label><input type="text" name="name" required value="' + escAttr(existing ? existing.name : "") + '" placeholder="e.g. Engine oil filter" /></div>' +
      '<div class="field"><label>Part number</label><input type="text" name="partNumber" value="' + escAttr(existing ? existing.partNumber : "") + '" placeholder="e.g. RE504836" /></div>' +
      '<div class="field"><label>Qty on hand (optional)</label><input type="text" name="qty" value="' + escAttr(existing ? existing.qty : "") + '" placeholder="e.g. 2" /></div>' +
      '<div class="field span-2"><label>Notes (optional)</label><input type="text" name="notes" value="' + escAttr(existing ? existing.notes : "") + '" placeholder="e.g. supplier, where to order" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button>' +
      '<button type="button" class="btn btn-ghost" onclick="delete ui.formErrors[\'' + formKey + '\'];' + (existing ? ("ui.openForms['" + formKey + "']=false;render();") : ("toggleForm('" + formKey + "')")) + '">Cancel</button>' +
    '</div>' +
  '</form>';
}
function saveMachinePart(e, machineId, partId){
  e.preventDefault();
  var f = e.target;
  var formKey = partId ? ("editpart_" + partId) : ("newPart_" + machineId);
  var name = f.name.value.trim();
  if(!name){
    ui.formErrors[formKey] = "Enter a part or component name.";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var m = byId(state.machinery, machineId);
  if(!m) return;
  m.parts = m.parts || [];
  var data = { name: name, partNumber: f.partNumber.value.trim(), qty: f.qty.value.trim(), notes: f.notes.value.trim() };
  if(partId){
    var existing = byId(m.parts, partId);
    if(existing) Object.assign(existing, data);
  } else {
    m.parts.push(Object.assign({ id: uid("part") }, data));
  }
  ui.openForms[formKey] = false;
  persist();
}
// Confirm message built here (never interpolated into the onclick attribute)
// since a part name or number can contain an apostrophe -- same reasoning as
// confirmDeleteServiceHistory/confirmDeleteMachine above.
function confirmDeleteMachinePart(machineId, partId){
  var m = byId(state.machinery, machineId);
  if(!m) return;
  var p = byId(m.parts || [], partId);
  if(!p) return;
  if(confirm("Delete part \"" + p.name + "\"" + (p.partNumber ? " (" + p.partNumber + ")" : "") + "? This cannot be undone.")){
    deleteMachinePart(machineId, partId);
  }
}
function deleteMachinePart(machineId, partId){
  var m = byId(state.machinery, machineId);
  if(!m) return;
  removeById(m.parts, partId);
  ui.openForms["editpart_" + partId] = false;
  persist();
}

function renderArchiveMachineForm(m){
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="archiveMachine(event,\'' + m.id + '\')">' +
    '<h4 style="margin-top:0;">Move to Sold or Other — ' + esc(m.name) + '</h4>' +
    '<p class="row-muted" style="margin:0 0 10px;font-size:12px;">This takes it off the active machinery list and lists it under "Sold or Other" at the bottom of the page instead. Its full service history is kept, and it can be restored to the active list at any time.</p>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Reason (optional)</label><input type="text" name="reason" placeholder="e.g. Sold, Traded in, Written off" value="' + escAttr(m.archivedReason || "") + '" /></div>' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + escAttr(m.archivedDate || todayISO()) + '" required /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Move to Sold or Other</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'archive_' + m.id + '\')">Cancel</button></div>' +
  '</form>';
}
function archiveMachine(e, id){
  e.preventDefault();
  var f = e.target;
  var m = byId(state.machinery, id);
  m.status = "archived";
  m.archivedReason = f.reason.value.trim();
  m.archivedDate = f.date.value;

  persist();
}
function restoreMachine(id){
  var m = byId(state.machinery, id);
  m.status = "active";
  persist();
}
// Genuine, permanent removal -- distinct from archiveMachine/restoreMachine
// above, which just moves a machine to "Sold or Other" and keeps everything
// about it. This one actually deletes the machine record (and, since it's
// gone, its service history and issues along with it) so it stops appearing
// anywhere, including "Sold or Other". Only offered from the archived card,
// since a machine needs to be moved there first -- an extra step that gives
// a chance to reconsider before something this final. Confirm message is
// built here (never interpolated into the onclick attribute) since a machine
// name can contain an apostrophe, same reasoning as confirmDeleteServiceHistory.
function confirmDeleteMachine(id){
  var m = byId(state.machinery, id);
  if(!m) return;
  if(confirm("Permanently delete " + m.name + "? This removes the machine along with its entire service history and reported issues. This cannot be undone.")){
    deleteMachineEntirely(id);
  }
}
function deleteMachineEntirely(id){
  removeById(state.machinery, id);
  persist();
}

// machine's own Edit form (renderMachineForm/saveMachine) so it's reachable
// alongside every other machine detail rather than only via this schedule
// button. This form now only sets the service interval; the due-milestone
// math (machineScheduleMilestones) reads the machine's scheduleStartHours
// fresh every time, so the schedule re-computes itself automatically as soon
// as that field changes -- nothing here needs to "sync" to it.
function renderMaintenanceScheduleForm(m){
  var formKey = "setSchedule_" + m.id;
  var err = ui.formErrors[formKey];

    '<h4>Maintenance schedule — ' + esc(m.name) + '</h4>' +

      '<div class="field"><label>Service interval (hrs)</label><input type="text" inputmode="decimal" name="serviceIntervalHours" required value="' + escAttr(m.serviceIntervalHours != null ? m.serviceIntervalHours : 250) + '" /></div>' +

  '</form>';

function saveMaintenanceSchedule(e, id){
  e.preventDefault();
  var f = e.target;
  var formKey = "setSchedule_" + id;
  var interval = parseHoursInput(f.serviceIntervalHours.value);
  if(isNaN(interval) || interval <= 0){
    ui.formErrors[formKey] = "Enter a service interval greater than 0 (e.g. 250).";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var m = byId(state.machinery, id);
  m.serviceIntervalHours = interval;
  ui.openForms[formKey] = false;
  persist();
}

async function addMachineIssue(e, id){
  e.preventDefault();
  var f = e.target;
  var formKey = "newIssue_" + id;
  if(!byId(state.machinery, id)) return;
  var description = f.description.value.trim();
  if(!description){
    ui.formErrors[formKey] = "Describe what you noticed.";
    render();
    return;
  }
  var severity = (f.severity && f.severity.value) || "Minor";
  var dateVal = f.date.value;
  var hourMeterRaw = f.hourMeter ? f.hourMeter.value.trim() : "";
  var hourMeter = hourMeterRaw ? parseHoursInput(hourMeterRaw) : NaN;
  if(isNaN(hourMeter)) hourMeter = null;
  var file = f.photo && f.photo.files && f.photo.files[0];
  var photoUrl = null;
  var submitBtn = f.querySelector('button[type="submit"]');
  delete ui.formErrors[formKey];
  if(file){
    if(!supabaseClient){
      ui.formErrors[formKey] = "Can't upload the photo right now (not connected to the database). Try again once you're back online, or submit without a photo.";
      render();
      return;
    }
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
    try{
      var uploadBlob = await compressMapPhoto(file);
      var path = uid("issuephoto") + ".jpg";
      var upRes = await supabaseClient.storage.from("machinery-photos").upload(path, uploadBlob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
      if(upRes.error) throw upRes.error;
      photoUrl = supabaseClient.storage.from("machinery-photos").getPublicUrl(path).data.publicUrl;
    }catch(err){
      console.error("[Bullamon Plains] issue photo upload failed:", err);
      ui.formErrors[formKey] = "Couldn't upload that photo (" + (err && err.message ? err.message : "unknown error") + "). Try again, or submit without a photo.";
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Submit report"; }
      render();
      return;
    }
  }
  var reportedByRaw = currentUser().name;
  var newIssueId = uid("iss"); // generated once, up front, and reused by `doIt` below so a replay after a save conflict (see persist()/adoptLatestAfterConflict) adds the same issue once, not a duplicate
  var doIt = function(){
    var mm = byId(state.machinery, id);
    if(!mm) return;
    mm.issues = mm.issues || [];
    if(!byId(mm.issues, newIssueId)){
      mm.issues.unshift({ id: newIssueId, description: description, reportedBy: reportedByRaw, date: dateVal, status: "Open", severity: severity, hourMeter: hourMeter, photoUrl: photoUrl, actions: [] });
    }
  };
  doIt();
  ui.machineryReportIssue = null;
  ui.machineryTab = "issues";
  persist(doIt);
}
// A dated entry in an issue's "Action taken" timeline (2026-09-28, matching
// the reference mockup) -- who did what, any parts used, and an optional
// photo, added to iss.actions[] without ever replacing/losing an earlier
// action the way editing the original report would. The issue itself stays
// open until "Mark resolved" is pressed separately (existing
// resolveMachineIssue, unchanged).
async function addMachineIssueAction(e, machineId, issueId){
  e.preventDefault();
  var f = e.target;
  var formKey = "issueAction_" + issueId;
  var m = byId(state.machinery, machineId);
  var iss = m && byId(m.issues || [], issueId);
  if(!iss) return;
  var description = f.description.value.trim();
  if(!description){
    ui.formErrors[formKey] = "Describe what was done.";
    render();
    return;
  }
  var partsUsed = Array.prototype.slice.call(f.querySelectorAll('input[name="partsUsedChip"]')).map(function(inp){
    var parts = inp.value.split("|");
    return { partId: parts[0], name: parts[1], qty: parts[2] };
  });
  var file = f.photo && f.photo.files && f.photo.files[0];
  var photoUrl = null;
  var submitBtn = f.querySelector('button[type="submit"]');
  delete ui.formErrors[formKey];
  if(file){
    if(!supabaseClient){
      ui.formErrors[formKey] = "Can't upload the photo right now (not connected to the database). Try again once you're back online, or save without a photo.";
      render();
      return;
    }
    if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
    try{
      var uploadBlob = await compressMapPhoto(file);
      var path = uid("actionphoto") + ".jpg";
      var upRes = await supabaseClient.storage.from("machinery-photos").upload(path, uploadBlob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
      if(upRes.error) throw upRes.error;
      photoUrl = supabaseClient.storage.from("machinery-photos").getPublicUrl(path).data.publicUrl;
    }catch(err){
      console.error("[Bullamon Plains] action photo upload failed:", err);
      ui.formErrors[formKey] = "Couldn't upload that photo (" + (err && err.message ? err.message : "unknown error") + "). Try again, or save without a photo.";
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Save action"; }
      render();
      return;
    }
  }
  var newActionId = uid("act");
  var doIt = function(){
    var mm = byId(state.machinery, machineId);
    var ii = mm && byId(mm.issues || [], issueId);
    if(!ii) return;
    ii.actions = ii.actions || [];
    if(!byId(ii.actions, newActionId)){
      ii.actions.push({ id: newActionId, by: currentUser().name, date: todayISO(), description: description, partsUsed: partsUsed, photoUrl: photoUrl });
    }
  };
  doIt();
  persist(doIt);
}

function editMachineIssue(e, machineId, issueId){
  e.preventDefault();
  var f = e.target;
  var m = byId(state.machinery, machineId);
  if(!m) return;
  var iss = byId(m.issues || [], issueId);
  if(!iss) return;
  var description = f.description.value.trim();
  if(!description) return;
  var reportedByRaw = f.reportedBy.value.trim();
  var dateVal = f.date.value;
  var doIt = function(){
    var mm = byId(state.machinery, machineId);
    var ii = mm && byId(mm.issues || [], issueId);
    if(!ii) return;
    ii.description = description;
    ii.reportedBy = reportedByRaw || ii.reportedBy;
    ii.date = dateVal;
  };
  doIt();
  ui.openForms["editissue_" + issueId] = false;
  persist(doIt);
}
// `resolveMachineIssue`/`reopenMachineIssue`/`deleteMachineIssue` each pass
// their own mutation as a `redo` callback into persist() (see persist()'s
// own comment) -- setting a status or removing a specific id is naturally
// idempotent (safe to apply twice), which is exactly what makes each of
// these safe to silently replay if a save conflict happens with another
// device's change in between. Without this, a conflict at just the wrong
// moment could drop the resolve/delete entirely while still showing it as
// done on screen -- which is what made a "deleted" issue seem to come back
// on its own (root-caused 2026-09-25 after Maria saw it happen twice).
function resolveMachineIssue(machineId, issueId){
  var doIt = function(){
    var m = byId(state.machinery, machineId);
    var iss = m && byId(m.issues || [], issueId);
    if(iss) iss.status = "Resolved";
  };
  doIt();
  persist(doIt);
}
function reopenMachineIssue(machineId, issueId){
  var doIt = function(){
    var m = byId(state.machinery, machineId);
    var iss = m && byId(m.issues || [], issueId);
    if(iss) iss.status = "Open";
  };
  doIt();
  persist(doIt);
}
function deleteMachineIssue(machineId, issueId){
  var doIt = function(){
    var m = byId(state.machinery, machineId);
    if(m) removeById(m.issues || [], issueId);
  };
  doIt();
  persist(doIt);
}

// The "Log service" button used to always open the generic log-or-reading
// form. Now that every machine's card shows the maintenance schedule's next
// due milestone, clicking it should jump straight to logging THAT scheduled
// service (the same milestone form the history table's own "Log this
// service" row opens) rather than a blank generic form -- one click gets you
// to the service that's actually coming up. A machine with no maintenance
// schedule configured has no milestone to jump to, so it falls back to the
// old generic form instead. General/non-scheduled work now has its own
// separate "+ Log other work" button (renderServiceLogForm/addServiceLog),
// unchanged.
function openLogServiceForNextDue(id){
  var m = byId(state.machinery, id);
  if(!m) return;
  var milestones = machineScheduleMilestones(m);
  var target = null;
  if(milestones){
    // Prefer the milestone the schedule currently marks "next", as long as
    // it hasn't already been logged; otherwise fall back to the first
    // outstanding (unlogged) milestone in the window, same rows the
    // combined service history table itself would offer to log.
    var next = machineNextMilestone(m);
    if(next && !machineMilestoneLog(m, milestoneKey(next.hours))){
      target = next;
    } else {
      for(var i = 0; i < milestones.length; i++){
        if(!machineMilestoneLog(m, milestoneKey(milestones[i].hours))){ target = milestones[i]; break; }
      }
    }
  }
  if(target){
    var key = milestoneKey(target.hours);
    ui.openForms["history_" + id] = true;
    ui.openForms["ms_" + id + "_" + key] = !ui.openForms["ms_" + id + "_" + key];
    render();
  } else {
    toggleForm("svc_" + id);
  }
}
function addServiceLog(e, id){
  e.preventDefault();
  var f = e.target;
  var formKey = "svc_" + id;
  var m = byId(state.machinery, id);
  var reading = parseHoursInput(f.reading.value);
  if(isNaN(reading)){
    ui.formErrors[formKey] = "Enter a valid reading (e.g. 2140).";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  m.log = m.log || [];
  m.log.unshift({ id: uid("l"), date: f.date.value, description: f.description.value.trim(), performedBy: f.performedBy.value.trim(), reading: reading, filtersUsed: f.filtersUsed.value.trim(), oilUsed: f.oilUsed.value.trim(), notes: f.notes.value.trim() });
  m.currentReading = reading;
  if(f.isService.checked){ m.lastServiceDate = f.date.value; m.lastServiceReading = reading; }
  ui.openForms[formKey] = false;
  persist();
}

  return '<form class="form-panel" style="margin:8px 0 0;" onsubmit="saveMilestoneReminder(event,\'' + m.id + '\',' + key + ')">' +

}

// Same removal as clearMilestoneReminder above, but for the Dashboard's
