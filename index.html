// Shrinks/re-compresses a photo client-side before it's uploaded (phone
// camera JPEGs are commonly 5-10MB, slow and wasteful to upload as-is,
// especially over the patchy rural connections this app needs to cope
// with). Falls back to the original file untouched on any decode error
// (e.g. a format the browser can't draw to canvas) rather than blocking
// the upload.
function compressMapPhoto(file){
  return new Promise(function(resolve){
    var MAX_DIM = 1800;
    try{
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          try{
            var scale = Math.min(1, MAX_DIM / Math.max(img.width, img.height));
            var cw = Math.max(1, Math.round(img.width * scale));
            var ch = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement("canvas");
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            canvas.toBlob(function(blob){ resolve(blob || file); }, "image/jpeg", 0.82);
          }catch(e2){ resolve(file); }
        };
        img.onerror = function(){ resolve(file); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ resolve(file); };
      reader.readAsDataURL(file);
    }catch(e){ resolve(file); }
  });
}
async function addMap(e){
  e.preventDefault();
  var f = e.target;
  var title = f.title.value.trim();
  var notes = f.notes.value.trim();
  var manualUrl = f.url.value.trim();
  var file = f.photo && f.photo.files && f.photo.files[0];
  if(!file && !manualUrl){
    setNotice("err", "Add a photo or paste a link before saving.");
    render();
    return;
  }
  if(!file){
    state.maps.items.push({ id: uid("map"), title: title, notes: notes, url: manualUrl, isPhoto: false });
    ui.openForms.newMap = false;
    persist();
    return;
  }
  if(!supabaseClient){
    setNotice("err", "Can't upload a photo right now (not connected to the database). Text and other changes still work offline, but photo uploads need a connection at the moment you add them — try again once you're back online.");
    render();
    return;
  }
  var submitBtn = f.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
  try{
    var uploadBlob = await compressMapPhoto(file);
    var path = uid("map") + ".jpg";
    var upRes = await supabaseClient.storage.from("maps").upload(path, uploadBlob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
    if(upRes.error) throw upRes.error;
    var pub = supabaseClient.storage.from("maps").getPublicUrl(path);
    state.maps.items.push({ id: uid("map"), title: title, notes: notes, url: pub.data.publicUrl, storagePath: path, isPhoto: true });
    ui.openForms.newMap = false;
    persist();
  }catch(err){
    console.error("[Bullamon Plains] map photo upload failed:", err);
    setNotice("err", "Couldn't upload that photo (" + (err && err.message ? err.message : "unknown error") + "). If you're offline or have a weak signal, try again once you're back in range.");
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Add"; }
    render();
  }
}
function removeMap(id){
  var item = (state.maps.items || []).find(function(m){ return m.id === id; });
  if(item && item.isPhoto && item.storagePath && supabaseClient){
    supabaseClient.storage.from("maps").remove([item.storagePath]).catch(function(err){
      console.error("[Bullamon Plains] couldn't delete the stored map photo (it will be left orphaned in storage, but this doesn't affect the app):", err);
    });
  }
  removeById(state.maps.items, id);
  persist();
}

function daysSinceBackup(){
  var last = state.meta && state.meta.lastBackupAt;
  if(!last) return null;
  var d = daysUntil(last);
  return d == null ? null : -d;
}
function renderTeam(){
  var html = pageHead("Team", "Who can sign in, and what they can do. Only admins see this page.");
  html += '<div class="banner">Sign-in codes are optional — leave a code blank and that person just picks their name to enter. Set a code here to require it.</div>';

  var daysSince = daysSinceBackup();
  if(daysSince === null){
    html += '<div class="banner warn">You haven\'t downloaded a data backup yet. Grab one below and save it somewhere safe (email it to yourself, or save it to a cloud drive) — it\'s the fastest way to recover everything if something ever goes wrong here.</div>';
  } else if(daysSince > 30){
    html += '<div class="banner warn">It\'s been ' + daysSince + ' days since your last backup (' + fmtDate(state.meta.lastBackupAt) + '). Worth downloading a fresh one so your saved copy has everything that\'s been added since.</div>';
  }

  html += '<div class="toolbar">' +
    '<button type="button" class="btn btn-ghost" style="width:auto;" onclick="downloadBackup()">&#8681; Download data backup</button>' +
    '<button type="button" id="restoreBackupBtn" class="btn btn-ghost" style="width:auto;" onclick="document.getElementById(\'restoreBackupInput\').click();">&#8593; Restore from backup</button>' +
    '<input type="file" id="restoreBackupInput" accept="application/json,.json" style="display:none;" onchange="handleRestoreFileSelected(event)" />' +
    (daysSince !== null ? '<span class="row-muted" style="font-size:12px;margin-left:10px;">Last backup: ' + fmtDate(state.meta.lastBackupAt) + ' (' + daysSince + (daysSince === 1 ? ' day' : ' days') + ' ago)</span>' : '') +
    '<span style="flex:1;"></span><button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newStaff\')">' + (ui.openForms.newStaff ? "Cancel" : "+ Add staff") + '</button>' +
  '</div>';
  html += '<p class="row-muted" style="margin:-6px 0 16px;font-size:12px;">Restoring completely replaces everything currently in the app -- for everyone, on every device -- with what\'s in the backup file. Only use this to recover from something going wrong.</p>';
  if(ui.openForms.newStaff) html += renderStaffForm();

  html += (state.team || []).map(function(t){
    if(ui.editing.staff === t.name) return renderStaffForm(t);
    return '<div class="team-card">' +
      '<div class="team-name-row"><div class="avatar">' + esc(initials(t.name)) + '</div><div>' +
        '<div style="font-weight:600;">' + esc(t.name) + (t.name === currentUser().name ? " (you)" : "") + '</div>' +
        '<div class="team-flags">' +
          (t.active ? '<span>Active</span>' : '<span style="color:var(--danger);">Inactive</span>') +
          (t.isAdmin ? '<span class="pill pill-admin" style="margin:0;">Admin</span>' : '') +
          (t.canAllocate ? '<span>Can allocate jobs</span>' : '') +
          '<span>Code: ' + (t.passcode ? '<code class="access-code">set</code>' : '<em>none</em>') + '</span>' +
        '</div></div></div>' +
      '<div style="display:flex;gap:6px;">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.staff=\'' + escAttr(t.name) + '\';render();">Edit</button>' +
        (t.name !== currentUser().name ? '<button type="button" class="btn btn-danger btn-sm" onclick="removeStaff(\'' + escAttr(t.name) + '\')">Remove</button>' : '') +
      '</div>' +
    '</div>';
  }).join("");
  return html;
}
function renderStaffForm(existing){

    '<h4>' + (existing ? "Edit " + esc(existing.name) : "New staff member") + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Name</label><input type="text" name="name" required value="' + escAttr(existing ? existing.name : "") + '" /></div>' +
      '<div class="field"><label>Access code (optional)</label><input type="text" name="passcode" value="' + escAttr(existing ? existing.passcode : "") + '" placeholder="Leave blank for no code" /></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="active" id="active_cb" ' + (!existing || existing.active ? 'checked' : '') + ' /><label for="active_cb" style="text-transform:none;font-weight:400;">Active (can sign in)</label></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="isAdmin" id="admin_cb" ' + (existing && existing.isAdmin ? 'checked' : '') + ' /><label for="admin_cb" style="text-transform:none;font-weight:400;">Admin (Team page + edit reference content)</label></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="canAllocate" id="alloc_cb" ' + (existing && existing.canAllocate ? 'checked' : '') + ' /><label for="alloc_cb" style="text-transform:none;font-weight:400;">Can allocate jobs to others</label></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button>' +
    '<button type="button" class="btn btn-ghost" onclick="' + (existing ? "ui.editing.staff=null;render();" : "toggleForm('newStaff')") + '">Cancel</button></div>' +
  '</form></div>';
}
function saveStaff(e, origName){
  e.preventDefault();
  var f = e.target;
  var name = f.name.value.trim();
  if(!name) return;
  var data = { name: name, passcode: f.passcode.value.trim(), active: f.active.checked, isAdmin: f.isAdmin.checked, canAllocate: f.canAllocate.checked };
  if(origName){
    var t = findTeam(origName);
    Object.assign(t, data);
    if(origName === session.name && origName !== name){ session.name = name; setLocal("bp_signed_in_name", name); }
    ui.editing.staff = null;
  } else {
    if(findTeam(name)){ alert("Someone with that name is already on the team."); return; }
    state.team.push(data);
    ui.openForms.newStaff = false;
  }
  persist();
}
function removeStaff(name){
  if(!confirm('Remove ' + name + ' from the team? They will no longer be able to sign in.')) return;
  var idx = state.team.findIndex(function(t){ return t.name === name; });
  if(idx > -1) state.team.splice(idx, 1);
  persist();
}

/* ======================================================================
   FORCE REFRESH (sidebar button)
   ====================================================================== */
// A plain page reload can still show a stale, previously-cached copy of the
// app -- the service worker (see sw.js) deliberately serves its cached copy
// first for speed, then only refreshes that cache in the background. This
// button skips that: it unregisters the service worker and clears its
// caches first, then reloads with a cache-busting query string so the
// browser is forced to fetch the current files straight from the network.
// It never touches farm data (that lives in Supabase / localStorage, not in
// these caches), so there's nothing risky about using it any time.
function forceRefreshApp(){
  // Refreshing needs a live connection -- it unregisters the service worker
  // and clears its cache, then reloads over the network. Doing that while
  // offline would strand the person on a browser "no internet" error page
  // instead of the app, so refuse early and say why. This never touches
  // farm data either way (offline edits live in localStorage, untouched by
  // this function), but the app itself would be unreachable until back in
  // range, so it's not worth the risk.
  if(isOffline || (typeof navigator !== "undefined" && "onLine" in navigator && !navigator.onLine)){
    setNotice("warn", "Refresh needs an internet connection -- you're currently offline, so the app is staying on this device's saved copy. Your data is safe either way; try Refresh again once you're back in range.");
    return;
  }
  var btn = document.getElementById("refreshAppBtn");
  if(btn){ btn.disabled = true; btn.innerHTML = "&#8987;"; }
  var reloaded = false;
  function goReload(){
    if(reloaded) return;
    reloaded = true;
    location.href = location.pathname + "?refreshed=" + Date.now();
  }
  var tasks = [];
  if("serviceWorker" in navigator){
    tasks.push(navigator.serviceWorker.getRegistrations().then(function(regs){
      return Promise.all(regs.map(function(r){ return r.unregister(); }));
    }).catch(function(){}));
  }
  if("caches" in window){
    tasks.push(caches.keys().then(function(names){
      return Promise.all(names.map(function(n){ return caches.delete(n); }));
    }).catch(function(){}));
  }
  Promise.all(tasks).then(goReload).catch(goReload);
  // Safety net in case a registration/cache call hangs -- never leave the
  // person stuck on a disabled button.
  setTimeout(goReload, 3000);
}

/* ======================================================================
   START
   ====================================================================== */
if("serviceWorker" in navigator){
  // Keeps a cached copy of the app itself so it can still open with no
  // signal at all -- see sw.js. If this fails (unsupported browser, etc.)
  // the app still works fine, it just needs a connection to load fresh.
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(e){
      console.error("[Bullamon Plains] service worker registration failed:", e);
    });
  });
}
boot();
