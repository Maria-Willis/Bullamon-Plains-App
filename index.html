/* ----------------------------------------------------------------------
   PUSH NOTIFICATIONS for Dashboard notes -- at Maria's request ("Is it
   possible to make the phone send a notification when something is added
   to the notes"). This is safe to be public -- it's the public half of a
   key pair (see PUSH_NOTIFICATIONS_SETUP.md); the matching private key
   never leaves Supabase.
   A staff member taps "Get notified of new notes" once per device, which
   asks the browser/phone for notification permission and registers a push
   subscription with the browser's push service; that subscription
   (endpoint + keys, no personal data beyond their team name) is saved to a
   new `push_subscriptions` table in Supabase. A Supabase Edge Function
   (notify-new-dashboard-note, in supabase/functions/) is triggered by a
   Database Webhook every time app_state is saved; it diffs the old and new
   dashboardNotes lists, and for any note that's newly appeared, sends a
   real push notification (via the Web Push protocol) to every subscribed
   device except ones belonging to whoever wrote that note. Delivery to the
   phone itself happens entirely outside this app once sent -- through the
   browser vendor's push service -- so it still arrives even if nobody has
   the app open, which is the whole point. See PUSH_NOTIFICATIONS_SETUP.md
   for the one-time Supabase setup this needs before it will actually
   deliver anything.
   ---------------------------------------------------------------------- */
var VAPID_PUBLIC_KEY = "BEl6aS6JvtMlfrPQWQYuf9rqK5X-6dyUl0cURVDYsGPsWkCHms16njVwGIir5sN3vHvoRMhu7krm6FgjOizEl7k";

function pushSupported(){
  return (typeof navigator !== "undefined" && "serviceWorker" in navigator) &&
    (typeof window !== "undefined" && "PushManager" in window && "Notification" in window);
}
function urlBase64ToUint8Array(base64String){
  var padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  var rawData = atob(base64);
  var outputArray = new Uint8Array(rawData.length);
  for(var i = 0; i < rawData.length; i++){ outputArray[i] = rawData.charCodeAt(i); }
  return outputArray;
}
async function refreshPushSubscriptionStatus(){
  if(!pushSupported()) return;
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    ui.pushSubscribed = !!sub;
    render();
  }catch(e){ /* leave as unknown -- the toggle just offers to turn it on */ }
}
function renderPushToggle(){
  if(!pushSupported()){
    return '<p class="row-muted" style="margin:0 0 10px;font-size:11.5px;">Push notifications aren\'t supported in this browser.</p>';
  }
  var html = "";
  if(ui.pushError) html += '<p style="color:var(--danger);font-size:12px;font-weight:600;margin:0 0 6px;">' + esc(ui.pushError) + '</p>';
  if(ui.pushSubscribed){
    html += '<button type="button" class="btn btn-ghost btn-sm"' + (ui.pushBusy ? " disabled" : "") + ' onclick="disableDashboardNotifications()">&#128276; Notifications on &mdash; turn off</button>';
  } else {
    html += '<button type="button" class="btn btn-ghost btn-sm"' + (ui.pushBusy ? " disabled" : "") + ' onclick="enableDashboardNotifications()">' + (ui.pushBusy ? "Turning on…" : "&#128276; Get notified of new notes") + '</button>';
  }
  return '<div style="margin:0 0 10px;">' + html + '</div>';
}
async function enableDashboardNotifications(){
  if(!pushSupported()){
    ui.pushError = "Push notifications aren't supported in this browser.";
    render();
    return;
  }
  if(!supabaseClient){
    ui.pushError = "Can't turn on notifications right now (not connected to the database). Try again once you're back online.";
    render();
    return;
  }
  ui.pushBusy = true;
  delete ui.pushError;
  render();
  try{
    var permission = await Notification.requestPermission();
    if(permission !== "granted"){
      ui.pushError = (permission === "denied")
        ? "Notifications are blocked for this app in your browser/phone settings. Turn them back on there, then try again."
        : "Notifications weren't enabled.";
      ui.pushBusy = false;
      render();
      return;
    }
    var reg = await navigator.serviceWorker.ready;
    var sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) }));
    var raw = sub.toJSON();
    var u = currentUser();
    var upRes = await supabaseClient.from("push_subscriptions").upsert({
      endpoint: raw.endpoint,
      p256dh: raw.keys.p256dh,
      auth: raw.keys.auth,
      user_name: u ? u.name : null
    }, { onConflict: "endpoint" });
    if(upRes.error) throw upRes.error;
    ui.pushSubscribed = true;
    ui.pushBusy = false;
    render();
  }catch(err){
    console.error("[Bullamon Plains] enabling push notifications failed:", err);
    ui.pushError = "Couldn't turn on notifications (" + (err && err.message ? err.message : "unknown error") + "). Try again once you're back online.";
    ui.pushBusy = false;
    render();
  }
}
async function disableDashboardNotifications(){
  if(!pushSupported()) return;
  ui.pushBusy = true;
  render();
  try{
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(sub){
      var endpoint = sub.endpoint;
      await sub.unsubscribe();
      if(supabaseClient){
        await supabaseClient.from("push_subscriptions").delete().eq("endpoint", endpoint);
      }
    }
    ui.pushSubscribed = false;
    ui.pushBusy = false;
    render();
  }catch(err){
    console.error("[Bullamon Plains] turning off push notifications failed:", err);
    ui.pushBusy = false;
    render();
  }
}

   MACHINERY
   ====================================================================== */
function machineDueForService(m){
  var d = daysUntil(m.nextServiceDue);
  return d != null && d <= 21;
}

// A maintenance schedule is "configured" once a starting hour reading and an
// interval (in hours) have both been entered manually for a machine.
function machineScheduleConfigured(m){
  return m.scheduleStartHours != null && m.serviceIntervalHours != null && m.serviceIntervalHours > 0;
}

// Builds a short window of service milestones (start + n * interval) around
// the machine's current reading: the most recently passed milestone (if any)
// plus the next few upcoming ones. Returns null when no schedule is set.
function machineScheduleMilestones(m){
  if(!machineScheduleConfigured(m)) return null;
  var start = m.scheduleStartHours;
  var interval = m.serviceIntervalHours;
  var current = m.currentReading || 0;
  var kLastDone = Math.floor((current - start) / interval);
  if(kLastDone < 0) kLastDone = 0;
  var fromK = Math.max(1, kLastDone - 1);
  var toK = kLastDone + 3;
  var milestones = [];
  var markedNext = false;
  for(var k = fromK; k <= toK; k++){
    var hours = start + k * interval;
    var status = hours <= current ? "done" : (markedNext ? "upcoming" : "next");
    if(status === "next") markedNext = true;
    milestones.push({ k: k, hours: hours, status: status });
  }
  return milestones;
}

function machineNextMilestone(m){
  var milestones = machineScheduleMilestones(m);
  if(!milestones) return null;
  for(var i = 0; i < milestones.length; i++){
    if(milestones[i].status === "next") return milestones[i];
  }
  return null;
}

// Rounds a computed milestone hour value to a stable key for matching
// against a saved log entry's milestoneHours -- start + k*interval can pick
// up float rounding noise (e.g. 2249.9999999998), so exact equality isn't
// safe to compare on.
function milestoneKey(hours){ return Math.round(hours * 100) / 100; }

// Finds the (most recent) service log entry recorded against a specific
// scheduled milestone, so the schedule table can show what was actually
// done at that point instead of just a due/done status.
function machineMilestoneLog(m, hours){
  var key = milestoneKey(hours);
  var log = m.log || [];
  for(var i = 0; i < log.length; i++){
    if(log[i].milestoneHours != null && milestoneKey(log[i].milestoneHours) === key) return log[i];
  }
  return null;
}


// Machine icons (2026-09-24, at Maria's request): a small set of hand-picked
// PNG icons (background-removed, resized) keyed by machine type, matched
// against each machine's name/type text. Case Steiger machines get a red
// recolour of the plain tractor icon; everything not explicitly matched

function machineIconAsset(m){
  var text = ((m.name || "") + " " + (m.type || "")).toLowerCase();
  if(text.indexOf("steiger") > -1) return MACHINE_ICON_ASSETS.tractorRed;
  if(text.indexOf("goldacres") > -1) return MACHINE_ICON_ASSETS.sprayer;
  if(text.indexOf("excavator") > -1) return MACHINE_ICON_ASSETS.excavator;
  if(text.indexOf("kenworth") > -1 || text.indexOf("mack") > -1) return MACHINE_ICON_ASSETS.truck;
  if(text.indexOf("track loader") > -1 || text.indexOf("track-loader") > -1) return MACHINE_ICON_ASSETS.trackloader;
  if(text.indexOf("loader") > -1) return MACHINE_ICON_ASSETS.loader;
  if(text.indexOf("moxy") > -1) return MACHINE_ICON_ASSETS.dumptruck;
  if(text.indexOf("dozer") > -1 || text.indexOf("bulldozer") > -1) return MACHINE_ICON_ASSETS.dozer;
  return MACHINE_ICON_ASSETS.tractor;
}
function machineIconHtml(m, cls){
  return '<img class="' + cls + '" src="' + machineIconAsset(m) + '" alt="" />';
}

function renderMachinery(){
  // Fleet-list / detail-view navigation (2026-09-24 redesign, to match
  // Maria's reference photos): the page shows either the whole fleet as a
  // searchable, filterable list of collapsed cards, or -- once a machine is
  // selected -- a single machine's full detail screen with a back chevron
  // to return to the list. If the selected machine no longer exists (e.g.
  // it was just deleted entirely from its detail screen), fall back to the
  // list instead of showing a blank/broken page.
  var selected = ui.machinerySelected ? byId(state.machinery, ui.machinerySelected) : null;
  if(ui.machinerySelected && !selected) ui.machinerySelected = null;
  return selected ? renderMachineDetail(selected) : renderMachineryList();
}

function renderMachineryList(){
  var q = ui.machineryQuery.trim().toLowerCase();
  var all = state.machinery || [];
  var active = all.filter(function(m){ return m.status !== "archived"; });
  var archived = all.filter(function(m){ return m.status === "archived"; });
  var dueCount = active.filter(machineDueForService).length;
  // "Out of action" has no dedicated status field of its own -- it's read
  // as "has at least one open (unresolved) reported issue", since that's
  // the closest thing this app already tracks to a machine being down.
  var outCount = active.filter(function(m){ return (m.issues||[]).some(function(i){ return i.status !== "Resolved"; }); }).length;

  var filter = ui.machineryFilter || "all";
  var list = active;
  if(filter === "due") list = list.filter(machineDueForService);
  else if(filter === "out") list = list.filter(function(m){ return (m.issues||[]).some(function(i){ return i.status !== "Resolved"; }); });
  if(q) list = list.filter(function(m){
    return (m.name + " " + (m.type||"") + " " + (m.regNo||"")).toLowerCase().indexOf(q) > -1;
  });

  var html = pageHead("Machinery Maintenance", "Service history, hour/km readings and reported issues for farm plant and vehicles.");
  html += '<div class="stat-row">' +
    '<div class="stat"><div class="stat-num">' + active.length + '</div><div class="stat-label">Total machines</div></div>' +
    '<div class="stat"><div class="stat-num">' + dueCount + '</div><div class="stat-label">Due for service</div></div>' +
  '</div>';
  html += '<div class="toolbar">' +
    '<input id="machinery-search-input" class="search-input" type="text" placeholder="Search machinery…" value="' + escAttr(ui.machineryQuery) + '" oninput="ui.machineryQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newMachine\')">' + (ui.openForms.newMachine ? "Cancel" : "+ Add machine") + '</button>' : '') +
  '</div>';
  html += '<div class="filter-pill-row">' +
    ['all', 'due', 'out'].map(function(key){
      var labels = { all: "All", due: "Service due (" + dueCount + ")", out: "Out of action (" + outCount + ")" };
      return '<button type="button" class="filter-pill' + (filter === key ? " active" : "") + '" onclick="ui.machineryFilter=\'' + key + '\';render();">' + labels[key] + '</button>';
    }).join("") +
  '</div>';
  if(ui.openForms.newMachine) html += renderMachineForm();

  if(list.length === 0){ html += '<div class="empty-state">No machinery matches your search.</div>'; }
  html += '<div class="list-cards">' + list.map(renderMachineFleetCard).join("") + '</div>';

  if(archived.length){
    html += '<h3 style="margin:26px 0 10px;font-size:15px;">Sold or Other (' + archived.length + ')</h3>' +
      '<p class="row-muted" style="margin:0 0 12px;font-size:12px;">Machines moved out of the active list. Service history is kept and they can be restored at any time.</p>';
    html += '<div class="list-cards">' + archived.map(renderArchivedMachineCard).join("") + '</div>';
  }
  return html;
}

// A single collapsed row in the fleet list: photo/icon placeholder, name,
// type/rego, and a status pill -- exactly what the reference photos show.
// The whole row is the click target and always navigates into that
// machine's own detail screen (renderMachineDetail); nothing expands here.
function renderMachineFleetCard(m){
  var d = daysUntil(m.nextServiceDue);
  var issues = m.issues || [];
  var openIssues = issues.filter(function(i){ return i.status !== "Resolved"; });
  var scheduleConfigured = machineScheduleConfigured(m);
  var nextMilestone = machineNextMilestone(m);
  var dueLabel, dueTone;
  if(scheduleConfigured && nextMilestone){
    var hoursRemaining = nextMilestone.hours - (m.currentReading || 0);
    var toneWindow = m.serviceIntervalHours || 250;
    dueTone = hoursRemaining <= toneWindow * 0.1 ? "pill-high" : hoursRemaining <= toneWindow * 0.25 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due at " + fmtNum(nextMilestone.hours, "hrs");
  } else {
    dueTone = d != null && d <= 7 ? "pill-high" : d != null && d <= 21 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due " + fmtDate(m.nextServiceDue);
  }
  return '<div class="card" style="cursor:pointer;" onclick="ui.machinerySelected=\'' + m.id + '\';render();">' +
    '<div class="card-row">' +
      '<div style="display:flex;gap:12px;align-items:center;min-width:0;">' +
        '<div class="machine-photo">' + machineIconHtml(m, "machine-icon-img") + '</div>' +
        '<div style="min-width:0;"><h3 style="margin-bottom:2px;font-size:18px;color:var(--accent-strong);">' + esc(m.name) + '</h3>' +
        '<p class="row-muted" style="margin:0;font-size:12.5px;">' + esc(m.type) + (m.regNo ? " &middot; " + esc(m.regNo) : "") + '</p></div>' +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:center;flex-shrink:0;">' +
        (openIssues.length ? '<span class="pill pill-high">' + openIssues.length + ' issue' + (openIssues.length === 1 ? "" : "s") + '</span>' : '') +
        '<span class="pill pill-due ' + dueTone + '">' + dueLabel + '</span>' +
        '<span class="nav-chevron">&#8250;</span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// A machine's full detail screen -- back chevron, header (photo placeholder,
// name/type/rego, current reading), an orange "service due" progress card,
// then every capability the old expanded card used to have (edit/archive,
// combined service history + schedule, parts & part numbers, issues), all
// unchanged. Deliberately has no "Start pre-start check" button -- that's
// from Maria's reference photos but isn't a feature this app has, and she
// asked for it to be left out.
function renderMachineDetail(m){
  var historyOpen = ui.openForms["history_" + m.id];
  var partsOpen = ui.openForms["parts_" + m.id];
  var issuesOpen = ui.openForms["issues_" + m.id];
  var editing = ui.editing.machine === m.id;
  var issues = m.issues || [];
  var scheduleConfigured = machineScheduleConfigured(m);
  var nextMilestone = machineNextMilestone(m);
  var d = daysUntil(m.nextServiceDue);
  var dueLabel, dueTone, dueOk;
  if(scheduleConfigured && nextMilestone){
    var hoursRemaining = nextMilestone.hours - (m.currentReading || 0);
    var toneWindow = m.serviceIntervalHours || 250;
    dueOk = hoursRemaining > toneWindow * 0.25;
    dueTone = hoursRemaining <= toneWindow * 0.1 ? "pill-high" : hoursRemaining <= toneWindow * 0.25 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due at " + fmtNum(nextMilestone.hours, "hrs") + " (" + fmtNum(Math.max(0, hoursRemaining), "hrs") + " to go)";
  } else {
    dueOk = d == null || d > 21;
    dueTone = d != null && d <= 7 ? "pill-high" : d != null && d <= 21 ? "pill-medium" : "pill-todo";
    dueLabel = "Service due " + fmtDate(m.nextServiceDue);
  }

  var html = '<button type="button" class="back-chevron-btn" onclick="ui.machinerySelected=null;render();">&#8249; Back to machinery</button>';
  html += '<div class="card">';
  if(editing){
    html += renderMachineForm(m);
    html += '</div>';
    return html;
  }

  html += '<div class="card-row" style="align-items:flex-start;">' +
    '<div style="display:flex;gap:14px;align-items:center;min-width:0;">' +
      '<div class="machine-photo machine-photo-lg">' + machineIconHtml(m, "machine-icon-img") + '</div>' +
      '<div style="min-width:0;"><h3 style="margin-bottom:2px;font-size:22px;color:var(--accent-strong);">' + esc(m.name) + '</h3>' +
      '<p class="row-muted" style="margin:0;font-size:13px;">' + esc(m.type) + (m.regNo ? " &middot; " + esc(m.regNo) : "") + '</p>' +
      '<p class="row-muted" style="margin:4px 0 0;font-size:12.5px;">' + fmtNum(m.currentReading, "hrs") + ' current reading</p></div>' +
    '</div>' +
    (m.status === "archived" ? '<span class="pill pill-todo">Sold / Other</span>' : '') +
  '</div>';

  html += '<div class="due-progress-card' + (dueOk ? " ok" : "") + '"><div class="stat-label">Maintenance status</div>' +
    '<div style="font-weight:700;font-size:14.5px;margin-top:2px;">' + dueLabel + '</div></div>';

  // The "Maintenance schedule" stat (Due at X hrs · every Y hrs / Not set) is
  // deliberately hidden here as of 2026-09-24, at Maria's request -- the same
  // due-at figure is still shown in full in the "Maintenance status" card
  // just above, so nothing is actually lost, just decluttered off this one
  // screen. Last service / Interval stay, unchanged.
  html += '<div class="form-grid" style="margin:12px 0;">' +
    '<div><div class="stat-label">Last service</div><div style="font-weight:600;">' + fmtNum(m.lastServiceReading, "hrs") + ' &middot; ' + fmtDate(m.lastServiceDate) + '</div></div>' +
    '<div><div class="stat-label">Interval</div><div style="font-weight:600;">' + esc(m.serviceIntervalDesc || "—") + '</div></div>' +
  '</div>';

  if(m.status === "archived"){
    html += '<p class="row-muted" style="margin:0 0 10px;font-size:12px;">' +
      (m.archivedReason ? esc(m.archivedReason) : "No reason given") + (m.archivedDate ? " &middot; " + fmtDate(m.archivedDate) : "") +
    '</p>';
    if(isAdmin()){
      html += '<div class="job-actions" style="margin-bottom:12px;">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="restoreMachine(\'' + m.id + '\')">Restore to active list</button>' +
        '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteMachine(\'' + m.id + '\')">Delete machine entirely</button>' +
      '</div>';
    }
  } else if(isAdmin()){
    html += '<div class="job-actions" style="margin-top:12px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.machine=\'' + m.id + '\';render();">Edit</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + m.id + '\')">' + (ui.openForms["archive_" + m.id] ? "Cancel" : "Mark as Sold / Other") + '</button>' +
    '</div>';
    if(ui.openForms["archive_" + m.id]) html += renderArchiveMachineForm(m);
  }

  html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;" />';
  // Service log and maintenance schedule used to be two separate
  // toggles/tables (Maria found that split confusing -- "I need the
  // service log and the schedule combined into one"). Now a single
  // "Show service history" toggle opens one combined table: any still-
  // outstanding scheduled milestones first (clickable to log them), then
  // every actual logged record underneath (newest first), each with its
  // own Edit button -- including old records well outside the schedule's
  // current computed window, which previously had no edit path at all.
  html += '<button type="button" class="section-toggle-btn" onclick="ui.openForms[\'history_' + m.id + '\']=!ui.openForms[\'history_' + m.id + '\'];render();">' + (historyOpen ? "Hide service history" : "Show service history (" + (m.log||[]).length + ")") + '</button>';
  if(historyOpen) html += renderMachineServiceHistory(m);
  if(isAdmin()){
    html += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">' +
      '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="openLogServiceForNextDue(\'' + m.id + '\')">' + (scheduleConfigured && nextMilestone ? "Log service due (" + fmtNum(nextMilestone.hours, "hrs") + ")" : "Log service") + '</button>' +
      '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="toggleForm(\'svc_' + m.id + '\')">' + (ui.openForms["svc_" + m.id] ? "Cancel" : "+ Log other work") + '</button>' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'setSchedule_' + m.id + '\')">' + (ui.openForms["setSchedule_" + m.id] ? "Cancel" : (scheduleConfigured ? "Edit maintenance schedule" : "+ Set maintenance schedule")) + '</button>' +
      ((m.log || []).length ? '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteServiceHistory(\'' + m.id + '\')">Delete all service history</button>' : '') +
    '</div>';
  }
  if(ui.openForms["svc_" + m.id]) html += renderServiceLogForm(m);
  if(ui.openForms["setSchedule_" + m.id]) html += renderMaintenanceScheduleForm(m);

  html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;" />';
  html += '<button type="button" class="section-toggle-btn" onclick="ui.openForms[\'parts_' + m.id + '\']=!ui.openForms[\'parts_' + m.id + '\'];render();">' + (partsOpen ? "Hide parts & part numbers" : "Show Parts & Part Numbers (" + (m.parts||[]).length + ")") + '</button>';
  if(partsOpen) html += renderMachinePartsSection(m);

  html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;" />';
  html += '<button type="button" class="section-toggle-btn" onclick="ui.openForms[\'issues_' + m.id + '\']=!ui.openForms[\'issues_' + m.id + '\'];render();">' + (issuesOpen ? "Hide issues" : "Report Issue & Show Issues (" + issues.length + ")") + '</button>';
  if(issuesOpen){
    if(issues.length === 0){
      html += '<div class="empty-state" style="margin-top:8px;">No issues reported for this machine.</div>';
    } else {
      html += '<div class="list-cards" style="margin-top:8px;">' + issues.slice().sort(byDateDesc("date")).map(function(iss){
        return '<div class="card" style="box-shadow:none;border:1px solid var(--border);padding:10px 12px;">' +
          '<div class="card-row"><p style="margin:0;flex:1;">' + esc(iss.description) + '</p>' +
          '<span class="pill ' + (iss.status === "Resolved" ? "pill-todo" : "pill-high") + '">' + esc(iss.status || "Open") + '</span></div>' +
          '<p class="row-muted" style="margin:6px 0 0;font-size:11.5px;">Reported by ' + esc(iss.reportedBy) + ' on ' + fmtDate(iss.date) + '</p>' +
          '<div style="display:flex;gap:6px;margin-top:8px;">' +
            (iss.status !== "Resolved" ? '<button type="button" class="btn btn-ghost btn-sm" onclick="resolveMachineIssue(\'' + m.id + '\',\'' + iss.id + '\')">Mark resolved</button>' : '<button type="button" class="btn btn-ghost btn-sm" onclick="reopenMachineIssue(\'' + m.id + '\',\'' + iss.id + '\')">Reopen</button>') +
            (isAdmin() ? '<button type="button" class="btn btn-danger btn-sm" onclick="if(confirm(\'Delete this issue?\')){deleteMachineIssue(\'' + m.id + '\',\'' + iss.id + '\');}">Delete</button>' : '') +
          '</div>' +
        '</div>';
      }).join("") + '</div>';
    }
    html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="toggleForm(\'newIssue_' + m.id + '\')">' + (ui.openForms["newIssue_" + m.id] ? "Cancel" : "+ Report an issue") + '</button>';
    if(ui.openForms["newIssue_" + m.id]) html += renderMachineIssueForm(m);
  }
  html += '</div>';
  return html;
}

// Parts & Part Numbers -- a per-machine reference list (not a log of events
// like service history or issues) so whoever's ordering a replacement filter,
// belt or hose can look up the right part number without having to dig
// through old service records or ask around. Anyone can view it; adding/
// editing/deleting entries is admin-only, same as the machine's own Edit
// form and maintenance schedule, since it's reference data staff rely on
// being accurate rather than a running log anyone should freely add to.
function renderMachinePartsSection(m){
  var parts = (m.parts || []).slice().sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||"")); });
  var openForms = "";
  var html = "";
  if(!parts.length){
    html += '<div class="empty-state" style="margin-top:8px;">No parts or part numbers recorded yet.</div>';
  } else {
    var rows = parts.map(function(p){
      var editKey = "editpart_" + p.id;
      var editing = ui.openForms[editKey];
      if(editing) openForms += renderMachinePartForm(m, p);
      return '<tr>' +
        '<td>' + esc(p.name) + '</td>' +
        '<td class="row-muted">' + esc(p.partNumber || "—") + '</td>' +
        '<td class="row-muted">' + esc(p.notes || "—") + '</td>' +
        '<td style="white-space:nowrap;">' + (isAdmin() ?
          ('<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'' + editKey + '\']=!ui.openForms[\'' + editKey + '\'];render();">' + (editing ? "Cancel" : "Edit") + '</button> ' +
           '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteMachinePart(\'' + m.id + '\',\'' + p.id + '\')">Delete</button>')
          : "") + '</td>' +
      '</tr>';
    }).join("");
    html += '<div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th>Part / component</th><th>Part number</th><th>Notes</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }
  if(openForms) html += '<div style="margin-top:10px;">' + openForms + '</div>';
  if(isAdmin()){
    var addKey = "newPart_" + m.id;
    html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="toggleForm(\'' + addKey + '\')">' + (ui.openForms[addKey] ? "Cancel" : "+ Add part") + '</button>';
    if(ui.openForms[addKey]) html += renderMachinePartForm(m, null);
  }
  return html;
}
function renderMachinePartForm(m, existing){
  var formKey = existing ? ("editpart_" + existing.id) : ("newPart_" + m.id);
  var err = ui.formErrors[formKey];
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="saveMachinePart(event,\'' + m.id + '\',' + (existing ? "'" + existing.id + "'" : "null") + ')">' +
    '<h4 style="margin-top:0;">' + (existing ? "Edit part" : "Add part") + ' — ' + esc(m.name) + '</h4>' +
    (err ? '<p style="color:var(--danger);font-size:12.5px;font-weight:600;margin:0 0 10px;">' + esc(err) + '</p>' : '') +
    '<div class="form-grid">' +
      '<div class="field"><label>Part / component</label><input type="text" name="name" required value="' + escAttr(existing ? existing.name : "") + '" placeholder="e.g. Engine oil filter" /></div>' +
      '<div class="field"><label>Part number</label><input type="text" name="partNumber" value="' + escAttr(existing ? existing.partNumber : "") + '" placeholder="e.g. RE504836" /></div>' +
      '<div class="field span-2"><label>Notes (optional)</label><input type="text" name="notes" value="' + escAttr(existing ? existing.notes : "") + '" placeholder="e.g. supplier, where to order, quantity needed" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button>' +
      '<button type="button" class="btn btn-ghost" onclick="delete ui.formErrors[\'' + formKey + '\'];' + (existing ? ("ui.openForms['" + formKey + "']=false;render();") : ("toggleForm('" + formKey + "')")) + '">Cancel</button>' +
    '</div>' +
  '</form>';
}
function saveMachinePart(e, machineId, partId){
  e.preventDefault();
  var f = e.target;
  var formKey = partId ? ("editpart_" + partId) : ("newPart_" + machineId);
  var name = f.name.value.trim();
  if(!name){
    ui.formErrors[formKey] = "Enter a part or component name.";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var m = byId(state.machinery, machineId);
  if(!m) return;
  m.parts = m.parts || [];
  var data = { name: name, partNumber: f.partNumber.value.trim(), notes: f.notes.value.trim() };
  if(partId){
    var existing = byId(m.parts, partId);
    if(existing) Object.assign(existing, data);
  } else {
    m.parts.push(Object.assign({ id: uid("part") }, data));
  }
  ui.openForms[formKey] = false;
  persist();
}
// Confirm message built here (never interpolated into the onclick attribute)
// since a part name or number can contain an apostrophe -- same reasoning as
// confirmDeleteServiceHistory/confirmDeleteMachine above.
function confirmDeleteMachinePart(machineId, partId){
  var m = byId(state.machinery, machineId);
  if(!m) return;
  var p = byId(m.parts || [], partId);
  if(!p) return;
  if(confirm("Delete part \"" + p.name + "\"" + (p.partNumber ? " (" + p.partNumber + ")" : "") + "? This cannot be undone.")){
    deleteMachinePart(machineId, partId);
  }
}
function deleteMachinePart(machineId, partId){
  var m = byId(state.machinery, machineId);
  if(!m) return;
  removeById(m.parts, partId);
  ui.openForms["editpart_" + partId] = false;
  persist();
}

function renderArchiveMachineForm(m){
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="archiveMachine(event,\'' + m.id + '\')">' +
    '<h4 style="margin-top:0;">Move to Sold or Other — ' + esc(m.name) + '</h4>' +
    '<p class="row-muted" style="margin:0 0 10px;font-size:12px;">This takes it off the active machinery list and lists it under "Sold or Other" at the bottom of the page instead. Its full service history is kept, and it can be restored to the active list at any time.</p>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Reason (optional)</label><input type="text" name="reason" placeholder="e.g. Sold, Traded in, Written off" value="' + escAttr(m.archivedReason || "") + '" /></div>' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + escAttr(m.archivedDate || todayISO()) + '" required /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Move to Sold or Other</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'archive_' + m.id + '\')">Cancel</button></div>' +
  '</form>';
}
function archiveMachine(e, id){
  e.preventDefault();
  var f = e.target;
  var m = byId(state.machinery, id);
  m.status = "archived";
  m.archivedReason = f.reason.value.trim();
  m.archivedDate = f.date.value;
  ui.openForms["archive_" + id] = false;
  persist();
}
function restoreMachine(id){
  var m = byId(state.machinery, id);
  m.status = "active";
  persist();
}
// Genuine, permanent removal -- distinct from archiveMachine/restoreMachine
// above, which just moves a machine to "Sold or Other" and keeps everything
// about it. This one actually deletes the machine record (and, since it's
// gone, its service history and issues along with it) so it stops appearing
// anywhere, including "Sold or Other". Only offered from the archived card,
// since a machine needs to be moved there first -- an extra step that gives
// a chance to reconsider before something this final. Confirm message is
// built here (never interpolated into the onclick attribute) since a machine
// name can contain an apostrophe, same reasoning as confirmDeleteServiceHistory.
function confirmDeleteMachine(id){
  var m = byId(state.machinery, id);
  if(!m) return;
  if(confirm("Permanently delete " + m.name + "? This removes the machine along with its entire service history and reported issues. This cannot be undone.")){
    deleteMachineEntirely(id);
  }
}
function deleteMachineEntirely(id){
  removeById(state.machinery, id);
  persist();
}
function renderArchivedMachineCard(m){
  return '<div class="card" style="opacity:.85;">' +
    '<div class="card-row"><div><h3 style="margin-bottom:2px;font-size:20px;color:var(--accent-strong);">' + esc(m.name) + '</h3>' +
      '<p class="row-muted" style="margin:0;font-size:12.5px;">' + esc(m.type) + (m.regNo ? " &middot; " + esc(m.regNo) : "") + '</p></div>' +
      '<span class="pill pill-todo">Sold / Other</span></div>' +
    '<p class="row-muted" style="margin:8px 0 0;font-size:12px;">' +
      (m.archivedReason ? esc(m.archivedReason) : "No reason given") + (m.archivedDate ? " &middot; " + fmtDate(m.archivedDate) : "") +
    '</p>' +
    (isAdmin() ? '<div class="job-actions" style="margin-top:12px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="restoreMachine(\'' + m.id + '\')">Restore to active list</button>' +
      '<button type="button" class="btn btn-danger btn-sm" onclick="confirmDeleteMachine(\'' + m.id + '\')">Delete machine entirely</button>' +
    '</div>' : '') +
  '</div>';
}

// Starting hours used to be entered here too, but it now lives on the
// machine's own Edit form (renderMachineForm/saveMachine) so it's reachable
// alongside every other machine detail rather than only via this schedule
// button. This form now only sets the service interval; the due-milestone
// math (machineScheduleMilestones) reads the machine's scheduleStartHours
// fresh every time, so the schedule re-computes itself automatically as soon
// as that field changes -- nothing here needs to "sync" to it.
function renderMaintenanceScheduleForm(m){
  var formKey = "setSchedule_" + m.id;
  var err = ui.formErrors[formKey];
  var startKnown = m.scheduleStartHours != null;
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="saveMaintenanceSchedule(event,\'' + m.id + '\')">' +
    '<h4>Maintenance schedule — ' + esc(m.name) + '</h4>' +
    (err ? '<p style="color:var(--danger);font-size:12.5px;font-weight:600;margin:0 0 10px;">' + esc(err) + '</p>' : '') +
    '<p class="row-muted" style="margin:0 0 10px;font-size:12px;">' +
      (startKnown
        ? ('Starting hours: <strong style="color:var(--text);">' + fmtNum(m.scheduleStartHours, "hrs") + '</strong> -- edit this via the machine\'s own "Edit" button.')
        : 'This machine has no starting hours set yet -- add one via the machine\'s own "Edit" button before this schedule can activate.') +
    '</p>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Service interval (hrs)</label><input type="text" inputmode="decimal" name="serviceIntervalHours" required value="' + escAttr(m.serviceIntervalHours != null ? m.serviceIntervalHours : 250) + '" /></div>' +
    '</div>' +
    '<p class="row-muted" style="margin:0 0 10px;font-size:11.5px;">How often (in hours) this machine needs a service. Bullamon Plains typically services on a 250-hour cycle. (Commas are fine, e.g. "1,800".)</p>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button><button type="button" class="btn btn-ghost" onclick="delete ui.formErrors[\'' + formKey + '\'];toggleForm(\'' + formKey + '\')">Cancel</button></div>' +
  '</form>';
}
function saveMaintenanceSchedule(e, id){
  e.preventDefault();
  var f = e.target;
  var formKey = "setSchedule_" + id;
  var interval = parseHoursInput(f.serviceIntervalHours.value);
  if(isNaN(interval) || interval <= 0){
    ui.formErrors[formKey] = "Enter a service interval greater than 0 (e.g. 250).";
    render();
    return;
  }

// The "Log service" button used to always open the generic log-or-reading
// form. Now that every machine's card shows the maintenance schedule's next
// due milestone, clicking it should jump straight to logging THAT scheduled
// service (the same milestone form the history table's own "Log this
// service" row opens) rather than a blank generic form -- one click gets you
// to the service that's actually coming up. A machine with no maintenance
// schedule configured has no milestone to jump to, so it falls back to the
// old generic form instead. General/non-scheduled work now has its own
// separate "+ Log other work" button (renderServiceLogForm/addServiceLog),
// unchanged.
function openLogServiceForNextDue(id){
  var m = byId(state.machinery, id);
  if(!m) return;
  var milestones = machineScheduleMilestones(m);
  var target = null;
  if(milestones){
    // Prefer the milestone the schedule currently marks "next", as long as
    // it hasn't already been logged; otherwise fall back to the first
    // outstanding (unlogged) milestone in the window, same rows the
    // combined service history table itself would offer to log.
    var next = machineNextMilestone(m);
    if(next && !machineMilestoneLog(m, milestoneKey(next.hours))){
      target = next;
    } else {
      for(var i = 0; i < milestones.length; i++){
        if(!machineMilestoneLog(m, milestoneKey(milestones[i].hours))){ target = milestones[i]; break; }
      }
    }
  }
  if(target){
    var key = milestoneKey(target.hours);
    ui.openForms["history_" + id] = true;
    ui.openForms["ms_" + id + "_" + key] = !ui.openForms["ms_" + id + "_" + key];
    render();
  } else {
    toggleForm("svc_" + id);
  }
}
function addServiceLog(e, id){
  e.preventDefault();
  var f = e.target;
  var formKey = "svc_" + id;
  var m = byId(state.machinery, id);
  var reading = parseHoursInput(f.reading.value);
  if(isNaN(reading)){
    ui.formErrors[formKey] = "Enter a valid reading (e.g. 2140).";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  m.log = m.log || [];
  m.log.unshift({ id: uid("l"), date: f.date.value, description: f.description.value.trim(), performedBy: f.performedBy.value.trim(), reading: reading, filtersUsed: f.filtersUsed.value.trim(), oilUsed: f.oilUsed.value.trim() });
  m.currentReading = reading;

}

  '</form>';

function addMilestoneServiceLog(e, machineId, key){
  e.preventDefault();
  var f = e.target;
  var formKey = "ms_" + machineId + "_" + key;
  var reading = parseHoursInput(f.reading.value);
  var description = f.description.value.trim();
  if(isNaN(reading) || !description){
    ui.formErrors[formKey] = !description ? "Describe what was done." : "Enter a valid reading (e.g. 2300).";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var m = byId(state.machinery, machineId);
  m.log = m.log || [];
  // Re-logging the same milestone updates its existing entry rather than
  // stacking a duplicate, so each scheduled point has one record.
  var existingIdx = m.log.findIndex(function(l){ return l.milestoneHours != null && milestoneKey(l.milestoneHours) === key; });
  var entry = { id: (existingIdx > -1 ? m.log[existingIdx].id : uid("l")), date: f.date.value, description: description, performedBy: f.performedBy.value.trim() || currentUser().name, reading: reading, milestoneHours: key, filtersUsed: f.filtersUsed.value.trim(), oilUsed: f.oilUsed.value.trim() };
  if(existingIdx > -1) m.log[existingIdx] = entry; else m.log.unshift(entry);
  m.currentReading = Math.max(m.currentReading || 0, reading);
  m.lastServiceDate = f.date.value;
  m.lastServiceReading = reading;
  ui.openForms["ms_" + machineId + "_" + key] = false;
  persist();
}

// Combines what used to be two separate views (the service log table and
// the maintenance schedule table) into one: any scheduled milestone that
// hasn't been logged yet appears first (still clickable, same as before),
// then every actual log entry underneath, newest first -- with its own Edit
// button, so an old record can be corrected even when it's well outside the
// schedule's own small computed window of nearby milestones (which is all
// machineScheduleMilestones() ever returns -- it was never meant to be a
// full history). One shared table/header for both kinds of row, rather than
// two separate tables under two separate toggles.
function renderMachineServiceHistory(m){
  var scheduleConfigured = machineScheduleConfigured(m);
  var openForms = "";
  var rows = "";

  if(scheduleConfigured){
    var milestones = machineScheduleMilestones(m) || [];
    rows += milestones.filter(function(ms){ return !machineMilestoneLog(m, milestoneKey(ms.hours)); }).map(function(ms){
      // A milestone can be computed as "done" (the current reading has
      // already passed it) and still have no matching log entry -- e.g. a
      // schedule set up after some service history already existed, where
      // none of that history was tagged against a specific milestone. Label
      // that case clearly rather than letting it fall through to "Upcoming",
      // which would wrongly suggest it hasn't happened yet.
      var label = ms.status === "done" ? "Passed (not logged)" : ms.status === "next" ? "Next due" : "Upcoming";
      var tone = ms.status === "upcoming" ? "pill-medium" : "pill-high";
      var key = milestoneKey(ms.hours);
      var open = ui.openForms["ms_" + m.id + "_" + key];
      if(open) openForms += renderMilestoneLogForm(m, ms.hours, null);
      return '<tr>' +
        '<td class="row-muted">—</td>' +
        '<td class="num">' + fmtNum(ms.hours) + '</td>' +
        '<td class="row-muted">Not logged yet</td>' +
        '<td class="row-muted">—</td>' +
        '<td><span class="pill ' + tone + '">' + label + '</span></td>' +
        '<td>' + (isAdmin() ? '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'ms_' + m.id + '_' + key + '\']=!ui.openForms[\'ms_' + m.id + '_' + key + '\'];render();">' + (open ? "Cancel" : "Log this service") + '</button>' : '') + '</td>' +
      '</tr>';
    }).join("");
  }

  var log = (m.log || []).slice().sort(byDateDesc("date"));
  rows += log.map(function(l){
    var editKey = "editlog_" + l.id;
    var editingLog = ui.openForms[editKey];
    if(editingLog) openForms += renderEditServiceLogForm(m, l);
    var scheduledTag = l.milestoneHours != null ? ' <span class="row-muted" style="font-size:10.5px;">(scheduled ' + fmtNum(l.milestoneHours) + ' hrs)</span>' : '';
    var usedTag = "";
    if(l.filtersUsed) usedTag += '<br/><span class="row-muted" style="font-size:11px;">Filters used: ' + esc(l.filtersUsed) + '</span>';
    if(l.oilUsed) usedTag += '<br/><span class="row-muted" style="font-size:11px;">Oil used: ' + esc(l.oilUsed) + '</span>';
    return '<tr>' +
      '<td>' + fmtDate(l.date) + '</td>' +
      '<td class="num">' + fmtNum(l.reading) + '</td>' +
      '<td>' + esc(l.description) + scheduledTag + usedTag + '</td>' +
      '<td>' + esc(l.performedBy) + '</td>' +
      '<td><span class="pill pill-todo">Done</span></td>' +
      '<td>' + (isAdmin() ? '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'' + editKey + '\']=!ui.openForms[\'' + editKey + '\'];render();">' + (editingLog ? "Cancel" : "Edit") + '</button>' : '') + '</td>' +
    '</tr>';
  }).join("");

  if(!rows){
    return '<div class="empty-state" style="margin-top:8px;">No service history logged yet' + (scheduleConfigured ? "" : ", and no maintenance schedule set") + '.</div>';
  }

  var html = '<div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th>Date</th><th>Hours</th><th>What was done</th><th>By</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  if(openForms) html += '<div style="margin-top:10px;">' + openForms + '</div>';
  if(scheduleConfigured){
    html += '<p class="row-muted" style="margin:8px 0 0;font-size:11.5px;">Starting from ' + fmtNum(m.scheduleStartHours) + ' hrs, every ' + fmtNum(m.serviceIntervalHours) + ' hrs. Current reading: ' + fmtNum(m.currentReading) + ' hrs.</p>';
  }
  return html;
}

      '<div class="field"><label>Oil used (optional)</label><input type="text" name="oilUsed" value="' + escAttr(l.oilUsed) + '" placeholder="e.g. 15W-40 diesel engine oil, 24L" /></div>' +

// Wipes an entire machine's logged service history in one go (admin only --
// gated at the button itself in renderMachineDetail, same as every other
// admin-only action). Separate from deleteServiceLog above, which removes
// one record at a time via its own Edit form -- this is for clearing
// everything at once (e.g. starting a machine's records over from scratch),
// rather than deleting records one by one. The machine's own current
// reading, last-service date/reading and maintenance schedule are left
// untouched -- only the log entries themselves are removed, so a schedule's
// upcoming milestones just show as "not logged yet" again afterwards. The
// confirmation dialog and the machine's name/record count are built here in
// JS rather than interpolated into the onclick attribute, to sidestep the
// HTML-entity-in-onclick apostrophe bug this app hit before (a machine name
// containing an apostrophe would otherwise break the inline JS string).
function confirmDeleteServiceHistory(machineId){
  var m = byId(state.machinery, machineId);
  if(!m) return;
  var count = (m.log || []).length;
  if(!count) return;
  if(confirm("Delete ALL " + count + " service history record" + (count === 1 ? "" : "s") + " for " + m.name + "? This cannot be undone.")){
    clearMachineServiceHistory(machineId);
  }
}
function clearMachineServiceHistory(machineId){
  var m = byId(state.machinery, machineId);
  if(!m) return;
  m.log = [];
  persist();
}

function saveMachine(e, id){
  e.preventDefault();
  var f = e.target;
  var formKey = "machineForm_" + (id || "new");
  var data = { name: f.name.value.trim(), type: f.type.value.trim(), regNo: f.regNo.value.trim(), serviceIntervalDesc: f.serviceIntervalDesc.value.trim(), nextServiceDue: f.nextServiceDue.value };
  if(!data.name) return;
  var startRaw = f.scheduleStartHours.value;
  if(startRaw != null && String(startRaw).trim() !== ""){
    var startHours = parseHoursInput(startRaw);
    if(isNaN(startHours)){
      ui.formErrors[formKey] = "Enter a valid starting hours reading (e.g. 1800), or leave it blank.";
      render();
      return;
    }
    data.scheduleStartHours = startHours;
  } else {
    data.scheduleStartHours = null;
  }
  delete ui.formErrors[formKey];
  if(id){ Object.assign(byId(state.machinery, id), data); ui.editing.machine = null; }
  else { state.machinery.push(Object.assign({ id: uid("m"), currentReading: 0, lastServiceDate: "", lastServiceReading: 0, log: [] }, data)); ui.openForms.newMachine = false; }
  persist();
}

/* ======================================================================
   BULLS
   Same active/archived-by-status pattern as Machinery ("Sold or Other")
   and the same per-item log pattern as Machinery's service log, applied
   here to yearly BBSE (Bull Breeding Soundness Evaluation) test results.
   ====================================================================== */
function bullItems(){ return (state.bulls && state.bulls.items) || []; }

// A number of test-log summaries in Maria's original spreadsheet contain
// only the single character "ü" -- almost certainly a Wingdings/Symbol-font
// tick mark ( a check mark glyph) that lost its meaning once the cell was
// read back as plain text, rather than an actual note. Shown as a plain
// check mark with a title explaining why, instead of either the raw "ü"
// (confusing) or a fabricated guess at what the tick meant (not something
// this app should invent).
function bullTestDisplay(summary){
  var s = (summary == null ? "" : String(summary)).trim();
  if(s === "ü"){
    return '<span title="Recorded in the source spreadsheet as a tick mark (Wingdings-style), with no written notes">&#10003; Tested &ndash; no written notes recorded</span>';
  }
  return esc(summary);
}

// Column years match the "Bull Summary" (active) sheet exactly, in the same
// left-to-right order (most recent year first) -- including years with no
// data for any current bull (e.g. "2021", currently blank for every bull),
// so the grid keeps the same shape as the spreadsheet rather than dropping
// empty columns. The "Dead or Sold" table was removed 2026-09-07, then
// reinstated 2026-09-21 as "Sold / Dead" at Maria's request -- see the Bulls
// architecture note for the full history.
var BULL_ACTIVE_YEARS = ["2026", "2025", "2024", "2023", "2022", "2021"];
// Matches the years actually present across the 56 archived bulls' test
// logs (including the source spreadsheet's odd "2021 Retest" column) --
// same "keep the shape even where a column is blank for every current row"
// approach as BULL_ACTIVE_YEARS above.
var BULL_ARCHIVED_YEARS = ["2025", "2024", "2023", "2022", "2021 Retest", "2021", "2020", "2018"];

// Scrolls a just-opened Bulls panel (an edit/add-test form rendered below
// the table, per this app's table/form rule) into view -- with 34+ rows in
// one un-paginated table, "below the table" can be a long way from the row
// someone actually clicked, which otherwise reads as the button having done
// nothing. Harmless no-op if the panel just closed (element no longer
// exists) or doesn't exist yet for any other reason.
function scrollToExtra(id){
  var el = document.getElementById(id);
  if(el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderBulls(){
  var q = ui.bullsQuery.trim().toLowerCase();
  // No sorting -- keeps bulls in exactly the order Maria's own spreadsheet
  // has them (the bulk import pushed them in that same row order, and a
  // newly-added bull goes on the end), per her request to match the
  // spreadsheet's order exactly rather than re-sorting alphabetically by tag.
  var allActive = bullItems().filter(function(b){ return b.status !== "archived"; });
  var archived = bullItems().filter(function(b){ return b.status === "archived"; });
  var matches = function(b){
    return (b.tag + " " + b.name + " " + (b.animalId||"") + " " + (b.location||"") + " " + (b.breed||"")).toLowerCase().indexOf(q) > -1;
  };
  var active = q ? allActive.filter(matches) : allActive;

  var html = pageHead("Bulls", "Laid out the same way as the original spreadsheet -- one row per bull, every year's BBSE test result across the top.");
  html += '<div class="stat-row">' +
    '<div class="stat"><div class="stat-num">' + allActive.length + '</div><div class="stat-label">Active bulls</div></div>' +
    '<div class="stat"><div class="stat-num">' + archived.length + '</div><div class="stat-label">Sold / Dead</div></div>' +
  '</div>';
  html += '<div class="toolbar">' +
    '<input id="bulls-search-input" class="search-input" type="text" placeholder="Search bulls…" value="' + escAttr(ui.bullsQuery) + '" oninput="ui.bullsQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newBull\')">' + (ui.openForms.newBull ? "Cancel" : "+ Add bull") + '</button>' : '') +
  '</div>';
  if(ui.openForms.newBull) html += renderBullForm();

  html += renderBullsTable(active, BULL_ACTIVE_YEARS, false);
  if(q) html += '<p class="row-muted" style="margin:8px 0 0;font-size:12px;">Showing ' + active.length + ' of ' + allActive.length + ' bulls.</p>';

  // Sold / Dead -- moved out of the active table, kept (not deleted --
  // their full test history and any PDF attachments are kept, and any of
  // them can be restored to the active table at any time) but hidden behind
  // a toggle by default at Maria's request ("hide the Sold/Dead bulls"),
  // rather than always shown in full underneath the active table as before.
  if(archived.length){
    var archivedOpen = !!ui.openForms.bullsArchived;
    html += '<div style="margin-top:26px;">' +
      '<button type="button" class="section-toggle-btn" onclick="toggleForm(\'bullsArchived\')">' + (archivedOpen ? "Hide" : "Show") + ' Sold / Dead (' + archived.length + ')</button>' +
    '</div>';
    if(archivedOpen){
      html += '<p class="row-muted" style="margin:12px 0 12px;font-size:12px;">Bulls moved out of the active list. Full test history and any attached PDFs are kept, and any of them can be restored to the active list at any time.</p>';
      html += renderBullsTable(archived, BULL_ARCHIVED_YEARS, true);
    }
  }

  return html;
}

// Renders a bulls table exactly shaped like the matching source sheet
// ("Bull Summary" for active, "Dead or Sold" for Sold / Dead) -- a plain
// data grid, every year's result shown directly in its own column (no
// per-bull toggle to open first) -- plus trailing Notes/Files/Actions
// columns for the things the spreadsheet itself didn't have (flagged
// data-quality notes, PDF attachments, edit/add-test/archive controls).
// Per this app's usual rule, a form is never rendered inside a table cell --
// clicking Edit/+Test/+Attach PDF/Mark as Sold-Dead on a row instead opens
// its panel in "extras", collected while building the rows and rendered as
// ordinary blocks below the whole table. `isArchived` only changes what
// shows in the Actions column (Edit + Restore, instead of Edit/+Test/Mark
// as Sold-Dead) -- everything else about the row is rendered identically.
function renderBullsTable(list, years, isArchived){
  var extras = "";
  if(list.length === 0){
    return '<div class="empty-state">No bulls' + (isArchived ? "" : " match your search") + '.</div>' + extras;
  }
  // Tag is pinned (position:sticky) at the far left edge of the table (left:0)
  // -- the one thing Maria wants to still see while scrolling sideways through
  // the year columns/Notes/Actions on the right, so it stays put like a frozen
  // first column in a spreadsheet while everything else scrolls underneath it.
  // The Location column (which used to sit before Tag) was removed at Maria's
  // request, which is what let Tag become the frozen leftmost column at all.
  var stickyTagStyle = 'position:sticky;left:0;box-shadow:2px 0 4px -2px rgba(0,0,0,.18);';
  var headerCells = '<th style="' + stickyTagStyle + 'background:var(--surface-2);z-index:3;">Tag</th>' +
    "<th>Name</th><th>Animal ID</th><th>DOB</th><th>Price</th>" +
    years.map(function(y){ return "<th>" + esc(y) + "</th>"; }).join("") +
    "<th>Notes</th>" +
    (isArchived ? "<th>Reason</th><th>Date</th>" : "") +
    "<th>Files</th><th>Actions</th>";

  var bodyRows = list.map(function(b){
    var editing = ui.editing.bull === b.id;
    var editKey = "bull-extra-edit_" + b.id;
    var testKey = "bull-extra-btest_" + b.id;
    var attachKey = "bull-extra-attach_" + b.id;
    var archiveKey = "bull-extra-archive_" + b.id;
    var notesKey = "bull-extra-notes_" + b.id;
    if(editing) extras += '<div class="form-panel-wrap" id="' + editKey + '" style="margin-top:10px;">' + renderBullForm(b) + '</div>';
    if(ui.openForms["btest_" + b.id]) extras += '<div class="form-panel-wrap" id="' + testKey + '" style="margin-top:10px;">' + renderBullTestForm(b) + '</div>';
    if(ui.openForms["battach_" + b.id]) extras += '<div class="form-panel-wrap" id="' + attachKey + '" style="margin-top:10px;">' + renderBullAttachmentForm(b) + '</div>';
    if(ui.openForms["archive_" + b.id]) extras += '<div class="form-panel-wrap" id="' + archiveKey + '" style="margin-top:10px;">' + renderArchiveBullForm(b) + '</div>';
    if(ui.openForms["bnotes_" + b.id]) extras += '<div class="form-panel-wrap" id="' + notesKey + '" style="margin-top:10px;">' + renderBullNotesPanel(b) + '</div>';

    var noteCount = (b.noteLog || []).length;
    var cells = '<td style="' + stickyTagStyle + 'background:var(--surface);font-weight:600;white-space:nowrap;">' + esc(b.tag) + '</td>' +
      '<td style="color:var(--accent-strong);font-weight:600;white-space:nowrap;cursor:pointer;" onclick="toggleForm(\'bnotes_' + b.id + '\');scrollToExtra(\'' + notesKey + '\');" title="Click for notes on ' + escAttr(b.name) + '">' + esc(b.name) + (noteCount ? ' <span class="row-muted" style="font-weight:400;font-size:11px;">(' + noteCount + ')</span>' : '') + '</td>' +
      '<td style="white-space:nowrap;">' + esc(b.animalId || "") + '</td>' +
      '<td style="white-space:nowrap;">' + (b.dob ? fmtDate(b.dob) : (b.dobRaw ? esc(b.dobRaw) : "—")) + '</td>' +
      '<td style="white-space:nowrap;">' + (b.purchasePriceRaw ? esc(b.purchasePriceRaw) : fmtMoney(b.purchasePrice)) + '</td>';

    // Each year's cell just shows the test summary text -- the "+ BBSE
    // detail" toggle (and the inline detail row it opened, with the
    // structured breed/BCS/scrotal-circumference/motility/etc. fields from
    // the merged July-2025 records) was removed at Maria's request. The
    // underlying t.detail data itself is untouched in state -- this only
    // removed the button and the row that displayed it.
    years.forEach(function(y){
      var t = (b.testLog || []).find(function(tt){ return tt.year === y; });
      if(!t){ cells += '<td class="row-muted">—</td>'; return; }
      cells += '<td style="min-width:170px;">' + bullTestDisplay(t.summary) + '</td>';
    });

    cells += '<td style="min-width:160px;font-size:11.5px;" class="row-muted">' + (b.notes ? esc(b.notes) : "") + '</td>';
    if(isArchived){
      cells += '<td style="min-width:120px;white-space:nowrap;">' + (b.archivedReason ? esc(b.archivedReason) : '<span class="row-muted">No reason given</span>') + '</td>' +
        '<td style="white-space:nowrap;">' + (b.archivedDate ? fmtDate(b.archivedDate) : "—") + '</td>';
    }

    // PDF attachments (registration papers, certificates, sale documents,
    // etc.) -- each just a small link plus, for an admin, its own remove
    // button; the upload control itself is a real form (a file input), so
    // per this app's usual rule it can't live in this cell and instead opens
    // below the whole table, in "extras", the same way Edit/+Test do.
    var attachList = (b.attachments || []).map(function(a){
      return '<div style="white-space:nowrap;">' +
        '<a href="' + escAttr(a.url) + '" target="_blank" rel="noopener" onclick="return openStoredFile(\'' + escAttr(a.url) + '\')" style="font-size:11.5px;">&#128196; ' + esc(a.name || "PDF") + '</a>' +
        (isAdmin() ? ' <button type="button" class="subtle-btn" style="font-size:10px;padding:0 3px;" title="Remove" onclick="removeBullAttachment(\'' + b.id + '\',\'' + a.id + '\')">&times;</button>' : '') +
      '</div>';
    }).join("");
    var filesCell = '<td style="min-width:130px;font-size:11.5px;">' + attachList;
    if(isAdmin()){
      filesCell += '<button type="button" class="subtle-btn" style="font-size:10.5px;margin-top:2px;" onclick="toggleForm(\'battach_' + b.id + '\');scrollToExtra(\'' + attachKey + '\');">' + (ui.openForms["battach_" + b.id] ? "Cancel" : "+ Attach PDF") + '</button>';
    } else if(!attachList){
      filesCell += '<span class="row-muted">—</span>';
    }
    filesCell += '</td>';

    var actions = '<td style="white-space:nowrap;">';
    if(isAdmin()){
      actions += '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.bull=\'' + b.id + '\';render();scrollToExtra(\'' + editKey + '\');">Edit</button> ';
      if(isArchived){
        actions += '<button type="button" class="btn btn-ghost btn-sm" onclick="restoreBull(\'' + b.id + '\')">Restore to active</button> ' +
          '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + b.id + '\');scrollToExtra(\'' + archiveKey + '\');">' + (ui.openForms["archive_" + b.id] ? "Cancel" : "Edit reason / date") + '</button>';
      } else {
        actions += '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'btest_' + b.id + '\');scrollToExtra(\'' + testKey + '\');">' + (ui.openForms["btest_" + b.id] ? "Cancel" : "+ Test") + '</button> ' +
          '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + b.id + '\');scrollToExtra(\'' + archiveKey + '\');">' + (ui.openForms["archive_" + b.id] ? "Cancel" : "Mark as Sold / Dead") + '</button>';
      }
    }
    actions += '</td>';

    return "<tr>" + cells + filesCell + actions + "</tr>";
  }).join("");

  return '<div class="table-wrap"><table class="bulls-table"><thead><tr>' + headerCells + '</tr></thead><tbody>' + bodyRows + '</tbody></table></div>' + extras;
}

    '<div class="form-grid">' +
      '<div class="field"><label>Tag / ID</label><input type="text" name="tag" required value="' + escAttr(existing ? existing.tag : "") + '" /></div>' +
      '<div class="field span-2"><label>Name</label><input type="text" name="name" required value="' + escAttr(existing ? existing.name : "") + '" /></div>' +
      '<div class="field"><label>Animal ID (NLIS / brand)</label><input type="text" name="animalId" value="' + escAttr(existing ? existing.animalId : "") + '" /></div>' +
      '<div class="field"><label>Breed</label><input type="text" name="breed" value="' + escAttr(existing ? existing.breed : "") + '" /></div>' +
      '<div class="field"><label>Location</label><input type="text" name="location" placeholder="e.g. BXP, WG" value="' + escAttr(existing ? existing.location : "") + '" /></div>' +
      '<div class="field"><label>Date of birth</label><input type="date" name="dob" value="' + escAttr(existing ? existing.dob : "") + '" /></div>' +
      '<div class="field"><label>Purchase price ($)</label><input type="number" step="1" name="purchasePrice" value="' + escAttr(existing && existing.purchasePrice != null ? existing.purchasePrice : "") + '" /></div>' +
      '<div class="field span-2"><label>Notes</label><textarea name="notes" rows="2">' + esc(existing ? existing.notes : "") + '</textarea></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">' + (existing ? "Save changes" : "Add bull") + '</button>' +
    '<button type="button" class="btn btn-ghost" onclick="' + (existing ? "ui.editing.bull=null;render();" : "toggleForm('newBull')") + '">Cancel</button></div>' +
  '</form>';
}
function saveBull(e, id){
  e.preventDefault();
  var f = e.target;
  var data = {
    tag: f.tag.value.trim(), name: f.name.value.trim(), animalId: f.animalId.value.trim(),
    breed: f.breed.value.trim(), location: f.location.value.trim(), dob: f.dob.value,
    purchasePrice: f.purchasePrice.value === "" ? null : parseFloat(f.purchasePrice.value),
    notes: f.notes.value.trim()
  };
  if(!data.tag || !data.name) return;
  state.bulls = state.bulls || { items: [] };
  if(id){
    var existing = byId(state.bulls.items, id);
    if(existing) Object.assign(existing, data);
    ui.editing.bull = null;
  } else {
    state.bulls.items.push(Object.assign({ id: uid("bull"), status: "active", testLog: [] }, data));
    ui.openForms.newBull = false;
  }
  persist();
}

function addBullTest(e, id){
  e.preventDefault();
  var f = e.target;
  var year = f.year.value.trim();
  var summary = f.summary.value.trim();
  if(!year || !summary) return;
  var b = byId(bullItems(), id);
  if(!b) return;
  var entry = { id: uid("bt"), year: year, summary: summary };
  var detailFields = {
    breed: f.breed.value.trim(), age: f.age.value.trim(), weight: f.weight.value.trim(),
    bcs: f.bcs.value.trim(), gaitLegs: f.gaitLegs.value.trim(),
    scrotalCircumference: f.scrotalCircumference.value.trim(), testesTone: f.testesTone.value.trim(),
    sheath: f.sheath.value.trim(), penisPrepuce: f.penisPrepuce.value.trim(),
    semenColour: f.semenColour.value.trim(), mass: f.mass.value.trim(),
    motility: f.motilityPct.value !== "" ? parseFloat(f.motilityPct.value) / 100 : null,
    morphSampleNo: f.morphSampleNo.value.trim(),
    normalMorphology: f.normalMorphologyPct.value !== "" ? parseFloat(f.normalMorphologyPct.value) / 100 : null,
    comments: f.comments.value.trim()
  };
  var hasDetail = Object.keys(detailFields).some(function(k){ var v = detailFields[k]; return v !== "" && v != null; });
  if(hasDetail) entry.detail = detailFields;
  b.testLog = b.testLog || [];
  b.testLog.unshift(entry);
  ui.openForms["btest_" + id] = false;
  persist();
}

// PDF attachments (registration papers, BBSE certificates, sale documents,
// etc.) live in a separate "bulls" Supabase Storage bucket -- see
// supabase-storage-setup-bulls.sql, a one-time SQL step alongside the
// existing "maps" bucket setup. Same upload pattern as Maps' PDF support
// (addMap): uploaded as-is (no compression -- that's only for photos),
// stored publicly, and the bull just keeps the public URL + storage path.
function renderBullAttachmentForm(b){
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="addBullAttachment(event,\'' + b.id + '\')">' +
    '<h4 style="margin-top:0;">Attach a PDF — ' + esc(b.name) + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Label</label><input type="text" name="label" placeholder="e.g. Registration papers, BBSE certificate" /></div>' +
      '<div class="field"><label>PDF file</label><input type="file" name="pdf" accept="application/pdf,.pdf" required /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Upload</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'battach_' + b.id + '\')">Cancel</button></div>' +
  '</form>';
}
async function addBullAttachment(e, id){
  e.preventDefault();
  var f = e.target;
  var label = f.label.value.trim();
  var file = f.pdf.files && f.pdf.files[0];
  if(!file) return;
  var b = byId(bullItems(), id);
  if(!b) return;
  if(!supabaseClient){
    setNotice("err", "Can't upload a PDF right now (not connected to the database). Text and other changes still work offline, but file uploads need a connection at the moment you add them — try again once you're back online.");
    render();
    return;
  }
  var submitBtn = f.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
  try{
    var path = uid("battach") + ".pdf";
    var upRes = await supabaseClient.storage.from("bulls").upload(path, file, { cacheControl: "3600", upsert: false, contentType: "application/pdf" });
    if(upRes.error) throw upRes.error;
    var pub = supabaseClient.storage.from("bulls").getPublicUrl(path);
    b.attachments = b.attachments || [];
    b.attachments.push({ id: uid("battach"), name: label || file.name || "PDF", url: pub.data.publicUrl, storagePath: path });
    ui.openForms["battach_" + id] = false;
    persist();
  }catch(err){
    console.error("[Bullamon Plains] bull PDF upload failed:", err);
    setNotice("err", "Couldn't upload that PDF (" + (err && err.message ? err.message : "unknown error") + "). If you're offline or have a weak signal, try again once you're back in range.");
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Upload"; }
    render();
  }
}
function removeBullAttachment(bullId, attachmentId){
  var b = byId(bullItems(), bullId);
  if(!b) return;
  var att = (b.attachments || []).find(function(a){ return a.id === attachmentId; });
  if(att && att.storagePath && supabaseClient){
    supabaseClient.storage.from("bulls").remove([att.storagePath]).catch(function(err){
      console.error("[Bullamon Plains] couldn't delete the stored bull PDF (it will be left orphaned in storage, but this doesn't affect the app):", err);
    });
  }
  removeById(b.attachments, attachmentId);
  persist();
}

// Per-bull note log -- separate from the bull's own single free-text
// "notes" field (b.notes, edited via the bull's own Edit form; used for
// flagged data-quality notes on the imported spreadsheet data). This is a
// running log any signed-in staff member can add to -- e.g. day-to-day
// observations about a specific bull -- each entry keeping its own date,
// who wrote it, and the note text, at Maria's request ("Need to be able to
// click on a Bull and it opens a note section with the date, who wrote the
// note and the note itself"). Opened by clicking the bull's own name in the
// table (styled + cursor:pointer to read as clickable), which toggles this
// panel open in "extras" below the table, the same as Edit/+Test/+Attach
// PDF/Archive.
function renderBullNotesPanel(b){
  var notes = (b.noteLog || []).slice().sort(byDateDesc("date"));
  var u = currentUser();
  return '<div class="card" style="margin:0;">' +
    '<div class="card-row"><h4 style="margin:0;">Notes — ' + esc(b.name) + '</h4>' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'bnotes_' + b.id + '\')">Close</button>' +
    '</div>' +
    renderBullNoteForm(b) +
    (notes.length === 0 ? '<div class="empty-state">No notes yet for ' + esc(b.name) + '.</div>' : notes.map(function(n){
      var canDelete = isAdmin() || (u && n.author === u.name);
      return '<div style="padding:10px 0;border-top:1px solid var(--border);">' +
        '<div class="card-row" style="margin-bottom:4px;"><span class="row-muted" style="font-size:12px;">' + fmtDate(n.date) + ' &middot; ' + esc(n.author) + '</span>' +

function renderSops(){
  var q = ui.sopQuery.trim().toLowerCase();
  var list = state.sops || [];
  if(q) list = list.filter(function(s){
    return (s.machine + " " + s.title + " " + (s.category||"") + " " + (s.heading||"")).toLowerCase().indexOf(q) > -1;
  });

  var html = pageHead("Standard Operating Procedures", "Pre-start checks and safe operating steps for farm machinery.");
  html += '<div class="toolbar">' +
    '<input id="sop-search-input" class="search-input" type="text" placeholder="Search SOPs…" value="' + escAttr(ui.sopQuery) + '" oninput="ui.sopQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newSop\')">' + (ui.openForms.newSop ? "Cancel" : "+ Add SOP") + '</button>' : '') +
  '</div>';
  html += sopHeadingOptionsList();
  if(ui.openForms.newSop) html += renderSopForm();
  if(list.length === 0){ html += '<div class="empty-state">No SOPs match your search.</div>'; return html; }

  // SOPs that share the same "Heading" (set on each SOP's own form) are
  // linked together and displayed as one group under that shared heading --
  // e.g. "Pre-start check", "Shutdown procedure" and "Emergency stop" for the
  // same machine (or topic) can all be given the heading "Tractors" so they
  // read as one connected set instead of scattered separate cards further
  // down an alphabetised or otherwise unrelated list. An SOP left with no
  // heading still displays entirely on its own, exactly as before -- nothing
  // about existing SOPs needs to change unless Maria wants to link them up.
  var groups = [];
  var groupIndex = {};
  var ungrouped = [];
  list.forEach(function(s){
    var h = (s.heading || "").trim();
    if(!h){ ungrouped.push(s); return; }
    if(!(h in groupIndex)){ groupIndex[h] = groups.length; groups.push({ heading: h, items: [] }); }
    groups[groupIndex[h]].items.push(s);
  });
  groups.sort(function(a,b){ return a.heading.localeCompare(b.heading); });

  html += groups.map(renderSopGroup).join("");
  html += ungrouped.map(renderSopCard).join("");
  return html;
}
function sopHeadingOptionsList(){
  var heads = Array.from(new Set((state.sops || []).map(function(s){ return (s.heading || "").trim(); }).filter(Boolean))).sort(function(a,b){ return a.localeCompare(b); });
  return '<datalist id="sop-heading-options">' + heads.map(function(h){ return '<option value="' + escAttr(h) + '"></option>'; }).join("") + '</datalist>';
}
// A linked group is rendered as one card with a shared heading, containing

  // (pageHead) is already an <h2>, so this stays a level below it instead of

  return '<div class="card">' +
    '<h3 class="sop-group-heading">' + esc(group.heading) + '</h3>' +
    group.items.map(renderSopSectionBody).join('<hr style="border:none;border-top:1px solid var(--border);margin:16px 0;" />') +
  '</div>';
}

// Same storage/compression pattern as Maps' photo upload (compressMapPhoto,
// below in this file -- function declarations are hoisted so the order
// doesn't matter) and Bulls' PDF attachments, just against its own "sop-photos"
// bucket so a step's reference photos (e.g. "guard should look like this",
// "correct hose routing") live alongside that SOP rather than in Maps.
async function addSopPhoto(e, sopId){
  e.preventDefault();
  var f = e.target;
  var formKey = "sopPhoto_" + sopId;
  var file = f.photo && f.photo.files && f.photo.files[0];
  if(!file){
    ui.formErrors[formKey] = "Choose a photo first.";
    render();
    return;
  }
  if(!supabaseClient){
    ui.formErrors[formKey] = "Can't upload a photo right now (not connected to the database). Try again once you're back online.";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var submitBtn = f.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
  try{
    var uploadBlob = await compressMapPhoto(file);
    var path = uid("sopphoto") + ".jpg";
    var upRes = await supabaseClient.storage.from("sop-photos").upload(path, uploadBlob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
    if(upRes.error) throw upRes.error;
    var pub = supabaseClient.storage.from("sop-photos").getPublicUrl(path);
    var s = byId(state.sops, sopId);
    if(!s){ render(); return; }
    s.photos = s.photos || [];
    s.photos.push({ id: uid("p"), url: pub.data.publicUrl, storagePath: path });
    ui.openForms[formKey] = false;
    persist();
  }catch(err){
    console.error("[Bullamon Plains] SOP photo upload failed:", err);
    ui.formErrors[formKey] = "Couldn't upload that photo (" + (err && err.message ? err.message : "unknown error") + "). If you're offline or have a weak signal, try again once you're back in range.";
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Upload"; }
    render();
  }
}
function removeSopPhoto(sopId, photoId){
  var s = byId(state.sops, sopId);
  if(!s) return;
  var photo = (s.photos || []).find(function(p){ return p.id === photoId; });
  if(!confirm("Remove this photo? This cannot be undone.")) return;
  if(photo && photo.storagePath && supabaseClient){
    supabaseClient.storage.from("sop-photos").remove([photo.storagePath]).catch(function(err){
      console.error("[Bullamon Plains] couldn't delete the stored SOP photo (it will be left orphaned in storage, but this doesn't affect the app):", err);
    });
  }
  removeById(s.photos, photoId);
  persist();
}

function renderSds(){

  // content (hazard class, signal word, first aid) has been added yet.

  // rendering nothing.

    return !c.hazardClass && !c.signalWord && !c.firstAid;
  }

      (c.chemicalType||"")

  });

    '</div>';
  if(ui.openForms.newSds) html += renderSdsForm();
  if(sdsList.length === 0){
    html += '<div class="empty-state">No safety data sheets match your search.' +

        (needsDetails ? '<span class="pill" style="background:#fee2e2;color:#991b1b;white-space:normal;text-align:left;">⚠ Needs SDS details</span>' : '<span class="pill pill-medium" style="white-space:normal;text-align:left;">' + esc(c.signalWord) + '</span>') +
        (isAdmin() ? '<button type="button" class="subtle-btn" onclick="ui.editing.sds=\'' + c.id + '\';render();">Edit</button>' : '') +
        (isAdmin() ? '<button type="button" class="subtle-btn" style="color:var(--danger);" onclick="if(confirm(\'Remove this chemical from the SDS list? This cannot be undone.\')){removeSds(\'' + c.id + '\')}">Remove</button>' : '') +

      (c.activeConstituent || c.hazardClass ? '<p class="row-muted" style="margin:0 0 6px;font-size:12.5px;">' + esc(c.activeConstituent) + (c.activeConstituent && c.hazardClass ? ' &middot; ' : '') + esc(c.hazardClass) + '</p>' : '') +
      (c.chemicalType ? '<p class="row-muted" style="margin:0 0 6px;font-size:12.5px;">' + esc(c.chemicalType) + '</p>' : '') +
      (c.storageRequirements ? '<p style="margin:8px 0 0;font-size:12.5px;"><strong>Storage:</strong> ' + esc(c.storageRequirements) + '</p>' : '') +
      (c.firstAid ? '<p style="margin:4px 0 0;font-size:12.5px;"><strong>First aid:</strong> ' + esc(c.firstAid) + '</p>' : '') +

  }).join("");

function saveSds(e, id){
  e.preventDefault();
