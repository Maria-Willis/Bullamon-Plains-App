<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bullamon Plains</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="./icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="./icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Bullamon Plains" />
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg: #f1ede1;
    --surface: #fffdf8;
    --surface-2: #e5e7d8;
    --sidebar: #152c1c;
    --sidebar-text: #eef4e9;
    --sidebar-text-dim: #b9d0b3;
    --text: #212a1c;
    --text-muted: #656e58;
    --border: #d9dcc6;
    --accent: #2f6b34;
    --accent-strong: #235327;
    --accent-contrast: #f4fbf1;
    --olive: #b5791e;
    --olive-contrast: #2c1c04;
    --status-todo: #8a8375;
    --status-progress: #3a6ea5;
    --status-done: #3f7d4a;
    --pri-high: #a33b2c;
    --pri-medium: #b5791e;
    --pri-low: #5c6b46;
    --danger: #a33b2c;
    --danger-contrast: #fff5f2;
    --focus: #3a6ea5;
    --shadow: 0 1px 2px rgba(15,30,15,.06), 0 6px 20px -8px rgba(15,30,15,.18);
  }
  /* Always use the off-white/cream palette above -- the app used to
     switch to a dark green theme automatically when a phone's system
     dark mode was on, which read as "the background is green" on
     mobile. That auto-switch has been removed so the background stays
     consistent for everyone regardless of phone settings. */
  html{ color-scheme: light; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-weight:700;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  table{font-variant-numeric:tabular-nums;}
  a{color:var(--accent-strong);}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-contrast);}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  /* ---------- sign-in ---------- */
  #signin-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .signin-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:32px 28px 28px;
  }
  .signin-eyebrow{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--accent-strong);
    font-weight:600;
    margin:0 0 4px;
  }
  .signin-card h1{
    margin:0 0 4px;
    font-size:24px;
  }
  .signin-sub{
    color:var(--text-muted);
    margin:0 0 22px;
    font-size:13px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  select, input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="url"], input[type="tel"], textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
  }
  input.no-spinner{-moz-appearance:textfield;}
  input.no-spinner::-webkit-outer-spin-button, input.no-spinner::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  select:focus, input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:70px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid transparent;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:var(--surface-2);
    color:var(--text);
  }
  .btn:hover{filter:brightness(1.04);}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-contrast);
    width:100%;
  }
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
  }
  .btn-olive{background:var(--olive);color:var(--olive-contrast);}
  .btn-danger{background:var(--danger);color:var(--danger-contrast);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .signin-error{
    background:var(--danger-contrast);
    color:var(--danger);
    border:1px solid var(--danger);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    margin-bottom:14px;
  }
  .signin-foot{
    margin-top:18px;
    font-size:11.5px;
    color:var(--text-muted);
    text-align:center;
  }

  /* ---------- app shell ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;
    flex:0 0 236px;
    background:var(--sidebar);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{padding:4px 8px 18px;}
  .brand-name{
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--sidebar-text);
    margin:0;
  }
  .brand-tag{
    font-size:11px;
    font-weight:600;
    color:var(--sidebar-text-dim);
    margin:3px 0 0;
    text-transform:uppercase;
    letter-spacing:.07em;
  }
  .refresh-btn{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:7px;
    border:1px solid rgba(255,255,255,.18);
    background:transparent;
    color:var(--sidebar-text-dim);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .refresh-btn:hover{color:var(--sidebar-text);border-color:rgba(255,255,255,.34);}
  .refresh-btn:disabled{opacity:.5;cursor:default;}
  .nav-group{margin-bottom:4px;}
  .nav-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    padding:9px 10px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--sidebar-text-dim);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:2px;
  }
  .nav-btn .ico{font-size:15px;width:18px;text-align:center;}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:var(--sidebar-text);}
  .nav-btn.active{background:var(--accent);color:var(--accent-contrast);}
  .nav-badge{
    margin-left:auto;
    background:rgba(255,255,255,.14);
    color:var(--sidebar-text);
    font-size:10.5px;
    font-weight:700;
    padding:1px 6px;
    border-radius:99px;
  }
  .nav-btn.active .nav-badge{background:rgba(0,0,0,.18);color:var(--accent-contrast);}
  .sidebar-spacer{flex:1;}
  .whoami{
    border-top:1px solid rgba(255,255,255,.1);
    padding-top:12px;
    margin-top:10px;
  }
  .whoami-name{font-weight:600;color:var(--sidebar-text);font-size:13.5px;}
  .whoami-role{font-size:11.5px;font-weight:600;color:var(--sidebar-text-dim);margin:1px 0 10px;}
  .signout-btn{
    width:100%;
    background:transparent;
    border:1px solid rgba(255,255,255,.18);
    color:var(--sidebar-text-dim);
    padding:7px 10px;
    border-radius:7px;
    font-size:12px;
    cursor:pointer;
  }
  .signout-btn:hover{color:var(--sidebar-text);border-color:rgba(255,255,255,.34);}

  main{flex:1;min-width:0;padding:30px 36px 60px;}
  .page-head{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head h2{margin:0;font-size:23px;}
  .page-desc{color:var(--text-muted);font-size:13px;margin:4px 0 0;max-width:60ch;}

  .banner{
    border-radius:10px;
    padding:10px 14px;
    font-size:12.5px;
    margin-bottom:18px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
  }
  .banner.warn{border-color:var(--pri-medium);color:var(--pri-medium);background:var(--surface);}
  .banner.err{border-color:var(--danger);color:var(--danger);background:var(--danger-contrast);}
  .banner.ok{border-color:var(--accent);color:var(--accent-strong);background:var(--surface);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 10px;font-size:15.5px;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-num{font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;font-size:26px;font-weight:700;line-height:1;}
  .stat-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 9px;
    border-radius:99px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;}
  .pill-todo{background:color-mix(in srgb, var(--status-todo) 16%, transparent);color:var(--status-todo);}
  .pill-progress{background:color-mix(in srgb, var(--status-progress) 16%, transparent);color:var(--status-progress);}
  .pill-done{background:color-mix(in srgb, var(--status-done) 16%, transparent);color:var(--status-done);}
  .pill-high{background:color-mix(in srgb, var(--pri-high) 16%, transparent);color:var(--pri-high);}
  .pill-medium{background:color-mix(in srgb, var(--pri-medium) 16%, transparent);color:var(--pri-medium);}
  .pill-low{background:color-mix(in srgb, var(--pri-low) 16%, transparent);color:var(--pri-low);}
  .pill-open{background:color-mix(in srgb, var(--danger) 16%, transparent);color:var(--danger);}
  .pill-closed{background:color-mix(in srgb, var(--status-done) 16%, transparent);color:var(--status-done);}
  .pill-admin{background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent-strong);}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:var(--surface-2);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.num{font-variant-numeric:tabular-nums;}
  .row-muted{color:var(--text-muted);}

  .list-cards{display:flex;flex-direction:column;gap:12px;}
  .job-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--status-todo);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .job-card[data-status="In progress"]{border-left-color:var(--status-progress);}
  .job-card[data-status="Done"]{border-left-color:var(--status-done);opacity:.75;}
  .job-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .job-title{font-weight:600;font-size:14.5px;margin:0 0 3px;}
  .job-meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .job-notes{margin-top:8px;font-size:12.5px;color:var(--text-muted);border-top:1px dashed var(--border);padding-top:8px;}
  .job-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar select, .toolbar input{width:auto;min-width:140px;}
  .search-input{flex:1;min-width:180px;}

  .area-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;}
  .area-tab{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-muted);
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .area-tab:hover{border-color:var(--accent);color:var(--text);}
  .area-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
  .area-tab .count{
    font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;
    background:var(--surface-2);color:var(--text-muted);
  }
  .area-tab.active .count{background:rgba(0,0,0,.16);color:var(--accent-contrast);}

  .form-panel{
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .form-panel h4{margin:0 0 12px;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .form-grid .field{margin-bottom:0;}
  /* "1 / -1" (first grid line to last) rather than a literal "span 2":
     on a narrow phone (or a form squeezed into a narrow side-by-side
     layout) the grid above collapses to a single auto-fit column, and a
     hard-coded "span 2" would force a second column into existence that
     isn't there, pushing the whole page wider than the screen. Spanning
     to the last line always means "full width of however many columns
     currently exist", so it never overflows. */
  .form-grid .field.span-2{grid-column:1 / -1;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .checkbox-row input{width:auto;}

  .subtle-btn{
    background:transparent;
    border:none;
    color:var(--accent-strong);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .subtle-btn:hover{text-decoration:underline;}

  .empty-state{
    text-align:center;
    padding:36px 20px;
    color:var(--text-muted);
    font-size:13px;
    border:1px dashed var(--border);
    border-radius:12px;
    background:var(--surface);
  }

  .steps-list{margin:8px 0 0;padding-left:20px;font-size:13px;}
  .steps-list li{margin-bottom:4px;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
  @media (max-width: 900px){
    .two-col{grid-template-columns:1fr;}
    #app-shell{flex-direction:column;}
    .sidebar{position:relative;width:100%;flex:none;height:auto;}
  }

  .team-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:10px;}
  .avatar{
    width:34px;height:34px;border-radius:99px;background:var(--accent);color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;
  }
  .team-name-row{display:flex;align-items:center;gap:10px;}
  .team-flags{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}

  code.access-code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-size:12px;}

  @media (prefers-reduced-motion: no-preference){
    .job-card, .card, .stat{transition:box-shadow .15s ease;}
  }
</style>
</head>

<div id="app"></div>

<script>
"use strict";

/* ======================================================================
   UTILITIES
   ====================================================================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escAttr(s){ return esc(s); }
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" });
}
function fmtMoney(n){
  if(n == null || n === "") return "—";
  return "$" + Number(n).toLocaleString("en-AU", { maximumFractionDigits: 2 });
}
function fmtNum(n, unit){
  if(n == null || n === "") return "—";
  var s = Number(n).toLocaleString("en-AU", { maximumFractionDigits: 2 });
  return unit ? (s + " " + unit) : s;
}
function daysUntil(iso){
  if(!iso) return null;
  var target = new Date(iso + "T00:00:00").getTime();
  var now = new Date(todayISO() + "T00:00:00").getTime();
  return Math.round((target - now) / 86400000);
}
function initials(name){
  var parts = String(name || "?").trim().split(/\s+/);
  return ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length-1][0] : "")).toUpperCase();
}
function byId(arr, id){ return (arr || []).find(function(x){ return x.id === id; }); }
function removeById(arr, id){ var i = (arr||[]).findIndex(function(x){ return x.id === id; }); if(i > -1) arr.splice(i,1); }

function pillStatus(status){
  var cls = status === "Done" ? "pill-done" : status === "In progress" ? "pill-progress" : "pill-todo";
  return '<span class="pill ' + cls + '">' + esc(status) + "</span>";
}
function pillPriority(p){
  var cls = p === "High" ? "pill-high" : p === "Low" ? "pill-low" : "pill-medium";
  return '<span class="pill ' + cls + '">' + esc(p) + "</span>";
}
function pillIncident(status){
  return '<span class="pill ' + (status === "Closed" ? "pill-closed" : "pill-open") + '">' + esc(status) + "</span>";
}

function getLocal(key){ try{ return window.localStorage.getItem(key); }catch(e){ return null; } }
function setLocal(key, val){ try{ window.localStorage.setItem(key, val); }catch(e){} }
function removeLocal(key){ try{ window.localStorage.removeItem(key); }catch(e){} }

function deepClone(obj){
  if(window.structuredClone) return window.structuredClone(obj);
  return JSON.parse(JSON.stringify(obj));
}

function fmtDateTime(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleString("en-AU", { day:"numeric", month:"short", year:"numeric", hour:"numeric", minute:"2-digit" });
}

/* ======================================================================
   OFFLINE SUPPORT — a device with no signal at all can still open the app
   (the service worker keeps a cached copy of the app itself) and keep
   working from whatever data it last saw. Edits made while offline are
   queued on this device and sent once a connection comes back. See
   queueOfflineEdit()/attemptOfflineSync() below for the detail.
   ====================================================================== */
var CACHE_STATE_KEY = "bp_cache_state";
var CACHE_VERSION_KEY = "bp_cache_version";
var PENDING_STATE_KEY = "bp_pending_state";
var PENDING_BASE_VERSION_KEY = "bp_pending_base_version";
var PENDING_SINCE_KEY = "bp_pending_since";

function cacheGoodState(){
  setLocal(CACHE_STATE_KEY, JSON.stringify(state));
  setLocal(CACHE_VERSION_KEY, String(stateVersion));
}
function loadCachedGoodState(){
  var raw = getLocal(CACHE_STATE_KEY);
  if(!raw) return null;
  try{
    return { data: JSON.parse(raw), version: parseInt(getLocal(CACHE_VERSION_KEY) || "0", 10) };
  }catch(e){ return null; }
}
function queueOfflineEdit(){
  // Keep the ORIGINAL base version -- the version this device last knew to
  // be current before it went offline -- so a later sync can tell whether
  // anyone else saved in the meantime. Don't reset it on every retry within
  // the same offline session.
  if(!getLocal(PENDING_STATE_KEY)){
    setLocal(PENDING_BASE_VERSION_KEY, String(stateVersion));
    setLocal(PENDING_SINCE_KEY, new Date().toISOString());
  }
  setLocal(PENDING_STATE_KEY, JSON.stringify(state));
}
function hasPendingOfflineEdits(){ return !!getLocal(PENDING_STATE_KEY); }
function clearOfflinePending(){
  removeLocal(PENDING_STATE_KEY);
  removeLocal(PENDING_BASE_VERSION_KEY);
  removeLocal(PENDING_SINCE_KEY);
}
function isOfflineError(err){
  if(!navigator.onLine) return true;
  if(!err) return false;
  // Real Postgrest/Postgres errors carry a `.code`; a raw network failure
  // (fetch throwing, DNS failure, no signal) generally doesn't.
  return !err.code;
}

// Restoring is the escape hatch for "something has gone badly wrong" -- it
// completely replaces the live shared data with whatever's in the uploaded
// backup file, for every signed-in user on every device, not just this one.
// Handled far more cautiously than the app's usual destructive actions
// (a plain confirm()) given how wide the blast radius is: this shows a
// summary of what's actually in the file plus a type-to-confirm step
// before touching anything.
function handleRestoreFileSelected(event){
  var input = event.target;
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    input.value = ""; // so selecting the same file again still fires onchange
    var parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      alert("That file isn't valid JSON, so it can't be restored (" + err.message + "). Make sure you're selecting a backup file that was downloaded from this app's \"Download data backup\" button.");
      return;
    }
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed) ||
       !Array.isArray(parsed.jobs) || !Array.isArray(parsed.team) || !Array.isArray(parsed.machinery) ||
       !parsed.chemicals || typeof parsed.chemicals !== "object"){
      alert("That file doesn't look like a Bullamon Plains backup -- it's missing the jobs/team/machinery/chemicals data this app expects. Nothing was changed.");
      return;
    }
    var summary = "This file contains:\n" +
      "  " + parsed.jobs.length + " jobs\n" +
      "  " + parsed.machinery.length + " machines\n" +
      "  " + ((parsed.chemicals.register || []).length) + " chemical register entries, " + ((parsed.chemicals.sds || []).length) + " safety data sheets\n" +
      "  " + parsed.team.length + " staff\n" +
      (parsed.meta && parsed.meta.lastBackupAt ? "\nThis backup was downloaded on: " + parsed.meta.lastBackupAt + "\n" : "\n") +
      "\nRestoring will COMPLETELY REPLACE everything currently in the app -- for every signed-in user, on every device -- with what's in this file. Anything added or changed since this backup was taken will be permanently lost. This cannot be undone.\n\n" +
      "Type RESTORE (all capitals) below to go ahead, or press Cancel to back out without changing anything.";
    var typed = prompt(summary);
    if(typed === null) return; // cancelled
    if(typed !== "RESTORE"){
      alert("Restore cancelled -- you didn't type RESTORE exactly, so nothing was changed.");
      return;
    }
    restoreFromBackup(parsed);
  };
  reader.onerror = function(){
    alert("Couldn't read that file -- please try selecting it again.");
  };
  reader.readAsText(file);
}
async function restoreFromBackup(backupData){
  if(isOffline || (typeof navigator !== "undefined" && "onLine" in navigator && !navigator.onLine)){
    setNotice("warn", "Restoring needs an internet connection -- you're currently offline, so nothing was changed. Try again once you're back in range.");
    return;
  }
  if(!supabaseClient){
    setNotice("err", "This app isn't connected to its database right now, so a restore can't be saved. Nothing was changed.");
    return;
  }
  var btn = document.getElementById("restoreBackupBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Restoring…"; }
  try{
    // Deliberately does NOT go through the normal persist()/doPersist()
    // optimistic-concurrency path -- a restore is meant to force-overwrite
    // whatever's live right now, not get silently discarded (and replaced
    // with someone else's version) the way an ordinary edit would be if it
    // lost a version race. Reads the current version fresh here (rather
    // than trusting the possibly-stale in-memory stateVersion) so this
    // always writes as the very next version no matter what.
    var cur = await supabaseClient.from("app_state").select("version").eq("id", "main").maybeSingle();
    if(cur.error) throw cur.error;
    if(cur.data){
      var nextVersion = (cur.data.version || 0) + 1;
      var res = await supabaseClient.from("app_state")
        .update({ data: backupData, version: nextVersion, updated_at: new Date().toISOString() })
        .eq("id", "main")
        .select("version");
      if(res.error) throw res.error;
    } else {
      // No row at all yet (a brand-new, never-saved project) -- create it
      // straight from the backup instead of updating a row that isn't there.
      var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: backupData, version: 1 }).select("version").single();
      if(insertRes.error) throw insertRes.error;
    }
    // A full reload (rather than swapping `state` in place) runs the
    // restored data back through boot()'s one-time migrations -- so an
    // older backup still ends up with every field today's app expects --
    // and clears out any stale UI state (open forms, "currently editing"
    // pointers) that might reference something the backup doesn't have.
    location.href = location.pathname + "?restored=" + Date.now();
  }catch(err){
    console.error("[Bullamon Plains] restore from backup failed:", err);
    if(btn){ btn.disabled = false; btn.innerHTML = "&#8593; Restore from backup"; }
    setNotice("err", "Couldn't restore that backup (" + (err && err.message ? err.message : "unknown error") + "). Nothing was changed -- check your connection and try again.");
  }
}

function findTeam(name){ return (state.team || []).find(function(t){ return t.name === name; }); }
function currentUser(){ return session.name ? findTeam(session.name) : null; }

/* ======================================================================
   SUPABASE — the shared database backing this app. See config.js for the
   project URL and public (anon) key, and supabase-schema.sql for the
   table + realtime setup this code expects.
   ====================================================================== */
var supabaseClient = (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;
var stateVersion = 0;      // optimistic-concurrency counter, mirrors the row in Supabase
var isNewRow = false;      // true until the very first row is written to Supabase

var realtimeSubscribed = false;
function subscribeRealtime(){
  if(!supabaseClient || realtimeSubscribed) return;
  realtimeSubscribed = true;
  supabaseClient
    .channel("app_state_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "app_state", filter: "id=eq.main" }, function(payload){
      // While this device has unsynced offline edits queued, let
      // attemptOfflineSync() own reconciling them instead of silently
      // overwriting local (possibly still-unsaved) work here.
      if(hasPendingOfflineEdits()) return;
      var row = payload.new;
      if(!row || typeof row.version !== "number") return;
      // Only adopt a version newer than what we already have -- this also
      // quietly ignores the echo of our own just-completed write.
      if(row.version > stateVersion){
        state = row.data;
        stateVersion = row.version;
        isOffline = false;
        cacheGoodState();
        render();
      }
    })
    .subscribe();
}

   BOOT
   ====================================================================== */
async function boot(){
  if(!supabaseClient){
    if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
      console.error("[Bullamon Plains] Supabase isn't configured -- check config.js has SUPABASE_URL and SUPABASE_ANON_KEY set.");
      state = deepClone(DEFAULT_STATE);
      booted = true;
      setNotice("err", "This app isn't connected to its database yet (config.js is missing the Supabase URL/key). Changes won't be saved.");
      return;
    }
    // config.js is filled in correctly, but the Supabase library itself
    // never loaded -- almost certainly no internet, and this device hasn't
    // cached it from an earlier visit yet. Treat exactly like a failed
    // network fetch below.
    isOffline = true;
    return bootOffline();
  }
  var migrated = false;
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").maybeSingle();
    if(res.error) throw res.error;
    if(res.data){
      state = res.data.data;
      stateVersion = res.data.version;
    } else {
      // Nothing in the table yet -- brand new project. Seed it with the
      // built-in defaults; the first persist() below writes the real row.
      state = deepClone(DEFAULT_STATE);
      isNewRow = true;
      migrated = true;
    }
    isOffline = false;
  }catch(e){
    console.error("[Bullamon Plains] could not load data from Supabase:", e);
    if(isOfflineError(e)){
      isOffline = true;
      return bootOffline();
    }
    state = deepClone(DEFAULT_STATE);
    booted = true;
    setNotice("err", "Couldn't load data from the database (" + (e && e.message ? e.message : "unknown error") + "). Changes won't be saved until this is fixed.");
    return;
  }
  if(session.name && !(findTeam(session.name) && findTeam(session.name).active)){
    session.name = null;
    removeLocal("bp_signed_in_name");
  }
  // one-time migration: jobs saved before the Irrigation/Dryland/Livestock/General
  // split get a sensible default area so nothing disappears from view.
  (state.jobs || []).forEach(function(j){
    if(!j.area){
      j.area = (j.category === "Irrigation") ? "Irrigation" : "General";

  // one-time migration: machines saved before issue reporting existed get an
  // empty issues list so the new section has something to render into.
  (state.machinery || []).forEach(function(m){
    if(!m.issues){
      m.issues = [];
      migrated = true;
    }
    if(m.scheduleStartHours === undefined){
      m.scheduleStartHours = null;
      migrated = true;
    }

  // one-time migration: chemical register entries saved before usage logging

function bootOffline(){
  // No usable connection right at startup (or the Supabase library never
  // loaded). Use whatever this device already has, most-current first:
  // unsynced offline edits from last time, then the last good copy it
  // cached, then -- only if this device has genuinely never loaded the app
  // before -- nothing.
  var pendingRaw = getLocal(PENDING_STATE_KEY);
  if(pendingRaw){
    try{
      state = JSON.parse(pendingRaw);
      stateVersion = parseInt(getLocal(PENDING_BASE_VERSION_KEY) || "0", 10);
      isNewRow = false;
      booted = true;
      render();
      return;
    }catch(e){ /* fall through to the cached copy below */ }
  }
  var cached = loadCachedGoodState();
  if(cached){
    state = cached.data;
    stateVersion = cached.version;
    isNewRow = false;
    booted = true;
    render();
    return;
  }
  state = deepClone(DEFAULT_STATE);
  booted = true;
  setNotice("err", "No internet connection, and this device hasn't loaded Bullamon Plains before, so there's no offline copy to show yet. Connect once to download the data — after that it'll keep working here even without a connection.");
  render();
}

async function attemptOfflineSync(){
  if(syncingOffline || !hasPendingOfflineEdits() || !supabaseClient) return;
  syncingOffline = true;
  var pendingState, pendingBaseVersion;
  try{
    pendingState = JSON.parse(getLocal(PENDING_STATE_KEY));
    pendingBaseVersion = parseInt(getLocal(PENDING_BASE_VERSION_KEY) || "-1", 10);
  }catch(e){
    clearOfflinePending();
    syncingOffline = false;
    return;
  }
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").maybeSingle();
    if(res.error) throw res.error;
    var serverVersion = res.data ? res.data.version : 0;
    var succeeded = false;
    var newVersion = null;

    if(!res.data || serverVersion === pendingBaseVersion){
      // Nobody else saved while this device was offline -- push the
      // offline edits straight through.
      if(!res.data){
        var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: pendingState, version: 1 }).select("version").single();
        if(insertRes.error && insertRes.error.code !== "23505") throw insertRes.error;
        if(!insertRes.error){ succeeded = true; newVersion = insertRes.data.version; }
      } else {
        var nextVersion = serverVersion + 1;
        var updateRes = await supabaseClient.from("app_state")
          .update({ data: pendingState, version: nextVersion, updated_at: new Date().toISOString() })
          .eq("id", "main").eq("version", serverVersion)
          .select("version");
        if(updateRes.error) throw updateRes.error;
        if(updateRes.data && updateRes.data.length > 0){ succeeded = true; newVersion = nextVersion; }
      }
    }

    if(succeeded){
      state = pendingState;
      stateVersion = newVersion;
      isNewRow = false;
      isOffline = false;
      clearOfflinePending();
      cacheGoodState();
      subscribeRealtime();
      setNotice("ok", "You're back online — your offline changes have been saved.");
      render();
    } else {
      // Someone else's changes are already in the row this device based its
      // offline edits on (or squeezed in between our read and write just
      // now). Don't guess how to combine two different sets of changes --
      // adopt the team's saved copy so this device isn't stuck out of date,
      // and keep the offline edits recoverable instead of discarding them.
      var latest = await supabaseClient.from("app_state").select("data,version").eq("id", "main").single();
      if(!latest.error && latest.data){
        offlineConflict = { state: pendingState, since: getLocal(PENDING_SINCE_KEY) };
        state = latest.data.data;
        stateVersion = latest.data.version;
        isNewRow = false;
        isOffline = false;
        clearOfflinePending();
        cacheGoodState();
        subscribeRealtime();
        render();
      }
    }
  }catch(e){
    console.error("[Bullamon Plains] offline sync attempt failed, will retry later:", e);
    // Still offline, or a transient error -- leave the queue in place and
    // try again on the next 'online' event or app load.
  }
  syncingOffline = false;
}

window.addEventListener("online", function(){
  isOffline = false;
  render();
  if(hasPendingOfflineEdits()) attemptOfflineSync();
});
window.addEventListener("offline", function(){
  isOffline = true;
  render();
});

/* ======================================================================
   PERSISTENCE — every mutating action calls this after updating `state`
   ====================================================================== */
var saveQueue = Promise.resolve();
function persist(){
  render(); // optimistic local update, immediately
  saveQueue = saveQueue.then(doPersist);
  return saveQueue;
}

async function doPersist(){
  if(!supabaseClient){
    if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
      setNotice("err", "This app isn't connected to its database (config.js is missing the Supabase URL/key). This change is only visible to you.");
      return;
    }
    // Configured correctly, just no connection right now (or the library
    // hasn't loaded on this device yet) -- queue exactly like a network
    // failure below rather than treating it as a permanent error.
    isOffline = true;
    queueOfflineEdit();
    render();
    return;
  }
  try{
    if(isNewRow){
      var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: state, version: 1 }).select("version").single();
      if(insertRes.error){
        // Someone else's first write beat ours -- adopt theirs instead of
        // erroring, since the row now genuinely exists.
        if(insertRes.error.code === "23505"){
          return adoptLatestAfterConflict();
        }
        throw insertRes.error;
      }
      isNewRow = false;
      stateVersion = insertRes.data.version;
    } else {
      var nextVersion = stateVersion + 1;
      var updateRes = await supabaseClient.from("app_state")
        .update({ data: state, version: nextVersion, updated_at: new Date().toISOString() })
        .eq("id", "main").eq("version", stateVersion)
        .select("version");
      if(updateRes.error) throw updateRes.error;
      if(!updateRes.data || updateRes.data.length === 0){
        // version didn't match -- someone else saved in between.
        return adoptLatestAfterConflict();
      }
      stateVersion = nextVersion;
    }
    writable = true; writeChecked = true;
    isOffline = false;
    clearOfflinePending();
    cacheGoodState();
    if(notice) setNotice(null);
  }catch(err){
    console.error("[Bullamon Plains] Supabase save failed:", err);
    var code = err && err.code;
    var message = err && err.message;
    writeChecked = true;
    if(code === "42501" || code === "PGRST301"){
      // Postgres/PostgREST permission-denied codes -- the anon key can't
      // write under the current row-level-security policies.
      writable = false;
      setNotice("view-only", "This browser can't save changes to the database right now (permission denied). (code: " + code + ")");
    } else if(isOfflineError(err)){
      isOffline = true;
      queueOfflineEdit();
    } else {
      setNotice("err", "Couldn't save that change (" + (message || "unknown error") + "). It's only visible to you until it's retried." + (code ? " (code: " + code + ")" : ""));
    }
    render();
  }
}

async function adoptLatestAfterConflict(){
  setNotice("conflict", "Someone else just saved a change — refreshing with the latest.");
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").single();
    if(!res.error && res.data){
      state = res.data.data;
      stateVersion = res.data.version;
      isNewRow = false;
      isOffline = false;
      cacheGoodState();
    }
  }catch(e){ console.error("[Bullamon Plains] could not refresh after conflict:", e); }
  setTimeout(function(){ if(notice && notice.kind === "conflict") setNotice(null); render(); }, 1200);
}

function setNotice(kind, msg){ notice = kind ? { kind: kind, msg: msg } : null; render(); }
function dismissNotice(){ notice = null; render(); }
function retrySave(){
  if(notice) setNotice(null);
  persist();
}

/* ======================================================================
   RENDER — top level dispatch
   ====================================================================== */
function render(){
  var app = document.getElementById("app");
  if(!app) return;
  if(!booted){
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;">Loading Bullamon Plains…</div>';
    return;
  }
  if(!isSignedIn()){
    app.innerHTML = renderSignIn();
    attachSignInHandlers();
    return;
  }
  // A live search box calls render() on every keystroke (so results update
  // as you type), and render() rebuilds the whole page's HTML from scratch.
  // Left alone, that destroys and recreates the input mid-keystroke, kicking
  // focus out after the very first letter typed -- so remember which field
  // (by its id) was focused and where the cursor was, and restore both once
  // the new HTML is in place.
  var active = document.activeElement;
  var focusId = null, selStart = null, selEnd = null;
  if(active && active.id && app.contains(active) && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")){
    focusId = active.id;
    if(typeof active.selectionStart === "number"){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  app.innerHTML = renderShell();
  if(focusId){
    var el = document.getElementById(focusId);
    if(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

var signinError = "";
var signinSelectedName = "";     // remembered across a failed attempt, so the name isn't lost

function renderSignIn(){
  var options = activeTeam().map(function(t){
    return '<option value="' + escAttr(t.name) + '"' + (t.name === signinSelectedName ? " selected" : "") + '>' + esc(t.name) + "</option>";
  }).join("");
  return '' +

    '<div class="signin-card">' +
      '<p class="signin-eyebrow">' + esc(state.meta.propertyName) + '</p>' +
      '<h1>Staff sign-in</h1>' +
      '<p class="signin-sub">Choose your name and enter your access code to continue.</p>' +
      (signinError ? '<div class="signin-error">' + esc(signinError) + '</div>' : '') +
      '<form id="signin-form">' +
        '<div class="field">' +
          '<label for="signin-name">Your name</label>' +
          '<select id="signin-name" required>' +
            '<option value="">Choose your name…</option>' +
            options +
          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label for="signin-code">Access code</label>' +
          '<input type="password" id="signin-code" placeholder="Enter your code" autocomplete="off" />' +
        '</div>' +
        '<button type="submit" class="btn btn-primary">Enter</button>' +
      '</form>' +
      '<p class="signin-foot">Not on the list, or lost your code? Ask a farm admin to add you in the Team section.</p>' +
    '</div>' +
  '</div>';
}
function attachSignInHandlers(){
  var form = document.getElementById("signin-form");
  if(!form) return;
  var nameSel = document.getElementById("signin-name");
  var codeInput = document.getElementById("signin-code");
  nameSel.addEventListener("change", function(){ signinSelectedName = nameSel.value; });
  if(signinFocusCode && codeInput){ codeInput.focus(); signinFocusCode = false; }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameSel.value;
    var code = codeInput.value;
    signinSelectedName = name;
    var member = findTeam(name);
    if(!member || !member.active){
      signinError = "Choose your name from the list.";
      render();
      return;
    }
    if(member.passcode && member.passcode !== code){
      signinError = "That access code doesn't match. Try again or ask an admin to reset it.";
      signinFocusCode = true;
      render();
      return;
    }
    signinError = "";
    signinSelectedName = "";
    session.name = member.name;
    setLocal("bp_signed_in_name", member.name);
    render();
  });
}
function signOut(){
  session.name = null;
  removeLocal("bp_signed_in_name");
  ui.section = "dashboard";
  render();
}

      ? "You’re offline — your changes are saved on this device and will sync automatically once you’re back in range."

    html += '<div class="banner warn" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">' +

      (hasPendingOfflineEdits() ? '<button type="button" class="subtle-btn" onclick="attemptOfflineSync()">Try now</button>' : '') +

    html += '<div class="banner err" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">' +

        '<button type="button" class="subtle-btn" onclick="downloadOfflineConflict()">Download</button>' +

/* ======================================================================
   MACHINERY
   ====================================================================== */
function machineDueForService(m){
  var d = daysUntil(m.nextServiceDue);
  return d != null && d <= 21;
}

// A maintenance schedule is "configured" once a starting hour reading and an
// interval (in hours) have both been entered manually for a machine.
function machineScheduleConfigured(m){
  return m.scheduleStartHours != null && m.serviceIntervalHours != null && m.serviceIntervalHours > 0;
}

// Builds a short window of service milestones (start + n * interval) around
// the machine's current reading: the most recently passed milestone (if any)
// plus the next few upcoming ones. Returns null when no schedule is set.
function machineScheduleMilestones(m){
  if(!machineScheduleConfigured(m)) return null;
  var start = m.scheduleStartHours;
  var interval = m.serviceIntervalHours;
  var current = m.currentReading || 0;
  var kLastDone = Math.floor((current - start) / interval);
  if(kLastDone < 0) kLastDone = 0;
  var fromK = Math.max(1, kLastDone - 1);
  var toK = kLastDone + 3;
  var milestones = [];
  var markedNext = false;
  for(var k = fromK; k <= toK; k++){
    var hours = start + k * interval;
    var status = hours <= current ? "done" : (markedNext ? "upcoming" : "next");
    if(status === "next") markedNext = true;
    milestones.push({ k: k, hours: hours, status: status });
  }
  return milestones;
}

function machineNextMilestone(m){
  var milestones = machineScheduleMilestones(m);
  if(!milestones) return null;
  for(var i = 0; i < milestones.length; i++){
    if(milestones[i].status === "next") return milestones[i];
  }
  return null;
}

// Rounds a computed milestone hour value to a stable key for matching
// against a saved log entry's milestoneHours -- start + k*interval can pick
// up float rounding noise (e.g. 2249.9999999998), so exact equality isn't
// safe to compare on.
function milestoneKey(hours){ return Math.round(hours * 100) / 100; }

// Finds the (most recent) service log entry recorded against a specific
// scheduled milestone, so the schedule table can show what was actually
// done at that point instead of just a due/done status.
function machineMilestoneLog(m, hours){
  var key = milestoneKey(hours);
  var log = m.log || [];
  for(var i = 0; i < log.length; i++){
    if(log[i].milestoneHours != null && milestoneKey(log[i].milestoneHours) === key) return log[i];
  }
  return null;
}

  var dueCount = active.filter(machineDueForService).length;
  var list = active;

  html += '<div class="stat-row">' +

    '<span style="flex:1;"></span>' +

  if(ui.openForms.newMachine) html += renderMachineForm();

  if(list.length === 0){ html += '<div class="empty-state">No machinery matches your search.</div>'; }

function renderMachineCard(m){

      '<div><div class="stat-label">Last service</div><div style="font-weight:600;">' + fmtDate(m.lastServiceDate) + ' &middot; ' + fmtNum(m.lastServiceReading) + '</div></div>' +
      '<div><div class="stat-label">Interval</div><div style="font-weight:600;">' + esc(m.serviceIntervalDesc || "—") + '</div></div>' +
    '</div>';
    html += '<button type="button" class="subtle-btn" onclick="ui.openForms[\'log_' + m.id + '\']=!ui.openForms[\'log_' + m.id + '\'];render();">' + (logOpen ? "Hide log" : "Show service log (" + (m.log||[]).length + ")") + '</button>';
    if(logOpen){
      html += '<div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th>Date</th><th>Description</th><th>By</th><th>Reading</th></tr></thead><tbody>' +
        (m.log||[]).slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(l){
          var scheduledTag = l.milestoneHours != null ? ' <span class="row-muted" style="font-size:10.5px;">(scheduled ' + fmtNum(l.milestoneHours) + ' hrs)</span>' : '';
          return '<tr><td>' + fmtDate(l.date) + '</td><td>' + esc(l.description) + scheduledTag + '</td><td>' + esc(l.performedBy) + '</td><td class="num">' + fmtNum(l.reading) + '</td></tr>';
        }).join("") + '</tbody></table></div>';
    }
    if(isAdmin()){
      html += '<div class="job-actions" style="margin-top:12px;">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.machine=\'' + m.id + '\';render();">Edit</button>' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + m.id + '\')">' + (ui.openForms["archive_" + m.id] ? "Cancel" : "Mark as Sold / Other") + '</button>' +

    html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;" />';
    html += '<button type="button" class="subtle-btn" onclick="ui.openForms[\'schedule_' + m.id + '\']=!ui.openForms[\'schedule_' + m.id + '\'];render();">' + (scheduleOpen ? "Hide maintenance schedule" : "Show maintenance schedule") + '</button>';
    if(scheduleOpen){
      var milestones = machineScheduleMilestones(m);
      if(!milestones){
        html += '<div class="empty-state" style="margin-top:8px;">No maintenance schedule set for this machine yet.</div>';
      } else {
        // Row 1 is always the starting hours themselves (informational, not
        // clickable -- it's the baseline the schedule counts from, not a due
        // date). Every row after that is a service point computed as the
        // previous one plus the interval (start, start+interval,
        // start+2*interval, ...) -- clicking its hour reading logs the
        // maintenance actually done at that point.
        // The "maintenance done" log form used to be embedded inside a
        // colspan cell of this table, which forced the whole card wide
        // (this table has a min-width for its own columns) and made staff
        // scroll sideways on a phone just to fill it in. It's now built up
        // separately and rendered as a normal full-width block below the
        // table instead, so it always stacks vertically regardless of
        // screen width.
        var openMilestoneForms = "";
        html += '<div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th>Hour meter reading</th><th>Status</th><th>Maintenance done</th></tr></thead><tbody>' +

          milestones.map(function(ms){
            var label = ms.status === "done" ? "Done" : ms.status === "next" ? "Next due" : "Upcoming";

            var key = milestoneKey(ms.hours);
            var logEntry = machineMilestoneLog(m, key);
            var open = ui.openForms["ms_" + m.id + "_" + key];
            if(open) openMilestoneForms += renderMilestoneLogForm(m, ms.hours, logEntry);
            return '<tr>' +
              '<td><button type="button" class="subtle-btn" style="font-weight:600;" onclick="ui.openForms[\'ms_' + m.id + '_' + key + '\']=!ui.openForms[\'ms_' + m.id + '_' + key + '\'];render();">' + fmtNum(ms.hours) + ' hrs</button></td>' +
              '<td><span class="pill ' + tone + '">' + label + '</span></td>' +
              '<td>' + (logEntry ? (esc(logEntry.description) + ' <span class="row-muted" style="font-size:11px;">(' + fmtDate(logEntry.date) + (logEntry.performedBy ? " &middot; " + esc(logEntry.performedBy) : "") + ')</span>') : '<span class="row-muted">Not logged yet</span>') +
              '</td>' +
            '</tr>';
          }).join("") + '</tbody></table></div>';
        if(openMilestoneForms) html += '<div style="margin-top:10px;">' + openMilestoneForms + '</div>';
        html += '<p class="row-muted" style="margin:8px 0 0;font-size:11.5px;">Starting from ' + fmtNum(m.scheduleStartHours) + ' hrs, every ' + fmtNum(m.serviceIntervalHours) + ' hrs. Current reading: ' + fmtNum(m.currentReading) + ' hrs. Click a scheduled reading above to log the maintenance done at that point.</p>';
      }
      if(isAdmin()){
        html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="toggleForm(\'setSchedule_' + m.id + '\')">' + (ui.openForms["setSchedule_" + m.id] ? "Cancel" : (scheduleConfigured ? "Edit maintenance schedule" : "+ Set maintenance schedule")) + '</button>';
        if(ui.openForms["setSchedule_" + m.id]) html += renderMaintenanceScheduleForm(m);
      }
    }
    html += '<div style="margin-top:10px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'svc_' + m.id + '\')">Log service</button>' +
    '</div>';
    if(ui.openForms["svc_" + m.id]) html += renderServiceLogForm(m);

    html += '<hr style="border:none;border-top:1px solid var(--border);margin:14px 0;" />';
    html += '<button type="button" class="subtle-btn" onclick="ui.openForms[\'issues_' + m.id + '\']=!ui.openForms[\'issues_' + m.id + '\'];render();">' + (issuesOpen ? "Hide issues" : "Show Issues & Report Issues (" + issues.length + ")") + '</button>';
    if(issuesOpen){
      if(issues.length === 0){
        html += '<div class="empty-state" style="margin-top:8px;">No issues reported for this machine.</div>';
      } else {
        html += '<div class="list-cards" style="margin-top:8px;">' + issues.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(iss){
          return '<div class="card" style="box-shadow:none;border:1px solid var(--border);padding:10px 12px;">' +
            '<div class="card-row"><p style="margin:0;flex:1;">' + esc(iss.description) + '</p>' +
            '<span class="pill ' + (iss.status === "Resolved" ? "pill-todo" : "pill-high") + '">' + esc(iss.status || "Open") + '</span></div>' +
            '<p class="row-muted" style="margin:6px 0 0;font-size:11.5px;">Reported by ' + esc(iss.reportedBy) + ' on ' + fmtDate(iss.date) + '</p>' +
            '<div style="display:flex;gap:6px;margin-top:8px;">' +
              (iss.status !== "Resolved" ? '<button type="button" class="btn btn-ghost btn-sm" onclick="resolveMachineIssue(\'' + m.id + '\',\'' + iss.id + '\')">Mark resolved</button>' : '<button type="button" class="btn btn-ghost btn-sm" onclick="reopenMachineIssue(\'' + m.id + '\',\'' + iss.id + '\')">Reopen</button>') +

            '</div>' +
          '</div>';
        }).join("") + '</div>';
      }
      html += '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px;" onclick="toggleForm(\'newIssue_' + m.id + '\')">' + (ui.openForms["newIssue_" + m.id] ? "Cancel" : "+ Report an issue") + '</button>';
      if(ui.openForms["newIssue_" + m.id]) html += renderMachineIssueForm(m);

  }
  html += '</div>';
  return html;

// Logging maintenance against a specific scheduled milestone (clicked
// straight from the maintenance schedule table) rather than the general
// "Log service" button. Pre-filled with that milestone's hour reading, and
// always counts as a scheduled service -- no separate checkbox needed the
// way the general log form has, since clicking a due date's own row makes
// that intent explicit.
function renderMilestoneLogForm(m, hours, existing){
  var key = milestoneKey(hours);
  return '<form class="form-panel" style="margin:8px 0 0;" onsubmit="addMilestoneServiceLog(event,\'' + m.id + '\',' + key + ')">' +
    '<h4 style="margin-top:0;">Maintenance at ' + fmtNum(hours) + ' hrs — ' + esc(m.name) + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + escAttr(existing ? existing.date : todayISO()) + '" required /></div>' +
      '<div class="field"><label>Actual reading</label><input type="number" step="0.1" name="reading" value="' + escAttr(existing ? existing.reading : hours) + '" required /></div>' +
      '<div class="field span-2"><label>What was done</label><textarea name="description" rows="2" required placeholder="e.g. 250-hour service - oil, filters, greased linkages">' + esc(existing ? existing.description : "") + '</textarea></div>' +
      '<div class="field"><label>Performed by</label><input type="text" name="performedBy" value="' + escAttr(existing ? existing.performedBy : currentUser().name) + '" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button><button type="button" class="btn btn-ghost" onclick="ui.openForms[\'ms_' + m.id + '_' + key + '\']=false;render();">Close</button></div>' +
  '</form>';
}
function addMilestoneServiceLog(e, machineId, key){
  e.preventDefault();
  var f = e.target;
  var reading = parseFloat(f.reading.value);
  var description = f.description.value.trim();
  if(isNaN(reading) || !description) return;
  var m = byId(state.machinery, machineId);
  m.log = m.log || [];
  // Re-logging the same milestone updates its existing entry rather than
  // stacking a duplicate, so each scheduled point has one record.
  var existingIdx = m.log.findIndex(function(l){ return l.milestoneHours != null && milestoneKey(l.milestoneHours) === key; });
  var entry = { id: (existingIdx > -1 ? m.log[existingIdx].id : uid("l")), date: f.date.value, description: description, performedBy: f.performedBy.value.trim() || currentUser().name, reading: reading, milestoneHours: key };
  if(existingIdx > -1) m.log[existingIdx] = entry; else m.log.unshift(entry);
  m.currentReading = Math.max(m.currentReading || 0, reading);
  m.lastServiceDate = f.date.value;
  m.lastServiceReading = reading;
  ui.openForms["ms_" + machineId + "_" + key] = false;
  persist();
}

  state.whs.incidents.push({ id: uid("i"), date: f.date.value, person: f.person.value.trim(), location: f.location.value.trim(), severity: f.severity.value, description: f.description.value.trim(), actionTaken: f.actionTaken.value.trim(), reportedTo: "Farm Manager", status: "Open" });
  ui.openForms.newIncident = false;
  persist();
}
function closeIncident(id){

}

/* ======================================================================
   CHEMICALS
   ====================================================================== */
function renderChemicals(){
  var html = pageHead("Chemicals", "The on-farm chemical register and safety data sheets.");

  html += '<div class="card"><div class="card-row"><h3 style="margin:0;">Chemical register</h3>' +
    '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="toggleForm(\'newReg\')">' + (ui.openForms.newReg ? "Cancel" : "+ Add stock entry") + '</button></div>';
  if(ui.openForms.newReg) html += renderRegisterForm();
  html += '<p class="row-muted" style="margin:0 0 6px;font-size:12px;">Click a chemical to log usage and deduct it from stock on hand.</p>';
  var registerList = state.chemicals.register || [];
  html += '<div class="table-wrap" style="box-shadow:none;"><table><thead><tr><th>Chemical</th><th>Batch</th><th>Qty</th><th>Location</th><th>Supplier</th><th>Expiry</th><th></th></tr></thead><tbody>' +
    registerList.map(renderRegisterRow).join("") +
  '</tbody></table></div>';
  // The usage/return forms (and log) for whichever entries are expanded
  // used to be embedded inside this table via a colspan cell, which forced
  // the whole table wide and made staff scroll sideways on a phone just to
  // fill the form in. They're now rendered as normal full-width blocks
  // below the table instead, so they always stack vertically.
  var openRegisterPanels = registerList.filter(function(r){ return ui.openForms["reguse_" + r.id]; })
    .map(renderRegisterExpanded).join("");
  if(openRegisterPanels) html += '<div style="margin-top:12px;">' + openRegisterPanels + '</div>';
  html += '</div>';

  // A chemical is missing its real safety info -- as opposed to just not
  // having filled in every optional field -- when NONE of the actual SDS
  // content (hazard class, signal word, first aid) has been added yet.
  // Anything in this state gets a loud warning instead of quietly
  // rendering nothing.
  function sdsNeedsDetails(c){
    return !c.hazardClass && !c.signalWord && !c.firstAid;
  }
  var sdsQ = ui.sdsQuery.trim().toLowerCase();
  var sdsAll = state.chemicals.sds || [];
  var sdsList = sdsAll;
  if(sdsQ) sdsList = sdsList.filter(function(c){
    return (
      (c.productName||"") + " " + (c.activeConstituent||"") + " " + (c.hazardClass||"") + " " +
      (c.signalWord||"") + " " + (c.withholdingPeriod||"") + " " +
      (c.chemicalType||"")
    ).toLowerCase().indexOf(sdsQ) > -1;
  });
  var sdsNeedingReview = sdsAll.filter(sdsNeedsDetails).length;

  html += '<div class="card"><div class="card-row"><h3 style="margin:0;">Safety data sheets</h3>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="toggleForm(\'newSds\')">' + (ui.openForms.newSds ? "Cancel" : "+ Add SDS") + '</button>' : '') + '</div>' +
    (sdsNeedingReview > 0 ? '<p class="row-muted" style="margin:6px 0 0;font-size:12.5px;color:#991b1b;">⚠ ' + sdsNeedingReview + ' of ' + sdsAll.length + ' chemicals still need their full safety details (hazard class, first aid) added from the real SDS.</p>' : '') +
    '<div class="toolbar" style="margin:10px 0 0;">' +
      '<input id="sds-search-input" class="search-input" type="text" placeholder="Search safety data sheets…" value="' + escAttr(ui.sdsQuery) + '" oninput="ui.sdsQuery=this.value;render();" />' +
      '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="searchWebForSds()" title="Opens a new tab with a web search for this product\'s SDS">Search the web ↗</button>' +
    '</div>';
  if(ui.openForms.newSds) html += renderSdsForm();
  if(sdsList.length === 0){
    html += '<div class="empty-state">No safety data sheets match your search.' +
      (sdsQ ? ' Not in our list? <button type="button" class="subtle-btn" onclick="searchWebForSds()">Search the web for it instead</button>' : '') +
    '</div>';
  }
  html += sdsList.map(function(c){
    if(ui.editing.sds === c.id) return renderSdsForm(c);
    var needsDetails = sdsNeedsDetails(c);
    return '<div style="padding:12px 0;border-top:1px solid var(--border);">' +
      '<div class="card-row" style="margin-bottom:4px;"><strong style="font-size:13.5px;">' + esc(c.productName) + '</strong>' +
      '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;">' +
        (needsDetails ? '<span class="pill" style="background:#fee2e2;color:#991b1b;white-space:normal;text-align:left;">⚠ Needs SDS details</span>' : '<span class="pill pill-medium" style="white-space:normal;text-align:left;">' + esc(c.signalWord) + '</span>') +
        (isAdmin() ? '<button type="button" class="subtle-btn" onclick="ui.editing.sds=\'' + c.id + '\';render();">Edit</button>' : '') +
        (isAdmin() ? '<button type="button" class="subtle-btn" style="color:var(--danger);" onclick="if(confirm(\'Remove this chemical from the SDS list? This cannot be undone.\')){removeSds(\'' + c.id + '\')}">Remove</button>' : '') +
      '</div></div>' +
      (c.activeConstituent || c.hazardClass ? '<p class="row-muted" style="margin:0 0 6px;font-size:12.5px;">' + esc(c.activeConstituent) + (c.activeConstituent && c.hazardClass ? ' &middot; ' : '') + esc(c.hazardClass) + '</p>' : '') +
      (c.chemicalType ? '<p class="row-muted" style="margin:0 0 6px;font-size:12.5px;">' + esc(c.chemicalType) + '</p>' : '') +
      (c.storageRequirements ? '<p style="margin:8px 0 0;font-size:12.5px;"><strong>Storage:</strong> ' + esc(c.storageRequirements) + '</p>' : '') +
      (c.firstAid ? '<p style="margin:4px 0 0;font-size:12.5px;"><strong>First aid:</strong> ' + esc(c.firstAid) + '</p>' : '') +
    '</div>';
  }).join("");
  html += '</div>';

  return html;
}
// Doesn't fetch or display anything inside the app -- this app has no
// backend of its own to run a real web search through, so "search the
// web" means exactly that: open a new browser tab at a normal web search
// for this product's SDS, using whatever's currently in the search box.
function searchWebForSds(){
  var q = (ui.sdsQuery || "").trim();
  if(!q){
    setNotice("err", "Type a chemical or product name in the search box above first, then try again.");
    render();
    return;
  }
  var url = "https://www.google.com/search?q=" + encodeURIComponent(q + " safety data sheet SDS");
  window.open(url, "_blank", "noopener");
}
function renderSdsForm(existing){
  return '<div class="form-panel"><form onsubmit="saveSds(event,' + (existing ? "'" + existing.id + "'" : "null") + ')">' +
    '<div class="form-grid">' +
      '<div class="field"><label>Product name</label><input type="text" name="productName" required value="' + escAttr(existing?existing.productName:"") + '" /></div>' +
      '<div class="field"><label>Active constituent</label><input type="text" name="activeConstituent" value="' + escAttr(existing?existing.activeConstituent:"") + '" /></div>' +
      '<div class="field"><label>Chemical type</label><input type="text" name="chemicalType" placeholder="Herbicide, Insecticide, Fungicide…" value="' + escAttr(existing?existing.chemicalType:"") + '" /></div>' +
      '<div class="field"><label>Hazard class</label><input type="text" name="hazardClass" value="' + escAttr(existing?existing.hazardClass:"") + '" /></div>' +
      '<div class="field"><label>Signal word</label><input type="text" name="signalWord" value="' + escAttr(existing?existing.signalWord:"") + '" /></div>' +
      '<div class="field"><label>Withholding period</label><input type="text" name="withholdingPeriod" value="' + escAttr(existing?existing.withholdingPeriod:"") + '" /></div>' +
      '<div class="field span-2"><label>Storage requirements</label><input type="text" name="storageRequirements" value="' + escAttr(existing?existing.storageRequirements:"") + '" /></div>' +
      '<div class="field span-2"><label>First aid</label><textarea name="firstAid">' + esc(existing?existing.firstAid:"") + '</textarea></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button><button type="button" class="btn btn-ghost" onclick="' + (existing ? "ui.editing.sds=null;render();" : "toggleForm('newSds')") + '">Cancel</button></div>' +
  '</form></div>';
}
function saveSds(e, id){
  e.preventDefault();
  var f = e.target;
  var data = { productName: f.productName.value.trim(), activeConstituent: f.activeConstituent.value.trim(), chemicalType: f.chemicalType.value.trim(), hazardClass: f.hazardClass.value.trim(), signalWord: f.signalWord.value.trim(), withholdingPeriod: f.withholdingPeriod.value.trim(), storageRequirements: f.storageRequirements.value.trim(), firstAid: f.firstAid.value.trim(), lastReviewed: todayISO() };
  if(!data.productName) return;
  if(id){ Object.assign(byId(state.chemicals.sds, id), data); ui.editing.sds = null; }
  else { state.chemicals.sds.push(Object.assign({ id: uid("c") }, data)); ui.openForms.newSds = false; }
  persist();
}
function removeSds(id){
  removeById(state.chemicals.sds, id);
  if(ui.editing.sds === id) ui.editing.sds = null;
  persist();
}
function renderRegisterForm(){
  return '<form class="form-panel" onsubmit="addRegister(event)">' +
    '<div class="form-grid">' +
      '<div class="field"><label>Chemical</label><input type="text" name="chemicalName" required /></div>' +
      '<div class="field"><label>Batch no.</label><input type="text" name="batchNo" /></div>' +
      '<div class="field"><label>Quantity</label><input type="number" step="0.1" name="quantity" required /></div>' +
      '<div class="field"><label>Unit</label><input type="text" name="unit" value="L" /></div>' +
      '<div class="field"><label>Storage location</label><input type="text" name="storageLocation" /></div>' +
      '<div class="field"><label>Supplier</label><input type="text" name="supplier" /></div>' +
      '<div class="field"><label>Purchase date</label><input type="date" name="purchaseDate" value="' + todayISO() + '" /></div>' +
      '<div class="field"><label>Expiry date</label><input type="date" name="expiryDate" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Add</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'newReg\')">Cancel</button></div>' +
  '</form>';
}
function addRegister(e){
  e.preventDefault();
  var f = e.target;
  state.chemicals.register.push({ id: uid("r"), chemicalName: f.chemicalName.value.trim(), batchNo: f.batchNo.value.trim(), quantity: parseFloat(f.quantity.value)||0, unit: f.unit.value.trim(), storageLocation: f.storageLocation.value.trim(), supplier: f.supplier.value.trim(), purchaseDate: f.purchaseDate.value, expiryDate: f.expiryDate.value, usageLog: [] });
  ui.openForms.newReg = false;
  persist();
}

function renderRegisterRow(r){
  var exp = daysUntil(r.expiryDate);
  var expStyle = (exp != null && exp < 60) ? ' style="color:var(--danger);font-weight:600;"' : "";
  return '<tr>' +
    '<td><button type="button" class="subtle-btn" style="font-weight:600;" onclick="ui.openForms[\'reguse_' + r.id + '\']=!ui.openForms[\'reguse_' + r.id + '\'];render();">' + esc(r.chemicalName) + '</button></td>' +
    '<td>' + esc(r.batchNo) + '</td><td class="num">' + fmtNum(r.quantity, r.unit) + '</td><td>' + esc(r.storageLocation) + '</td><td>' + esc(r.supplier) + '</td><td' + expStyle + '>' + fmtDate(r.expiryDate) + '</td>' +
    '<td><button type="button" class="subtle-btn" style="color:var(--danger);" onclick="if(confirm(\'Remove this stock entry (' + escAttr(r.chemicalName) + (r.batchNo ? ", batch " + escAttr(r.batchNo) : "") + ')? This cannot be undone.\')){removeRegister(\'' + r.id + '\')}">Remove</button></td>' +
  '</tr>';
}
// The usage/return forms + log for a register entry that's been expanded
// (clicked open from renderRegisterRow above). Rendered as a plain block
// outside the table -- see the note in renderChemicals() for why.
function renderRegisterExpanded(r){
  var html = '<div style="border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:var(--surface-2);">';
  html += '<p class="row-muted" style="margin:0 0 10px;font-size:12px;font-weight:600;">' + esc(r.chemicalName) + (r.batchNo ? " &middot; batch " + esc(r.batchNo) : "") + '</p>';
  html += '<div style="display:flex;gap:20px;flex-wrap:wrap;">' +
    '<div style="flex:1 1 260px;min-width:0;">' + renderRegisterUsageForm(r) + '</div>' +
    '<div style="flex:1 1 260px;min-width:0;">' + renderRegisterReturnForm(r) + '</div>' +
  '</div>';
  var log = r.usageLog || [];
  if(log.length){
    html += '<div class="table-wrap" style="box-shadow:none;margin-top:14px;"><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>By</th><th>Job / notes</th></tr></thead><tbody>' +
      log.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(u){
        var isReturn = u.type === "returned";
        return '<tr><td>' + fmtDate(u.date) + '</td>' +
          '<td>' + (isReturn ? "Returned" : "Used") + '</td>' +
          '<td class="num"' + (isReturn ? ' style="color:var(--accent);font-weight:600;"' : '') + '>' + (isReturn ? "+" : "-") + fmtNum(u.amount, r.unit) + '</td>' +
          '<td>' + esc(u.usedBy) + '</td><td>' + esc(u.notes || "—") + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }
  html += '</div>';
  return html;
}
function renderRegisterUsageForm(r){
  return '<form class="form-panel" style="margin:0;" onsubmit="addRegisterUsage(event,\'' + r.id + '\')">' +
    '<h4 style="margin-top:0;">Log usage — ' + esc(r.chemicalName) + ' <span class="row-muted" style="font-weight:400;font-size:12px;">(' + fmtNum(r.quantity, r.unit) + ' on hand)</span></h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Amount used (' + esc(r.unit || "units") + ')</label><input type="number" step="0.1" min="0" name="amount" class="no-spinner" required /></div>' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + todayISO() + '" required /></div>' +
      '<div class="field"><label>Used by</label><input type="text" name="usedBy" value="' + escAttr(currentUser().name) + '" /></div>' +
      '<div class="field span-2"><label>Job / notes</label><input type="text" name="notes" placeholder="e.g. Spraying dryland wheat - paddock 4" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Log usage</button><button type="button" class="btn btn-ghost" onclick="ui.openForms[\'reguse_' + r.id + '\']=false;render();">Close</button></div>' +
  '</form>';
}
function addRegisterUsage(e, id){
  e.preventDefault();
  var f = e.target;
  var amount = parseFloat(f.amount.value);
  if(isNaN(amount) || amount <= 0) return;
  var r = byId(state.chemicals.register, id);
  r.usageLog = r.usageLog || [];
  r.usageLog.unshift({ id: uid("u"), type: "used", amount: amount, date: f.date.value, usedBy: f.usedBy.value.trim() || currentUser().name, notes: f.notes.value.trim() });
  r.quantity = Math.max(0, (r.quantity || 0) - amount);
  persist();
}
// Covers the "took some out, didn't use it all" case -- e.g. someone draws
// 20L intending to spray a full paddock, only uses 12L, and needs to put
// the leftover 8L back into stock on hand. A separate action (rather than
// letting "Log usage" take a negative number) so the log stays unambiguous
// at a glance -- every row is clearly either usage or a return, never a
// number whose sign someone has to interpret.
function renderRegisterReturnForm(r){
  return '<form class="form-panel" style="margin:0;" onsubmit="addRegisterReturn(event,\'' + r.id + '\')">' +
    '<h4 style="margin-top:0;">Return unused chemical — ' + esc(r.chemicalName) + '</h4>' +
    '<p class="row-muted" style="margin:0 0 10px;font-size:12px;">Took some out but didn\'t use it all? Add the unused amount back to stock on hand here.</p>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Amount returned (' + esc(r.unit || "units") + ')</label><input type="number" step="0.1" min="0" name="amount" class="no-spinner" required /></div>' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + todayISO() + '" required /></div>' +
      '<div class="field"><label>Returned by</label><input type="text" name="usedBy" value="' + escAttr(currentUser().name) + '" /></div>' +
      '<div class="field span-2"><label>Job / notes</label><input type="text" name="notes" placeholder="e.g. Only needed 12L of the 20L drawn for paddock 4" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Return to stock</button><button type="button" class="btn btn-ghost" onclick="ui.openForms[\'reguse_' + r.id + '\']=false;render();">Close</button></div>' +
  '</form>';
}
function addRegisterReturn(e, id){
  e.preventDefault();
  var f = e.target;
  var amount = parseFloat(f.amount.value);
  if(isNaN(amount) || amount <= 0) return;
  var r = byId(state.chemicals.register, id);
  r.usageLog = r.usageLog || [];
  r.usageLog.unshift({ id: uid("u"), type: "returned", amount: amount, date: f.date.value, usedBy: f.usedBy.value.trim() || currentUser().name, notes: f.notes.value.trim() });
  r.quantity = (r.quantity || 0) + amount;
  persist();
}
function removeRegister(id){
  removeById(state.chemicals.register, id);
  delete ui.openForms["reguse_" + id];
  persist();
}

   EMERGENCY
   ====================================================================== */

  '</div><div class="form-grid">' +

    html += '<div class="list-cards">' + em.contacts.map(function(c){
      if(ui.openForms.editContacts){

            '<div class="field"><label>Phone</label><input type="text" value="' + escAttr(c.phone) + '" onchange="updateContact(\'' + c.id + '\',\'phone\',this.value)" /></div>' +
            '<div class="field span-2"><label>Notes</label><input type="text" value="' + escAttr(c.notes) + '" onchange="updateContact(\'' + c.id + '\',\'notes\',this.value)" /></div>' +
          '</div>' +
          '<div style="margin-top:10px;"><button type="button" class="btn btn-danger btn-sm" onclick="if(confirm(\'Remove this contact?\')){removeEmergencyContact(\'' + c.id + '\')}">Remove</button></div>' +

        '<div style="font-size:13.5px;font-weight:600;">' + esc(c.name || "—") + '</div>' +
        '<div style="font-size:13px;color:var(--text-muted);margin-top:2px;">' + esc(c.phone || "No phone listed") + '</div>' +
        (c.notes ? '<div style="font-size:12.5px;color:var(--text-muted);margin-top:6px;">' + esc(c.notes) + '</div>' : '') +
      '</div>';
    }).join("") + '</div>';
  }
  html += (ui.openForms.editContacts ? '<div style="margin-top:12px;"><button type="button" class="btn btn-ghost btn-sm" onclick="addEmergencyContact()">+ Add contact</button></div>' : '') +
  '</div>';

  html += '<div class="toolbar"><span style="flex:1;"></span><button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newEmergencyProcedure\')">' + (ui.openForms.newEmergencyProcedure ? "Cancel" : "+ Add procedure") + '</button></div>';

      '<p style="margin:0;">' + esc(p.body) + '</p></div>';
  }).join("");
  return html;
}

}
function updateContact(id, field, value){

}
function addEmergencyContact(){
  state.emergency.contacts.push({ id: uid("e"), role: "", name: "", phone: "", notes: "" });

}
function removeEmergencyContact(id){
  removeById(state.emergency.contacts, id);
  persist();
}
function renderEmergencyProcedureForm(existing){
  return '<div class="form-panel"><form onsubmit="saveEmergencyProcedure(event,' + (existing ? "'" + existing.id + "'" : "null") + ')">' +

function renderMapForm(){
  return '<form class="form-panel" onsubmit="addMap(event)">' +
    '<div class="form-grid">' +
      '<div class="field"><label>Title</label><input type="text" name="title" required /></div>' +
