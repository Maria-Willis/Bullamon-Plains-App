function addMilestoneServiceLog(e, machineId, key){
  e.preventDefault();
  var f = e.target;
  var formKey = "ms_" + machineId + "_" + key;
  var reading = parseHoursInput(f.reading.value);
  var description = f.description.value.trim();
  if(isNaN(reading) || !description){
    ui.formErrors[formKey] = !description ? "Describe what was done." : "Enter a valid reading (e.g. 2300).";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var m = byId(state.machinery, machineId);
  m.log = m.log || [];
  // Re-logging the same milestone updates its existing entry rather than
  // stacking a duplicate, so each scheduled point has one record.
  var existingIdx = m.log.findIndex(function(l){ return l.milestoneHours != null && milestoneKey(l.milestoneHours) === key; });
  var entry = { id: (existingIdx > -1 ? m.log[existingIdx].id : uid("l")), date: f.date.value, description: description, performedBy: f.performedBy.value.trim() || currentUser().name, reading: reading, milestoneHours: key, filtersUsed: f.filtersUsed.value.trim(), oilUsed: f.oilUsed.value.trim(), notes: f.notes.value.trim() };
  if(existingIdx > -1) m.log[existingIdx] = entry; else m.log.unshift(entry);
  m.currentReading = Math.max(m.currentReading || 0, reading);
  m.lastServiceDate = f.date.value;
  m.lastServiceReading = reading;
  if(m.reminders) delete m.reminders[key];
  ui.openForms["ms_" + machineId + "_" + key] = false;
  persist();
}

// Combines what used to be two separate views (the service log table and
// the maintenance schedule table) into one: any scheduled milestone that
// hasn't been logged yet appears first (still clickable, same as before),
// then every actual log entry underneath, newest first -- with its own Edit
// button, so an old record can be corrected even when it's well outside the
// schedule's own small computed window of nearby milestones (which is all
// machineScheduleMilestones() ever returns -- it was never meant to be a
// full history). One shared table/header for both kinds of row, rather than
// two separate tables under two separate toggles.
function renderMachineServiceHistory(m){
  var scheduleConfigured = machineScheduleConfigured(m);
  var openForms = "";
  var rows = "";

  if(scheduleConfigured){
    var milestones = machineScheduleMilestones(m) || [];
    rows += milestones.filter(function(ms){ return !machineMilestoneLog(m, milestoneKey(ms.hours)); }).map(function(ms){
      // A milestone can be computed as "done" (the current reading has
      // already passed it) and still have no matching log entry -- e.g. a
      // schedule set up after some service history already existed, where
      // none of that history was tagged against a specific milestone. Label
      // that case clearly rather than letting it fall through to "Upcoming",
      // which would wrongly suggest it hasn't happened yet.
      var label = ms.status === "done" ? "Passed (not logged)" : ms.status === "next" ? "Next due" : "Upcoming";
      var tone = ms.status === "upcoming" ? "pill-medium" : "pill-high";
      var key = milestoneKey(ms.hours);
      var open = ui.openForms["ms_" + m.id + "_" + key];
      if(open) openForms += renderMilestoneLogForm(m, ms.hours, null);
      var reminderFormKey = "mres_" + m.id + "_" + key;
      var reminderOpen = ui.openForms[reminderFormKey];
      if(reminderOpen) openForms += renderMilestoneReminderForm(m, ms.hours);
      var reminderText = (m.reminders && m.reminders[key]) || "";
      var whatCell = "Not logged yet" + (reminderText ? '<br/><span class="row-muted" style="font-size:11px;white-space:pre-wrap;">🔔 ' + esc(reminderText) + '</span>' : '');
      return '<tr>' +
        '<td class="row-muted">—</td>' +
        '<td class="num">' + fmtNum(ms.hours) + '</td>' +
        '<td class="row-muted">' + whatCell + '</td>' +
        '<td class="row-muted">—</td>' +
        '<td><span class="pill ' + tone + '">' + label + '</span></td>' +
        '<td style="white-space:nowrap;">' + (isAdmin() ? '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'ms_' + m.id + '_' + key + '\']=!ui.openForms[\'ms_' + m.id + '_' + key + '\'];render();">' + (open ? "Cancel" : "Log this service") + '</button> <button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'' + reminderFormKey + '\']=!ui.openForms[\'' + reminderFormKey + '\'];render();">' + (reminderOpen ? "Cancel" : (reminderText ? "Edit reminder" : "Set reminder")) + '</button>' : '') + '</td>' +
      '</tr>';
    }).join("");
  }

  var log = (m.log || []).slice().sort(byDateDesc("date"));
  rows += log.map(function(l){
    var editKey = "editlog_" + l.id;
    var editingLog = ui.openForms[editKey];
    if(editingLog) openForms += renderEditServiceLogForm(m, l);
    var scheduledTag = l.milestoneHours != null ? ' <span class="row-muted" style="font-size:10.5px;">(scheduled ' + fmtNum(l.milestoneHours) + ' hrs)</span>' : '';
    var usedTag = "";
    if(l.checklistDone && l.checklistDone.length) usedTag += '<br/><span class="row-muted" style="font-size:11px;">Completed: ' + esc(l.checklistDone.join(", ")) + '</span>';
    if(l.partsUsed && l.partsUsed.length) usedTag += '<br/><span class="row-muted" style="font-size:11px;">Parts used: ' + esc(l.partsUsed.map(function(pu){ return pu.name + (pu.qty ? " ×" + pu.qty : ""); }).join(", ")) + '</span>';
    if(l.filtersUsed) usedTag += '<br/><span class="row-muted" style="font-size:11px;">Filters used: ' + esc(l.filtersUsed) + '</span>';
    if(l.oilUsed) usedTag += '<br/><span class="row-muted" style="font-size:11px;">Oil used: ' + esc(l.oilUsed) + '</span>';
    if(l.notes) usedTag += '<br/><span class="row-muted" style="font-size:11px;white-space:pre-wrap;">Notes: ' + esc(l.notes) + '</span>';
    return '<tr>' +
      '<td>' + fmtDate(l.date) + '</td>' +
      '<td class="num">' + fmtNum(l.reading) + '</td>' +
      '<td>' + esc(l.description) + scheduledTag + usedTag + '</td>' +
      '<td>' + esc(l.performedBy) + '</td>' +
      '<td><span class="pill pill-todo">Done</span></td>' +
      '<td>' + (isAdmin() ? '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.openForms[\'' + editKey + '\']=!ui.openForms[\'' + editKey + '\'];render();">' + (editingLog ? "Cancel" : "Edit") + '</button>' : '') + '</td>' +
    '</tr>';
  }).join("");

  if(!rows){
    return '<div class="empty-state" style="margin-top:8px;">No service history logged yet' + (scheduleConfigured ? "" : ", and no maintenance schedule set") + '.</div>';
  }

  var html = '<div class="table-wrap" style="box-shadow:none;margin-top:8px;"><table><thead><tr><th>Date</th><th>Hours</th><th>What was done</th><th>By</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  if(openForms) html += '<div style="margin-top:10px;">' + openForms + '</div>';
  if(scheduleConfigured){
    html += '<p class="row-muted" style="margin:8px 0 0;font-size:11.5px;">Starting from ' + fmtNum(m.scheduleStartHours) + ' hrs, every ' + fmtNum(m.serviceIntervalHours) + ' hrs. Current reading: ' + fmtNum(m.currentReading) + ' hrs.</p>';
  }
  return html;
}

function saveMachine(e, id){

  if(id){ Object.assign(byId(state.machinery, id), data); ui.editing.machine = null; }
  else { state.machinery.push(Object.assign({ id: uid("m"), currentReading: 0, lastServiceDate: "", lastServiceReading: 0, log: [], serviceChecklistItems: DEFAULT_MACHINE_CHECKLIST.slice() }, data)); ui.openForms.newMachine = false; }
  persist();
}

/* ======================================================================
   BULLS
   Same active/archived-by-status pattern as Machinery ("Sold or Other")
   and the same per-item log pattern as Machinery's service log, applied
   here to yearly BBSE (Bull Breeding Soundness Evaluation) test results.
   ====================================================================== */
function bullItems(){ return (state.bulls && state.bulls.items) || []; }

// A number of test-log summaries in Maria's original spreadsheet contain
// only the single character "ü" -- almost certainly a Wingdings/Symbol-font
// tick mark ( a check mark glyph) that lost its meaning once the cell was
// read back as plain text, rather than an actual note. Shown as a plain
// check mark with a title explaining why, instead of either the raw "ü"
// (confusing) or a fabricated guess at what the tick meant (not something
// this app should invent).
function bullTestDisplay(summary){
  var s = (summary == null ? "" : String(summary)).trim();
  if(s === "ü"){
    return '<span title="Recorded in the source spreadsheet as a tick mark (Wingdings-style), with no written notes">&#10003; Tested &ndash; no written notes recorded</span>';
  }
  return esc(summary);
}

// Matches the years actually present across the 56 archived (Sold/Dead)
// bulls' test logs (including the source spreadsheet's odd "2021 Retest"
// column) -- kept fixed, since that table is historical record, not
// something staff add new years to. The "Dead or Sold" table was removed
// 2026-09-07, then reinstated 2026-09-21 as "Sold / Dead" at Maria's
// request -- see the Bulls architecture note for the full history.
var BULL_ARCHIVED_YEARS = ["2025", "2024", "2023", "2022", "2021 Retest", "2021", "2020", "2018"];

// The active bulls table's year columns (2026-09-27, at Maria's request:
// "archive 2022 and 2023. I also need to be able to add new years") --
// unlike BULL_ARCHIVED_YEARS above, this list is no longer fixed in code:
// it lives in state.bulls.yearColumns (seeded by the bullYearColumnsMigratedV1
// migration) so admins can archive an old year's column (hiding it, without
// touching any bull's actual test-log data underneath -- exactly like
// archiving a bull hides a row) or add a new one, entirely from the app
// itself, with no code change needed here going forward.
function bullYearColumns(){
  if(!state.bulls) state.bulls = { items: [] };
  if(!state.bulls.yearColumns) state.bulls.yearColumns = { active: ["2026", "2025", "2024", "2021"], archived: ["2023", "2022"] };
  return state.bulls.yearColumns;
}
function sortYearsDesc(years){
  return years.slice().sort(function(a, b){ return parseInt(b, 10) - parseInt(a, 10); });
}
// Corrects the left/right order of any year columns that share the same
// year number but not the same spelling (a plain year and its "Retest"
// variant, e.g. "2026" and "2026 Retest") -- the plain one always ends up
// last (rightmost) within that tied pair. Deliberately narrow: it only
// ever reorders entries that are numeric ties with each other, and leaves
// every other column's relative position completely untouched, so it's
// safe to run over a whole existing list (see the one-time migration that
// uses it below) without disturbing years that were never part of a tie.
function fixYearTieOrder(years){
  var byNum = {};
  years.forEach(function(y, i){
    var n = parseInt(y, 10);
    (byNum[n] = byNum[n] || []).push(i);
  });
  var result = years.slice();
  Object.keys(byNum).forEach(function(n){
    var idxs = byNum[n];
    if(idxs.length < 2) return;
    var items = idxs.map(function(i){ return years[i]; });
    items.sort(function(a, b){
      var aPlain = /^[0-9]+$/.test(a), bPlain = /^[0-9]+$/.test(b);
      if(aPlain !== bPlain) return aPlain ? 1 : -1;
      return 0;
    });
    idxs.forEach(function(i, k){ result[i] = items[k]; });
  });
  return result;
}
function archiveBullYearColumn(year){
  var yc = bullYearColumns();
  yc.active = yc.active.filter(function(y){ return y !== year; });
  if(yc.archived.indexOf(year) === -1) yc.archived.push(year);
  yc.archived = sortYearsDesc(yc.archived);
  persist();
}
function restoreBullYearColumn(year){
  var yc = bullYearColumns();
  yc.archived = yc.archived.filter(function(y){ return y !== year; });
  if(yc.active.indexOf(year) === -1) yc.active.push(year);
  yc.active = sortYearsDesc(yc.active);
  persist();
}
// Permanently removes a year column (active or archived) from the table, at
// Maria's request for a real "delete" alongside Archive/Restore -- for a
// column added by mistake (wrong year typed, an unwanted Retest column,
// etc.) rather than one that should just be hidden. Per this app's usual
// non-destructive rule, this never touches a bull's own testLog data: if
// any bull already has a result recorded under this exact year, that entry
// is left completely untouched and simply stops being shown as a column --
// it reappears on its own if this same year is ever added back later. The
// confirmation message says up front whether that applies, so it's never a
// surprise.
function deleteBullYearColumn(year){
  var withData = bullItems().filter(function(b){
    return (b.testLog || []).some(function(t){ return t.year === year; });
  }).length;
  var msg = 'Delete the "' + year + '" column?';
  msg += withData > 0
    ? (' ' + withData + ' bull' + (withData === 1 ? " has a test result" : "s have test results") + ' recorded under ' + year + ' -- that data is kept on those bulls, it just won\'t be shown as a column any more (it reappears if "' + year + '" is ever added back).')
    : ' No bull currently has any data recorded under it.';
  if(!confirm(msg)) return;
  var yc = bullYearColumns();
  yc.active = yc.active.filter(function(y){ return y !== year; });
  yc.archived = yc.archived.filter(function(y){ return y !== year; });
  persist();
}
function addBullYearColumn(e){
  e.preventDefault();
  var f = e.target;
  var year = f.year.value.trim().replace(/\s+/g, " ");
  // Accepts a plain 4-digit year ("2027") or a year plus "Retest" ("2027
  // Retest", any capitalisation) -- matching the archived Sold/Dead table's
  // existing "2021 Retest" column, for a bull that gets retested partway
  // through a year and needs its own separate result column.
  if(!/^[0-9]{4}( retest)?$/i.test(year)){
    setNotice("err", "Enter a 4-digit year (e.g. 2027) or a year plus \"Retest\" (e.g. 2027 Retest).");
    return;
  }
  year = year.replace(/ retest$/i, " Retest");
  var yc = bullYearColumns();
  if(yc.active.indexOf(year) > -1 || yc.archived.indexOf(year) > -1){
    setNotice("err", year + " is already a column here (check \"Show archived years\" if you don't see it in the table).");
    return;
  }
  insertBullYearColumn(yc.active, year);
  ui.openForms.addBullYear = false;
  persist();
}
// Places a newly added year column (from "+ Add year" above), at Maria's
// request: "the add year needs to be placed to the left of the current
// year" -- rather than plain descending year-number sort, which put a
// same-year column like "2026 Retest" (added after "2026" already existed,
// and numerically tied with it) to its *right* instead of its left.
//   - A genuine future year (e.g. "2027", added while today is still in
//     2026) keeps proper chronological order -- inserted just ahead of the
//     first existing column that isn't itself a later future year, so
//     several future years still read newest-first, exactly like before.
//   - The current year itself, a same-year variant of it (a "2026 Retest"
//     column), or an older year lands immediately to the left of the real
//     current year's own column specifically (falling back to the very
//     front of the table if that column isn't currently active).
function insertBullYearColumn(years, year){
  var currentYear = new Date().getFullYear();
  var yearNum = parseInt(year, 10);
  if(yearNum > currentYear){
    for(var i = 0; i < years.length; i++){
      if(parseInt(years[i], 10) <= yearNum){ years.splice(i, 0, year); return; }
    }
    years.push(year);
    return;
  }
  var idx = years.indexOf(String(currentYear));
  if(idx === -1){ years.unshift(year); return; }
  years.splice(idx, 0, year);
}

// Scrolls a just-opened Bulls panel (an edit/add-test form rendered below
// the table, per this app's table/form rule) into view -- with 34+ rows in
// one un-paginated table, "below the table" can be a long way from the row
// someone actually clicked, which otherwise reads as the button having done
// nothing. Harmless no-op if the panel just closed (element no longer
// exists) or doesn't exist yet for any other reason.
function scrollToExtra(id){
  var el = document.getElementById(id);
  if(el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

function renderBulls(){
  var q = ui.bullsQuery.trim().toLowerCase();
  // No sorting -- keeps bulls in exactly the order Maria's own spreadsheet
  // has them (the bulk import pushed them in that same row order, and a
  // newly-added bull goes on the end), per her request to match the
  // spreadsheet's order exactly rather than re-sorting alphabetically by tag.
  var allActive = bullItems().filter(function(b){ return b.status !== "archived"; });
  var archived = bullItems().filter(function(b){ return b.status === "archived"; });
  var matches = function(b){
    return (b.tag + " " + b.name + " " + (b.location||"") + " " + (b.breed||"")).toLowerCase().indexOf(q) > -1;
  };
  var active = q ? allActive.filter(matches) : allActive;
  var yc = bullYearColumns();

  var html = pageHead("Bulls", "Laid out the same way as the original spreadsheet -- one row per bull, every year's BBSE test result across the top.");
  html += '<div class="stat-row">' +
    '<div class="stat"><div class="stat-num">' + allActive.length + '</div><div class="stat-label">Active bulls</div></div>' +
  '</div>';
  html += '<div class="toolbar">' +
    '<input id="bulls-search-input" class="search-input" type="text" placeholder="Search bulls…" value="' + escAttr(ui.bullsQuery) + '" oninput="ui.bullsQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    '<button type="button" class="btn btn-ghost" style="width:auto;" onclick="printBullsList()">&#128424; Print list</button>' +
    (isAdmin() ? '<button type="button" class="btn btn-ghost" style="width:auto;" onclick="toggleForm(\'addBullYear\')">' + (ui.openForms.addBullYear ? "Cancel" : "+ Add year") + '</button>' : '') +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newBull\')">' + (ui.openForms.newBull ? "Cancel" : "+ Add bull") + '</button>' : '') +
  '</div>';
  if(ui.openForms.newBull) html += renderBullForm();
  if(ui.openForms.addBullYear){
    html += '<form class="form-panel" style="margin-top:10px;max-width:280px;" onsubmit="addBullYearColumn(event)">' +
      '<h4 style="margin-top:0;">Add a year column</h4>' +
      '<div class="form-grid">' +
        '<div class="field"><label>Year</label><input type="text" name="year" required placeholder="e.g. 2027 or 2027 Retest" maxlength="12" /></div>' +
      '</div>' +
      '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Add</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'addBullYear\')">Cancel</button></div>' +
    '</form>';
  }
  if(yc.archived.length){
    var hiddenYearsOpen = !!ui.openForms.bullsHiddenYears;
    html += '<div style="margin:14px 0 0;">' +
      '<button type="button" class="section-toggle-btn" onclick="toggleForm(\'bullsHiddenYears\')">' + (hiddenYearsOpen ? "Hide" : "Show") + ' archived years (' + yc.archived.join(", ") + ')</button>' +
    '</div>';
  }

  // Archiving a year column only hides it here -- it never removes the
  // column from the table Playwright/print sees when "Show archived years"
  // is open, and never touches a single bull's testLog data underneath.
  var activeTableYears = ui.openForms.bullsHiddenYears ? sortYearsDesc(yc.active.concat(yc.archived)) : yc.active.slice();
  html += renderBullsTable(active, activeTableYears, false, yc.archived);
  if(q) html += '<p class="row-muted" style="margin:8px 0 0;font-size:12px;">Showing ' + active.length + ' of ' + allActive.length + ' bulls.</p>';

  // Sold / Dead -- moved out of the active table, kept (not deleted --
  // their full test history and any PDF attachments are kept, and any of
  // them can be restored to the active table at any time) but hidden behind
  // a toggle by default at Maria's request ("hide the Sold/Dead bulls"),
  // rather than always shown in full underneath the active table as before.
  if(archived.length){
    var archivedOpen = !!ui.openForms.bullsArchived;
    html += '<div style="margin-top:26px;">' +
      '<button type="button" class="section-toggle-btn" onclick="toggleForm(\'bullsArchived\')">' + (archivedOpen ? "Hide" : "Show") + ' Sold / Dead (' + archived.length + ')</button>' +
    '</div>';
    if(archivedOpen){
      html += '<p class="row-muted" style="margin:12px 0 12px;font-size:12px;">Bulls moved out of the active list. Full test history and any attached PDFs are kept, and any of them can be restored to the active list at any time.</p>';
      html += renderBullsTable(archived, BULL_ARCHIVED_YEARS, true);
    }
  }

  return html;
}

// Renders a bulls table exactly shaped like the matching source sheet
// ("Bull Summary" for active, "Dead or Sold" for Sold / Dead) -- a plain
// data grid, every year's result shown directly in its own column (no
// per-bull toggle to open first) -- plus trailing Notes/Files/Actions
// columns for the things the spreadsheet itself didn't have (flagged
// data-quality notes, PDF attachments, edit/add-test/archive controls).
// Per this app's usual rule, a form is never rendered inside a table cell --
// clicking Edit/+Test/+Attach PDF/Mark as Sold-Dead on a row instead opens
// its panel in "extras", collected while building the rows and rendered as
// ordinary blocks below the whole table. `isArchived` only changes what
// shows in the Actions column (Edit + Restore, instead of Edit/+Test/Mark
// as Sold-Dead) -- everything else about the row is rendered identically.
// Wraps a cell's displayed content in its own block-level div. Invisible on
// screen (no styling applied there) -- it exists purely so the print
// stylesheet has something it CAN clip to a max height: browsers ignore
// max-height/overflow set directly on a table cell (its row always grows to
// fit the cell's natural content height regardless), but the same rule on an
// ordinary block-level div works as expected, which is what actually keeps
// every printed row a small, predictable height.
function pc(html){ return '<div class="print-clamp">' + html + '</div>'; }
function renderBullsTable(list, years, isArchived, archivedYearsInView){
  var extras = "";
  if(list.length === 0){
    return '<div class="empty-state">No bulls' + (isArchived ? "" : " match your search") + '.</div>' + extras;
  }
  // Hoisted here (rather than computed per-row below) since the header row
  // needs it too, for the per-year Archive/Restore controls just below.
  var admin = isAdmin() && !printingBullsMode;
  var archivedYears = archivedYearsInView || [];
  // Tag is pinned (position:sticky) at the far left edge of the table (left:0)
  // -- the one thing Maria wants to still see while scrolling sideways through
  // the year columns/Notes/Actions on the right, so it stays put like a frozen
  // first column in a spreadsheet while everything else scrolls underneath it.
  // The Location column (which used to sit before Tag) was removed at Maria's
  // request, which is what let Tag become the frozen leftmost column at all.
  // (Animal ID column removed 2026-09-27 at Maria's request -- the field
  // itself is left untouched on each bull's stored data, only the column and
  // the add/edit-bull form field were removed, so nothing already recorded
  // is lost, it's just no longer shown or collected anywhere in the app.)
  var stickyTagStyle = 'position:sticky;left:0;box-shadow:2px 0 4px -2px rgba(0,0,0,.18);';
  // Price moved to the end of the row (2026-09-27, at Maria's request) --
  // just after Notes, still ahead of the trailing Files/Actions (and
  // Reason/Date, for the archived Sold/Dead table) columns that were never
  // really "data about the bull" in the same sense.
  var headerCells = '<th style="' + stickyTagStyle + 'background:var(--surface-2);z-index:3;">Tag</th>' +
    "<th>Name</th><th>DOB</th>" +
    years.map(function(y){
      var isArchivedCol = archivedYears.indexOf(y) > -1;
      var label = esc(y) + (isArchivedCol ? ' <span class="row-muted" style="font-weight:400;font-size:11px;">(archived)</span>' : '');
      if(isArchived || !admin) return "<th>" + label + "</th>";
      var ctrl = isArchivedCol
        ? '<button type="button" class="subtle-btn" style="font-size:10px;padding:1px 4px;" title="Restore ' + esc(y) + ' to the active year columns" onclick="restoreBullYearColumn(\'' + esc(y) + '\')">&#8635; Restore</button>'
        : '<button type="button" class="subtle-btn" style="font-size:10px;padding:1px 4px;" title="Archive the ' + esc(y) + ' column -- test results for ' + esc(y) + ' are kept, this just hides the column here" onclick="archiveBullYearColumn(\'' + esc(y) + '\')">&times; Archive</button>';
      // "Delete" (as distinct from Archive/Restore, which only hide/show the
      // column) permanently removes it from the year-columns list -- for a
      // column added by mistake rather than one that should stay available.
      // Works from either state (active or archived), and confirms first
      // (deleteBullYearColumn() itself explains what happens to any data).
      var delBtn = '<button type="button" class="subtle-btn" style="font-size:10px;padding:1px 4px;color:var(--danger);" title="Delete the ' + esc(y) + ' column entirely" onclick="deleteBullYearColumn(\'' + esc(y) + '\')">Delete</button>';
      return "<th>" + label + "<br/>" + ctrl + " " + delBtn + "</th>";
    }).join("") +
    "<th>Notes</th><th>Price</th>" +
    (isArchived ? "<th>Reason</th><th>Date</th>" : "") +
    '<th class="col-files">Files</th><th class="col-actions">Actions</th>';

  var bodyRows = list.map(function(b){
    var editing = ui.editing.bull === b.id;
    // Cells only turn into live inputs for a row an admin has explicitly
    // clicked "Edit" on (2026-09-27, at Maria's request -- "as soon as I
    // touch a bull it tries to edit the entry"): every cell used to be a
    // real input all the time for any admin, which meant just tapping a
    // cell to read it (especially on a touchscreen) could look like it was
    // trying to edit. Now a row shows the exact same plain read-only text a
    // non-admin sees until "Edit" is clicked for that specific row, and
    // reverts to read-only again on "Done editing" -- nothing about how a
    // save actually happens (still on blur) changed, just when the inputs
    // are there to blur from in the first place. This also fixes needing to
    // scroll inside a cramped one-line textarea to read a longer test
    // result: the read-only view just wraps as plain text at full height.
    var rowEditing = admin && editing;
    var editKey = "bull-extra-edit_" + b.id;
    var testKey = "bull-extra-btest_" + b.id;
    var attachKey = "bull-extra-attach_" + b.id;
    var archiveKey = "bull-extra-archive_" + b.id;
    var notesKey = "bull-extra-notes_" + b.id;
    if(editing) extras += '<div class="form-panel-wrap" id="' + editKey + '" style="margin-top:10px;">' + renderBullForm(b) + '</div>';
    if(ui.openForms["btest_" + b.id]) extras += '<div class="form-panel-wrap" id="' + testKey + '" style="margin-top:10px;">' + renderBullTestForm(b) + '</div>';
    if(ui.openForms["battach_" + b.id]) extras += '<div class="form-panel-wrap" id="' + attachKey + '" style="margin-top:10px;">' + renderBullAttachmentForm(b) + '</div>';
    if(ui.openForms["archive_" + b.id]) extras += '<div class="form-panel-wrap" id="' + archiveKey + '" style="margin-top:10px;">' + renderArchiveBullForm(b) + '</div>';
    if(ui.openForms["bnotes_" + b.id]) extras += '<div class="form-panel-wrap" id="' + notesKey + '" style="margin-top:10px;">' + renderBullNotesPanel(b) + '</div>';

    var noteCount = (b.noteLog || []).length;
    // Inline spreadsheet-style editing (2026-09-27), gated behind an
    // explicit "Edit" click per row (added later the same day -- see
    // rowEditing above): once a row is in edit mode, every field an admin
    // can change is a real <input>/<textarea> sitting directly in its cell,
    // styled to look like plain text until you click into it (see
    // .cell-edit above) -- so the table can be edited exactly like the
    // original spreadsheet, cell by cell, instead of only through the form
    // panel below. Any row not currently being edited (including for a
    // non-admin, who never sees the Edit button at all) gets the same plain
    // read-only text. Saves fire in updateBullField()/updateBullTestCell()
    // below, on blur.
    var cells = '<td style="' + stickyTagStyle + 'background:var(--surface);font-weight:600;white-space:nowrap;">' +
      (rowEditing
        ? '<input type="text" class="cell-edit" style="font-weight:600;min-width:64px;" value="' + escAttr(b.tag) + '" onblur="updateBullField(this,\'' + b.id + '\',\'tag\')" />'
        : pc(esc(b.tag))
      ) + '</td>' +
      '<td style="white-space:nowrap;">' +
      (rowEditing
        ? '<div style="display:flex;align-items:center;gap:4px;">' +
            '<input type="text" class="cell-edit" style="color:var(--accent-strong);font-weight:600;min-width:110px;" value="' + escAttr(b.name) + '" onblur="updateBullField(this,\'' + b.id + '\',\'name\')" />' +
            '<button type="button" class="subtle-btn" style="font-size:10px;padding:2px 4px;flex:none;white-space:nowrap;" title="Dated notes on ' + escAttr(b.name) + (noteCount ? " (" + noteCount + ")" : "") + '" onclick="toggleForm(\'bnotes_' + b.id + '\');scrollToExtra(\'' + notesKey + '\');">&#128172;' + (noteCount ? ' ' + noteCount : '') + '</button>' +
          '</div>'
        : '<div style="color:var(--accent-strong);font-weight:600;cursor:pointer;" onclick="toggleForm(\'bnotes_' + b.id + '\');scrollToExtra(\'' + notesKey + '\');" title="Click for notes on ' + escAttr(b.name) + '">' + pc(esc(b.name) + (noteCount ? ' <span class="row-muted" style="font-weight:400;font-size:11px;">(' + noteCount + ')</span>' : '')) + '</div>'
      ) + '</td>' +
      '<td style="white-space:nowrap;">' +
      (rowEditing
        ? '<input type="date" class="cell-edit" style="min-width:132px;" value="' + escAttr(b.dob || "") + '"' + (!b.dob && b.dobRaw ? ' title="Spreadsheet import had: ' + escAttr(b.dobRaw) + '"' : '') + ' onblur="updateBullField(this,\'' + b.id + '\',\'dob\')" />'
        : pc(b.dob ? fmtDate(b.dob) : (b.dobRaw ? esc(b.dobRaw) : "—"))
      ) + '</td>';

    // Each year's cell just shows the test summary text -- the "+ BBSE
    // detail" toggle (and the inline detail row it opened, with the
    // structured breed/BCS/scrotal-circumference/motility/etc. fields from
    // the merged July-2025 records) was removed at Maria's request. The
    // underlying t.detail data itself is untouched in state -- this only
    // removed the button and the row that displayed it.
    // For an admin, this cell is now directly editable -- typing a result
    // and clicking away saves it (creating that year's entry if it didn't
    // exist yet), and clearing it back to blank removes the entry entirely,
    // same as clearing a cell in a spreadsheet. This also fixes a gap the
    // old "+ Test" button had: there was previously no way to correct or
    // remove a test result already entered for a year, only add a new one.
    years.forEach(function(y){
      var t = (b.testLog || []).find(function(tt){ return tt.year === y; });
      if(rowEditing){
        cells += '<td style="min-width:170px;">' +
          '<textarea class="cell-edit" rows="2" style="min-width:160px;" placeholder="—" onblur="updateBullTestCell(this,\'' + b.id + '\',\'' + esc(y) + '\')">' + esc(t ? t.summary : "") + '</textarea>' +
        '</td>';
        return;
      }
      if(!t){ cells += '<td class="row-muted">' + pc("—") + '</td>'; return; }
      cells += '<td style="min-width:170px;">' + pc(bullTestDisplay(t.summary)) + '</td>';
    });

    // Notes column -- previously only showed the single legacy free-text
    // b.notes field (flagged data-quality notes carried over from the
    // spreadsheet import), which is a different, older field than the
    // per-bull noteLog panel opened by clicking the bull's name -- so a note
    // added there ("it doesn't show up in the notes section to the right of
    // the bull's name") never appeared in this column at all, even though
    // its "(N)" count next to the name updated correctly. Fixed by also
    // showing the most recent noteLog entry here (dated, so it's clear it's
    // the latest of possibly several -- click the notes icon for the full
    // list), stacked above any legacy b.notes text rather than replacing it,
    // so nothing already recorded is lost. For an admin, the legacy b.notes
    // text itself is now directly editable here too; the dated noteLog
    // history stays read-only in this cell (open its own panel to add to
    // it) since it's a list of separate dated entries, not one field a
    // single cell can hold.
    var latestNote = (b.noteLog && b.noteLog.length) ? b.noteLog.slice().sort(byDateDesc("date"))[0] : null;
    var latestNoteHtml = latestNote ? '<div style="margin-bottom:4px;">' + esc(latestNote.text) + ' <span style="font-size:10.5px;">(' + fmtDate(latestNote.date) + ')</span></div>' : "";
    if(rowEditing){
      cells += '<td style="min-width:160px;font-size:11.5px;" class="row-muted">' + latestNoteHtml +
        '<textarea class="cell-edit" rows="2" style="min-width:150px;font-size:11.5px;" placeholder="Notes…" onblur="updateBullField(this,\'' + b.id + '\',\'notes\')">' + esc(b.notes || "") + '</textarea>' +
      '</td>';
    } else {
      var notesCellHtml = latestNoteHtml + (b.notes ? '<div' + (latestNote ? ' style="padding-top:4px;border-top:1px solid var(--border);"' : '') + '>' + esc(b.notes) + '</div>' : "");
      cells += '<td style="min-width:160px;font-size:11.5px;" class="row-muted">' + pc(notesCellHtml) + '</td>';
    }
    // Price -- moved here, to the end of the row, at Maria's request.
    cells += '<td style="white-space:nowrap;">' +
      (rowEditing
        ? '<input type="number" step="1" class="cell-edit" style="min-width:90px;" value="' + escAttr(b.purchasePrice != null ? b.purchasePrice : "") + '"' + (b.purchasePrice == null && b.purchasePriceRaw ? ' placeholder="' + escAttr(b.purchasePriceRaw) + '"' : '') + ' onblur="updateBullField(this,\'' + b.id + '\',\'purchasePrice\',true)" />'
        : pc(b.purchasePriceRaw ? esc(b.purchasePriceRaw) : fmtMoney(b.purchasePrice))
      ) + '</td>';
    if(isArchived){
      cells += '<td style="min-width:120px;white-space:nowrap;">' + pc(b.archivedReason ? esc(b.archivedReason) : '<span class="row-muted">No reason given</span>') + '</td>' +
        '<td style="white-space:nowrap;">' + pc(b.archivedDate ? fmtDate(b.archivedDate) : "—") + '</td>';
    }

    // PDF attachments (registration papers, certificates, sale documents,
    // etc.) -- each just a small link plus, for an admin, its own remove
    // button; the upload control itself is a real form (a file input), so
    // per this app's usual rule it can't live in this cell and instead opens
    // below the whole table, in "extras", the same way Edit/+Test do.
    var attachList = (b.attachments || []).map(function(a){
      return '<div style="white-space:nowrap;">' +
        '<a href="' + escAttr(a.url) + '" target="_blank" rel="noopener" onclick="return openStoredFile(\'' + escAttr(a.url) + '\')" style="font-size:11.5px;">&#128196; ' + esc(a.name || "PDF") + '</a>' +
        (isAdmin() ? ' <button type="button" class="subtle-btn" style="font-size:10px;padding:0 3px;" title="Remove" onclick="removeBullAttachment(\'' + b.id + '\',\'' + a.id + '\')">&times;</button>' : '') +
      '</div>';
    }).join("");
    var filesCell = '<td class="col-files" style="min-width:130px;font-size:11.5px;">' + attachList;
    if(isAdmin()){
      filesCell += '<button type="button" class="subtle-btn" style="font-size:10.5px;margin-top:2px;" onclick="toggleForm(\'battach_' + b.id + '\');scrollToExtra(\'' + attachKey + '\');">' + (ui.openForms["battach_" + b.id] ? "Cancel" : "+ Attach PDF") + '</button>';
    } else if(!attachList){
      filesCell += '<span class="row-muted">—</span>';
    }
    filesCell += '</td>';

    var actions = '<td class="col-actions" style="white-space:nowrap;">';
    if(isAdmin()){
      // A row's cells only become editable once "Edit" is clicked here --
      // see rowEditing above for why (2026-09-27: touching a cell was
      // triggering edit mode with no explicit action first). "Edit" also
      // opens the full form panel below for breed/location and other fields
      // not shown as their own column, same as it always has.
      actions += (editing
        ? '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.bull=null;render();">Done editing</button> '
        : '<button type="button" class="btn btn-ghost btn-sm" title="Edit this bull -- tag, name, DOB, test results, notes, price, and other fields not shown in the table" onclick="ui.editing.bull=\'' + b.id + '\';render();scrollToExtra(\'' + editKey + '\');">Edit</button> '
      );
      if(isArchived){
        actions += '<button type="button" class="btn btn-ghost btn-sm" onclick="restoreBull(\'' + b.id + '\')">Restore to active</button> ' +
          '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + b.id + '\');scrollToExtra(\'' + archiveKey + '\');">' + (ui.openForms["archive_" + b.id] ? "Cancel" : "Edit reason / date") + '</button>';
      } else {
        actions += '<button type="button" class="btn btn-ghost btn-sm" title="Add a test result for a year not shown as a column above, or with detailed BBSE measurements" onclick="toggleForm(\'btest_' + b.id + '\');scrollToExtra(\'' + testKey + '\');">' + (ui.openForms["btest_" + b.id] ? "Cancel" : "+ Detailed test") + '</button> ' +
          '<button type="button" class="btn btn-ghost btn-sm" onclick="toggleForm(\'archive_' + b.id + '\');scrollToExtra(\'' + archiveKey + '\');">' + (ui.openForms["archive_" + b.id] ? "Cancel" : "Mark as Sold / Dead") + '</button>';
      }
    }
    actions += '</td>';

    return "<tr>" + cells + filesCell + actions + "</tr>";
  }).join("");

  return '<div class="table-wrap"><table class="bulls-table"><thead><tr>' + headerCells + '</tr></thead><tbody>' + bodyRows + '</tbody></table></div>' + extras;
}

// "Print list" (2026-09-24, at Maria's request) -- the Bulls table normally
// lives in a horizontally-scrolling, sticky-Tag-column container built for
// screen viewing, which a browser's print engine can't reflow: printed as-is
// it would just clip everything past one page's width instead of showing the
// rest of the columns. Printing instead adds a body class that a dedicated
// @media print stylesheet (see .printing-bulls rules) uses to switch the
// page to landscape A4, drop the sidebar/search/stat row/Files/Actions
// columns (all screen-only, not useful on paper), shrink the table down to a
// compact but legible size, and repeat the header row on every printed page
// -- which comfortably fits the whole active list within a couple of A4
// sheets instead of spilling across many, or clipping columns off entirely.
function printBullsList(){
  // Switch every cell back to plain read-only text for the duration of the
  // print (see printingBullsMode above), then print, then switch back.
  printingBullsMode = true;
  render();
  document.body.classList.add("printing-bulls");
  var cleanup = function(){
    document.body.classList.remove("printing-bulls");
    printingBullsMode = false;
    render();
    window.removeEventListener("afterprint", cleanup);
  };
  window.addEventListener("afterprint", cleanup);
  window.print();
  // Fallback for browsers that don't fire afterprint reliably (some mobile
  // WebViews) -- print dialogs are modal, so by the time this fires the
  // person has already either printed or cancelled either way.
  setTimeout(cleanup, 3000);
}

function saveBull(e, id){
  e.preventDefault();
  var f = e.target;
  var data = {
    tag: f.tag.value.trim(), name: f.name.value.trim(),
    breed: f.breed.value.trim(), location: f.location.value.trim(), dob: f.dob.value,
    purchasePrice: f.purchasePrice.value === "" ? null : parseFloat(f.purchasePrice.value),
    notes: f.notes.value.trim()
  };
  if(!data.tag || !data.name) return;
  state.bulls = state.bulls || { items: [] };
  if(id){
    var existing = byId(state.bulls.items, id);
    if(existing) Object.assign(existing, data);
    ui.editing.bull = null;
  } else {
    state.bulls.items.push(Object.assign({ id: uid("bull"), status: "active", testLog: [] }, data));
    ui.openForms.newBull = false;
  }
  persist();
}

// Inline spreadsheet-style editing on the Bulls table (2026-09-27) -- called
// from an <input>/<textarea>'s onblur (leaving the cell), not on every
// keystroke, since this app fully re-renders its HTML from state on every
// change and doing that mid-keystroke would yank the cursor out of the field.
// field is one of: tag, name, dob, purchasePrice, notes.
function updateBullField(el, id, field, isNumber){
  var b = byId(bullItems(), id);
  if(!b) return;
  var raw = el.value;
  var newVal;
  if(isNumber){
    newVal = raw.trim() === "" ? null : parseFloat(raw);
    if(newVal != null && isNaN(newVal)) newVal = null;
  } else {
    newVal = raw.trim();
  }
  if((field === "tag" || field === "name") && !newVal){
    // Tag and Name are required -- revert the cell rather than save a blank
    // that would make the bull unfindable/unnamed, and tell Maria why.
    el.value = b[field] || "";
    setNotice("err", (field === "tag" ? "Tag" : "Name") + " can't be left blank -- change reverted.");
    return;
  }
  var current = b[field];
  if(current == null) current = isNumber ? null : "";
  if(current === newVal) return; // nothing actually changed -- skip the write
  b[field] = newVal;
  // A fresh, clean entry supersedes the old spreadsheet-import fallback text
  // for that same field, so the table doesn't keep showing stale raw text
  // alongside (or instead of) the new value once it's actually been edited.
  if(field === "purchasePrice") b.purchasePriceRaw = null;
  if(field === "dob" && newVal) b.dobRaw = null;
  persist();
}

// Same idea, for one year's test-result cell. Clearing the cell back to
// blank removes that year's test-log entry entirely (same as clearing a
// spreadsheet cell) -- this also fixes a gap the old "+ Test" button had,
// where a result already entered for a year could never be corrected or
// removed, only added to for a year that didn't have one yet.
function updateBullTestCell(el, id, year){
  var b = byId(bullItems(), id);
  if(!b) return;
  var newVal = el.value.trim();
  b.testLog = b.testLog || [];
  var existing = b.testLog.find(function(t){ return t.year === year; });
  var current = existing ? existing.summary : "";
  if(current === newVal) return;
  if(!newVal){
    if(existing) b.testLog = b.testLog.filter(function(t){ return t !== existing; });
  } else if(existing){
    existing.summary = newVal;
  } else {
    b.testLog.push({ id: uid("bt"), year: year, summary: newVal });
  }
  persist();
}

function addBullTest(e, id){
  e.preventDefault();
  var f = e.target;
  var year = f.year.value.trim();
  var summary = f.summary.value.trim();
  if(!year || !summary) return;
  var b = byId(bullItems(), id);
  if(!b) return;
  var entry = { id: uid("bt"), year: year, summary: summary };
  var detailFields = {
    breed: f.breed.value.trim(), age: f.age.value.trim(), weight: f.weight.value.trim(),
    bcs: f.bcs.value.trim(), gaitLegs: f.gaitLegs.value.trim(),
    scrotalCircumference: f.scrotalCircumference.value.trim(), testesTone: f.testesTone.value.trim(),
    sheath: f.sheath.value.trim(), penisPrepuce: f.penisPrepuce.value.trim(),
    semenColour: f.semenColour.value.trim(), mass: f.mass.value.trim(),
    motility: f.motilityPct.value !== "" ? parseFloat(f.motilityPct.value) / 100 : null,
    morphSampleNo: f.morphSampleNo.value.trim(),
    normalMorphology: f.normalMorphologyPct.value !== "" ? parseFloat(f.normalMorphologyPct.value) / 100 : null,
    comments: f.comments.value.trim()

// PDF attachments (registration papers, BBSE certificates, sale documents,
// etc.) live in a separate "bulls" Supabase Storage bucket -- see
// supabase-storage-setup-bulls.sql, a one-time SQL step alongside the
// existing "maps" bucket setup. Same upload pattern as Maps' PDF support
// (addMap): uploaded as-is (no compression -- that's only for photos),
// stored publicly, and the bull just keeps the public URL + storage path.
function renderBullAttachmentForm(b){
  return '<form class="form-panel" style="margin-top:10px;" onsubmit="addBullAttachment(event,\'' + b.id + '\')">' +
    '<h4 style="margin-top:0;">Attach a PDF — ' + esc(b.name) + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Label</label><input type="text" name="label" placeholder="e.g. Registration papers, BBSE certificate" /></div>' +
      '<div class="field"><label>PDF file</label><input type="file" name="pdf" accept="application/pdf,.pdf" required /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Upload</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'battach_' + b.id + '\')">Cancel</button></div>' +
  '</form>';
}
async function addBullAttachment(e, id){
  e.preventDefault();
  var f = e.target;
  var label = f.label.value.trim();
  var file = f.pdf.files && f.pdf.files[0];
  if(!file) return;
  var b = byId(bullItems(), id);
  if(!b) return;
  if(!supabaseClient){
    setNotice("err", "Can't upload a PDF right now (not connected to the database). Text and other changes still work offline, but file uploads need a connection at the moment you add them — try again once you're back online.");
    render();
    return;
  }
  var submitBtn = f.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
  try{
    var path = uid("battach") + ".pdf";
    var upRes = await supabaseClient.storage.from("bulls").upload(path, file, { cacheControl: "3600", upsert: false, contentType: "application/pdf" });
    if(upRes.error) throw upRes.error;
    var pub = supabaseClient.storage.from("bulls").getPublicUrl(path);
    b.attachments = b.attachments || [];
    b.attachments.push({ id: uid("battach"), name: label || file.name || "PDF", url: pub.data.publicUrl, storagePath: path });
    ui.openForms["battach_" + id] = false;
    persist();
  }catch(err){
    console.error("[Bullamon Plains] bull PDF upload failed:", err);
    setNotice("err", "Couldn't upload that PDF (" + (err && err.message ? err.message : "unknown error") + "). If you're offline or have a weak signal, try again once you're back in range.");
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Upload"; }
    render();
  }
}
function removeBullAttachment(bullId, attachmentId){
  var b = byId(bullItems(), bullId);
  if(!b) return;
  var att = (b.attachments || []).find(function(a){ return a.id === attachmentId; });
  if(att && att.storagePath && supabaseClient){
    supabaseClient.storage.from("bulls").remove([att.storagePath]).catch(function(err){
      console.error("[Bullamon Plains] couldn't delete the stored bull PDF (it will be left orphaned in storage, but this doesn't affect the app):", err);
    });
  }
  removeById(b.attachments, attachmentId);
  persist();
}

function addBullNote(e, bullId){
  e.preventDefault();
  var f = e.target;
  var errKey = "bullNote_" + bullId;
  var date = f.date.value;
  var text = f.text.value.trim();
  if(!date || !text){
    ui.formErrors[errKey] = !date ? "Enter a date." : "Write something before adding.";
    render();
    return;
  }
  delete ui.formErrors[errKey];
  var b = byId(bullItems(), bullId);
  if(!b) return;
  var u = currentUser();
  b.noteLog = b.noteLog || [];
  b.noteLog.push({ id: uid("bullnote"), date: date, author: u ? u.name : "Unknown", text: text });
  persist();
}
function confirmDeleteBullNote(bullId, noteId){
  var b = byId(bullItems(), bullId);
  if(!b) return;
  var n = byId(b.noteLog, noteId);
  if(!n) return;
  var preview = n.text.length > 40 ? (n.text.slice(0,40) + "...") : n.text;
  if(confirm('Delete this note ("' + preview + '")? This cannot be undone.')){
    removeById(b.noteLog, noteId);
    persist();
  }
}

function archiveBull(e, id){

   SOPs
   ====================================================================== */
function renderSops(){
  var q = ui.sopQuery.trim().toLowerCase();
  var list = state.sops || [];
  if(q) list = list.filter(function(s){
    return (s.machine + " " + s.title + " " + (s.category||"") + " " + (s.heading||"")).toLowerCase().indexOf(q) > -1;
  });

  var html = pageHead("Standard Operating Procedures", "Pre-start checks and safe operating steps for farm machinery.");
  html += '<div class="toolbar">' +
    '<input id="sop-search-input" class="search-input" type="text" placeholder="Search Operating Procedures…" value="' + escAttr(ui.sopQuery) + '" oninput="ui.sopQuery=this.value;render();" />' +
    '<span style="flex:1;"></span>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newSop\')">' + (ui.openForms.newSop ? "Cancel" : "+ Add Operating Procedure") + '</button>' : '') +
  '</div>';
  html += sopHeadingOptionsList();
  if(ui.openForms.newSop) html += renderSopForm();
  if(list.length === 0){ html += '<div class="empty-state">No Operating Procedures match your search.</div>'; return html; }

  // SOPs that share the same "Heading" (set on each SOP's own form) are
  // linked together and displayed as one group under that shared heading --
  // e.g. "Pre-start check", "Shutdown procedure" and "Emergency stop" for the
  // same machine (or topic) can all be given the heading "Tractors" so they
  // read as one connected set instead of scattered separate cards further
  // down an alphabetised or otherwise unrelated list. An SOP left with no
  // heading still displays entirely on its own, exactly as before -- nothing
  // about existing SOPs needs to change unless Maria wants to link them up.
  var groups = [];
  var groupIndex = {};
  var ungrouped = [];
  list.forEach(function(s){
    var h = (s.heading || "").trim();
    if(!h){ ungrouped.push(s); return; }
    if(!(h in groupIndex)){ groupIndex[h] = groups.length; groups.push({ heading: h, items: [] }); }
    groups[groupIndex[h]].items.push(s);
  });
  groups.sort(function(a,b){ return a.heading.localeCompare(b.heading); });

  html += groups.map(renderSopGroup).join("");
  html += ungrouped.map(renderSopCard).join("");
  return html;
}
function sopHeadingOptionsList(){
  var heads = Array.from(new Set((state.sops || []).map(function(s){ return (s.heading || "").trim(); }).filter(Boolean))).sort(function(a,b){ return a.localeCompare(b); });
  return '<datalist id="sop-heading-options">' + heads.map(function(h){ return '<option value="' + escAttr(h) + '"></option>'; }).join("") + '</datalist>';
}
// A linked group is rendered as one card with a shared heading, containing
// each member SOP's own section (still individually editable/deletable)
// separated by a thin rule -- everything but the outer wrapper is identical
// to a standalone SOP card, via the shared renderSopSectionBody below.
function renderSopGroup(group){
  // A dedicated class/tag rather than reusing <h2> -- the page's own title
  // (pageHead) is already an <h2>, so this stays a level below it instead of
  // creating a second, same-level heading with a different meaning.
  return '<div class="card">' +
    '<h3 class="sop-group-heading">' + esc(group.heading) + '</h3>' +
    group.items.map(renderSopGroupMember).join('<hr style="border:none;border-top:1px solid var(--border);margin:16px 0;" />') +
  '</div>';
}
// A linked group's members are collapsed to just their title/subtitle row by
// default (2026-09-24, at Maria's request), rather than every member's full
// steps/photos always showing at once under a shared heading -- clicking a
// row (or "Edit") expands it, same on/off pattern as everything else in this
// app that starts collapsed (machine cards, service history, etc.). A
// standalone SOP with no heading (renderSopCard, below) is unaffected --
// it's not "listed beneath" anything else, so it still always shows in full.
function renderSopGroupMember(s){
  if(ui.editing.sop === s.id) return renderSopForm(s);
  var expandKey = "sopExpand_" + s.id;
  if(ui.openForms[expandKey]) return renderSopSectionBody(s, { collapsible: true });
  return '<div class="card-row" style="cursor:pointer;" onclick="ui.openForms[\'' + expandKey + '\']=true;render();">' +
    '<div><h3 style="margin-bottom:2px;">' + esc(s.machine) + '</h3><p class="row-muted" style="margin:0;font-size:12.5px;">' + esc(s.title) + ' &middot; ' + esc(s.category) + '</p></div>' +
    '<span class="row-muted" style="font-size:12px;white-space:nowrap;">&#9662; Details</span>' +
  '</div>';
}
function renderSopCard(s){
  if(ui.editing.sop === s.id) return renderSopForm(s);
  return '<div class="card">' + renderSopSectionBody(s) + '</div>';
}
function renderSopSectionBody(s, opts){
  opts = opts || {};
  var photos = s.photos || [];
  var photoFormKey = "sopPhoto_" + s.id;

// Same storage/compression pattern as Maps' photo upload (compressMapPhoto,
// below in this file -- function declarations are hoisted so the order
// doesn't matter) and Bulls' PDF attachments, just against its own "sop-photos"
// bucket so a step's reference photos (e.g. "guard should look like this",
// "correct hose routing") live alongside that SOP rather than in Maps.
async function addSopPhoto(e, sopId){
  e.preventDefault();
  var f = e.target;
  var formKey = "sopPhoto_" + sopId;
  var file = f.photo && f.photo.files && f.photo.files[0];
  if(!file){
    ui.formErrors[formKey] = "Choose a photo first.";
    render();
    return;
  }
  if(!supabaseClient){
    ui.formErrors[formKey] = "Can't upload a photo right now (not connected to the database). Try again once you're back online.";
    render();
    return;
  }
  delete ui.formErrors[formKey];
  var submitBtn = f.querySelector('button[type="submit"]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = "Uploading…"; }
  try{
    var uploadBlob = await compressMapPhoto(file);
    var path = uid("sopphoto") + ".jpg";
    var upRes = await supabaseClient.storage.from("sop-photos").upload(path, uploadBlob, { cacheControl: "3600", upsert: false, contentType: "image/jpeg" });
    if(upRes.error) throw upRes.error;
    var pub = supabaseClient.storage.from("sop-photos").getPublicUrl(path);
    var s = byId(state.sops, sopId);
    if(!s){ render(); return; }
    s.photos = s.photos || [];
    s.photos.push({ id: uid("p"), url: pub.data.publicUrl, storagePath: path });
    ui.openForms[formKey] = false;
    persist();
  }catch(err){
    console.error("[Bullamon Plains] SOP photo upload failed:", err);
    ui.formErrors[formKey] = "Couldn't upload that photo (" + (err && err.message ? err.message : "unknown error") + "). If you're offline or have a weak signal, try again once you're back in range.";
    if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = "Upload"; }
    render();
  }
}
function removeSopPhoto(sopId, photoId){
  var s = byId(state.sops, sopId);
  if(!s) return;
  var photo = (s.photos || []).find(function(p){ return p.id === photoId; });
  if(!confirm("Remove this photo? This cannot be undone.")) return;
  if(photo && photo.storagePath && supabaseClient){
    supabaseClient.storage.from("sop-photos").remove([photo.storagePath]).catch(function(err){
      console.error("[Bullamon Plains] couldn't delete the stored SOP photo (it will be left orphaned in storage, but this doesn't affect the app):", err);
    });
  }
  removeById(s.photos, photoId);
  persist();
}

// screen (matching Maria's reference photo of a categorised, card-based SDS
// layout), the same list/detail pattern already used for Machinery
// Maintenance (see ui.machinerySelected / renderMachineDetail). The photo
// was a style reference from elsewhere, not real data already in this app --
// most of the specific fields it showed (APVMA number, poison schedule,
// PPE list, detailed spray conditions, buffer distances, withholding by
// crop) didn't exist on any chemical yet, so this adds them as new, entirely
// optional fields rather than inventing values: a chemical with none of them
// filled in just shows a shorter detail page (each card below only renders
// when it actually has something to show), never a fabricated number.
function renderSds(){
  var selected = ui.sdsSelected ? byId(state.chemicals.sds || [], ui.sdsSelected) : null;
  if(ui.sdsSelected && !selected) ui.sdsSelected = null;
  return selected ? renderSdsDetail(selected) : renderSdsList();
}

// A chemical is missing its real safety info -- as opposed to just not
// having filled in every optional field -- when NONE of the actual SDS
// content (hazard class, signal word, first aid) has been added yet.
// Anything in this state gets a loud warning instead of quietly
// rendering nothing.
function sdsNeedsDetails(c){
  return !c.hazardClass && !c.signalWord && !c.firstAid;
}
function renderSdsList(){
  var html = pageHead("Safety Data Sheets", "Product safety information for every chemical kept on farm.");

  var sdsQ = ui.sdsQuery.trim().toLowerCase();
  var sdsAll = state.chemicals.sds || [];
  var sdsList = sdsAll;
  if(sdsQ) sdsList = sdsList.filter(function(c){
    return (
      (c.productName||"") + " " + (c.activeConstituent||"") + " " + (c.hazardClass||"") + " " +
      (c.signalWord||"") + " " + (c.withholdingPeriod||"") + " " +
      (c.chemicalType||"")
    ).toLowerCase().indexOf(sdsQ) > -1;
  });
  var sdsNeedingReview = sdsAll.filter(sdsNeedsDetails).length;

  html += '<div class="card"><div class="card-row"><h3 style="margin:0;">Safety data sheets</h3>' +
    (isAdmin() ? '<button type="button" class="btn btn-primary btn-sm" style="width:auto;" onclick="toggleForm(\'newSds\')">' + (ui.openForms.newSds ? "Cancel" : "+ Add SDS") + '</button>' : '') + '</div>' +
    (sdsNeedingReview > 0 ? '<p class="row-muted" style="margin:6px 0 0;font-size:12.5px;color:#991b1b;">⚠ ' + sdsNeedingReview + ' of ' + sdsAll.length + ' chemicals still need their full safety details (hazard class, first aid) added from the real SDS.</p>' : '') +
    '<p class="row-muted" style="margin:6px 0 0;font-size:12px;">Tap a chemical to see its full safety information.</p>' +
    '<div class="toolbar" style="margin:10px 0 0;">' +
      '<input id="sds-search-input" class="search-input" type="text" placeholder="Search safety data sheets…" value="' + escAttr(ui.sdsQuery) + '" oninput="ui.sdsQuery=this.value;render();" />' +
      '<button type="button" class="btn btn-ghost btn-sm" style="width:auto;" onclick="searchWebForSds()" title="Opens a new tab with a web search for this product\'s SDS">Search the web ↗</button>' +
      '<a class="btn btn-ghost btn-sm" style="width:auto;text-decoration:none;display:inline-block;" href="https://portal.apvma.gov.au/pubcris" target="_blank" rel="noopener" title="Opens the official APVMA product register in a new tab">Search APVMA ↗</a>' +
    '</div>';
  if(ui.openForms.newSds) html += renderSdsForm();
  if(sdsList.length === 0){
    html += '<div class="empty-state">No safety data sheets match your search.' +
      (sdsQ ? ' Not in our list? <button type="button" class="subtle-btn" onclick="searchWebForSds()">Search the web for it instead</button>' : '') +
    '</div>';
  }
  html += '<div class="list-cards" style="margin-top:8px;">' + sdsList.map(function(c){
    var needsDetails = sdsNeedsDetails(c);
    return '<div class="card" style="cursor:pointer;box-shadow:none;border:1px solid var(--border);" onclick="ui.sdsSelected=\'' + c.id + '\';render();">' +
      '<div class="card-row" style="margin-bottom:4px;"><strong style="font-size:13.5px;">' + esc(c.productName) + '</strong>' +
        (needsDetails ? '<span class="pill" style="background:#fee2e2;color:#991b1b;white-space:normal;text-align:left;">⚠ Needs SDS details</span>' : '<span class="pill pill-medium" style="white-space:normal;text-align:left;">' + esc(c.signalWord) + '</span>') +
      '</div>' +
      (c.activeConstituent || c.hazardClass ? '<p class="row-muted" style="margin:0;font-size:12.5px;">' + esc(c.activeConstituent) + (c.activeConstituent && c.hazardClass ? ' &middot; ' : '') + esc(c.hazardClass) + '</p>' : '') +
      (c.chemicalType ? '<p class="row-muted" style="margin:2px 0 0;font-size:12.5px;">' + esc(c.chemicalType) + '</p>' : '') +
    '</div>';
  }).join("") + '</div>';
  html += '</div>';

  return html;
}
// Doesn't fetch or display anything inside the app -- this app has no
// backend of its own to run a real web search through, so "search the
// web" means exactly that: open a new browser tab at a normal web search
// for this product's SDS, using whatever's currently in the search box.
function searchWebForSds(){
  var q = (ui.sdsQuery || "").trim();
  if(!q){
    setNotice("err", "Type a chemical or product name in the search box above first, then try again.");
    render();
    return;
  }
  var url = "https://www.google.com/search?q=" + encodeURIComponent(q + " safety data sheet SDS");
  window.open(url, "_blank", "noopener");
}

// A single row inside one of the detail cards below: a small muted label on
// the left, the value bold on the right -- matches the reference photo's
// "Product identity"/"Spray conditions" rows.
function sdsInfoRow(label, value){
  if(!value) return "";
  return '<div class="card-row" style="padding:7px 0;border-top:1px solid var(--border);"><span class="row-muted" style="font-size:12.5px;">' + esc(label) + '</span><strong style="font-size:13px;text-align:right;">' + esc(value) + '</strong></div>';
}
function sdsBulletList(items){
  if(!items || !items.length) return "";
  return '<ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.6;">' + items.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join("") + '</ul>';
}
// List-of-pairs fields (buffer distances, withholding by crop) are entered
// as plain "Label: Value" lines in a textarea rather than a dynamic
// add/remove row editor -- simplest thing that lets Maria enter an
// arbitrary number of rows without a much bigger UI component.
function parseSdsPairLines(v){
  return String(v||"").split("\n").map(function(s){ return s.trim(); }).filter(Boolean).map(function(line){
    var idx = line.indexOf(":");
    if(idx === -1) return { label: line, value: "" };
    return { label: line.slice(0, idx).trim(), value: line.slice(idx+1).trim() };
  });
}
function joinSdsPairLines(pairs){
  return (pairs||[]).map(function(p){ return p.value ? (p.label + ": " + p.value) : p.label; }).join("\n");
}
function parseSdsBulletLines(v){
  return String(v||"").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
}

function renderSdsDetail(c){
  if(ui.editing.sds === c.id){
    return '<button type="button" class="back-chevron-btn" onclick="ui.sdsSelected=null;render();">&#8249; Back to Safety Data Sheets</button>' +
      '<div class="card">' + renderSdsForm(c) + '</div>';
  }
  var spray = c.spray || {};
  var storagePoints = (c.storagePoints && c.storagePoints.length) ? c.storagePoints : (c.storageRequirements ? [c.storageRequirements] : []);
  var harvestRows = (c.withholdingHarvest && c.withholdingHarvest.length) ? c.withholdingHarvest : (c.withholdingPeriod ? [{ label: "Harvest", value: c.withholdingPeriod }] : []);
  var grazingRows = c.withholdingGrazing || [];

  var categoryParts = [];
  if(c.chemicalType) categoryParts.push(c.chemicalType.toUpperCase());
  if(c.groupNumber) categoryParts.push("GROUP " + c.groupNumber);
  if(c.formulationCode) categoryParts.push(c.formulationCode.toUpperCase());

  var html = '<button type="button" class="back-chevron-btn" onclick="ui.sdsSelected=null;render();">&#8249; Back to Safety Data Sheets</button>';

  html += '<div class="card">';
  if(categoryParts.length) html += '<p class="row-muted" style="margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.06em;">' + esc(categoryParts.join(" · ")) + '</p>';
  html += '<h3 style="margin:0 0 2px;font-size:20px;">' + esc(c.productName) + '</h3>';
  if(c.manufacturer) html += '<p class="row-muted" style="margin:0;font-size:12.5px;">' + esc(c.manufacturer) + '</p>';
  if(isAdmin()){
    html += '<div style="display:flex;gap:8px;margin-top:12px;">' +
      '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.sds=\'' + c.id + '\';render();">Edit</button>' +
      '<button type="button" class="btn btn-danger btn-sm" onclick="if(confirm(\'Remove this chemical from the SDS list? This cannot be undone.\')){removeSds(\'' + c.id + '\')}">Remove</button>' +
    '</div>';
  }
  html += '</div>';

  // "Find the current SDS" -- added 2026-09-29 at Maria's request, after a
  // conversation about WHS compliance: the law requires workers have access
  // to the CURRENT safety data sheet for a hazardous chemical, and a lot of
  // product names on this register are genuinely ambiguous (several
  // different companies sell a "Weedmaster" or a "Tackle" with different
  // active constituents), so a written summary Claude has researched or
  // transcribed can never fully substitute for staff being able to look up
  // the exact product themselves. This card links out to a searchable,
  // authoritative register (and a per-product web search) instead of (or
  // alongside) the quick-reference fields below -- shown on every chemical,
  // not just the ones missing data.
  //
  // CORRECTED 2026-09-29 (same day, a few hours after first shipping this):
  // Maria pointed out Infopest is no longer active -- checked, and she's
  // right: Infopest (run by QFVG, formerly Growcom) permanently closed on
  // 31 January 2024 ("all access closed to prevent any liability issues
  // around unmaintained data" -- QFVG's own closure notice), so the first
  // version of this button linked to a dead site. Replaced with the
  // official APVMA PubCRIS product register (portal.apvma.gov.au/pubcris),
  // confirmed live and free with no login, and currently the resource
  // government guidance (business.qld.gov.au) actually points growers to.
  // The second button no longer links to a second static site (nothing
  // else free/public/current enough was confirmed) -- instead it runs an
  // actual web search for *this specific product* plus "APVMA label SDS
  // Australia", which is more useful per-chemical than a second homepage
  // link and doesn't depend on any one third-party site staying online.
  html += '<div class="card" style="background:var(--accent-contrast);border:1px solid var(--accent);">' +
    '<h3 style="margin:0 0 4px;font-size:15px;color:var(--accent-strong);">Find the current SDS</h3>' +
    '<p style="margin:0 0 12px;font-size:12.5px;color:var(--text-muted);">The details further down this page are a quick reference and may not reflect the latest label revision, or may be for a different branded product with the same active ingredient. For the official, current Safety Data Sheet, search <strong>' + esc(c.productName) + '</strong> on one of these.</p>' +
    '<a class="btn btn-primary" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px;" href="https://portal.apvma.gov.au/pubcris" target="_blank" rel="noopener">Search the APVMA product register</a>' +
    '<a class="btn btn-ghost" style="display:block;text-align:center;text-decoration:none;border:1px solid var(--accent);color:var(--accent-strong);" href="https://www.google.com/search?q=' + encodeURIComponent(c.productName + " APVMA label SDS Australia") + '" target="_blank" rel="noopener">Search the web for this product’s label</a>' +
  '</div>';

  // First aid + the two universal emergency numbers -- these two hotlines
  // (Poisons Information Centre, and 000 for a transport incident) are the
  // same for every chemical in Australia, so they're fixed here rather than
  // fields to fill in per product.
  html += '<div class="card" style="background:var(--danger-contrast);border:1px solid #f3c6bd;">' +
    '<h3 style="margin:0 0 8px;color:var(--danger);font-size:15px;">+ First aid</h3>' +
    '<p style="margin:0 0 14px;font-size:13px;white-space:pre-wrap;">' + (c.firstAid ? esc(c.firstAid) : "First aid details haven’t been added for this product yet — check the product label or contact the supplier.") + '</p>' +
    '<a class="btn btn-danger" style="display:block;text-align:center;text-decoration:none;margin-bottom:8px;" href="tel:131126">Call Poisons Info 13 11 26</a>' +
    '<a class="btn btn-ghost" style="display:block;text-align:center;text-decoration:none;border:1px solid var(--danger);color:var(--danger);" href="tel:000">Transport emergency 000</a>' +
  '</div>';

  // Poison schedule / signal word: earlier SDS entries (added before this
  // detail page existed) used the older "hazardClass" / "signalWord"
  // fields rather than the newer "poisonSchedule" field -- fall back to
  // those so that real, already-researched data for those chemicals is
  // never silently hidden just because the field name changed.
  var identityRows = sdsInfoRow("Active", c.activeConstituent) + sdsInfoRow("APVMA No.", c.apvmaNo) + sdsInfoRow("Formulation", c.formulation) + sdsInfoRow("Poison schedule", c.poisonSchedule || c.hazardClass) + sdsInfoRow("Signal word", c.signalWord) + sdsInfoRow("Dangerous Goods", c.dangerousGoods) + sdsInfoRow("Registered for", c.registeredFor);
  if(identityRows) html += '<div class="card"><h3 style="margin:0 0 4px;font-size:15px;">Product identity</h3>' + identityRows + '</div>';

  if(c.ppePoints && c.ppePoints.length) html += '<div class="card"><h3 style="margin:0 0 8px;font-size:15px;">PPE and re-entry</h3>' + sdsBulletList(c.ppePoints) + '</div>';

  if(storagePoints.length) html += '<div class="card"><h3 style="margin:0 0 8px;font-size:15px;">Storage</h3>' + sdsBulletList(storagePoints) + '</div>';

  var sprayRows = sdsInfoRow("Wind speed", spray.windSpeed) + sdsInfoRow("Inversions", spray.inversions) + sdsInfoRow("Droplet size", spray.dropletSize) + sdsInfoRow("Rain", spray.rain) + sdsInfoRow("Heavy dew", spray.heavyDew) + sdsInfoRow("Bees", spray.bees) + sdsInfoRow("ULV", spray.ulv);
  var bufferRows = (c.bufferDistances || []).map(function(b){ return sdsInfoRow(b.label, b.value); }).join("");
  if(sprayRows || bufferRows || (c.applicationLimits && c.applicationLimits.length)){
    html += '<div class="card"><h3 style="margin:0 0 4px;font-size:15px;">Spray conditions</h3>' + sprayRows;
    if(bufferRows) html += '<h4 style="margin:14px 0 0;font-size:12.5px;">Buffer to natural aquatic areas</h4>' + bufferRows;
    if(c.applicationLimits && c.applicationLimits.length) html += '<h4 style="margin:14px 0 6px;font-size:12.5px;">Application limits</h4>' + sdsBulletList(c.applicationLimits);
    html += '</div>';
  }

  if(harvestRows.length || grazingRows.length){
    html += '<div class="card"><h3 style="margin:0 0 4px;font-size:15px;">Withholding periods</h3>';
    if(harvestRows.length) html += '<h4 style="margin:10px 0 0;font-size:12.5px;">Harvest</h4>' + harvestRows.map(function(r){ return sdsInfoRow(r.label, r.value); }).join("");
    if(grazingRows.length) html += '<h4 style="margin:14px 0 0;font-size:12.5px;">Grazing</h4>' + grazingRows.map(function(r){ return sdsInfoRow(r.label, r.value); }).join("");
    html += '</div>';
  }

  return html;
}

function saveSds(e, id){
  e.preventDefault();
  var f = e.target;
  var data = {
    productName: f.productName.value.trim(),
    manufacturer: f.manufacturer.value.trim(),
    activeConstituent: f.activeConstituent.value.trim(),
    chemicalType: f.chemicalType.value.trim(),
    groupNumber: f.groupNumber.value.trim(),
    formulationCode: f.formulationCode.value.trim(),
    hazardClass: f.hazardClass.value.trim(),
    signalWord: f.signalWord.value.trim(),
    firstAid: f.firstAid.value.trim(),
    apvmaNo: f.apvmaNo.value.trim(),
    formulation: f.formulation.value.trim(),
    poisonSchedule: f.poisonSchedule.value.trim(),
    dangerousGoods: f.dangerousGoods.value.trim(),
    registeredFor: f.registeredFor.value.trim(),
    ppePoints: parseSdsBulletLines(f.ppePoints.value),
    storagePoints: parseSdsBulletLines(f.storagePoints.value),
    spray: {
      windSpeed: f.windSpeed.value.trim(),
      inversions: f.inversions.value.trim(),
      dropletSize: f.dropletSize.value.trim(),
      rain: f.rain.value.trim(),
      heavyDew: f.heavyDew.value.trim(),
      bees: f.bees.value.trim(),
      ulv: f.ulv.value.trim()
    },
    bufferDistances: parseSdsPairLines(f.bufferDistances.value),
    applicationLimits: parseSdsBulletLines(f.applicationLimits.value),
    withholdingHarvest: parseSdsPairLines(f.withholdingHarvest.value),
    withholdingGrazing: parseSdsPairLines(f.withholdingGrazing.value),
    lastReviewed: todayISO()
  };
  // storageRequirements (the old single-line field) is kept in sync with the
  // new storagePoints bullets rather than dropped, purely so anything that
  // still reads the legacy field (e.g. the list-view search box) keeps
  // working exactly as before.
  data.storageRequirements = data.storagePoints.length ? data.storagePoints.join("; ") : "";
  // withholdingPeriod similarly kept in sync from the first harvest row, for
  // the same backward-compatibility reason.
  data.withholdingPeriod = data.withholdingHarvest.length ? data.withholdingHarvest[0].value : "";
  if(!data.productName) return;
  if(id){ Object.assign(byId(state.chemicals.sds, id), data); ui.editing.sds = null; }
  else { state.chemicals.sds.push(Object.assign({ id: uid("c") }, data)); ui.openForms.newSds = false; }
  persist();
}
function removeSds(id){
  removeById(state.chemicals.sds, id);
  if(ui.editing.sds === id) ui.editing.sds = null;
  if(ui.sdsSelected === id) ui.sdsSelected = null;

// Extensible field model: a pre-existing field (batch no., supplier,
// purchase date, expiry date) keeps reading/writing its original object
// key via legacyKey, so nothing needs a data migration. A brand new field
// Maria adds herself has no legacyKey, so its values live in a generic
// customFields bag instead, keyed by the field's own id.
function registerFieldValue(entry, field){
  if(field.legacyKey) return entry[field.legacyKey];
  return (entry.customFields || {})[field.id];
}
function setRegisterFieldValue(entry, field, value){
  if(field.legacyKey){
    entry[field.legacyKey] = value;
  } else {
    entry.customFields = entry.customFields || {};
    entry.customFields[field.id] = value;
  }
}
function addRegisterField(){
  state.chemicals.registerFields = state.chemicals.registerFields || [];
  state.chemicals.registerFields.push({ id: uid("rf"), label: "New field" });

}
function renameRegisterField(id, label){
  var f = byId(state.chemicals.registerFields || [], id);
  if(!f) return;
  f.label = label;
  persist();
}
function removeRegisterField(id){
  var fields = state.chemicals.registerFields || [];
  var f = byId(fields, id);
  if(!f) return;
  if(!confirm('Remove the "' + f.label + '" field? It will stop showing on the register and the add/edit form. This does not delete any chemicals or the volumes you have on hand.')) return;
  removeById(fields, id);
  persist();
}
function moveRegisterField(id, direction){
  var fields = state.chemicals.registerFields || [];
  var i = fields.findIndex(function(f){ return f.id === id; });
  if(i < 0) return;
  var j = i + direction;
  if(j < 0 || j >= fields.length) return;
  var tmp = fields[i]; fields[i] = fields[j]; fields[j] = tmp;
  persist();
}
function renderRegisterFieldsEditor(){

        '<span style="display:flex;gap:4px;">' +
          '<button type="button" class="btn btn-ghost btn-sm"' + (isFirst ? " disabled" : "") + ' onclick="moveRegisterField(\'' + f.id + '\',-1)" title="Move up">&#8593;</button>' +
          '<button type="button" class="btn btn-ghost btn-sm"' + (isLast ? " disabled" : "") + ' onclick="moveRegisterField(\'' + f.id + '\',1)" title="Move down">&#8595;</button>' +
        '</span>' +

      '</div>';
    }).join("");
  }

  return html;
}

// Opens a file stored in Supabase Storage (a map photo/PDF, or a bull's
// attached PDF), preferring an offline-cached copy (kept warm in the
// background by prefetchStorageFilesForOffline()) over hitting the network
// directly -- so these still work with no signal at all, not just the list
// of titles/names. Opens a blank tab SYNCHRONOUSLY, before any await, and
// only navigates it once the cache lookup resolves -- looking the URL up
// first and opening the tab afterwards would make most browsers treat the
// delayed window.open() as a blocked popup, since it'd no longer be
// directly inside the click's own call stack. Named generically (not
// "openMapFile") since Bulls' PDF attachments use this exact same function.
function openStoredFile(url){
  var win = null;
  try{ win = window.open("", "_blank"); }catch(e){}
  (async function(){
    try{
      if("caches" in window){
        var cached = await caches.match(url);
        if(cached){
          var blob = await cached.blob();
          var blobUrl = URL.createObjectURL(blob);
          if(win && !win.closed){ win.location = blobUrl; } else { window.open(blobUrl, "_blank"); }
          return;
        }
      }
    }catch(e){ /* fall through to a direct network open below */ }
    if(win && !win.closed){ win.location = url; } else { window.open(url, "_blank"); }
  })();
  return false;
}
function renderMaps(){
