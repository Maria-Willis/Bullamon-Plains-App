<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bullamon Plains</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="./icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="./icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Bullamon Plains" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #f2f2f2;
    --text: #1c242a;
    --text-muted: #58646e;
    --border: #dcdcdc;
    --accent: #1870b9;
    --accent-strong: #12578b;
    --accent-contrast: #f1f6fb;
    --olive: #b5791e;
    --olive-contrast: #2c1c04;
    --status-todo: #8a8375;
    --status-progress: #3a6ea5;
    --status-done: #3f7d4a;
    --pri-high: #a33b2c;
    --pri-medium: #b5791e;
    --pri-low: #5c6b46;
    --danger: #a33b2c;
    --danger-contrast: #fff5f2;
    --focus: #3a6ea5;
    --shadow: 0 1px 2px rgba(15,15,30,.06), 0 6px 20px -8px rgba(15,15,30,.18);
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-pill: 999px;
  }
  /* Page background is a very light cream (--bg), matching the reference
     screens Maria supplied for the app-wide restyle, while cards/tables/
     panels stay white (--surface) so content still stands out against it.
     (History: white 2026-09-21 -> light grey 2026-09-22 -> this cream
     2026-09-24, at Maria's request to match her Machinery Maintenance
     reference images.) The app used to switch to a dark green theme
     automatically when a phone's system dark mode was on, which read as
     "the background is green" on mobile. That auto-switch has been
     removed so the background stays consistent for everyone regardless of
     phone settings.
     Corners: this app used to enforce square corners everywhere (2026-09-21
     "All boxes to have straight corners") -- that rule is superseded now,
     at Maria's request to match the sidebar's rounded-card look across the
     whole app ("change the entire appearance of the app to match the menu
     styling"). --radius-lg/--radius-md/--radius-pill below back every
     rounded corner in the app now, replacing the old border-radius:0 on
     cards, panels, tables, inputs and buttons. */
  html{ color-scheme: light; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-weight:700;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  table{font-variant-numeric:tabular-nums;}
  a{color:var(--accent-strong);}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-contrast);}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  /* ---------- sign-in ---------- */
  #signin-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .signin-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:32px 28px 28px;
  }
  .signin-eyebrow{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--accent-strong);
    font-weight:600;
    margin:0 0 4px;
  }
  .signin-card h1{
    margin:0 0 4px;
    font-size:24px;
  }
  .signin-sub{
    color:var(--text-muted);
    margin:0 0 22px;
    font-size:13px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  select, input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="url"], input[type="tel"], textarea{
    width:100%;
    padding:10px 12px;
    border-radius:var(--radius-md);
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
  }
  input.no-spinner{-moz-appearance:textfield;}
  input.no-spinner::-webkit-outer-spin-button, input.no-spinner::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  select:focus, input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:70px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 16px;
    border-radius:var(--radius-pill);
    border:1px solid transparent;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:var(--surface-2);
    color:var(--text);
  }
  .btn:hover{filter:brightness(1.04);}
  .btn:disabled{opacity:.4;cursor:default;pointer-events:none;}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-contrast);
    width:100%;
  }
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
  }
  .btn-olive{background:var(--olive);color:var(--olive-contrast);}
  .btn-danger{background:var(--danger);color:var(--danger-contrast);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .signin-error{
    background:var(--danger-contrast);
    color:var(--danger);
    border:1px solid var(--danger);
    border-radius:var(--radius-md);
    padding:8px 10px;
    font-size:12.5px;
    margin-bottom:14px;
  }
  .signin-foot{
    margin-top:18px;
    font-size:11.5px;
    color:var(--text-muted);
    text-align:center;
  }

  /* ---------- app shell ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;
    flex:0 0 236px;
    background:var(--surface);
    color:var(--text);
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  /* The property name/tagline block is its own blue box, at Maria's
     request ("I'd also like the Bullamon Plains Farm Operations in a blue
     box"), separate from the plain-list nav below it. */
  .brand{
    padding:14px;
    margin-bottom:18px;
    background:var(--accent);
  }
  .brand-name{
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--accent-contrast);
    margin:0;
  }
  .brand-tag{
    font-size:11px;
    font-weight:600;
    color:var(--accent-contrast);
    opacity:.85;
    margin:3px 0 0;
    text-transform:uppercase;
    letter-spacing:.07em;
  }
  .refresh-btn{
    flex-shrink:0;
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .brand .refresh-btn{
    border-color:rgba(255,255,255,.45);
    background:transparent;
    color:var(--accent-contrast);
  }
  .brand .refresh-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.7);}
  .refresh-btn:disabled{opacity:.5;cursor:default;}
  /* Sidebar menu redesigned into grouped, rounded "cards" with icon
     circles and a trailing chevron on each row, at Maria's request to
     match a reference design she supplied ("make the main menu look like
     this but use the blue instead of the green"). This supersedes the
     plain flat-list style and the collapsible dropdown headings that came
     before it (see bullamon-app-status.md for the full history) -- those
     are gone now in favour of always-visible rows grouped under plain
     (non-clickable) section labels: Daily Work, Safety & Compliance,
     People, plus Dashboard on its own with no label above it. The
     rounded corners here are a deliberate, explicit exception to this
     app's usual square-corners rule, same as the existing pill/badge/
     avatar exceptions -- it's what the reference design asked for. */
  .nav-list{margin-bottom:4px;}
  .nav-section-label{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-muted);
    margin:16px 2px 6px;
  }
  .nav-section-label:first-of-type{margin-top:0;}
  .nav-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    margin-bottom:4px;
  }
  .nav-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    padding:11px 12px;
    border:none;
    border-bottom:1px solid var(--border);
    background:transparent;
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .nav-card .nav-btn:last-child{border-bottom:none;}
  .nav-btn:hover{background:var(--surface-2);}
  .nav-btn.active{background:color-mix(in srgb, var(--accent) 10%, var(--surface));color:var(--accent-strong);}
  .nav-icon-circle{
    flex-shrink:0;
    width:30px;
    height:30px;
    border-radius:50%;
    background:color-mix(in srgb, var(--accent) 16%, var(--surface));
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }
  .nav-btn.active .nav-icon-circle{background:var(--accent);color:var(--accent-contrast);}
  /* The Bulls nav icon is a colour cow emoji by default -- Maria asked for
     it to appear black in the Livestock/Bulls entry, so force its rendered
     glyph to a solid black silhouette without touching the icon circle's
     own background colour. */
  .icon-force-black{ display:inline-flex; filter:grayscale(1) brightness(0); }
  .nav-btn-label{flex:1;min-width:0;}
  .nav-chevron{flex-shrink:0;color:var(--text-muted);font-size:16px;line-height:1;margin-left:2px;}
  .nav-badge{
    margin-left:auto;
    background:var(--surface-2);
    color:var(--text);
    font-size:10.5px;
    font-weight:700;
    padding:1px 6px;
    border-radius:99px;
  }
  .sidebar-spacer{flex:1;}
  .whoami{
    border-top:1px solid var(--border);
    padding-top:12px;
    margin-top:10px;
  }
  .whoami-name{font-weight:600;color:var(--text);font-size:13.5px;}
  .whoami-role{font-size:11.5px;font-weight:600;color:var(--text-muted);margin:1px 0 10px;}
  .signout-btn{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    padding:7px 10px;
    border-radius:var(--radius-pill);
    font-size:12px;
    cursor:pointer;
  }
  .signout-btn:hover{color:var(--accent-strong);border-color:var(--accent);}

  main{flex:1;min-width:0;padding:30px 36px 60px;}
  .page-head{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head h2{margin:0;font-size:23px;}
  .page-desc{color:var(--text-muted);font-size:13px;margin:4px 0 0;max-width:60ch;}

  .banner{
    border-radius:var(--radius-md);
    padding:10px 14px;
    font-size:12.5px;
    margin-bottom:18px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
  }
  .banner.warn{border-color:var(--pri-medium);color:var(--pri-medium);background:var(--surface);}
  .banner.err{border-color:var(--danger);color:var(--danger);background:var(--danger-contrast);}
  .banner.ok{border-color:var(--accent);color:var(--accent-strong);background:var(--surface);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:18px 20px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 10px;font-size:15.5px;}
  .sop-group-heading{margin:0 0 14px;font-size:18px;color:var(--accent-strong);padding-bottom:10px;border-bottom:1px solid var(--border);}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-num{font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;font-size:26px;font-weight:700;line-height:1;}
  .stat-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 9px;
    border-radius:99px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;}
  /* The "Service due" pill on each collapsed Machinery card is the whole
     point of the collapsed list -- it's how Maria tells at a glance which
     machines need attention without opening every card. The plain .pill
     style (small, low-opacity tint) reads fine for a "todo"-style status
     pill next to other job pills, but on its own in a mostly-empty card
     row it was easy to miss, especially in its lighter (not-yet-due) tone.
     This variant is bigger, bolder and outlined so it stands out on every
     machine card regardless of urgency -- applied only to that one pill via
     an extra class, so every other pill in the app (jobs, issues, SDS, etc.)
     keeps its original compact style. */
  .pill-due{
    font-size:13px;
    padding:6px 13px;
    border:1.5px solid currentColor;
  }
  .pill-due::before{width:7px;height:7px;}
  .pill-todo{background:color-mix(in srgb, var(--status-todo) 16%, transparent);color:var(--status-todo);}
  .pill-progress{background:color-mix(in srgb, var(--status-progress) 16%, transparent);color:var(--status-progress);}
  .pill-done{background:color-mix(in srgb, var(--status-done) 16%, transparent);color:var(--status-done);}
  .pill-high{background:color-mix(in srgb, var(--pri-high) 16%, transparent);color:var(--pri-high);}
  .pill-medium{background:color-mix(in srgb, var(--pri-medium) 16%, transparent);color:var(--pri-medium);}
  .pill-low{background:color-mix(in srgb, var(--pri-low) 16%, transparent);color:var(--pri-low);}
  .pill-open{background:color-mix(in srgb, var(--danger) 16%, transparent);color:var(--danger);}
  .pill-closed{background:color-mix(in srgb, var(--status-done) 16%, transparent);color:var(--status-done);}
  .pill-admin{background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent-strong);}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:var(--surface-2);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  /* Bulls table only: position:sticky on a cell silently does nothing on a
     border-collapse:collapse table (a longstanding browser limitation --
     collapsed cells don't get their own positioned box), which is what the
     frozen Tag column below needs. Switched to border-collapse:separate
     with the row divider redrawn as an inset box-shadow instead of a real
     border, so it still looks identical to every other table in the app. */
  .bulls-table{border-collapse:separate;border-spacing:0;}
  .bulls-table th,.bulls-table td{border-bottom:none;box-shadow:inset 0 -1px 0 var(--border);}
  .bulls-table tr:last-child td{box-shadow:none;}
  /* Inline spreadsheet-style editing on the Bulls table (2026-09-27, at
     Maria's request -- "make the bull spreadsheet/table fully editable"):
     every cell an admin can change is a real <input>/<textarea> rather than
     plain text, styled to be invisible until you interact with it so the
     table still reads as a plain data grid at a glance. Saves happen on
     blur (leaving the cell), not on every keystroke -- this app fully
     re-renders its HTML from state on every change, which would yank focus
     and the cursor position out from under you on each keypress if a save
     fired that often. Tabbing/clicking to the next cell is exactly the
     "leave the cell" moment a spreadsheet saves on, so this matches that
     feel closely without needing a virtual DOM.  */
  .cell-edit{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 5px;width:100%;box-sizing:border-box;}
  .cell-edit:hover{border-color:var(--border);}
  .cell-edit:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent);}
  textarea.cell-edit{resize:vertical;min-height:32px;font-family:inherit;}
  td.num{font-variant-numeric:tabular-nums;}
  .row-muted{color:var(--text-muted);}

  .list-cards{display:flex;flex-direction:column;gap:12px;}
  .job-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--status-todo);
    border-radius:var(--radius-lg);
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .job-card[data-status="In progress"]{border-left-color:var(--status-progress);}
  .job-card[data-status="Done"]{border-left-color:var(--status-done);opacity:.75;}
  .job-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
  .job-title{font-weight:600;font-size:14.5px;margin:0 0 3px;}
  .job-meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .job-notes{margin-top:8px;font-size:12.5px;color:var(--text-muted);border-top:1px dashed var(--border);padding-top:8px;}
  .job-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar select, .toolbar input{width:auto;min-width:140px;}
  .search-input{flex:1;min-width:180px;}

  .area-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;}
  .area-tab{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-muted);
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .area-tab:hover{border-color:var(--accent);color:var(--text);}
  .area-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
  .area-tab .count{
    font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;
    background:var(--surface-2);color:var(--text-muted);
  }
  .area-tab.active .count{background:rgba(0,0,0,.16);color:var(--accent-contrast);}

  .form-panel{
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:var(--radius-lg);
    padding:16px 18px;
    margin-bottom:18px;
  }
  .form-panel h4{margin:0 0 12px;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .form-grid .field{margin-bottom:0;}
  /* "1 / -1" (first grid line to last) rather than a literal "span 2":
     on a narrow phone (or a form squeezed into a narrow side-by-side
     layout) the grid above collapses to a single auto-fit column, and a
     hard-coded "span 2" would force a second column into existence that
     isn't there, pushing the whole page wider than the screen. Spanning
     to the last line always means "full width of however many columns
     currently exist", so it never overflows. */
  .form-grid .field.span-2{grid-column:1 / -1;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .checkbox-row input{width:auto;}

  .subtle-btn{
    background:transparent;
    border:none;
    color:var(--accent-strong);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .subtle-btn:hover{text-decoration:underline;}

  /* A more prominent toggle than .subtle-btn, for the machinery card's two
     collapsible sections ("Show service history" / "Show Issues & Report
     Issues") -- Maria found the plain text-link style easy to miss, so
     these get a real button treatment (border + tinted background) instead
     of just underlined text. */
  .section-toggle-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:color-mix(in srgb, var(--accent) 12%, var(--surface));
    border:1px solid var(--accent);
    color:var(--accent-strong);
    font-size:13px;
    font-weight:700;
    padding:8px 14px;
    border-radius:var(--radius-pill);
    cursor:pointer;
  }

    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;

  .machine-photo-lg{ width:84px; height:84px; font-size:36px; }
  .machine-icon-img{ width:70%; height:70%; object-fit:contain; }
  .filter-pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 4px; }
  .filter-pill{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:var(--radius-pill);
    padding:6px 14px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .filter-pill.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
  /* Machinery Maintenance restructure (2026-09-28, matching Maria's
     reference mockups): a machine's detail screen is now Overview / Parts /
     History / Issues tabs instead of always-visible stacked toggle
     sections. Reuses .filter-pill-row/.filter-pill for the tab strip itself
     (same look as the existing All/Due/Out filter pills) so this reads as
     the same design language, not a new one. */
  /* On a narrow phone, "Overview"/"Parts"/"History"/"Issues (N)" together are
     often wider than the card itself -- without this, the row just overflows
     the card's right edge instead of wrapping or scrolling (reported by
     Maria 2026-09-28: "when the machine is opened on my phone, the Issues is
     outside the borders"). Scrolls horizontally within the card instead,
     same as .table-wrap already does for a wide table; flex-shrink:0 on each
     button stops them being squashed to fit. */
  .detail-tab-row{
    display:flex; gap:18px; border-bottom:1px solid var(--border); margin:14px 0 16px;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .detail-tab-row::-webkit-scrollbar{ display:none; }
  .detail-tab-btn{
    background:none; border:none; border-bottom:2px solid transparent;
    padding:8px 4px; font-size:13.5px; font-weight:600; white-space:nowrap; flex-shrink:0;
    color:var(--text-muted); cursor:pointer;
  }
  .detail-tab-btn.active{ color:var(--accent-strong); border-bottom-color:var(--accent-strong); }
  .due-checklist-row{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border); font-size:13.5px; }
  .due-checklist-row:last-child{ border-bottom:none; }
  .due-checklist-dot{ width:18px; height:18px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; }
  .due-checklist-row.checked .due-checklist-dot{ background:var(--status-done); border-color:var(--status-done); position:relative; }
  /* Severity picker (Report an issue) -- three equal-width pill buttons,
     managed with plain JS (selectSeverityPill()) rather than a full
     render(), so picking a severity never disturbs whatever's already been
     typed into the description field above it. */
  .severity-pill-row{ display:flex; gap:8px; margin:6px 0 2px; }
  .severity-pill-btn{
    flex:1; border:1px solid var(--border); background:var(--surface); color:var(--text);
    border-radius:var(--radius-lg); padding:9px 6px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .severity-pill-btn.sel-minor{ background:color-mix(in srgb, var(--status-done) 16%, transparent); color:var(--status-done); border-color:transparent; }
  .severity-pill-btn.sel-repair{ background:color-mix(in srgb, var(--pri-medium) 16%, transparent); color:var(--pri-medium); border-color:transparent; }
  .severity-pill-btn.sel-unsafe{ background:var(--danger); color:#fff; border-color:var(--danger); }
  /* "Parts used" chips (Log work / Add action taken) -- a small removable
     token per part, matching the mockup's rounded pill-with-x tokens. */
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .chip{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-pill);
    padding:5px 8px 5px 12px; font-size:12.5px; font-weight:600;
  }
  .chip button{ background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; line-height:1; padding:2px; }
  .back-chevron-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--accent-strong);
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    padding:4px 0;
    margin-bottom:10px;

  .due-progress-card{
    border-radius:var(--radius-lg);
    background:color-mix(in srgb, var(--pri-medium) 14%, var(--surface));
    border:1px solid color-mix(in srgb, var(--pri-medium) 35%, var(--border));
    padding:14px 16px;
    margin:12px 0;
  }
  .due-progress-card.ok{
    background:color-mix(in srgb, var(--status-done) 12%, var(--surface));
    border-color:color-mix(in srgb, var(--status-done) 30%, var(--border));
  }

  .empty-state{
    text-align:center;
    padding:36px 20px;
    color:var(--text-muted);
    font-size:13px;
    border:1px dashed var(--border);
    border-radius:var(--radius-lg);
    background:var(--surface);
  }

  .steps-list{margin:8px 0 0;padding-left:20px;font-size:13px;}
  .steps-list li{margin-bottom:4px;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
  /* Mobile back bar (the "Back to menu" control shown above a section's
     content on a narrow screen): hidden by default -- on desktop the
     sidebar and content are always both visible side by side, so there's
     nothing to "go back" to. Only the 900px breakpoint below turns it on. */
  .mobile-back-bar{display:none;}
  @media (max-width: 900px){
    .two-col{grid-template-columns:1fr;}
    #app-shell{flex-direction:column;}
    .sidebar{position:relative;width:100%;flex:none;height:auto;}
    /* On a narrow screen, show either the nav menu (sidebar) or the
       current section's content -- never both stacked, which is what
       used to force scrolling past the whole menu to reach a section
       you'd just tapped. #app-shell carries a "mobile-menu-open" class,
       toggled in JS by showMobileMenu()/goTo(), that picks which one. */
    .sidebar{display:none;}
    #app-shell.mobile-menu-open .sidebar{display:flex;}
    #app-shell.mobile-menu-open main{display:none;}
    .mobile-back-bar{display:flex;}
  }
  .mobile-back-bar{
    align-items:center;
    gap:10px;
    margin:-4px 0 18px;
    padding-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .mobile-back-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    font-size:16px;
    font-weight:700;
    padding:12px 20px;
    border-radius:var(--radius-pill);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .mobile-back-btn:hover{border-color:var(--accent);color:var(--accent-strong);}
  .mobile-back-title{
    font-size:12px;
    font-weight:700;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:.05em;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .team-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);margin-bottom:10px;}
  .avatar{
    width:34px;height:34px;border-radius:99px;background:var(--accent);color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;
  }
  .team-name-row{display:flex;align-items:center;gap:10px;}
  .team-flags{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}

  code.access-code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:6px;font-size:12px;}

  @media (prefers-reduced-motion: no-preference){
    .job-card, .card, .stat{transition:box-shadow .15s ease;}
  }

  /* Bulls "Print list" (2026-09-24) -- only active while body carries
     .printing-bulls (set by printBullsList() for the duration of the print
     dialog), so this never affects printing any other page. Landscape A4
     with slim margins, sidebar/search/stat-row/buttons/Files/Actions all
     hidden, header repeating on every page, so the whole list prints cleanly
     across however many A4 sheets it actually needs instead of clipping
     columns off past one page width.
     (2026-09-28, at Maria's request -- "overcrowded and I can't read the
     information... spread it over 2 full sheets and make the boxes/info
     deeper": the original settings (7px font, every cell hard-clipped to 2
     lines at 26px tall, tuned specifically to force exactly 2 pages) were
     genuinely too small to read, and the clipping was cutting sentences off
     mid-word, not just showing less of them -- see the print-clamp comment
     below for why that clip is gone now rather than just made bigger, and
     what that means for page count.) */
  @media print{
    @page{ size: A4 landscape; margin: 10mm; }
  }
  body.printing-bulls .sidebar,
  body.printing-bulls .toolbar,
  body.printing-bulls .stat-row,
  body.printing-bulls .notice,
  body.printing-bulls .form-panel-wrap,
  body.printing-bulls .section-toggle-btn,
  body.printing-bulls .col-files,
  body.printing-bulls .col-actions,
  body.printing-bulls .page-head p{
    display:none !important;
  }
  body.printing-bulls .page-head{ margin-bottom:8px; }
  body.printing-bulls .table-wrap{
    overflow:visible !important;box-shadow:none !important;border:none !important;
  }
  body.printing-bulls table.bulls-table{
    width:100%;font-size:10px;line-height:1.35;border-collapse:collapse !important;table-layout:fixed;
  }
  body.printing-bulls table.bulls-table th,
  body.printing-bulls table.bulls-table td{
    position:static !important;box-shadow:none !important;
    border:1px solid #999 !important;padding:5px 6px !important;
    white-space:normal !important;min-width:0 !important;background:#fff !important;
    color:#000 !important;overflow-wrap:break-word;
  }
  /* The BBSE test-summary and Notes cells hold full free-text sentences.
     This used to force every cell down to a hard 2-line clip (see pc() in
     renderBullsTable, and the ".print-clamp" div it wraps every cell's
     content in) purely so the page count stayed fixed at 2 -- but that meant
     a longer result got cut off mid-sentence, sometimes mid-word, which is
     exactly what Maria couldn't read. Removed at her request: a row is now
     simply as tall as its fullest cell genuinely needs (ordinary table
     behaviour), so nothing is ever hidden, at the cost of the page count no
     longer being fixed -- a bull with an unusually long note or test result
     makes its own row taller rather than clipping. Re-checked against the
     real 34-bull list after this and the font/padding changes above via a
     real PDF export: this comes out to 4 pages rather than 2 (some rows are
     genuinely that tall once nothing is hidden), which is the trade-off for
     nothing being cut off -- if that page count matters, ask to trade some
     of this readability back for fewer pages rather than assuming either
     one is right. */
  body.printing-bulls table.bulls-table thead{ display:table-header-group; }
  body.printing-bulls table.bulls-table tr{ page-break-inside:avoid; }
</style>

<script>
"use strict";

// A small, human-visible build tag (shown next to the "Refresh app" button
// in the sidebar, and in the browser console) -- added 2026-09-25 after
// several rounds of "I uploaded the new files but nothing changed", which
// turned out to be this app's offline cache (see sw.js's CACHE_NAME)
// serving an old copy on a device that hadn't picked up the update yet.
// Bump this string (a plain date + a same-day counter) alongside every
// change to this file, same as CACHE_NAME in sw.js -- it gives an instant,
// no-technical-steps-needed way to confirm whether a given device is
// actually running the latest deploy, without comparing file contents.
var APP_BUILD = "2026-09-29.11";

/* ======================================================================
   UTILITIES
   ====================================================================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escAttr(s){ return esc(s); }
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" });
}
// A plain `list.sort(function(a,b){return b.date.localeCompare(a.date);})`
// (used all over this app for "newest first" lists) throws if any single
// record's date field is missing or isn't a string -- one old/imported
// record without a date used to be able to crash the ENTIRE page's render
// (everything is built as one big HTML string, so one throw partway through
// leaves the whole app frozen on whatever last rendered successfully, with
// no on-screen sign of why -- every click afterwards looks like it silently
// does nothing, even though the underlying data usually did update). This
// sorts newest-first the same way but tolerates a missing/odd date instead
// of throwing.
function byDateDesc(dateField){
  return function(a, b){
    var av = String((a && a[dateField]) || "");
    var bv = String((b && b[dateField]) || "");
    return bv.localeCompare(av);
  };
}
function fmtMoney(n){
  if(n == null || n === "") return "—";
  return "$" + Number(n).toLocaleString("en-AU", { maximumFractionDigits: 2 });
}
function fmtNum(n, unit){
  if(n == null || n === "") return "—";
  var s = Number(n).toLocaleString("en-AU", { maximumFractionDigits: 2 });
  return unit ? (s + " " + unit) : s;
}
// Every hour/reading number in this app is DISPLAYED with thousands
// separators via fmtNum (e.g. "2,300 hrs"), so it's an easy, natural mistake
// to type one back in with a comma when editing it -- e.g. "1,800". A plain
// <input type="number"> silently rejects that keystroke-by-keystroke (the
// field is left empty, with no visible error), which made an edit look like
// it had simply "glitched" and wouldn't save. Machinery's hour/reading
// fields are plain text inputs (with a numeric mobile keyboard via
// inputmode="decimal") so a comma can be typed at all, and this strips
// thousands-separator commas and surrounding whitespace before parsing.
function parseHoursInput(raw){
  if(raw == null) return NaN;
  var cleaned = String(raw).replace(/,/g, "").trim();
  if(cleaned === "") return NaN;
  return parseFloat(cleaned);
}
function daysUntil(iso){
  if(!iso) return null;
  var target = new Date(iso + "T00:00:00").getTime();
  var now = new Date(todayISO() + "T00:00:00").getTime();
  return Math.round((target - now) / 86400000);
}
function initials(name){
  var parts = String(name || "?").trim().split(/\s+/);
  return ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length-1][0] : "")).toUpperCase();
}
function byId(arr, id){ return (arr || []).find(function(x){ return x.id === id; }); }
function removeById(arr, id){ var i = (arr||[]).findIndex(function(x){ return x.id === id; }); if(i > -1) arr.splice(i,1); }

function pillStatus(status){
  var cls = status === "Done" ? "pill-done" : status === "In progress" ? "pill-progress" : "pill-todo";
  return '<span class="pill ' + cls + '">' + esc(status) + "</span>";
}
function pillPriority(p){
  var cls = p === "High" ? "pill-high" : p === "Low" ? "pill-low" : "pill-medium";
  return '<span class="pill ' + cls + '">' + esc(p) + "</span>";
}
function pillIncident(status){
  return '<span class="pill ' + (status === "Closed" ? "pill-closed" : "pill-open") + '">' + esc(status) + "</span>";
}

function getLocal(key){ try{ return window.localStorage.getItem(key); }catch(e){ return null; } }
function setLocal(key, val){ try{ window.localStorage.setItem(key, val); }catch(e){} }
function removeLocal(key){ try{ window.localStorage.removeItem(key); }catch(e){} }

function deepClone(obj){
  if(window.structuredClone) return window.structuredClone(obj);
  return JSON.parse(JSON.stringify(obj));
}

function fmtDateTime(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleString("en-AU", { day:"numeric", month:"short", year:"numeric", hour:"numeric", minute:"2-digit" });
}

/* ======================================================================
   OFFLINE SUPPORT — a device with no signal at all can still open the app
   (the service worker keeps a cached copy of the app itself) and keep
   working from whatever data it last saw. Edits made while offline are
   queued on this device and sent once a connection comes back. See
   queueOfflineEdit()/attemptOfflineSync() below for the detail.
   ====================================================================== */
var CACHE_STATE_KEY = "bp_cache_state";
var CACHE_VERSION_KEY = "bp_cache_version";
var PENDING_STATE_KEY = "bp_pending_state";
var PENDING_BASE_VERSION_KEY = "bp_pending_base_version";
var PENDING_SINCE_KEY = "bp_pending_since";

function cacheGoodState(){
  setLocal(CACHE_STATE_KEY, JSON.stringify(state));
  setLocal(CACHE_VERSION_KEY, String(stateVersion));
  prefetchStorageFilesForOffline();
}
// Quietly asks the service worker to download and cache every current map
// photo/PDF and bull-attachment PDF in the background, so those sections
// still work with no signal at all -- not just the list of titles/names
// (already covered by the state cache above), but the actual files
// themselves. The service worker (sw.js) does the real fetching/caching and
// already skips anything it's cached before, so this is safe to call often
// (every cacheGoodState()) without re-downloading files that haven't
// changed. Quietly no-ops if there's no active service worker yet to ask
// (e.g. this device's very first-ever visit, before one's installed) -- the
// next successful sync after that picks it up, same as this app's other
// offline features. (Kept the "cacheMapFiles" message name sw.js already
// listens for, even though it now also carries bull-attachment URLs --
// sw.js just caches whatever URL list it's given, it doesn't care what
// kind of file each one is.)
function prefetchStorageFilesForOffline(){
  if(!("serviceWorker" in navigator) || !navigator.serviceWorker.controller) return;
  var urls = ((state.maps && state.maps.items) || [])
    .filter(function(m){ return m.url && (m.isPhoto || m.isPDF); })
    .map(function(m){ return m.url; });
  bullItems().forEach(function(b){
    (b.attachments || []).forEach(function(a){ if(a.url) urls.push(a.url); });
  });
  (state.sops || []).forEach(function(s){
    (s.photos || []).forEach(function(p){ if(p.url) urls.push(p.url); });
  });
  (state.machinery || []).forEach(function(m){
    (m.issues || []).forEach(function(iss){
      if(iss.photoUrl) urls.push(iss.photoUrl);
      (iss.actions || []).forEach(function(a){ if(a.photoUrl) urls.push(a.photoUrl); });
    });
  });
  if(!urls.length) return;
  navigator.serviceWorker.controller.postMessage({ type: "cacheMapFiles", urls: urls });
}
function loadCachedGoodState(){
  var raw = getLocal(CACHE_STATE_KEY);
  if(!raw) return null;
  try{
    return { data: JSON.parse(raw), version: parseInt(getLocal(CACHE_VERSION_KEY) || "0", 10) };
  }catch(e){ return null; }
}
function queueOfflineEdit(){
  // Keep the ORIGINAL base version -- the version this device last knew to
  // be current before it went offline -- so a later sync can tell whether
  // anyone else saved in the meantime. Don't reset it on every retry within
  // the same offline session.
  if(!getLocal(PENDING_STATE_KEY)){
    setLocal(PENDING_BASE_VERSION_KEY, String(stateVersion));
    setLocal(PENDING_SINCE_KEY, new Date().toISOString());
  }
  setLocal(PENDING_STATE_KEY, JSON.stringify(state));
}
function hasPendingOfflineEdits(){ return !!getLocal(PENDING_STATE_KEY); }
function clearOfflinePending(){
  removeLocal(PENDING_STATE_KEY);
  removeLocal(PENDING_BASE_VERSION_KEY);
  removeLocal(PENDING_SINCE_KEY);
}
function isOfflineError(err){
  if(!navigator.onLine) return true;
  if(!err) return false;
  // Real Postgrest/Postgres errors carry a `.code`; a raw network failure
  // (fetch throwing, DNS failure, no signal) generally doesn't.
  return !err.code;
}

var isOffline = false;      // best current guess at connectivity
var offlineConflict = null; // { state, since } -- set when offline edits couldn't be auto-combined with what the team saved while this device was out of range
var syncingOffline = false; // true while an offline-sync attempt is in flight

function downloadOfflineConflict(){
  if(!offlineConflict) return;
  var json = JSON.stringify(offlineConflict.state, null, 2);
  var blob = new Blob([json], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "bullamon-plains-offline-changes-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

/* ======================================================================
   STATE
   ====================================================================== */
var state = null;
var writable = true;      // becomes false once we learn this viewer can't save
var writeChecked = false; // whether we've learned writable status yet
var booted = false;
var notice = null;        // { kind: 'view-only'|'conflict'|'warn'|'err'|'ok', msg }
// Set true only for the brief window printBullsList() is running (see

// A real file download -- no artifact-platform sharing restriction applies
// here, so this is a plain, reliable Blob download instead of a clipboard
// copy with a textarea fallback.
function downloadBackup(){
  var json = JSON.stringify(state, null, 2);
  var blob = new Blob([json], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "bullamon-plains-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  state.meta.lastBackupAt = todayISO();
  persist();
}

// Restoring is the escape hatch for "something has gone badly wrong" -- it
// completely replaces the live shared data with whatever's in the uploaded
// backup file, for every signed-in user on every device, not just this one.
// Handled far more cautiously than the app's usual destructive actions
// (a plain confirm()) given how wide the blast radius is: this shows a
// summary of what's actually in the file plus a type-to-confirm step
// before touching anything.
function handleRestoreFileSelected(event){
  var input = event.target;
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    input.value = ""; // so selecting the same file again still fires onchange
    var parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      alert("That file isn't valid JSON, so it can't be restored (" + err.message + "). Make sure you're selecting a backup file that was downloaded from this app's \"Download data backup\" button.");
      return;
    }
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed) ||
       !Array.isArray(parsed.jobs) || !Array.isArray(parsed.team) || !Array.isArray(parsed.machinery) ||
       !parsed.chemicals || typeof parsed.chemicals !== "object"){
      alert("That file doesn't look like a Bullamon Plains backup -- it's missing the jobs/team/machinery/chemicals data this app expects. Nothing was changed.");
      return;
    }
    var summary = "This file contains:\n" +
      "  " + parsed.jobs.length + " jobs\n" +
      "  " + parsed.machinery.length + " machines\n" +
      "  " + ((parsed.chemicals.register || []).length) + " chemical register entries, " + ((parsed.chemicals.sds || []).length) + " safety data sheets\n" +
      "  " + parsed.team.length + " staff\n" +
      (parsed.meta && parsed.meta.lastBackupAt ? "\nThis backup was downloaded on: " + parsed.meta.lastBackupAt + "\n" : "\n") +
      "\nRestoring will COMPLETELY REPLACE everything currently in the app -- for every signed-in user, on every device -- with what's in this file. Anything added or changed since this backup was taken will be permanently lost. This cannot be undone.\n\n" +
      "Type RESTORE (all capitals) below to go ahead, or press Cancel to back out without changing anything.";
    var typed = prompt(summary);
    if(typed === null) return; // cancelled
    if(typed !== "RESTORE"){
      alert("Restore cancelled -- you didn't type RESTORE exactly, so nothing was changed.");
      return;
    }
    restoreFromBackup(parsed);
  };
  reader.onerror = function(){
    alert("Couldn't read that file -- please try selecting it again.");
  };
  reader.readAsText(file);
}
async function restoreFromBackup(backupData){
  if(isOffline || (typeof navigator !== "undefined" && "onLine" in navigator && !navigator.onLine)){
    setNotice("warn", "Restoring needs an internet connection -- you're currently offline, so nothing was changed. Try again once you're back in range.");
    return;
  }
  if(!supabaseClient){
    setNotice("err", "This app isn't connected to its database right now, so a restore can't be saved. Nothing was changed.");
    return;
  }
  var btn = document.getElementById("restoreBackupBtn");
  if(btn){ btn.disabled = true; btn.textContent = "Restoring…"; }
  try{
    // Deliberately does NOT go through the normal persist()/doPersist()
    // optimistic-concurrency path -- a restore is meant to force-overwrite
    // whatever's live right now, not get silently discarded (and replaced
    // with someone else's version) the way an ordinary edit would be if it
    // lost a version race. Reads the current version fresh here (rather
    // than trusting the possibly-stale in-memory stateVersion) so this
    // always writes as the very next version no matter what.
    var cur = await supabaseClient.from("app_state").select("version").eq("id", "main").maybeSingle();
    if(cur.error) throw cur.error;
    if(cur.data){
      var nextVersion = (cur.data.version || 0) + 1;
      var res = await supabaseClient.from("app_state")
        .update({ data: backupData, version: nextVersion, updated_at: new Date().toISOString() })
        .eq("id", "main")
        .select("version");
      if(res.error) throw res.error;
    } else {
      // No row at all yet (a brand-new, never-saved project) -- create it
      // straight from the backup instead of updating a row that isn't there.
      var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: backupData, version: 1 }).select("version").single();
      if(insertRes.error) throw insertRes.error;
    }
    // A full reload (rather than swapping `state` in place) runs the
    // restored data back through boot()'s one-time migrations -- so an
    // older backup still ends up with every field today's app expects --
    // and clears out any stale UI state (open forms, "currently editing"
    // pointers) that might reference something the backup doesn't have.
    location.href = location.pathname + "?restored=" + Date.now();
  }catch(err){
    console.error("[Bullamon Plains] restore from backup failed:", err);
    if(btn){ btn.disabled = false; btn.innerHTML = "&#8593; Restore from backup"; }
    setNotice("err", "Couldn't restore that backup (" + (err && err.message ? err.message : "unknown error") + "). Nothing was changed -- check your connection and try again.");
  }
}

function activeTeam(){ return (state.team || []).filter(function(t){ return t.active; }); }
function findTeam(name){ return (state.team || []).find(function(t){ return t.name === name; }); }
function currentUser(){ return session.name ? findTeam(session.name) : null; }
function isAdmin(){ var u = currentUser(); return !!(u && u.isAdmin); }
// The "Private" section (see renderPrivate()) is visible to admins (so it
// can always be found and managed, even before anyone's been given access)
// plus whichever up-to-two people are listed in state.settings.privateAccess.
function canSeePrivateSection(){
  if(isAdmin()) return true;
  var u = currentUser();
  return !!(u && (state.settings.privateAccess || []).indexOf(u.name) > -1);
}
function isSignedIn(){ return !!(session.name && findTeam(session.name) && findTeam(session.name).active); }

/* ======================================================================
   SUPABASE — the shared database backing this app. See config.js for the
   project URL and public (anon) key, and supabase-schema.sql for the
   table + realtime setup this code expects.
   ====================================================================== */
var supabaseClient = (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;
var stateVersion = 0;      // optimistic-concurrency counter, mirrors the row in Supabase
var isNewRow = false;      // true until the very first row is written to Supabase

var realtimeSubscribed = false;
function subscribeRealtime(){
  if(!supabaseClient || realtimeSubscribed) return;
  realtimeSubscribed = true;
  supabaseClient
    .channel("app_state_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "app_state", filter: "id=eq.main" }, function(payload){
      // While this device has unsynced offline edits queued, let
      // attemptOfflineSync() own reconciling them instead of silently
      // overwriting local (possibly still-unsaved) work here.
      if(hasPendingOfflineEdits()) return;
      var row = payload.new;
      if(!row || typeof row.version !== "number") return;
      // Only adopt a version newer than what we already have -- this also
      // quietly ignores the echo of our own just-completed write.
      if(row.version > stateVersion){
        state = row.data;
        stateVersion = row.version;
        isOffline = false;
        cacheGoodState();
        render();
      }
    })
    .subscribe();
}

/* ======================================================================
   BOOT
   ====================================================================== */
async function boot(){
  if(!supabaseClient){
    if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
      console.error("[Bullamon Plains] Supabase isn't configured -- check config.js has SUPABASE_URL and SUPABASE_ANON_KEY set.");
      state = deepClone(DEFAULT_STATE);
      booted = true;
      setNotice("err", "This app isn't connected to its database yet (config.js is missing the Supabase URL/key). Changes won't be saved.");
      return;
    }
    // config.js is filled in correctly, but the Supabase library itself
    // never loaded -- almost certainly no internet, and this device hasn't
    // cached it from an earlier visit yet. Treat exactly like a failed
    // network fetch below.
    isOffline = true;
    return bootOffline();
  }
  var migrated = false;
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").maybeSingle();
    if(res.error) throw res.error;
    if(res.data){
      state = res.data.data;
      stateVersion = res.data.version;
    } else {
      // Nothing in the table yet -- brand new project. Seed it with the
      // built-in defaults; the first persist() below writes the real row.
      state = deepClone(DEFAULT_STATE);
      isNewRow = true;
      migrated = true;
    }
    isOffline = false;
  }catch(e){
    console.error("[Bullamon Plains] could not load data from Supabase:", e);
    if(isOfflineError(e)){
      isOffline = true;
      return bootOffline();
    }
    state = deepClone(DEFAULT_STATE);
    booted = true;
    setNotice("err", "Couldn't load data from the database (" + (e && e.message ? e.message : "unknown error") + "). Changes won't be saved until this is fixed.");
    return;
  }
  if(session.name && !(findTeam(session.name) && findTeam(session.name).active)){
    session.name = null;
    removeLocal("bp_signed_in_name");
  }
  // one-time migration: jobs saved before the Irrigation/Dryland/Livestock/General
  // split get a sensible default area so nothing disappears from view.
  (state.jobs || []).forEach(function(j){
    if(!j.area){
      j.area = (j.category === "Irrigation") ? "Irrigation" : "General";
      migrated = true;
    }
  });
  // one-time migration: machines saved before issue reporting existed get an
  // empty issues list so the new section has something to render into.
  (state.machinery || []).forEach(function(m){
    if(!m.issues){
      m.issues = [];
      migrated = true;
    }
    if(m.scheduleStartHours === undefined){
      m.scheduleStartHours = null;
      migrated = true;
    }
    if(m.serviceIntervalHours === undefined){
      m.serviceIntervalHours = null;
      migrated = true;
    }
  });
  // one-time migration: chemical register entries saved before usage logging
  // existed get an empty usage log so deductions have somewhere to record.
  (state.chemicals && state.chemicals.register || []).forEach(function(r){
    if(!r.usageLog){
      r.usageLog = [];
      migrated = true;
    }
  });
  if(state.meta && state.meta.lastBackupAt === undefined){
    state.meta.lastBackupAt = null;
    migrated = true;
  }
  // one-time migration: drop "Cropping" from the sidebar tagline.

    state.meta.tagline = "Farm Operations";

  // and the SOPs section at Maria's request (2026-09-02). Strips any

function bootOffline(){
  // No usable connection right at startup (or the Supabase library never
  // loaded). Use whatever this device already has, most-current first:
  // unsynced offline edits from last time, then the last good copy it
  // cached, then -- only if this device has genuinely never loaded the app
  // before -- nothing.
  var pendingRaw = getLocal(PENDING_STATE_KEY);
  if(pendingRaw){
    try{
      state = JSON.parse(pendingRaw);
      stateVersion = parseInt(getLocal(PENDING_BASE_VERSION_KEY) || "0", 10);
      isNewRow = false;
      booted = true;
      render();
      return;
    }catch(e){ /* fall through to the cached copy below */ }
  }
  var cached = loadCachedGoodState();
  if(cached){
    state = cached.data;
    stateVersion = cached.version;
    isNewRow = false;
    booted = true;
    render();
    return;
  }
  state = deepClone(DEFAULT_STATE);
  booted = true;
  setNotice("err", "No internet connection, and this device hasn't loaded Bullamon Plains before, so there's no offline copy to show yet. Connect once to download the data — after that it'll keep working here even without a connection.");
  render();
}

async function attemptOfflineSync(){
  if(syncingOffline || !hasPendingOfflineEdits() || !supabaseClient) return;
  syncingOffline = true;
  var pendingState, pendingBaseVersion;
  try{
    pendingState = JSON.parse(getLocal(PENDING_STATE_KEY));
    pendingBaseVersion = parseInt(getLocal(PENDING_BASE_VERSION_KEY) || "-1", 10);
  }catch(e){
    clearOfflinePending();
    syncingOffline = false;
    return;
  }
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").maybeSingle();
    if(res.error) throw res.error;
    var serverVersion = res.data ? res.data.version : 0;
    var succeeded = false;
    var newVersion = null;

    if(!res.data || serverVersion === pendingBaseVersion){
      // Nobody else saved while this device was offline -- push the
      // offline edits straight through.
      if(!res.data){
        var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: pendingState, version: 1 }).select("version").single();
        if(insertRes.error && insertRes.error.code !== "23505") throw insertRes.error;
        if(!insertRes.error){ succeeded = true; newVersion = insertRes.data.version; }
      } else {
        var nextVersion = serverVersion + 1;
        var updateRes = await supabaseClient.from("app_state")
          .update({ data: pendingState, version: nextVersion, updated_at: new Date().toISOString() })
          .eq("id", "main").eq("version", serverVersion)
          .select("version");
        if(updateRes.error) throw updateRes.error;
        if(updateRes.data && updateRes.data.length > 0){ succeeded = true; newVersion = nextVersion; }
      }
    }

    if(succeeded){
      state = pendingState;
      stateVersion = newVersion;
      isNewRow = false;
      isOffline = false;
      clearOfflinePending();
      cacheGoodState();
      subscribeRealtime();
      setNotice("ok", "You're back online — your offline changes have been saved.");
      render();
    } else {
      // Someone else's changes are already in the row this device based its
      // offline edits on (or squeezed in between our read and write just
      // now). Don't guess how to combine two different sets of changes --
      // adopt the team's saved copy so this device isn't stuck out of date,
      // and keep the offline edits recoverable instead of discarding them.
      var latest = await supabaseClient.from("app_state").select("data,version").eq("id", "main").single();
      if(!latest.error && latest.data){
        offlineConflict = { state: pendingState, since: getLocal(PENDING_SINCE_KEY) };
        state = latest.data.data;
        stateVersion = latest.data.version;
        isNewRow = false;
        isOffline = false;
        clearOfflinePending();
        cacheGoodState();
        subscribeRealtime();
        render();
      }
    }
  }catch(e){
    console.error("[Bullamon Plains] offline sync attempt failed, will retry later:", e);
    // Still offline, or a transient error -- leave the queue in place and
    // try again on the next 'online' event or app load.
  }
  syncingOffline = false;
}

window.addEventListener("online", function(){
  isOffline = false;
  render();
  if(hasPendingOfflineEdits()) attemptOfflineSync();
});
window.addEventListener("offline", function(){
  isOffline = true;
  render();
});

/* ======================================================================
   PERSISTENCE — every mutating action calls this after updating `state`
   ====================================================================== */
var saveQueue = Promise.resolve();
// `redo` (optional) is a small, idempotent "do this mutation again" callback
// -- e.g. "delete the issue with this id, if it's still there" -- used to
// safely re-apply a change that a save-conflict below would otherwise
// silently drop (see doPersist/adoptLatestAfterConflict). Most call sites
// don't pass one, which keeps their behaviour exactly as before; it's worth
// the extra few lines specifically for actions like resolving/deleting a
// machinery issue, since a silently-dropped delete is exactly what made a
// "deleted" issue seem to come back on its own (2026-09-25, root-caused
// after Maria reported the same reopened-issue reappearing a second time).
function persist(redo){
  render(); // optimistic local update, immediately
  saveQueue = saveQueue.then(function(){ return doPersist(redo); });
  return saveQueue;
}

async function doPersist(redo){
  if(!supabaseClient){
    if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
      setNotice("err", "This app isn't connected to its database (config.js is missing the Supabase URL/key). This change is only visible to you.");
      return;
    }
    // Configured correctly, just no connection right now (or the library
    // hasn't loaded on this device yet) -- queue exactly like a network
    // failure below rather than treating it as a permanent error.
    isOffline = true;
    queueOfflineEdit();
    render();
    return;
  }
  try{
    if(isNewRow){
      var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: state, version: 1 }).select("version").single();
      if(insertRes.error){
        // Someone else's first write beat ours -- adopt theirs instead of
        // erroring, since the row now genuinely exists.
        if(insertRes.error.code === "23505"){
          return adoptLatestAfterConflict(redo);
        }
        throw insertRes.error;
      }
      isNewRow = false;
      stateVersion = insertRes.data.version;
    } else {
      var nextVersion = stateVersion + 1;
      var updateRes = await supabaseClient.from("app_state")
        .update({ data: state, version: nextVersion, updated_at: new Date().toISOString() })
        .eq("id", "main").eq("version", stateVersion)
        .select("version");
      if(updateRes.error) throw updateRes.error;
      if(!updateRes.data || updateRes.data.length === 0){
        // version didn't match -- someone else saved in between.
        return adoptLatestAfterConflict(redo);
      }
      stateVersion = nextVersion;
    }
    writable = true; writeChecked = true;
    isOffline = false;
    clearOfflinePending();
    cacheGoodState();
    if(notice) setNotice(null);
  }catch(err){
    console.error("[Bullamon Plains] Supabase save failed:", err);
    var code = err && err.code;
    var message = err && err.message;
    writeChecked = true;
    if(code === "42501" || code === "PGRST301"){
      // Postgres/PostgREST permission-denied codes -- the anon key can't
      // write under the current row-level-security policies.
      writable = false;
      setNotice("view-only", "This browser can't save changes to the database right now (permission denied). (code: " + code + ")");
    } else if(isOfflineError(err)){
      isOffline = true;
      queueOfflineEdit();
    } else {
      setNotice("err", "Couldn't save that change (" + (message || "unknown error") + "). It's only visible to you until it's retried." + (code ? " (code: " + code + ")" : ""));
    }
    render();
  }
}

async function adoptLatestAfterConflict(redo){
  setNotice("conflict", "Someone else just saved a change — refreshing with the latest.");
  var adopted = false;
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").single();
    if(!res.error && res.data){
      state = res.data.data;
      stateVersion = res.data.version;
      isNewRow = false;
      isOffline = false;
      cacheGoodState();
      adopted = true;
    }
  }catch(e){ console.error("[Bullamon Plains] could not refresh after conflict:", e); }
  // Without this, whatever change was in flight when the conflict happened
  // (e.g. deleting/resolving a machinery issue) is just discarded here --
  // the freshly-adopted server state overwrites local `state` entirely, so
  // that in-flight change never actually reaches the database even though
  // the screen had already optimistically shown it as done. `redo` is a
  // small idempotent replay of that same change against the state we just
  // adopted, and persisting it again is what actually saves it. Only
  // retried once -- if this second attempt also conflicts (rare), it falls
  // back to the same "someone else's change wins" behaviour as before
  // rather than looping.
  if(adopted && redo){
    redo();
    setTimeout(function(){ if(notice && notice.kind === "conflict") setNotice(null); persist(); }, 50);
    return;
  }
  setTimeout(function(){ if(notice && notice.kind === "conflict") setNotice(null); render(); }, 1200);
}

function setNotice(kind, msg){ notice = kind ? { kind: kind, msg: msg } : null; render(); }
function dismissNotice(){ notice = null; render(); }
function retrySave(){
  if(notice) setNotice(null);
  persist();
}

/* ======================================================================
   RENDER — top level dispatch
   ====================================================================== */
function render(){
  var app = document.getElementById("app");
  if(!app) return;
  if(!booted){
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;">Loading Bullamon Plains…</div>';
    return;
  }
  if(!isSignedIn()){
    app.innerHTML = renderSignIn();
    attachSignInHandlers();
    return;
  }
  // A live search box calls render() on every keystroke (so results update
  // as you type), and render() rebuilds the whole page's HTML from scratch.
  // Left alone, that destroys and recreates the input mid-keystroke, kicking
  // focus out after the very first letter typed -- so remember which field
  // (by its id) was focused and where the cursor was, and restore both once
  // the new HTML is in place.
  var active = document.activeElement;
  var focusId = null, selStart = null, selEnd = null;
  if(active && active.id && app.contains(active) && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")){
    focusId = active.id;
    if(typeof active.selectionStart === "number"){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  }
  // The whole app is built as one big HTML string (renderShell() calls every
  // section's render function in turn), and persist() calls render()
  // synchronously as its very first step -- so if a bad piece of data
  // anywhere makes any render function throw (an old/imported record with a
  // field missing that newer code assumes is always there, for example),
  // the WHOLE app used to just freeze on whatever last rendered
  // successfully, with nothing on screen to say why. Worse, since persist()
  // calls render() before it queues the actual save, that throw happened
  // before the change was ever sent to Supabase -- so the click that
  // triggered it looked like it silently did nothing, indefinitely, no
  // matter how many times it was retried. Catching it here can't undo
  // whatever bad data caused it, but at least shows a clear, actionable
  // message instead of a silent freeze.
  try{
    app.innerHTML = renderShell();
  }catch(err){
    console.error("[Bullamon Plains] Render failed:", err);
    app.innerHTML = renderCrashScreen(err);
    return;
  }
  if(focusId){
    var el = document.getElementById(focusId);
    if(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")){
      el.focus();
      if(selStart !== null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

// Shown in place of the whole app when render() itself throws (see the long
// comment above its try/catch). Deliberately doesn't try to keep using
// `state` or call any other render function -- if one of those is what broke,
// reusing it here could just throw again. A plain reload is usually enough
// to recover (most causes are a stray bit of bad data in one record that a
// particular click/view touches -- reloading avoids that click and gets you
// back to a working app; the underlying bad record, if any, still needs
// fixing, which is what the error detail beneath is for reporting).
function renderCrashScreen(err){
  var detail = (err && err.message) ? String(err.message) : String(err);
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">' +
    '<div style="max-width:480px;text-align:center;">' +
      '<h2 style="margin:0 0 10px;">Something went wrong displaying this page</h2>' +
      '<p class="row-muted" style="margin:0 0 16px;">Reloading usually fixes it. If it keeps happening, please tell Maria/your admin what you were doing right before this, along with the detail below.</p>' +
      '<button type="button" class="btn btn-primary" style="width:auto;margin:0 auto 16px;" onclick="window.location.reload()">Reload app</button>' +
      '<p class="row-muted" style="margin:0;font-size:11px;font-family:monospace;word-break:break-word;">' + esc(detail) + '</p>' +
    '</div>' +
  '</div>';
}

var signinError = "";
var signinSelectedName = "";     // remembered across a failed attempt, so the name isn't lost
var signinFocusCode = false;     // whether to focus+select the code field on next render
function renderSignIn(){
  var options = activeTeam().map(function(t){
    return '<option value="' + escAttr(t.name) + '"' + (t.name === signinSelectedName ? " selected" : "") + '>' + esc(t.name) + "</option>";
  }).join("");
  return '' +
  '<div id="signin-screen">' +
    '<div class="signin-card">' +
      '<p class="signin-eyebrow">' + esc(state.meta.propertyName) + '</p>' +
      '<h1>Staff sign-in</h1>' +
      '<p class="signin-sub">Choose your name and enter your access code to continue.</p>' +
      (signinError ? '<div class="signin-error">' + esc(signinError) + '</div>' : '') +
      '<form id="signin-form">' +
        '<div class="field">' +
          '<label for="signin-name">Your name</label>' +
          '<select id="signin-name" required>' +
            '<option value="">Choose your name…</option>' +
            options +
          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label for="signin-code">Access code</label>' +
          '<input type="password" id="signin-code" placeholder="Enter your code" autocomplete="off" />' +
        '</div>' +
        '<button type="submit" class="btn btn-primary">Enter</button>' +
      '</form>' +
      '<p class="signin-foot">Not on the list, or lost your code? Ask a farm admin to add you in the Team section.</p>' +
    '</div>' +
  '</div>';
}
function attachSignInHandlers(){
  var form = document.getElementById("signin-form");
  if(!form) return;
  var nameSel = document.getElementById("signin-name");
  var codeInput = document.getElementById("signin-code");
  nameSel.addEventListener("change", function(){ signinSelectedName = nameSel.value; });
  if(signinFocusCode && codeInput){ codeInput.focus(); signinFocusCode = false; }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameSel.value;
    var code = codeInput.value;
    signinSelectedName = name;
    var member = findTeam(name);
    if(!member || !member.active){
      signinError = "Choose your name from the list.";
      render();
      return;
    }
    if(member.passcode && member.passcode !== code){
      signinError = "That access code doesn't match. Try again or ask an admin to reset it.";
      signinFocusCode = true;
      render();
      return;
    }
    signinError = "";
    signinSelectedName = "";
    session.name = member.name;
    setLocal("bp_signed_in_name", member.name);
    render();
  });
}
function signOut(){
  session.name = null;
  removeLocal("bp_signed_in_name");
  ui.section = "dashboard";
  ui.mobileMenuOpen = true;
  // If a section's content was open (a "back to menu" history entry
  // pushed), clear it rather than leaving it stranded -- otherwise the next
  // phone back-button press would silently consume that stale entry
  // instead of actually leaving the app as expected.
  if(typeof history !== "undefined" && history.state && history.state.bpMobileSection){
    try{ history.replaceState(null, "", location.href); }catch(e){}
  }
  render();
}
