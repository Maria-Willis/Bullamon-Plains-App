<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bullamon Plains</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="./icons/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" href="./icons/icon-192.png" sizes="192x192" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Bullamon Plains" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f1ede1;
    --surface: #fffdf8;
    --surface-2: #e5e7d8;
    --sidebar: #152c1c;
    --sidebar-text: #eef4e9;
    --sidebar-text-dim: #b9d0b3;
    --text: #212a1c;
    --text-muted: #656e58;
    --border: #d9dcc6;
    --accent: #2f6b34;
    --accent-strong: #235327;
    --accent-contrast: #f4fbf1;
    --olive: #b5791e;
    --olive-contrast: #2c1c04;
    --status-todo: #8a8375;
    --status-progress: #3a6ea5;
    --status-done: #3f7d4a;
    --pri-high: #a33b2c;
    --pri-medium: #b5791e;
    --pri-low: #5c6b46;
    --danger: #a33b2c;
    --danger-contrast: #fff5f2;
    --focus: #3a6ea5;
    --shadow: 0 1px 2px rgba(15,30,15,.06), 0 6px 20px -8px rgba(15,30,15,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #12180f;
      --surface: #1b2318;
      --surface-2: #263123;
      --sidebar: #0d1a10;
      --sidebar-text: #eef4e9;
      --sidebar-text-dim: #a3c29a;
      --text: #e7ecdf;
      --text-muted: #a6ae98;
      --border: #34402f;
      --accent: #6fbf65;
      --accent-strong: #8fd884;
      --accent-contrast: #0c1f0c;
      --olive: #dba24f;
      --olive-contrast: #2a1c04;
      --status-todo: #9b9382;
      --status-progress: #6ea3d9;
      --status-done: #6fbb7c;
      --pri-high: #e08669;
      --pri-medium: #dba24f;
      --pri-low: #93a771;
      --danger: #e08669;
      --danger-contrast: #2a140e;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg: #12180f;
    --surface: #1b2318;
    --surface-2: #263123;
    --sidebar: #0d1a10;
    --sidebar-text: #eef4e9;
    --sidebar-text-dim: #a3c29a;
    --text: #e7ecdf;
    --text-muted: #a6ae98;
    --border: #34402f;
    --accent: #6fbf65;
    --accent-strong: #8fd884;
    --accent-contrast: #0c1f0c;
    --olive: #dba24f;
    --olive-contrast: #2a1c04;
    --status-todo: #9b9382;
    --status-progress: #6ea3d9;
    --status-done: #6fbb7c;
    --pri-high: #e08669;
    --pri-medium: #dba24f;
    --pri-low: #93a771;
    --danger: #e08669;
    --danger-contrast: #2a140e;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.font-display{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    text-wrap:balance;
    letter-spacing:-0.01em;
  }
  table{font-variant-numeric:tabular-nums;}
  a{color:var(--accent-strong);}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-contrast);}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  /* ---------- sign-in ---------- */
  #signin-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .signin-card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:32px 28px 28px;
  }
  .signin-eyebrow{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--accent-strong);
    font-weight:600;
    margin:0 0 4px;
  }
  .signin-card h1{
    margin:0 0 4px;
    font-size:24px;
  }
  .signin-sub{
    color:var(--text-muted);
    margin:0 0 22px;
    font-size:13px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--text-muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  select, input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="url"], input[type="tel"], textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    font-family:inherit;
  }
  input.no-spinner{-moz-appearance:textfield;}
  input.no-spinner::-webkit-outer-spin-button, input.no-spinner::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  select:focus, input:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:70px;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:10px 16px;
    border-radius:8px;
    border:1px solid transparent;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    background:var(--surface-2);
    color:var(--text);
  }
  .btn:hover{filter:brightness(1.04);}
  .btn-primary{
    background:var(--accent);
    color:var(--accent-contrast);
    width:100%;
  }
  .btn-primary:hover{background:var(--accent-strong);}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--border);
  }
  .btn-olive{background:var(--olive);color:var(--olive-contrast);}
  .btn-danger{background:var(--danger);color:var(--danger-contrast);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .signin-error{
    background:var(--danger-contrast);
    color:var(--danger);
    border:1px solid var(--danger);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    margin-bottom:14px;
  }
  .signin-foot{
    margin-top:18px;
    font-size:11.5px;
    color:var(--text-muted);
    text-align:center;
  }

  /* ---------- app shell ---------- */
  #app-shell{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;
    flex:0 0 236px;
    background:var(--sidebar);
    color:var(--sidebar-text);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{padding:4px 8px 18px;}
  .brand-name{
    font-family:"Fraunces",Georgia,serif;
    font-weight:600;
    font-size:19px;
    color:var(--sidebar-text);
    margin:0;
  }
  .brand-tag{
    font-size:11px;
    font-weight:600;
    color:var(--sidebar-text-dim);
    margin:3px 0 0;
    text-transform:uppercase;
    letter-spacing:.07em;
  }
  .nav-group{margin-bottom:4px;}
  .nav-btn{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    padding:9px 10px;
    border-radius:8px;
    border:none;
    background:transparent;
    color:var(--sidebar-text-dim);
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    margin-bottom:2px;
  }
  .nav-btn .ico{font-size:15px;width:18px;text-align:center;}
  .nav-btn:hover{background:rgba(255,255,255,.06);color:var(--sidebar-text);}
  .nav-btn.active{background:var(--accent);color:var(--accent-contrast);}
  .nav-badge{
    margin-left:auto;
    background:rgba(255,255,255,.14);
    color:var(--sidebar-text);
    font-size:10.5px;
    font-weight:700;
    padding:1px 6px;
    border-radius:99px;
  }
  .nav-btn.active .nav-badge{background:rgba(0,0,0,.18);color:var(--accent-contrast);}
  .sidebar-spacer{flex:1;}
  .whoami{
    border-top:1px solid rgba(255,255,255,.1);
    padding-top:12px;
    margin-top:10px;
  }
  .whoami-name{font-weight:600;color:var(--sidebar-text);font-size:13.5px;}
  .whoami-role{font-size:11.5px;font-weight:600;color:var(--sidebar-text-dim);margin:1px 0 10px;}
  .signout-btn{
    width:100%;
    background:transparent;
    border:1px solid rgba(255,255,255,.18);
    color:var(--sidebar-text-dim);
    padding:7px 10px;
    border-radius:7px;
    font-size:12px;
    cursor:pointer;
  }
  .signout-btn:hover{color:var(--sidebar-text);border-color:rgba(255,255,255,.34);}

  main{flex:1;min-width:0;padding:30px 36px 60px;}
  .page-head{margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .page-head h2{margin:0;font-size:23px;}
  .page-desc{color:var(--text-muted);font-size:13px;margin:4px 0 0;max-width:60ch;}

  .banner{
    border-radius:10px;
    padding:10px 14px;
    font-size:12.5px;
    margin-bottom:18px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
  }
  .banner.warn{border-color:var(--pri-medium);color:var(--pri-medium);background:var(--surface);}
  .banner.err{border-color:var(--danger);color:var(--danger);background:var(--danger-contrast);}
  .banner.ok{border-color:var(--accent);color:var(--accent-strong);background:var(--surface);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 10px;font-size:15.5px;}
  .card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .stat{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .stat-num{font-family:"Fraunces",serif;font-size:26px;font-weight:600;line-height:1;}
  .stat-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 9px;
    border-radius:99px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.03em;
    white-space:nowrap;
  }
  .pill::before{content:"";width:6px;height:6px;border-radius:99px;background:currentColor;}
  .pill-todo{background:color-mix(in srgb, var(--status-todo) 16%, transparent);color:var(--status-todo);}
  .pill-progress{background:color-mix(in srgb, var(--status-progress) 16%, transparent);color:var(--status-progress);}
  .pill-done{background:color-mix(in srgb, var(--status-done) 16%, transparent);color:var(--status-done);}
  .pill-high{background:color-mix(in srgb, var(--pri-high) 16%, transparent);color:var(--pri-high);}
  .pill-medium{background:color-mix(in srgb, var(--pri-medium) 16%, transparent);color:var(--pri-medium);}
  .pill-low{background:color-mix(in srgb, var(--pri-low) 16%, transparent);color:var(--pri-low);}
  .pill-open{background:color-mix(in srgb, var(--danger) 16%, transparent);color:var(--danger);}
  .pill-closed{background:color-mix(in srgb, var(--status-done) 16%, transparent);color:var(--status-done);}
  .pill-admin{background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent-strong);}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);background:var(--surface-2);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.num{font-variant-numeric:tabular-nums;}
  .row-muted{color:var(--text-muted);}

  .list-cards{display:flex;flex-direction:column;gap:12px;}
  .job-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--status-todo);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:var(--shadow);
  }
  .job-card[data-status="In progress"]{border-left-color:var(--status-progress);}
  .job-card[data-status="Done"]{border-left-color:var(--status-done);opacity:.75;}
  .job-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .job-title{font-weight:600;font-size:14.5px;margin:0 0 3px;}
  .job-meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
  .job-notes{margin-top:8px;font-size:12.5px;color:var(--text-muted);border-top:1px dashed var(--border);padding-top:8px;}
  .job-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .toolbar select, .toolbar input{width:auto;min-width:140px;}
  .search-input{flex:1;min-width:180px;}

  .area-tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;}
  .area-tab{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-muted);
    font-size:13px;font-weight:600;cursor:pointer;
  }
  .area-tab:hover{border-color:var(--accent);color:var(--text);}
  .area-tab.active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
  .area-tab .count{
    font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;
    background:var(--surface-2);color:var(--text-muted);
  }
  .area-tab.active .count{background:rgba(0,0,0,.16);color:var(--accent-contrast);}

  .form-panel{
    background:var(--surface-2);
    border:1px dashed var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:18px;
  }
  .form-panel h4{margin:0 0 12px;font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .form-grid .field{margin-bottom:0;}
  .form-grid .field.span-2{grid-column:span 2;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;}
  .checkbox-row input{width:auto;}

  .subtle-btn{
    background:transparent;
    border:none;
    color:var(--accent-strong);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .subtle-btn:hover{text-decoration:underline;}

  .empty-state{
    text-align:center;
    padding:36px 20px;
    color:var(--text-muted);
    font-size:13px;
    border:1px dashed var(--border);
    border-radius:12px;
    background:var(--surface);
  }

  .ppe-tag{
    display:inline-block;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 8px;
    font-size:11.5px;
    margin:2px 4px 2px 0;
  }
  .steps-list{margin:8px 0 0;padding-left:20px;font-size:13px;}
  .steps-list li{margin-bottom:4px;}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
  @media (max-width: 900px){
    .two-col{grid-template-columns:1fr;}
    #app-shell{flex-direction:column;}
    .sidebar{position:relative;width:100%;flex:none;height:auto;}
  }

  .team-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:10px;}
  .avatar{
    width:34px;height:34px;border-radius:99px;background:var(--accent);color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;
  }
  .team-name-row{display:flex;align-items:center;gap:10px;}
  .team-flags{font-size:11.5px;color:var(--text-muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;}

  code.access-code{background:var(--surface-2);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-size:12px;}

  @media (prefers-reduced-motion: no-preference){
    .job-card, .card, .stat{transition:box-shadow .15s ease;}
  }
</style>
</head>

  "biosecurity": {
    "sections": [
      {
        "id": "b1",
        "title": "Property Overview & Risk",
        "body": "Bullamon Plains is a broadacre cropping operation growing cotton, wheat and chickpeas. Biosecurity risks include weed seed, soil-borne disease and pest incursions carried in on vehicles, machinery, seed, grain and visiting stock. This plan sets out how staff, contractors and visitors manage that risk on a daily basis. Review this plan at the start of each season or after any biosecurity incident."
      },
      {
        "id": "b2",
        "title": "Entry & Exit Protocol",
        "body": "All visitors and contractors must report to the homestead office before entering paddocks or sheds. Sign the visitor register, declare their last property visited, and follow any wash-down requirements below. Only enter through the designated farm entrance off the main road - do not use back tracks unless directed by farm staff."
      },
      {
        "id": "b3",
        "title": "Vehicle & Equipment Hygiene (Come Clean, Go Clean)",
        "body": "Vehicles and machinery arriving from another property must be free of soil, plant material and manure before entering. Use the wash-down bay near the main machinery shed for any equipment that has worked on another property in the last 7 days. Farm-owned machinery moving between paddocks should be inspected for soil and weed seed build-up, especially after working in known weedy paddocks."
      },
      {
        "id": "b4",
        "title": "Visitor & Contractor Requirements",
        "body": "All visitors sign the register below before proceeding onto the property. Contractors bringing machinery (harvest contractors, spray contractors, agronomists) must confirm their equipment has been cleaned since its last job. Deliveries of seed, fertiliser or chemical are received at the main shed only."
      },
      {
        "id": "b5",
        "title": "Weed & Pest Monitoring",
        "body": "Paddock edges, laneways and the creek crossing are checked each month for new weed incursions, particularly during and after harvest when machinery movement is highest. Report any unusual weeds, insect activity or plant disease symptoms to the farm manager immediately - do not move machinery through the affected area until it has been assessed."
      },
      {
        "id": "b6",
        "title": "Outbreak & Reporting Procedure",
        "body": "If a suspected exotic pest, weed or plant disease is found, do not disturb the area, restrict access, and phone the Exotic Plant Pest Hotline on 1800 084 881. Notify the farm manager immediately. Record the location, date, photos and any recent visitors or machinery movement in that area."
      }

<script>
"use strict";

/* ======================================================================
   UTILITIES
   ====================================================================== */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function escAttr(s){ return esc(s); }
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso + "T00:00:00");
  if(isNaN(d.getTime())) return esc(iso);
  return d.toLocaleDateString("en-AU", { day:"numeric", month:"short", year:"numeric" });
}
function fmtMoney(n){
  if(n == null || n === "") return "—";
  return "$" + Number(n).toLocaleString("en-AU", { maximumFractionDigits: 2 });
}
function fmtNum(n, unit){
  if(n == null || n === "") return "—";
  var s = Number(n).toLocaleString("en-AU", { maximumFractionDigits: 2 });
  return unit ? (s + " " + unit) : s;
}
function daysUntil(iso){
  if(!iso) return null;
  var target = new Date(iso + "T00:00:00").getTime();
  var now = new Date(todayISO() + "T00:00:00").getTime();
  return Math.round((target - now) / 86400000);
}
function initials(name){
  var parts = String(name || "?").trim().split(/\s+/);
  return ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length-1][0] : "")).toUpperCase();
}
function byId(arr, id){ return (arr || []).find(function(x){ return x.id === id; }); }
function removeById(arr, id){ var i = (arr||[]).findIndex(function(x){ return x.id === id; }); if(i > -1) arr.splice(i,1); }

function pillStatus(status){
  var cls = status === "Done" ? "pill-done" : status === "In progress" ? "pill-progress" : "pill-todo";
  return '<span class="pill ' + cls + '">' + esc(status) + "</span>";
}
function pillPriority(p){
  var cls = p === "High" ? "pill-high" : p === "Low" ? "pill-low" : "pill-medium";
  return '<span class="pill ' + cls + '">' + esc(p) + "</span>";
}
function pillIncident(status){
  return '<span class="pill ' + (status === "Closed" ? "pill-closed" : "pill-open") + '">' + esc(status) + "</span>";
}

function getLocal(key){ try{ return window.localStorage.getItem(key); }catch(e){ return null; } }
function setLocal(key, val){ try{ window.localStorage.setItem(key, val); }catch(e){} }
function removeLocal(key){ try{ window.localStorage.removeItem(key); }catch(e){} }

function deepClone(obj){
  if(window.structuredClone) return window.structuredClone(obj);
  return JSON.parse(JSON.stringify(obj));
}

/* ======================================================================
   STATE
   ====================================================================== */
var state = null;
var writable = true;      // becomes false once we learn this viewer can't save
var writeChecked = false; // whether we've learned writable status yet
var booted = false;
var notice = null;        // { kind: 'view-only'|'conflict'|'warn'|'err'|'ok', msg }
var session = { name: getLocal("bp_signed_in_name") || null };
var ui = {
  section: "dashboard",
  jobArea: "Irrigation",
  jobStatusFilter: "open",
  jobQuery: "",
  sopQuery: "",
  machineryQuery: "",
  openForms: {},   // formKey -> true when an add/edit panel is expanded
  editing: {}      // formKey -> id currently being edited, or null
};

// A real file download -- no artifact-platform sharing restriction applies
// here, so this is a plain, reliable Blob download instead of a clipboard
// copy with a textarea fallback.
function downloadBackup(){
  var json = JSON.stringify(state, null, 2);
  var blob = new Blob([json], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "bullamon-plains-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  state.meta.lastBackupAt = todayISO();
  persist();
}

function activeTeam(){ return (state.team || []).filter(function(t){ return t.active; }); }
function findTeam(name){ return (state.team || []).find(function(t){ return t.name === name; }); }
function currentUser(){ return session.name ? findTeam(session.name) : null; }
function isAdmin(){ var u = currentUser(); return !!(u && u.isAdmin); }
function isSignedIn(){ return !!(session.name && findTeam(session.name) && findTeam(session.name).active); }

/* ======================================================================
   SUPABASE — the shared database backing this app. See config.js for the
   project URL and public (anon) key, and supabase-schema.sql for the
   table + realtime setup this code expects.
   ====================================================================== */
var supabaseClient = (window.supabase && window.SUPABASE_URL && window.SUPABASE_ANON_KEY)
  ? window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)
  : null;
var stateVersion = 0;      // optimistic-concurrency counter, mirrors the row in Supabase
var isNewRow = false;      // true until the very first row is written to Supabase

function subscribeRealtime(){
  if(!supabaseClient) return;
  supabaseClient
    .channel("app_state_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "app_state", filter: "id=eq.main" }, function(payload){
      var row = payload.new;
      if(!row || typeof row.version !== "number") return;
      // Only adopt a version newer than what we already have -- this also
      // quietly ignores the echo of our own just-completed write.
      if(row.version > stateVersion){
        state = row.data;
        stateVersion = row.version;
        render();
      }
    })
    .subscribe();
}

/* ======================================================================
   BOOT
   ====================================================================== */
async function boot(){
  if(!supabaseClient){
    console.error("[Bullamon Plains] Supabase isn't configured -- check config.js has SUPABASE_URL and SUPABASE_ANON_KEY set.");
    state = deepClone(DEFAULT_STATE);
    booted = true;
    setNotice("err", "This app isn't connected to its database yet (config.js is missing the Supabase URL/key). Changes won't be saved.");
    return;
  }
  var migrated = false;
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").maybeSingle();
    if(res.error) throw res.error;
    if(res.data){
      state = res.data.data;
      stateVersion = res.data.version;
    } else {
      // Nothing in the table yet -- brand new project. Seed it with the
      // built-in defaults; the first persist() below writes the real row.
      state = deepClone(DEFAULT_STATE);
      isNewRow = true;
      migrated = true;
    }
  }catch(e){
    console.error("[Bullamon Plains] could not load data from Supabase:", e);
    state = deepClone(DEFAULT_STATE);
    booted = true;
    setNotice("err", "Couldn't load data from the database (" + (e && e.message ? e.message : "unknown error") + "). Changes won't be saved until this is fixed.");
    return;
  }
  if(session.name && !(findTeam(session.name) && findTeam(session.name).active)){
    session.name = null;
    removeLocal("bp_signed_in_name");
  }
  // one-time migration: jobs saved before the Irrigation/Dryland/Livestock/General
  // split get a sensible default area so nothing disappears from view.
  (state.jobs || []).forEach(function(j){
    if(!j.area){
      j.area = (j.category === "Irrigation") ? "Irrigation" : "General";
      migrated = true;
    }
  });
  // one-time migration: machines saved before issue reporting existed get an
  // empty issues list so the new section has something to render into.
  (state.machinery || []).forEach(function(m){
    if(!m.issues){
      m.issues = [];
      migrated = true;
    }
    if(m.scheduleStartHours === undefined){
      m.scheduleStartHours = null;
      migrated = true;
    }
    if(m.serviceIntervalHours === undefined){
      m.serviceIntervalHours = null;
      migrated = true;
    }
  });
  // one-time migration: chemical register entries saved before usage logging
  // existed get an empty usage log so deductions have somewhere to record.
  (state.chemicals && state.chemicals.register || []).forEach(function(r){
    if(!r.usageLog){
      r.usageLog = [];
      migrated = true;
    }
  });
  if(state.meta && state.meta.lastBackupAt === undefined){
    state.meta.lastBackupAt = null;
    migrated = true;
  }
  booted = true;
  subscribeRealtime();
  if(migrated){ persist(); } else { render(); }
}

/* ======================================================================
   PERSISTENCE — every mutating action calls this after updating `state`
   ====================================================================== */
var saveQueue = Promise.resolve();
function persist(){
  render(); // optimistic local update, immediately
  saveQueue = saveQueue.then(doPersist);
  return saveQueue;
}

async function doPersist(){
  if(!supabaseClient){
    setNotice("err", "This app isn't connected to its database (config.js is missing the Supabase URL/key). This change is only visible to you.");
    return;
  }
  try{
    if(isNewRow){
      var insertRes = await supabaseClient.from("app_state").insert({ id: "main", data: state, version: 1 }).select("version").single();
      if(insertRes.error){
        // Someone else's first write beat ours -- adopt theirs instead of
        // erroring, since the row now genuinely exists.
        if(insertRes.error.code === "23505"){
          return adoptLatestAfterConflict();
        }
        throw insertRes.error;
      }
      isNewRow = false;
      stateVersion = insertRes.data.version;
    } else {
      var nextVersion = stateVersion + 1;
      var updateRes = await supabaseClient.from("app_state")
        .update({ data: state, version: nextVersion, updated_at: new Date().toISOString() })
        .eq("id", "main").eq("version", stateVersion)
        .select("version");
      if(updateRes.error) throw updateRes.error;
      if(!updateRes.data || updateRes.data.length === 0){
        // version didn't match -- someone else saved in between.
        return adoptLatestAfterConflict();
      }
      stateVersion = nextVersion;
    }
    writable = true; writeChecked = true;
    if(notice) setNotice(null);
  }catch(err){
    console.error("[Bullamon Plains] Supabase save failed:", err);
    var code = err && err.code;
    var message = err && err.message;
    writeChecked = true;
    if(code === "42501" || code === "PGRST301"){
      // Postgres/PostgREST permission-denied codes -- the anon key can't
      // write under the current row-level-security policies.
      writable = false;
      setNotice("view-only", "This browser can't save changes to the database right now (permission denied). (code: " + code + ")");
    } else if(!navigator.onLine){
      setNotice("warn", "You're offline -- this change will need to be retried once you're back online.");
    } else {
      setNotice("err", "Couldn't save that change (" + (message || "unknown error") + "). It's only visible to you until it's retried." + (code ? " (code: " + code + ")" : ""));
    }
    render();
  }
}

async function adoptLatestAfterConflict(){
  setNotice("conflict", "Someone else just saved a change — refreshing with the latest.");
  try{
    var res = await supabaseClient.from("app_state").select("data,version").eq("id", "main").single();
    if(!res.error && res.data){
      state = res.data.data;
      stateVersion = res.data.version;
      isNewRow = false;
    }
  }catch(e){ console.error("[Bullamon Plains] could not refresh after conflict:", e); }
  setTimeout(function(){ if(notice && notice.kind === "conflict") setNotice(null); render(); }, 1200);
}

function setNotice(kind, msg){ notice = kind ? { kind: kind, msg: msg } : null; render(); }
function dismissNotice(){ notice = null; render(); }
function retrySave(){
  if(notice) setNotice(null);
  persist();
}

/* ======================================================================
   RENDER — top level dispatch
   ====================================================================== */
function render(){
  var app = document.getElementById("app");
  if(!app) return;
  if(!booted){
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px;">Loading Bullamon Plains…</div>';
    return;
  }
  if(!isSignedIn()){
    app.innerHTML = renderSignIn();
    attachSignInHandlers();
    return;
  }
  app.innerHTML = renderShell();
}

/* ======================================================================
   SIGN-IN SCREEN
   ====================================================================== */
var signinError = "";
var signinSelectedName = "";     // remembered across a failed attempt, so the name isn't lost
var signinFocusCode = false;     // whether to focus+select the code field on next render
function renderSignIn(){
  var options = activeTeam().map(function(t){
    return '<option value="' + escAttr(t.name) + '"' + (t.name === signinSelectedName ? " selected" : "") + '>' + esc(t.name) + "</option>";
  }).join("");
  return '' +
  '<div id="signin-screen">' +
    '<div class="signin-card">' +
      '<p class="signin-eyebrow">' + esc(state.meta.propertyName) + '</p>' +
      '<h1>Staff sign-in</h1>' +
      '<p class="signin-sub">Choose your name and enter your access code to continue.</p>' +
      (signinError ? '<div class="signin-error">' + esc(signinError) + '</div>' : '') +
      '<form id="signin-form">' +
        '<div class="field">' +
          '<label for="signin-name">Your name</label>' +
          '<select id="signin-name" required>' +
            '<option value="">Choose your name…</option>' +
            options +
          '</select>' +
        '</div>' +
        '<div class="field">' +
          '<label for="signin-code">Access code</label>' +
          '<input type="password" id="signin-code" placeholder="Enter your code" autocomplete="off" />' +
        '</div>' +
        '<button type="submit" class="btn btn-primary">Enter</button>' +
      '</form>' +
      '<p class="signin-foot">Not on the list, or lost your code? Ask a farm admin to add you in the Team section.</p>' +
    '</div>' +
  '</div>';
}
function attachSignInHandlers(){
  var form = document.getElementById("signin-form");
  if(!form) return;
  var nameSel = document.getElementById("signin-name");
  var codeInput = document.getElementById("signin-code");
  nameSel.addEventListener("change", function(){ signinSelectedName = nameSel.value; });
  if(signinFocusCode && codeInput){ codeInput.focus(); signinFocusCode = false; }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = nameSel.value;
    var code = codeInput.value;
    signinSelectedName = name;
    var member = findTeam(name);
    if(!member || !member.active){
      signinError = "Choose your name from the list.";
      render();
      return;
    }
    if(member.passcode && member.passcode !== code){
      signinError = "That access code doesn't match. Try again or ask an admin to reset it.";
      signinFocusCode = true;
      render();
      return;
    }
    signinError = "";
    signinSelectedName = "";
    session.name = member.name;
    setLocal("bp_signed_in_name", member.name);
    render();
  });
}
function signOut(){
  session.name = null;
  removeLocal("bp_signed_in_name");
  ui.section = "dashboard";
  render();
}

/* ======================================================================
   APP SHELL
   ====================================================================== */
var NAV = [
  { key: "dashboard",   label: "Dashboard",    icon: "&#9679;" },
  { key: "jobs",        label: "Jobs",         icon: "&#9745;" },
  { key: "machinery",   label: "Machinery Maintenance",    icon: "&#9881;" },
  { key: "sops",        label: "SOPs",         icon: "&#128196;" },
  { key: "biosecurity", label: "Biosecurity",  icon: "&#128737;" },
  { key: "whs",         label: "WHS",          icon: "&#9888;" },
  { key: "chemicals",   label: "Chemicals",    icon: "&#129514;" },
  { key: "emergency",   label: "Emergency",    icon: "&#9742;" },
  { key: "maps",        label: "Maps",         icon: "&#128506;" },
  { key: "team",        label: "Team",         icon: "&#128101;", adminOnly: true }
];

function openJobsCount(){ return (state.jobs || []).filter(function(j){ return j.status !== "Done"; }).length; }
function openIncidentsCount(){ return (state.whs.incidents || []).filter(function(i){ return i.status !== "Closed"; }).length; }

function renderShell(){
  var u = currentUser();
  var navHtml = NAV.filter(function(n){ return !n.adminOnly || isAdmin(); }).map(function(n){
    var badge = "";
    if(n.key === "jobs" && openJobsCount() > 0) badge = '<span class="nav-badge">' + openJobsCount() + "</span>";
    if(n.key === "whs" && openIncidentsCount() > 0) badge = '<span class="nav-badge">' + openIncidentsCount() + "</span>";
    return '<button type="button" class="nav-btn' + (ui.section === n.key ? " active" : "") + '" onclick="goTo(\'' + n.key + '\')">' +
      '<span class="ico">' + n.icon + "</span><span>" + esc(n.label) + "</span>" + badge +
    "</button>";
  }).join("");

  return '' +
  '<div id="app-shell">' +
    '<nav class="sidebar">' +
      '<div class="brand">' +
        '<p class="brand-name">' + esc(state.meta.propertyName) + '</p>' +
        '<p class="brand-tag">' + esc(state.meta.tagline) + '</p>' +
      '</div>' +
      '<div class="nav-group">' + navHtml + '</div>' +
      '<div class="sidebar-spacer"></div>' +
      '<div class="whoami">' +
        '<div class="whoami-name">' + esc(u.name) + (u.isAdmin ? ' &middot; Admin' : '') + '</div>' +
        '<div class="whoami-role">' + (writeChecked && !writable ? "View only" : "Signed in") + '</div>' +
        '<button type="button" class="signout-btn" onclick="signOut()">Sign out</button>' +
      '</div>' +
    '</nav>' +
    '<main>' + renderNotice() + renderSection() + '</main>' +
  '</div>';
}

function goTo(section){ ui.section = section; render(); }

function renderNotice(){
  if(!notice) return "";
  var cls = (notice.kind === "view-only" || notice.kind === "conflict" || notice.kind === "warn") ? "warn" : notice.kind === "err" ? "err" : notice.kind === "ok" ? "ok" : "";
  return '<div class="banner ' + cls + '" style="display:flex;justify-content:space-between;gap:12px;align-items:center;">' +
    '<span>' + esc(notice.msg) + '</span>' +
    '<span style="display:flex;gap:6px;flex-shrink:0;">' +
    (notice.kind === "err" || notice.kind === "view-only" ? '<button type="button" class="subtle-btn" onclick="retrySave()">Retry now</button>' : '') +
    (notice.kind !== "conflict" ? '<button type="button" class="subtle-btn" onclick="dismissNotice()">Dismiss</button>' : '') +
    '</span>' +
  '</div>';
}

function renderSection(){
  switch(ui.section){
    case "jobs": return renderJobs();
    case "machinery": return renderMachinery();
    case "sops": return renderSops();
    case "biosecurity": return renderBiosecurity();
    case "whs": return renderWhs();
    case "chemicals": return renderChemicals();
    case "emergency": return renderEmergency();
    case "maps": return renderMaps();
    case "team": return isAdmin() ? renderTeam() : renderDashboard();
    default: return renderDashboard();
  }
}

function pageHead(title, desc){
  return '<div class="page-head"><div><h2>' + esc(title) + '</h2>' + (desc ? '<p class="page-desc">' + esc(desc) + '</p>' : '') + '</div></div>';
}

/* ======================================================================
   DASHBOARD
   ====================================================================== */
function renderDashboard(){
  var u = currentUser();
  var openJobs = (state.jobs || []).filter(function(j){ return j.status !== "Done"; });
  var mine = openJobs.filter(function(j){ return j.assignee === u.name; });
  var dueService = (state.machinery || []).filter(function(m){ var d = daysUntil(m.nextServiceDue); return d != null && d <= 21; });

  var html = pageHead("Welcome back, " + u.name.split(" ")[0], "Here's what's happening on Bullamon Plains today.");
  html += '<div class="stat-row">' +
    '<div class="stat"><div class="stat-num">' + openJobs.length + '</div><div class="stat-label">Open jobs</div></div>' +
    '<div class="stat"><div class="stat-num">' + mine.length + '</div><div class="stat-label">Assigned to you</div></div>' +
    '<div class="stat"><div class="stat-num">' + dueService.length + '</div><div class="stat-label">Machinery due for service</div></div>' +
  '</div>';
  return html;
}

/* ======================================================================
   JOBS
   ====================================================================== */
var JOB_AREAS = ["Irrigation", "Dryland", "Livestock", "General"];
function jobArea(j){ return (j && j.area && JOB_AREAS.indexOf(j.area) > -1) ? j.area : "General"; }

function renderJobs(){
  var q = ui.jobQuery.trim().toLowerCase();
  var byArea = (state.jobs || []).filter(function(j){ return jobArea(j) === ui.jobArea; });
  var list = byArea.slice().sort(function(a,b){
    return (a.dueDate || "9999").localeCompare(b.dueDate || "9999");
  });
  if(ui.jobStatusFilter === "open") list = list.filter(function(j){ return j.status !== "Done"; });
  if(ui.jobStatusFilter === "mine") list = list.filter(function(j){ return j.assignee === currentUser().name; });
  if(q) list = list.filter(function(j){ return (j.title + " " + (j.category||"") + " " + j.assignee).toLowerCase().indexOf(q) > -1; });

  var html = pageHead("Jobs", "Track tasks across the property, grouped by area.");

  html += '<div class="area-tabs">' + JOB_AREAS.map(function(a){
    var openCount = (state.jobs || []).filter(function(j){ return jobArea(j) === a && j.status !== "Done"; }).length;
    return '<button type="button" class="area-tab' + (ui.jobArea === a ? ' active' : '') + '" onclick="ui.jobArea=\'' + a + '\';ui.openForms.newJob=false;render();">' +
      esc(a) + (openCount ? ' <span class="count">' + openCount + '</span>' : '') +
    '</button>';
  }).join("") + '</div>';

  html += '<div class="toolbar">' +
    '<select onchange="ui.jobStatusFilter=this.value;render();">' +
      ['open','mine','all'].map(function(v){ var lbl = v==='open'?'Open jobs':v==='mine'?'Assigned to me':'All jobs'; return '<option value="'+v+'"'+(ui.jobStatusFilter===v?' selected':'')+'>'+lbl+'</option>'; }).join("") +
    '</select>' +
    '<input class="search-input" type="text" placeholder="Search ' + esc(ui.jobArea).toLowerCase() + ' jobs…" value="' + escAttr(ui.jobQuery) + '" oninput="ui.jobQuery=this.value;render();" />' +
    '<button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newJob\')">' + (ui.openForms.newJob ? "Cancel" : "+ Add " + ui.jobArea.toLowerCase() + " job") + '</button>' +
  '</div>';

  if(ui.openForms.newJob) html += renderJobForm();

  if(list.length === 0){
    html += '<div class="empty-state">No ' + esc(ui.jobArea).toLowerCase() + ' jobs match this view.</div>';
  } else {
    html += '<div class="list-cards">' + list.map(renderJobCard).join("") + '</div>';
  }
  return html;
}

function renderJobCard(j){
  var d = daysUntil(j.dueDate);
  var when = j.dueDate ? (d < 0 ? (Math.abs(d) + " day" + (Math.abs(d)===1?"":"s") + " overdue") : d === 0 ? "Due today" : ("Due " + fmtDate(j.dueDate))) : "No due date";
  var editingThis = ui.editing.job === j.id;
  var html = '<div class="job-card" data-status="' + escAttr(j.status) + '">';
  if(editingThis){
    html += renderJobForm(j);
  } else {
    html += '<div class="job-top"><div><p class="job-title">' + esc(j.title) + '</p>' +
      '<div class="job-meta"><span>' + esc(j.category || "General") + '</span><span>' + esc(j.assignee || "Unassigned") + '</span><span>' + esc(when) + '</span></div></div>' +
      '<div style="display:flex;gap:6px;flex-shrink:0;">' + pillPriority(j.priority) + pillStatus(j.status) + '</div></div>';
    if(j.notes) html += '<div class="job-notes">' + esc(j.notes) + '</div>';
    html += '<div class="job-actions">';
    if(j.status !== "To do") html += '<button type="button" class="btn btn-ghost btn-sm" onclick="setJobStatus(\'' + j.id + '\',\'To do\')">Mark to do</button>';
    if(j.status !== "In progress") html += '<button type="button" class="btn btn-ghost btn-sm" onclick="setJobStatus(\'' + j.id + '\',\'In progress\')">Start</button>';
    if(j.status !== "Done") html += '<button type="button" class="btn btn-olive btn-sm" onclick="setJobStatus(\'' + j.id + '\',\'Done\')">Mark done</button>';
    html += '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.job=\'' + j.id + '\';render();">Edit</button>';
    if(isAdmin()) html += '<button type="button" class="btn btn-danger btn-sm" onclick="deleteJob(\'' + j.id + '\')">Delete</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderJobForm(existing){
  var team = state.team.map(function(t){ return t.name; });
  var defaultArea = existing ? jobArea(existing) : ui.jobArea;
  return '<form class="form-panel" onsubmit="saveJob(event,' + (existing ? "'" + existing.id + "'" : "null") + ')">' +
    '<h4>' + (existing ? "Edit job" : "New job") + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field span-2"><label>Title</label><input type="text" name="title" required value="' + escAttr(existing ? existing.title : "") + '" /></div>' +
      '<div class="field"><label>Area</label><select name="area">' +
        JOB_AREAS.map(function(a){ return '<option' + (a === defaultArea ? ' selected' : '') + '>' + a + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="field"><label>Category</label><input type="text" name="category" value="' + escAttr(existing ? existing.category : "") + '" placeholder="e.g. Fencing" /></div>' +
      '<div class="field"><label>Assignee</label><select name="assignee">' +
        '<option value="">Unassigned</option>' +
        team.map(function(n){ return '<option value="' + escAttr(n) + '"' + (existing && existing.assignee===n ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="field"><label>Priority</label><select name="priority">' +
        ['Low','Medium','High'].map(function(p){ return '<option' + (existing && existing.priority===p || (!existing && p==='Medium') ? ' selected' : '') + '>' + p + '</option>'; }).join("") +
      '</select></div>' +
      '<div class="field"><label>Due date</label><input type="date" name="dueDate" value="' + escAttr(existing ? existing.dueDate : "") + '" /></div>' +
      '<div class="field span-2"><label>Notes</label><textarea name="notes">' + esc(existing ? existing.notes : "") + '</textarea></div>' +

function machineDueForService(m){
  var d = daysUntil(m.nextServiceDue);
  return d != null && d <= 21;
}

// A maintenance schedule is "configured" once a starting hour reading and an
// interval (in hours) have both been entered manually for a machine.
function machineScheduleConfigured(m){
  return m.scheduleStartHours != null && m.serviceIntervalHours != null && m.serviceIntervalHours > 0;
}

// Builds a short window of service milestones (start + n * interval) around
// the machine's current reading: the most recently passed milestone (if any)
// plus the next few upcoming ones. Returns null when no schedule is set.
function machineScheduleMilestones(m){
  if(!machineScheduleConfigured(m)) return null;
  var start = m.scheduleStartHours;
  var interval = m.serviceIntervalHours;
  var current = m.currentReading || 0;
  var kLastDone = Math.floor((current - start) / interval);
  if(kLastDone < 0) kLastDone = 0;
  var fromK = Math.max(1, kLastDone - 1);
  var toK = kLastDone + 3;
  var milestones = [];
  var markedNext = false;
  for(var k = fromK; k <= toK; k++){
    var hours = start + k * interval;
    var status = hours <= current ? "done" : (markedNext ? "upcoming" : "next");
    if(status === "next") markedNext = true;
    milestones.push({ k: k, hours: hours, status: status });
  }
  return milestones;
}

function machineNextMilestone(m){
  var milestones = machineScheduleMilestones(m);
  if(!milestones) return null;
  for(var i = 0; i < milestones.length; i++){
    if(milestones[i].status === "next") return milestones[i];
  }
  return null;
}

function renderRegisterRow(r){

  var expStyle = (exp != null && exp < 60) ? ' style="color:var(--danger);font-weight:600;"' : "";
  var open = ui.openForms["reguse_" + r.id];
  var html = '<tr>' +
    '<td><button type="button" class="subtle-btn" style="font-weight:600;" onclick="ui.openForms[\'reguse_' + r.id + '\']=!ui.openForms[\'reguse_' + r.id + '\'];render();">' + esc(r.chemicalName) + '</button></td>' +
    '<td>' + esc(r.batchNo) + '</td><td class="num">' + fmtNum(r.quantity, r.unit) + '</td><td>' + esc(r.storageLocation) + '</td><td>' + esc(r.supplier) + '</td><td' + expStyle + '>' + fmtDate(r.expiryDate) + '</td>' +
  '</tr>';
  if(open){
    html += '<tr><td colspan="6" style="background:var(--surface-2, rgba(0,0,0,0.03));">';
    html += renderRegisterUsageForm(r);
    var log = r.usageLog || [];
    if(log.length){
      html += '<div class="table-wrap" style="box-shadow:none;margin-top:10px;"><table><thead><tr><th>Date</th><th>Amount used</th><th>Used by</th><th>Job / notes</th></tr></thead><tbody>' +
        log.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(u){
          return '<tr><td>' + fmtDate(u.date) + '</td><td class="num">' + fmtNum(u.amount, r.unit) + '</td><td>' + esc(u.usedBy) + '</td><td>' + esc(u.notes || "—") + '</td></tr>';
        }).join("") + '</tbody></table></div>';
    }
    html += '</td></tr>';

    '<h4 style="margin-top:0;">Log usage — ' + esc(r.chemicalName) + ' <span class="row-muted" style="font-weight:400;font-size:12px;">(' + fmtNum(r.quantity, r.unit) + ' on hand)</span></h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Amount used (' + esc(r.unit || "units") + ')</label><input type="number" step="0.1" min="0" name="amount" class="no-spinner" required /></div>' +
      '<div class="field"><label>Date</label><input type="date" name="date" value="' + todayISO() + '" required /></div>' +
      '<div class="field"><label>Used by</label><input type="text" name="usedBy" value="' + escAttr(currentUser().name) + '" /></div>' +

  '</form>';
}
function addRegisterUsage(e, id){
  e.preventDefault();
  var f = e.target;
  var amount = parseFloat(f.amount.value);
  if(isNaN(amount) || amount <= 0) return;
  var r = byId(state.chemicals.register, id);
  r.usageLog = r.usageLog || [];
  r.usageLog.unshift({ id: uid("u"), amount: amount, date: f.date.value, usedBy: f.usedBy.value.trim() || currentUser().name, notes: f.notes.value.trim() });
  r.quantity = Math.max(0, (r.quantity || 0) - amount);
  persist();
}

      '<div class="field"><label>Title</label><input type="text" name="title" required /></div>' +
      '<div class="field"><label>Link (URL)</label><input type="url" name="url" required placeholder="https://…" /></div>' +
      '<div class="field span-2"><label>Notes</label><input type="text" name="notes" /></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Add</button><button type="button" class="btn btn-ghost" onclick="toggleForm(\'newMap\')">Cancel</button></div>' +
  '</form>';
}
function addMap(e){
  e.preventDefault();
  var f = e.target;
  state.maps.items.push({ id: uid("map"), title: f.title.value.trim(), url: f.url.value.trim(), notes: f.notes.value.trim() });
  ui.openForms.newMap = false;
  persist();
}

/* ======================================================================
   TEAM (admin only) — add/remove staff, set access, reset codes.
   This is the screen that fixes "I can't sign in" without needing Claude.
   ====================================================================== */
function daysSinceBackup(){
  var last = state.meta && state.meta.lastBackupAt;
  if(!last) return null;
  var d = daysUntil(last);
  return d == null ? null : -d;
}
function renderTeam(){
  var html = pageHead("Team", "Who can sign in, and what they can do. Only admins see this page.");
  html += '<div class="banner">Sign-in codes are optional — leave a code blank and that person just picks their name to enter. Set a code here to require it.</div>';

  var daysSince = daysSinceBackup();
  if(daysSince === null){
    html += '<div class="banner warn">You haven\'t downloaded a data backup yet. Grab one below and save it somewhere safe (email it to yourself, or save it to a cloud drive) — it\'s the fastest way to recover everything if something ever goes wrong here.</div>';
  } else if(daysSince > 30){
    html += '<div class="banner warn">It\'s been ' + daysSince + ' days since your last backup (' + fmtDate(state.meta.lastBackupAt) + '). Worth downloading a fresh one so your saved copy has everything that\'s been added since.</div>';
  }

  html += '<div class="toolbar"><button type="button" class="btn btn-ghost" style="width:auto;" onclick="downloadBackup()">&#8681; Download data backup</button>' +
    (daysSince !== null ? '<span class="row-muted" style="font-size:12px;margin-left:10px;">Last backup: ' + fmtDate(state.meta.lastBackupAt) + ' (' + daysSince + (daysSince === 1 ? ' day' : ' days') + ' ago)</span>' : '') +
    '<span style="flex:1;"></span><button type="button" class="btn btn-primary" style="width:auto;" onclick="toggleForm(\'newStaff\')">' + (ui.openForms.newStaff ? "Cancel" : "+ Add staff") + '</button></div>';
  if(ui.openForms.newStaff) html += renderStaffForm();

  html += (state.team || []).map(function(t){
    if(ui.editing.staff === t.name) return renderStaffForm(t);
    return '<div class="team-card">' +
      '<div class="team-name-row"><div class="avatar">' + esc(initials(t.name)) + '</div><div>' +
        '<div style="font-weight:600;">' + esc(t.name) + (t.name === currentUser().name ? " (you)" : "") + '</div>' +
        '<div class="team-flags">' +
          (t.active ? '<span>Active</span>' : '<span style="color:var(--danger);">Inactive</span>') +
          (t.isAdmin ? '<span class="pill pill-admin" style="margin:0;">Admin</span>' : '') +
          (t.canAllocate ? '<span>Can allocate jobs</span>' : '') +
          '<span>Code: ' + (t.passcode ? '<code class="access-code">set</code>' : '<em>none</em>') + '</span>' +
        '</div></div></div>' +
      '<div style="display:flex;gap:6px;">' +
        '<button type="button" class="btn btn-ghost btn-sm" onclick="ui.editing.staff=\'' + escAttr(t.name) + '\';render();">Edit</button>' +
        (t.name !== currentUser().name ? '<button type="button" class="btn btn-danger btn-sm" onclick="removeStaff(\'' + escAttr(t.name) + '\')">Remove</button>' : '') +
      '</div>' +
    '</div>';
  }).join("");
  return html;
}
function renderStaffForm(existing){
  return '<div class="form-panel"><form onsubmit="saveStaff(event,' + (existing ? "'" + escAttr(existing.name) + "'" : "null") + ')">' +
    '<h4>' + (existing ? "Edit " + esc(existing.name) : "New staff member") + '</h4>' +
    '<div class="form-grid">' +
      '<div class="field"><label>Name</label><input type="text" name="name" required value="' + escAttr(existing ? existing.name : "") + '" /></div>' +
      '<div class="field"><label>Access code (optional)</label><input type="text" name="passcode" value="' + escAttr(existing ? existing.passcode : "") + '" placeholder="Leave blank for no code" /></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="active" id="active_cb" ' + (!existing || existing.active ? 'checked' : '') + ' /><label for="active_cb" style="text-transform:none;font-weight:400;">Active (can sign in)</label></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="isAdmin" id="admin_cb" ' + (existing && existing.isAdmin ? 'checked' : '') + ' /><label for="admin_cb" style="text-transform:none;font-weight:400;">Admin (Team page + edit reference content)</label></div>' +
      '<div class="checkbox-row field"><input type="checkbox" name="canAllocate" id="alloc_cb" ' + (existing && existing.canAllocate ? 'checked' : '') + ' /><label for="alloc_cb" style="text-transform:none;font-weight:400;">Can allocate jobs to others</label></div>' +
    '</div>' +
    '<div class="form-actions"><button type="submit" class="btn btn-primary" style="width:auto;">Save</button>' +
    '<button type="button" class="btn btn-ghost" onclick="' + (existing ? "ui.editing.staff=null;render();" : "toggleForm('newStaff')") + '">Cancel</button></div>' +
  '</form></div>';
}
function saveStaff(e, origName){
  e.preventDefault();
  var f = e.target;
  var name = f.name.value.trim();
  if(!name) return;
  var data = { name: name, passcode: f.passcode.value.trim(), active: f.active.checked, isAdmin: f.isAdmin.checked, canAllocate: f.canAllocate.checked };
  if(origName){
    var t = findTeam(origName);
    Object.assign(t, data);
    if(origName === session.name && origName !== name){ session.name = name; setLocal("bp_signed_in_name", name); }
    ui.editing.staff = null;
  } else {
    if(findTeam(name)){ alert("Someone with that name is already on the team."); return; }
    state.team.push(data);
    ui.openForms.newStaff = false;
  }
  persist();
}
function removeStaff(name){
  if(!confirm('Remove ' + name + ' from the team? They will no longer be able to sign in.')) return;
  var idx = state.team.findIndex(function(t){ return t.name === name; });
  if(idx > -1) state.team.splice(idx, 1);
  persist();
}

/* ======================================================================
   START
   ====================================================================== */
boot();
</script>
</body>
</html>
